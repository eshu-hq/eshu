# Eshu reviewer role for Codex, discovered from this repo's project config
# layer (`<repo>/.codex/agents/*.toml`, loaded when the checkout is trusted).
# The twins are .claude/agents/review-eshu.md and .opencode/agent/review-eshu.md.
#
# Workhorse tier per docs/internal/agent-orchestration.md. The eshu-code-review
# skill declares the tier and names no model, so the binding lives here.
name = "review-eshu"
description = """
Eshu reviewer. Loads the eshu-code-review skill and judges a final diff, PR \
update, or merge-readiness claim. Read/run only: it never edits the tree it \
is reviewing.
"""

model = "gpt-5.6-terra"
model_reasoning_effort = "high"

# Review stays separate from authorship: read-only is the sandbox equivalent of
# the withheld write tools in the Claude and opencode twins.
#
# Codex's read-only preset also gates network access behind approval, and a
# reviewer needs the network for the live GitHub truth the skill requires
# (review threads, check rollup, head/base). `approval_policy = "never"`
# returns such a call as a failure instead of prompting, so this role asks
# on request. It does not widen the write boundary: read-only still refuses
# edits, and an approval prompt for one is the signal that the reviewer is
# doing something it should not.
sandbox_mode = "read-only"
approval_policy = "on-request"
