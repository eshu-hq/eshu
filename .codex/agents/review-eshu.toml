# Eshu reviewer role for Codex, discovered from this repo's project config
# layer (`<repo>/.codex/agents/*.toml`, loaded when the checkout is trusted).
# The twins are .claude/agents/review-eshu.md and .opencode/agent/review-eshu.md.
#
# Workhorse tier per docs/internal/agent-orchestration.md. The eshu-code-review
# skill declares the tier and names no model, so the binding lives here.
name = "review-eshu"
description = """
Eshu reviewer. Loads the eshu-code-review skill and judges a final diff, PR \
update, or merge-readiness claim. Read/run only: it never edits the tree it \
is reviewing.
"""

# Workhorse tier for Codex is Terra per the tier table. Confirm the exact id
# against your local Codex model list before relying on this role -- the
# opencode examples in agent-orchestration.md carry the same caveat, and a
# stale id fails at dispatch rather than at load.
model = "gpt-5.6-terra"
model_reasoning_effort = "high"

# Review stays separate from authorship: read-only is the sandbox equivalent of
# the withheld write tools in the Claude and opencode twins.
#
# Codex's read-only preset also gates network access behind approval, and a
# reviewer needs the network for the live GitHub truth the skill requires
# (review threads, check rollup, head/base). `approval_policy = "never"`
# returns such a call as a failure instead of prompting, so this role asks
# on request. It does not widen the write boundary: read-only still refuses
# edits, and an approval prompt for one is the signal that the reviewer is
# doing something it should not.
sandbox_mode = "read-only"
approval_policy = "on-request"

# Required, not optional: a role file discovered from the `agents/` directory is
# parsed with `role_name_hint: None` (codex-rs/agent-roles/src/loader.rs:303),
# which sets `require_present` on the developer_instructions validator
# (agent_role_config.rs:67-71, 134-157). Without a non-blank value here the role
# fails validation, is logged as a startup warning, and is silently dropped --
# the binding above would never take effect.
#
# This is the Codex counterpart of the prose body in the Claude and opencode
# twins: runtime boundaries only. The review method lives in the skill.
developer_instructions = """
Load the eshu-code-review skill and follow it. It owns the review method: proof \
tiers, the five passes, the hostile read, the merge bar, and the verdict shape. \
Do not restate it here. Then load whichever project skill matches the diff \
surface before judging findings. AGENTS.md is the canon.

Never edit the tree you are judging. The sandbox is read-only; an approval \
prompt to write is the signal that you are doing something a reviewer should \
not. Approve network access only for the read-only GitHub truth the skill \
requires at step 6.

Never run `make pre-push`, `make pre-pr`, or `make pre-pr-full`. Those belong to \
the orchestrator, once per branch. Run focused read-only verification and paste \
it in the handoff.
"""
