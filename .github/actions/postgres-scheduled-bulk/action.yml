name: Scheduled PostgreSQL bulk proofs
description: Run the enrolled bulk proof families and upload their streams.
inputs:
  postgres_container:
    description: PostgreSQL service container ID.
    required: true
runs:
  using: composite
  steps:
    - name: Create fresh admin database
      shell: bash
      run: docker exec "${{ inputs.postgres_container }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_admin_scheduled'
    - name: Run admin proofs
      shell: bash
      working-directory: go
      env:
        ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu_admin_scheduled?sslmode=disable
        ESHU_ADMIN_REPLAY_FENCE_LIVE: "1"
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=6m ./internal/query/admin -run '^(TestAdminHandler_ChangedSincePoisonedLinksQueryLiveFiltersAndPagination|TestAdminHandler_ChangedSincePoisonedLinksQueryLiveRepositoryScopedGrant|TestAdminStoreIdentityFenceMutationsLive|TestAdminStoreMutationsRecheckStatusLive|TestAdminStoreReplayRecordsPriorFailureClassLive|TestAdminStoreSupersededGenerationReplayFenceLive|TestAdminWorkItemListingExposesPriorFailureAndNote|TestOperatorNoteKeepsTheFailureItReplaces)$' | tee "${RUNNER_TEMP}/admin.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/admin.jsonl" --group admin
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Create fresh completion database
