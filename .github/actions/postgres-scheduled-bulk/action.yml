        ESHU_TEST_SUPPLY_CHAIN_RUNTIME_INDEX_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
        ESHU_TEST_SUPPLY_CHAIN_RUNTIME_INDEX_POSTGRES_DISPOSABLE: "1"
      shell: bash
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=6m ./internal/storage/postgres -run '^(TestContentFileSecretLinesMigrationBackfillsAndReappliesLive|TestContentFileSecretLinesRetentionPruneCascadesLive|TestSupplyChainRuntimeFallbackIndexRestartSafetyLive)$' | tee "${RUNNER_TEMP}/disposable_storage.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/disposable_storage.jsonl" --group disposable_storage
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Upload bulk proof streams
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scheduled-proof-streams-bulk-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/admin.jsonl
          ${{ runner.temp }}/completion.jsonl
          ${{ runner.temp }}/reachability.jsonl
          ${{ runner.temp }}/secret_lines.jsonl
          ${{ runner.temp }}/crossplane.jsonl
          ${{ runner.temp }}/infra_inventory.jsonl
          ${{ runner.temp }}/disposable_gate.jsonl
          ${{ runner.temp }}/disposable_query.jsonl
          ${{ runner.temp }}/disposable_storage.jsonl
          ${{ runner.temp }}/claim.jsonl
          ${{ runner.temp }}/liveness.jsonl
          ${{ runner.temp }}/fanout.jsonl
          ${{ runner.temp }}/search.jsonl
          ${{ runner.temp }}/readiness.jsonl
          ${{ runner.temp }}/containerimage.jsonl
        if-no-files-found: error
        retention-days: 14
