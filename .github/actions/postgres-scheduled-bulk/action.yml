name: Scheduled PostgreSQL bulk proofs
description: Run the enrolled bulk proof families and upload their streams.
inputs:
  postgres_container:
    description: PostgreSQL service container ID.
    required: true
runs:
  using: composite
  steps:
    - name: Create fresh Crossplane database
      shell: bash
      run: docker exec "${{ inputs.postgres_container }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_crossplane_scheduled'
    - name: Run Crossplane proofs
      working-directory: go
      env:
        ESHU_CROSSPLANE_REDRIVE_PROOF_DSN: postgres://eshu:change-me@localhost:15432/eshu_crossplane_scheduled?sslmode=disable
        ESHU_CROSSPLANE_REDRIVE_PROOF_DISPOSABLE: '1'
      shell: bash
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=7m ./internal/storage/postgres/crossplane -run '^(TestCrossplaneRedriveDeadLetteredTargetIsNotPermanentlySuppressedLive|TestCrossplaneRedriveStateConcurrentClaimConvergesLive|TestCrossplaneRedriveStateCrashRecoveryLive|TestCrossplaneRedriveSuccessfulMaterializationWritesLedgerThenSkipsLive|TestCrossplaneRedriveSweepMidFanOutFailureRecoveredByCatchUpLive|TestCrossplaneRedriveSweepXRDLookupFailureRecoveredByCatchUpLive|TestCrossplaneRedriveTargetDiscoveryQueryPlanLive|TestCrossplaneRedriveUnconfirmedEdgeNotLedgeredAndReenqueuedLive|TestCrossplaneSatisfiedByRedriveClosesXRDLagWindowLive)$' | tee "${RUNNER_TEMP}/crossplane.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/crossplane.jsonl" --group crossplane
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Create fresh inventory database
      shell: bash
      run: docker exec "${{ inputs.postgres_container }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_inventory_scheduled'
    - name: Run infra inventory proofs
      working-directory: go
      env:
        ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu_inventory_scheduled?sslmode=disable
      shell: bash
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=7m ./internal/storage/postgres/infra/inventory -run '^(TestBackfillLiveClearsEveryFenceMarkOnAFreshInstall|TestBackfillLiveCoversEveryRepositoryThenMarksComplete|TestBackfillLiveFailureLeavesNoMarker|TestMirrorLiveTombstoneWithStalePathDeletesByEntityID|TestMirrorPathsLiveDeltaTouchesOnlyItsPathsAndTombstonesConverge|TestMirrorPathsLiveDerivesOnlyEntityDerivedLabelsWithCanonicalValues|TestMirrorPathsLiveLargeRepositoryCost|TestMirrorRepoLiveRederivesWholeRepoAndDropsStaleRows|TestReadFenceStateLiveReportsMarksAndReadiness|TestReaderLiveCountBucketsGroupsLabelProviderEnvironment|TestReaderLiveDimensionBucketsAndFiltersMirrorGraphClauses|TestReconcileCycleLiveBudgetBoundsEachCycle|TestReconcileCycleLiveDoesNotCountAnInFlightWriteAsRepaired|TestReconcileCycleLivePersistsAndResumesTheWalkCursor|TestReconcileCycleLiveReplicasClaimDisjointPages|TestReconcileCycleLiveReportsReadyOnceTheMarkerExists|TestReconcileCycleLiveWrapsOnlyWhenTheWalkReachesTheEnd|TestReconcileRepoLiveConcurrentDeriveDoesNotDeadlock|TestReconcileRepoLiveLeavesMatchingRepoUntouched|TestReconcileRepoLiveRepairsInjectedDrift|TestReconcileRepositoriesLivePageStopsAtBudget|TestRetentionLiveDeletesOnlyOrphansOfAffectedRepositories|TestRetentionLiveLockHoldAndDeriveWaitCost|TestRetentionLiveLocksBlockConcurrentDeriveOfSameRepository|TestRunBackgroundLiveRetriesUntilTheMarkerIsRecorded|TestVerifyWriterSessionLiveFlagsAnUnfencedConnection|TestWriterFenceLiveInvariantUnderConcurrentWritesAndRepairs|TestWriterFenceLiveMarksOnlyUnawareInfraWrites|TestWriterFenceLiveOnlyWholeRepoDerivesDischargeMarks|TestWriterFenceLiveRepairWaitsForAnOpenUnawareWrite|TestWriterFenceLiveStatementShapes|TestWriterFenceLiveTwoReplicasRepairAMarkOnce)$' | tee "${RUNNER_TEMP}/infra_inventory.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/infra_inventory.jsonl" --group infra_inventory
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Create fresh containerimage database
      shell: bash
      run: docker exec "${{ inputs.postgres_container }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_containerimage_scheduled'
    - name: Run containerimage proofs
      working-directory: go
      env:
        ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu_containerimage_scheduled?sslmode=disable
      shell: bash
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=6m ./internal/reducer/containerimage -run '^(TestPostgresContainerImageIdentityCompletedCutoverMultiChunkKeepsHeartbeatLive|TestPostgresContainerImageIdentityCompletedCutoverRejectsLaterLegacyWriter|TestPostgresContainerImageIdentityCompletedCutoverRejectsStaleClaimEpoch|TestPostgresContainerImageIdentityCutoverCacheFollowsTransactionBoundaries|TestPostgresContainerImageIdentityCutoverCacheRechecksAlternatingKeys|TestPostgresContainerImageIdentityCutoverFenceKeepsOtherScopeConcurrent|TestPostgresContainerImageIdentityFactFenceSerializesOnlyMatchingLogicalKey|TestPostgresContainerImageIdentityFirstCutoverRetriesExistingLegacyUpsertWithoutDeadlock|TestPostgresContainerImageIdentityHandlerKeepsUnmappedConfigWarningRepository|TestPostgresContainerImageIdentityHeldCanonicalStillCreatesCutover|TestPostgresContainerImageIdentityLegacyWriterFailsClosedAboveReadCommitted|TestPostgresContainerImageIdentityMarkerInvalidatesOpenTransactionCache|TestPostgresContainerImageIdentityMultiChunkFailureRollsBackAndRetryConverges|TestPostgresContainerImageIdentityMultiChunkWriterSerializesMatchingKeyAndCleansInterleavedLegacyWrite|TestPostgresContainerImageIdentityTombstoneFencePreventsStaleResurrection)$' -args -containerimage-bootstrap=1 -containerimage-database=eshu_containerimage_scheduled | tee "${RUNNER_TEMP}/containerimage.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/containerimage.jsonl" --group containerimage
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Run disposable golden corpus residual proof
      working-directory: go
      env:
        ESHU_TEST_DRAIN_RESIDUAL_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
        ESHU_TEST_DRAIN_RESIDUAL_POSTGRES_DISPOSABLE: "1"
      shell: bash
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=6m ./cmd/golden-corpus-gate -run '^(TestResidualBreakdownLivePostgres)$' | tee "${RUNNER_TEMP}/disposable_gate.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/disposable_gate.jsonl" --group disposable_gate
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Run disposable query proofs
      working-directory: go
      env:
        ESHU_TEST_CONTENT_INDEX_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
        ESHU_TEST_CONTENT_INDEX_POSTGRES_DISPOSABLE: "1"
        ESHU_TEST_DOCUMENTATION_INDEX_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
        ESHU_TEST_DOCUMENTATION_INDEX_POSTGRES_DISPOSABLE: "1"
      shell: bash
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=6m ./internal/query -run '^(TestContentReaderOmitsFingerprintKeysAfterStorageWriteLive|TestDocumentationFactsBindActiveGenerationLive|TestDocumentationFactsLabelsHonorScopedGrantsLive|TestDocumentationRelatedReadsBindActiveGenerationLive|TestDocumentationTargetFactsSplitReadMatchesLegacyLive|TestHardcodedSecretSideTableDifferentialLive|TestInvestigateCodeTopicPathFirstPostgresLive|TestRepositoryLanguageInventoryTwoStageLive|TestSearchEntitiesSingleRepoAvoidsNamedPreparedStatementLive)$' | tee "${RUNNER_TEMP}/disposable_query.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/disposable_query.jsonl" --group disposable_query
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Create fresh admin database
      shell: bash
      run: docker exec "${{ inputs.postgres_container }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_admin_scheduled'
    - name: Run admin proofs
      shell: bash
      working-directory: go
      env:
        ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu_admin_scheduled?sslmode=disable
        ESHU_ADMIN_REPLAY_FENCE_LIVE: "1"
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=6m ./internal/query/admin -run '^(TestAdminHandler_ChangedSincePoisonedLinksQueryLiveFiltersAndPagination|TestAdminHandler_ChangedSincePoisonedLinksQueryLiveRepositoryScopedGrant|TestAdminStoreIdentityFenceMutationsLive|TestAdminStoreMutationsRecheckStatusLive|TestAdminStoreReplayRecordsPriorFailureClassLive|TestAdminStoreSupersededGenerationReplayFenceLive|TestAdminWorkItemListingExposesPriorFailureAndNote|TestOperatorNoteKeepsTheFailureItReplaces)$' | tee "${RUNNER_TEMP}/admin.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/admin.jsonl" --group admin
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Create fresh completion database
      shell: bash
      run: docker exec "${{ inputs.postgres_container }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_completion_scheduled'
    - name: Run completion proofs
      shell: bash
      working-directory: go
      env:
        ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu_completion_scheduled?sslmode=disable
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=6m ./internal/storage/postgres/scope/completion -run '^(TestProducerScopeQuiescenceLive)$' | tee "${RUNNER_TEMP}/completion.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/completion.jsonl" --group completion
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Create fresh reachability database
      shell: bash
      run: docker exec "${{ inputs.postgres_container }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_reachability_scheduled'
    - name: Run reachability proofs
      shell: bash
      working-directory: go
      env:
        ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu_reachability_scheduled?sslmode=disable
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=6m ./internal/storage/postgres/code/reachability -run '^(TestCodeReachabilityLoaderGateEachPredicateIsLoadBearing|TestCodeReachabilityLoaderGateMatchesLegacyOnCompleteRuns|TestCodeReachabilityLoaderGateSkipsIncompleteRuns|TestCodeReachabilityPendingInputsPlanAtEpochBump|TestCodeReachabilityRailsRouteFactsLoaderKeepsRootOnlyRoutedController|TestCodeReachabilityRailsRouteFactsLoaderRoundTrip)$' | tee "${RUNNER_TEMP}/reachability.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/reachability.jsonl" --group reachability
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Run secret_lines proofs
      shell: bash
      working-directory: go
      env:
        ESHU_TEST_CONTENT_INDEX_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
        ESHU_TEST_CONTENT_INDEX_POSTGRES_DISPOSABLE: "1"
      run: |
        set -euo pipefail
        test -z "${GOFLAGS:-}"
        test -z "${GOWORK:-}"
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
        go test -json -race -p=1 -count=1 -timeout=8m ./internal/storage/postgres/secret/lines -run '^(TestBeginDeferralTakesReadinessAndBumpsEpochLive|TestBootstrapStartsDuringARebuildWaitsThenProceedsLive|TestBulkLoadLockDiesWithItsSessionLive|TestBulkLoadLockKeepsReadyHonestLive|TestBulkLoadLockRefusesASecondLoadLive|TestBulkLoadLockSessionSurvivesIdleTimeoutLive|TestDeferredPoolFailsNamingTheHolderLive|TestDeferredPoolReleasesTheProbeWhenOpeningFailsLive|TestDeferredPoolUnreachableDatabaseFailsWithinThePingTimeoutLive|TestDeferredPoolWaitsForARebuildLongerThanThePingLive|TestDeferredProbeUncertainUnlockIsDiscardedLive|TestDeferredSessionBirthIsFencedAfterLockLossLive|TestDeferredSessionWritesDeriveNothingLive|TestFinalizeBoundsABatchByContentBytesLive|TestFinalizeIsRestartSafeLive|TestFinalizeIsSupersededByNewBulkLoadLive|TestFinalizeRebuildsSideTableToParityLive|TestFinalizeSurvivesAConcurrentKeyMoveLive|TestFinalizeWithSteadyStateWritersLive|TestFinalizeYieldsToAHeldWriterLive|TestRepairerCountsShutdownAsCancelledLive|TestRepairerIsSingleFlightLive|TestRepairerLeavesReadyStateAloneLive|TestRepairerPublishesOnAPoolOfOneLive|TestRepairerPublishesStaleStateToParityLive|TestRepairerRecordsFailureAndHealsLive|TestRepairerSkipsWhileTheProbeHoldsThenBootstrapProceedsLive|TestRepairerYieldsToBulkLoadAndFollowsEpochLive|TestRepairerYieldsToLiveDeferredWritersAfterLockLossLive|TestUncertainLockSessionNeverReturnsToThePoolLive)$' | tee "${RUNNER_TEMP}/secret_lines.jsonl"
        python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/secret_lines.jsonl" --group secret_lines
        effective_config="$(go env GOFLAGS GOWORK)"
        test -z "$effective_config"
        proof_status="$(git -C .. status --porcelain --untracked-files=all)"
        test -z "$proof_status"
    - name: Upload bulk proof streams
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scheduled-proof-streams-bulk-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/admin.jsonl
          ${{ runner.temp }}/completion.jsonl
          ${{ runner.temp }}/reachability.jsonl
          ${{ runner.temp }}/secret_lines.jsonl
          ${{ runner.temp }}/crossplane.jsonl
          ${{ runner.temp }}/infra_inventory.jsonl
          ${{ runner.temp }}/disposable_gate.jsonl
          ${{ runner.temp }}/disposable_query.jsonl
          ${{ runner.temp }}/containerimage.jsonl
        if-no-files-found: error
        retention-days: 14
