# Paths that require test.yml's go-core lane (golangci-lint, gofumpt, go build,
# filelength plugin, and go-core test mirrors) on PRs.
# Must remain a strict superset of every registry gate with ci.job == "go-core"
# in specs/ci-gates.d/; guarded by scripts/ci/test-go-core-filter-superset.py.
go_core:
  - 'go/**'
  - 'sdk/go/**'
  - 'tools/golangci-lint-filelength/**'
  - 'Makefile'
  - '.github/workflows/**'
  - '.github/actions/ci-go-core/**'
  - '.github/leaf-go-core-filter.yml'
  - 'scripts/dev/precommit-go.sh'
  - 'scripts/lib/go-toolchain.sh'
  - 'scripts/lib/precommit-go-filecap.sh'
  - 'scripts/lib/cgo-cflags.sh'
  - 'scripts/lib/precommit-go-gosec.sh'
  - 'scripts/test-precommit-go-cgo-cflags.sh'
  - 'scripts/test-precommit-go-filecap.sh'
  - 'scripts/lib/test-precommit-go-filecap-cases.sh'
  - 'scripts/ci/install-apt-packages.sh'
  - 'scripts/test-ci-install-apt-packages.sh'
  - 'scripts/lib/test-ci-install-apt-packages-fixtures.sh'
  - 'scripts/ci/go-mod-download-retry.sh'
  - 'scripts/test-ci-go-mod-download-retry.sh'
  - 'scripts/ci/go-install-retry.sh'
  - 'scripts/test-ci-go-install-retry.sh'
  - 'scripts/lib/test-ci-go-install-retry-fake-go.sh'
  - 'scripts/ci/smoke_go_build_canary.py'
  - 'scripts/ci/assert-go-complete.sh'
  - 'scripts/ci/test-assert-go-complete.sh'
  - 'scripts/ci/test-go-core-filter-superset.py'
  - 'specs/ci-gates.v1.yaml'
  - 'specs/ci-gates.d/**'
  - 'specs/ifa-coverage-manifest.v1.yaml'
  - 'specs/fact-kind-registry.v1.yaml'
  - 'specs/replay-coverage-manifest.v1.yaml'
  - 'testdata/golden/e2e-20repo-snapshot.json'
  - 'testdata/cassettes/vulnerabilityintelligence/**'
  - 'schema/data-plane/**'
