ifa:
  - '.github/workflows/static-contract-gates.yml'
  - 'specs/ci-gates.v1.yaml'
  - 'specs/ci-gates.d/**'
  - '.github/static-contract-filters.yml'
  - 'go/internal/ifa/**'
  - 'go/internal/synth/gcp/**'
  - 'go/cmd/ifa/**'
  - 'docs/internal/design/4389-ifa-conformance-platform.md'
  - 'specs/ifa-coverage-manifest.v1.yaml'
  - 'specs/fact-kind-registry.v1.yaml'
  - 'specs/replay-coverage-manifest.v1.yaml'
  - 'testdata/golden/e2e-20repo-snapshot.json'
  # The shell family registry. The Go blocker-shape lockstep test
  # parses these rows and binds each family's declared blocker_kind
  # to its real handler's write shape, so a row edit must select
  # this gate's CI check. A single '*' does not cross '/' in a
  # dorny filter, hence the explicit '**' on the rows directory.
  - 'scripts/lib/ifa_family_registry.sh'
  - 'scripts/lib/ifa_family_registry/**'
  # #5351 materialized-edge exhaustiveness gate: the SQL relationship
  # family's write path edge/writer/sql.go, sql_relationship_*.go)
  # and its fixtures/manifest. A write-path-only regression here is
  # exactly the silent-no-op class the gate exists for and the pure
  # seam cannot catch, so it MUST retrigger the Ifa contract-layer
  # gate (which runs the pure ifa-materialized-edge-coverage go test).
  # The gate runs `go test ./internal/reducer/...` for the WHOLE TREE,
  # so any sibling file -- in the root or in a domain subpackage --
  # can change its verdict. It ran a
  # `-run TestMaterializedEdgeFamilies` filter until that regex went
  # stale twice, silently not selecting tests that had landed since.
  # specs/ci-gates.v1.yaml was broadened to 'go/internal/reducer/**'
  # for exactly that reason
  # (#5873) but this filter was not, so the registry could select the
  # gate as required while this workflow never scheduled it. The
  # aggregator then waited out its 55m timeout on a MISSING job and
  # failed required-gates-complete -- red that names no real defect
  # and points at no file. Keep this glob and the registry trigger in
  # lockstep; the per-file entries below stay as the reader's map of
  # what the gate is actually about.
  - 'go/internal/reducer/**'
  - 'go/internal/reducer/materialized_edge_families.go'
  - 'go/internal/reducer/contract/domain.go'
  - 'go/internal/reducer/sqlrelationship/sql_relationship_materialization.go'
  - 'go/internal/reducer/sqlrelationship/sql_relationship_embedded_query.go'
  - 'go/internal/reducer/sqlrelationship/sql_relationship_metadata.go'
  # The whole cypher package, mirroring the registry trigger
  # (#6181). The direct-family drift guard this gate runs parses
  # every non-test file in that package and follows each reducer
  # port through its call graph, so any file there can change the
  # verdict; the four per-file entries below reached 6 of 131 and
  # left every other direct writer unable to schedule this job.
  - 'go/internal/storage/cypher/**'
  - 'go/internal/storage/cypher/edge/writer/sql.go'
  - 'go/internal/storage/cypher/materialized_edge_*.go'
  - 'go/internal/storage/cypher/canonical_code_call_edges.go'
  - 'go/internal/storage/cypher/canonical_inheritance_edges.go'
  - 'specs/ifa-materialized-edge-coverage.v1.yaml'
  - 'specs/ifa-materialized-edge-coverage-direct.v1.yaml'
  - 'testdata/cassettes/sqlrelationships/**'
  - 'testdata/cassettes/codecalls/**'
  - 'testdata/cassettes/symbolruntime/**'
  - 'testdata/cassettes/codeowners/**'
  - 'testdata/cassettes/deployableunit/**'
  - 'testdata/cassettes/documentation/**'
  - 'testdata/cassettes/inheritance/**'
  - 'testdata/cassettes/iaminstanceprofilerole/**'
  - 'testdata/cassettes/kubernetesnamespaceenvironment/**'
  - 'testdata/cassettes/rationale/**'
  - 'testdata/cassettes/repodependency/**'
  - 'testdata/cassettes/shellexec/**'
  - 'testdata/cassettes/submodulepin/**'
  - 'testdata/cassettes/workloaddependency/**'
