name: Bench Baseline Refresh
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: 8617-lint-cache-proof
  cancel-in-progress: false
jobs:
  refresh:
    name: Bounded lint cache proof; no baseline publication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOCACHE: /tmp/eshu-ci/go-build
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 2
    - name: Restore Go build cache
      uses: actions/cache/restore@v4
      with:
        path: /tmp/eshu-ci/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ hashFiles('go/go.sum') }}
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go/go.mod
        cache-dependency-path: go/go.sum
    - name: Install ripgrep
      run: scripts/ci/install-apt-packages.sh ripgrep
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Pre-warm Go modules
      run: scripts/ci/go-mod-download-retry.sh
    - name: Install golangci-lint
      run: scripts/ci/go-install-retry.sh github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
    - name: Pre-warm golangci-lint filelength plugin modules
      run: scripts/ci/go-mod-download-retry.sh tools/golangci-lint-filelength
    - name: Build golangci-lint filelength plugin
      working-directory: tools/golangci-lint-filelength
      run: make build
    - name: Measure same-source cold control and warm lint
      run: bash scripts/experiments/lint-cache-proof.sh measure
    - name: Save isolated analyzer cache
      uses: actions/cache/save@v4
      with:
        path: /tmp/eshu-lint-proof/seed
        key: 8617-lint-proof-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Remove only experiment analyzer cache
      run: bash scripts/experiments/lint-cache-proof.sh clear
    - name: Restore exact experiment analyzer cache
      uses: actions/cache/restore@v4
      with:
        path: /tmp/eshu-lint-proof/seed
        key: 8617-lint-proof-${{ github.run_id }}-${{ github.run_attempt }}
        fail-on-cache-miss: true
    - name: Measure restored-cache lint
      run: bash scripts/experiments/lint-cache-proof.sh restored
    - name: Prove source and configuration invalidation
      run: bash scripts/experiments/lint-cache-proof.sh invalidation
    - name: Upload raw experiment evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: 8617-lint-cache-proof
        path: '/tmp/eshu-lint-proof/*.log

          /tmp/eshu-lint-proof/*.time

          /tmp/eshu-lint-proof/*.txt

          /tmp/eshu-lint-proof/*.load-*'
        retention-days: 7
        if-no-files-found: error
