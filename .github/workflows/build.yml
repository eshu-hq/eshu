name: Build and Release Binaries

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches: [ main ]
    tags: [ 'v*' ]

concurrency:
  group: ci-leaf-build-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    # Binary builds need read access; release publishing retains write access.
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'build') }}
    name: Build on ${{ matrix.os }}
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: eshu-linux-x86_64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: eshu-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a release-build
      # failure that never compiled anything (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Build Go binaries
        working-directory: go
        env:
          CGO_ENABLED: "1"
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_SHA::12}"
          fi
          go build -trimpath -ldflags="-s -w -X github.com/eshu-hq/eshu/go/internal/buildinfo.Version=${VERSION}" -o ../dist/${{ matrix.artifact_name }} ./cmd/eshu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'release')) && (startsWith(github.ref, 'refs/tags/v')) }}
    name: Create Release
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/eshu-linux-x86_64/eshu-linux-x86_64
            artifacts/eshu-macos-arm64/eshu-macos-arm64
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
