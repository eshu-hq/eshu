name: tmp-cap-proof
on:
  push:
    branches: [tmp/8241-cap-proof]
jobs:
  capped:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: start
        run: echo "START $(date +%s)" >> "$GITHUB_ENV"
      - name: long step
        run: sleep 150
      - name: after always
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "REACHED always() step; job.status=$JOB_STATUS"
          echo "REACHED always() job.status=$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
      - name: after cancelled only
        if: cancelled()
        run: echo "REACHED cancelled() step"
