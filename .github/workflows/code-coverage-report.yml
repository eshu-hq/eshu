name: Code Coverage Report

# Advisory Go code-coverage reporting for #4227. This is ordinary executable
# test coverage and intentionally does not replace replay, golden-corpus, or
# full-corpus proof. The workflow uploads current PR artifacts; the committed
# docs report is the public baseline and README badge source.

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-leaf-code-coverage-report-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  static-mirror:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'static-mirror') }}
    name: static mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: scripts/ci/install-apt-packages.sh jq ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate coverage report contract
        run: bash scripts/test-generate-code-coverage-report.sh

  coverage-report:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'coverage-report')) && (github.event_name != 'pull_request') }}
    name: Generate Go code coverage report
    # Advisory report only — it does not gate correctness (see the header). The
    # ~15-18m full-coverage run is intentionally OFF the PR path: it caught no
    # code defects there, it only produced the badge/baseline numbers. This job
    # runs post-merge on push-to-main and on manual dispatch, and it only
    # UPLOADS them: the workflow holds `contents: read`, runs no git write, and
    # redirects the generator to the workspace root via
    # ESHU_CODE_COVERAGE_REPORT_OUT below, so it never touches the committed
    # docs/public/reference/code-coverage.md. Refreshing the committed report and
    # the README shield is a manual step — run
    # scripts/generate-code-coverage-report.sh with its default output paths and
    # commit the result. The cheap static-mirror contract check above still runs
    # on every PR, so a change to the generator script is still validated
    # pre-merge.
    runs-on: ubuntu-24.04
    needs: static-mirror
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a coverage
      # regression that never ran a test -- this is the exact failure #6615
      # reported (sigs.k8s.io/yaml stream error, "Generate advisory Go
      # coverage report" step, run 102179760337, all packages [setup failed]).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      # The full go test run includes tests that shell out to the committed
      # cassette private-data gate, which needs ripgrep. Without it those
      # tests fail closed and the report goes red on every main push (#7111).
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate advisory Go coverage report
        env:
          ESHU_CODE_COVERAGE_PROFILE_OUT: ${{ github.workspace }}/go-code-coverage.out
          ESHU_CODE_COVERAGE_REPORT_OUT: code-coverage.md
          ESHU_CODE_COVERAGE_SHIELD_OUT: code-coverage-shield.json
        run: bash scripts/generate-code-coverage-report.sh
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            go-code-coverage.out
            code-coverage.md
            code-coverage-shield.json
          if-no-files-found: error
