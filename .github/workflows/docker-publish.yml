name: Publish Image
on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths: [
      'Dockerfile', '.dockerignore', 'go/**',
      '.github/workflows/docker-publish.yml', 'scripts/ci/select-docker-publish-lanes.sh', 'scripts/verify-apk-floors.sh',
      'scripts/test-verify-apk-floors.sh', 'scripts/fixtures/apk-floors/**',
      'scripts/verify-runtime-image-tools.sh', 'scripts/test-verify-runtime-image-tools.sh',
      'scripts/verify-scanner-images.sh', 'scripts/test-verify-scanner-images.sh',
      'scripts/lib/rootfs-resolve.sh',
      'scripts/verify-scanner-digest-pins.sh', 'scripts/test-verify-scanner-digest-pins.sh',
      'scripts/ci/go-install-retry.sh',
    ]
  workflow_dispatch:
    inputs:
      mode:
        description: Normal release publication or pinned CI service image mirror
        required: true
        default: release
        type: choice
        options:
          - release
          - ci-mirrors-publish
          - ci-mirrors-verify-public
      expected_sha:
        description: Exact independently reviewed branch SHA required for mirror publication
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: ci-leaf-docker-publish-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"
  CI_BUILDKIT_IMAGE: ghcr.io/eshu-hq/ci-mirror-buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  ESHU_XX_IMAGE: ghcr.io/eshu-hq/ci-mirror-xx@sha256:0c6a569797744e45955f39d4f7538ac344bfb7ebf0a54006a0a4297b153ccf0f
  ESHU_GO_IMAGE: ghcr.io/eshu-hq/ci-mirror-golang@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
  ESHU_ALPINE_IMAGE: ghcr.io/eshu-hq/ci-mirror-alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_PLATFORMS: ${{ (github.event_name == 'pull_request') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
jobs:
  changes:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'changes')) && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.filter.outputs.image }}
      apkfloors: ${{ steps.filter.outputs.apkfloors }}
      scannerpins: ${{ steps.filter.outputs.scannerpins }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide release artifact lanes
        id: filter
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/select-docker-publish-lanes.sh
  verify-apk-floors:
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'verify-apk-floors')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && (github.event_name == 'pull_request' && needs.changes.outputs.apkfloors == 'true')) }}
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.apkfloors }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: ${{ env.LANE_APPLIES == 'true' }}
        uses: actions/checkout@v5
      - name: Self-test the apk floor verifier
        if: ${{ env.LANE_APPLIES == 'true' }}
        run: bash scripts/test-verify-apk-floors.sh
      - name: Verify apk floors against the Alpine repository
        if: ${{ env.LANE_APPLIES == 'true' }}
        run: bash scripts/verify-apk-floors.sh
  # Scanner digest pins (#9491): the drift gate for the artifactDigests pins
  # in go/internal/collector/scannerworker/component/manifest.go. Lives
  # beside verify-apk-floors (own scannerpins lane, no dependency on the
  # 45-minute builds): the self-test runs first so a broken verifier fails
  # before any registry read, then the verifier resolves each pin against
  # the immutable sha-<publish-sha> tag, re-verifies the build
  # attestation, and fails when scanner sources advanced past the anchor.
  # Anonymous crane reads need no login; gh attestation verify uses the
  # in-workflow token. Full history (fetch-depth 0) feeds the
  # merge-base staleness check.
  verify-scanner-digest-pins:
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'verify-scanner-digest-pins')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && (github.event_name == 'pull_request' && needs.changes.outputs.scannerpins == 'true')) }}
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.scannerpins }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout repository
        if: ${{ env.LANE_APPLIES == 'true' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install pinned crane
        if: ${{ env.LANE_APPLIES == 'true' }}
        run: GOBIN="${RUNNER_TEMP}" scripts/ci/go-install-retry.sh github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Self-test the scanner digest pin verifier
        if: ${{ env.LANE_APPLIES == 'true' }}
        run: bash scripts/test-verify-scanner-digest-pins.sh
      - name: Verify scanner digest pins against GHCR
        if: ${{ env.LANE_APPLIES == 'true' }}
        env:
          CRANE_BIN: ${{ runner.temp }}/crane
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-scanner-digest-pins.sh
  build-and-push-image:
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'build-and-push-image')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && needs.changes.outputs.image == 'true') }}
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.image }}
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        if: ${{ env.LANE_APPLIES == 'true' }}
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        if: ${{ env.LANE_APPLIES == 'true' }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}
      - name: Log in to Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        if: ${{ env.LANE_APPLIES == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
      - name: Compute source date epoch
        if: ${{ env.LANE_APPLIES == 'true' }}
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Pin deterministic labels
        if: ${{ env.LANE_APPLIES == 'true' }}
        id: labels
        run: |
          CREATED="$(date -u -d "@${{ steps.epoch.outputs.epoch }}" '+%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' '${{ steps.meta.outputs.labels }}' > /tmp/labels.txt
          sed -i "s|org\.opencontainers\.image\.created=.*|org.opencontainers.image.created=${CREATED}|" /tmp/labels.txt
          { echo 'labels<<EOF'; cat /tmp/labels.txt; echo 'EOF'; } >> "${GITHUB_OUTPUT}"
      - name: Build and push Docker image
        if: ${{ env.LANE_APPLIES == 'true' }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            ESHU_XX_IMAGE=${{ env.ESHU_XX_IMAGE }}
            ESHU_GO_IMAGE=${{ env.ESHU_GO_IMAGE }}
            ESHU_ALPINE_IMAGE=${{ env.ESHU_ALPINE_IMAGE }}
            ESHU_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          # #9632: the BuildKit cache lives in the eshu-buildcache GHCR package,
          # not the 10 GB Actions cache store, where mode=max blobs (~8.8 GB
          # per main push) evicted the Go build caches. Only a push event
          # (main or tag) writes it; pull_request (test.yml's workflow_call
          # carries the caller's event) and workflow_dispatch get an empty
          # cache-to and only read. A missing cache is a plain miss.
          cache-from: type=registry,ref=ghcr.io/eshu-hq/eshu-buildcache:runtime
          cache-to: ${{ github.event_name == 'push' && 'type=registry,ref=ghcr.io/eshu-hq/eshu-buildcache:runtime,mode=max' || '' }}
          no-cache-filters: runtime
          platforms: ${{ env.IMAGE_PLATFORMS }}
      - name: Generate artifact attestation
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v4.1.0
      - name: Sign Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"
      - name: Verify Docker image signature
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Prepare release metadata output
        if: ${{ github.event_name != 'pull_request' }}
        run: mkdir -p dist
      - name: Generate image SBOM
        if: ${{ github.event_name != 'pull_request' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/eshu-image.spdx.json
          artifact-name: eshu-image-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Generate SBOM attestation
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/eshu-image.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify image attestations
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3
  # Destination scanner-<name> images (#8878): one minimal image per analyzer,
  # each carrying exactly its eshu-scanner-component-<name> binary from the
  # Dockerfile scanner-<name> stage. Published as
  # ghcr.io/<owner>/scanner-<name> so the ComponentPackage manifest artifact
  # (go/internal/collector/scannerworker/component) can pin the published
  # digest after the first publish. Downstream activation consumes these
  # images by digest alone (a tag is rejected at render time), mirroring
  # the main image job (semver tags included on release-tag events).
  build-and-push-scanner-images:
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'build-and-push-scanner-images')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && needs.changes.outputs.image == 'true') }}
    name: Build and push scanner-${{ matrix.component }}
    strategy:
      matrix:
        component: [image, sbom, osruntime]
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.image }}
      SCANNER_IMAGE_NAME: ${{ github.repository_owner }}/scanner-${{ matrix.component }}
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        if: ${{ env.LANE_APPLIES == 'true' }}
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        if: ${{ env.LANE_APPLIES == 'true' }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}
      - name: Log in to Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        if: ${{ env.LANE_APPLIES == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SCANNER_IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
      - name: Compute source date epoch
        if: ${{ env.LANE_APPLIES == 'true' }}
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Pin deterministic labels
        if: ${{ env.LANE_APPLIES == 'true' }}
        id: labels
        run: |
          CREATED="$(date -u -d "@${{ steps.epoch.outputs.epoch }}" '+%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' '${{ steps.meta.outputs.labels }}' > /tmp/labels.txt
          sed -i "s|org\.opencontainers\.image\.created=.*|org.opencontainers.image.created=${CREATED}|" /tmp/labels.txt
          { echo 'labels<<EOF'; cat /tmp/labels.txt; echo 'EOF'; } >> "${GITHUB_OUTPUT}"
      - name: Build and push scanner image
        if: ${{ env.LANE_APPLIES == 'true' }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: scanner-${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            ESHU_XX_IMAGE=${{ env.ESHU_XX_IMAGE }}
            ESHU_GO_IMAGE=${{ env.ESHU_GO_IMAGE }}
            ESHU_ALPINE_IMAGE=${{ env.ESHU_ALPINE_IMAGE }}
            ESHU_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          # #9632: same registry cache and push-only write as the main image
          # build. The runtime tag is read too: the targets share the builder
          # stage, which the old shared type=gha scope reused across builds.
          cache-from: |
            type=registry,ref=ghcr.io/eshu-hq/eshu-buildcache:scanner-${{ matrix.component }}
            type=registry,ref=ghcr.io/eshu-hq/eshu-buildcache:runtime
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/eshu-hq/eshu-buildcache:scanner-{0},mode=max', matrix.component) || '' }}
          platforms: ${{ env.IMAGE_PLATFORMS }}
      - name: Generate artifact attestation
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SCANNER_IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v4.1.0
      - name: Sign scanner image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.SCANNER_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"
      - name: Verify scanner image signature
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.SCANNER_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Prepare release metadata output
        if: ${{ github.event_name != 'pull_request' }}
        run: mkdir -p dist
      - name: Generate scanner image SBOM
        if: ${{ github.event_name != 'pull_request' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.SCANNER_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/eshu-scanner-${{ matrix.component }}.spdx.json
          artifact-name: eshu-scanner-${{ matrix.component }}-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Generate scanner SBOM attestation
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SCANNER_IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/eshu-scanner-${{ matrix.component }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify scanner image attestations
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://${{ env.REGISTRY }}/${{ env.SCANNER_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3
  promote-moving-tags:
    needs: [changes, build-and-push-image]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'promote-moving-tags')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && needs.changes.outputs.image == 'true' && needs.build-and-push-image.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote moving tags behind the ancestry guard
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
          MY_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/promote-moving-tags.sh
  verify-reproducibility:
    needs: [changes, build-and-push-image]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'verify-reproducibility')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && needs.changes.outputs.image == 'true') }}
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.image }}
    # The scanner destination builds (#8878) added three rootfs builds plus
    # verifier runs to this job; measured need is ~40 min (13 first build +
    # ~11 shared-builder scanner builds + 13 second no-cache build + compare;
    # the pre-fix shape needed ~54 min and died at the 30- and 45-minute
    # envelopes with no test failing). 60 leaves 1.5x margin over the
    # measured need.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: ${{ env.LANE_APPLIES == 'true' }}
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        if: ${{ env.LANE_APPLIES == 'true' }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}
      - name: Compute source date epoch
        if: ${{ env.LANE_APPLIES == 'true' }}
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build image (first)
        if: ${{ env.LANE_APPLIES == 'true' }}
        run: |
          bash scripts/ci/build-reproducibility-image.sh /tmp/out1 "${{ steps.epoch.outputs.epoch }}"
      - name: Self-test the runtime image tool verifier
        if: ${{ env.LANE_APPLIES == 'true' }}
        run: bash scripts/test-verify-runtime-image-tools.sh
      - name: Verify runtime image ships required tools
        if: ${{ env.LANE_APPLIES == 'true' }}
        # #7762: git execs ssh for ESHU_GIT_AUTH_METHOD=ssh and the
        # HEALTHCHECK execs curl. Assert the verifier's REQUIRED_TOOLS
        # list against the rootfs this job just built rather than the
        # Dockerfile text.
        run: bash scripts/verify-runtime-image-tools.sh /tmp/out1
      - name: Self-test the scanner image verifier
        if: ${{ env.LANE_APPLIES == 'true' }}
        run: bash scripts/test-verify-scanner-images.sh
      - name: Build and verify scanner destination images
        if: ${{ env.LANE_APPLIES == 'true' }}
        # #8878: each scanner-<name> stage must export a rootfs carrying
        # only its own component binary under the enforced directories.
        # Same mirrored bases and reproducibility flags as
        # scripts/ci/build-reproducibility-image.sh, but WITHOUT --no-cache:
        # the verifier asserts content, not cold-build reproducibility (the
        # main-image compare below owns that), and the three targets share
        # one builder stage, so the second and third builds reuse its layers
        # instead of recompiling Go twice more (~14 min saved; the first
        # build on a fresh runner is inherently cold).
        run: |
          for component in image sbom osruntime; do
            dest="/tmp/scan-${component}"
            docker buildx build \
              --platform linux/amd64 \
              --target "scanner-${component}" \
              --build-arg "SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}" \
              --build-arg ESHU_VERSION=reproducibility-test \
              --build-arg "ESHU_XX_IMAGE=${{ env.ESHU_XX_IMAGE }}" \
              --build-arg "ESHU_GO_IMAGE=${{ env.ESHU_GO_IMAGE }}" \
              --build-arg "ESHU_ALPINE_IMAGE=${{ env.ESHU_ALPINE_IMAGE }}" \
              --provenance=false \
              --output "type=local,dest=${dest}" \
              .
            bash scripts/verify-scanner-images.sh "${component}" "${dest}"
          done
      - name: Build image (second, no cache)
        if: ${{ env.LANE_APPLIES == 'true' }}
        run: |
          bash scripts/ci/build-reproducibility-image.sh /tmp/out2 "${{ steps.epoch.outputs.epoch }}"
      - name: Compare builds
        if: ${{ env.LANE_APPLIES == 'true' }}
        run: |
          (cd /tmp/out1 && find . -type f -exec sha256sum {} \; | sort -k2) > /tmp/out1.sha256
          (cd /tmp/out2 && find . -type f -exec sha256sum {} \; | sort -k2) > /tmp/out2.sha256
          grep './usr/local/bin/' /tmp/out1.sha256 | sort -k2 > /tmp/out1.binaries.sha256
          grep './usr/local/bin/' /tmp/out2.sha256 | sort -k2 > /tmp/out2.binaries.sha256
          if ! diff /tmp/out1.binaries.sha256 /tmp/out2.binaries.sha256; then
            echo "::error::Go binaries differ across builds. Reproducibility failed."
            exit 1
          fi
          echo "::notice::All Go binaries are byte-identical across builds."
          echo "Reproducibility summary:"
          echo "  Go binaries in /usr/local/bin: IDENTICAL"
          echo "  Total files compared: $(wc -l < /tmp/out1.sha256)"
          if diff /tmp/out1.sha256 /tmp/out2.sha256 > /tmp/repro.diff 2>&1; then
            echo "  Full filesystem: IDENTICAL"
          else
            DIFF_COUNT=$(grep -c '^<' /tmp/repro.diff 2>/dev/null || echo 0)
            echo "  Full filesystem: ${DIFF_COUNT} files differ (acceptable: apk-installed system package metadata variance)"
          fi
  attach-release-sbom:
    needs: [changes, build-and-push-image]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'attach-release-sbom')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && needs.changes.outputs.image == 'true' && github.ref_type == 'tag') }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download image SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: eshu-image-sbom.spdx.json
          path: dist
      - name: Wait for GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..30}; do
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
      - name: Attach image SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "dist/eshu-image-sbom.spdx.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
  publish-ci-service-mirrors:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ci-mirrors-publish' && github.repository == 'eshu-hq/eshu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Install pinned crane
        run: GOBIN="${RUNNER_TEMP}" scripts/ci/go-install-retry.sh github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test publisher safety contract
        run: bash scripts/dev/test-publish-ci-image-mirrors.sh
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy exact upstream indexes
        env:
          CRANE_BIN: ${{ runner.temp }}/crane
          EXPECTED_REVIEWED_SHA: ${{ inputs.expected_sha }}
        run: bash scripts/dev/publish-ci-image-mirrors.sh publish
  verify-public-ci-service-mirrors:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ci-mirrors-verify-public' && github.repository == 'eshu-hq/eshu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Install pinned crane
        run: GOBIN="${RUNNER_TEMP}" scripts/ci/go-install-retry.sh github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test publisher safety contract
        run: bash scripts/dev/test-publish-ci-image-mirrors.sh
      - name: Verify anonymous digests
        env:
          CRANE_BIN: ${{ runner.temp }}/crane
        run: bash scripts/dev/publish-ci-image-mirrors.sh verify-public
