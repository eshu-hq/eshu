name: Publish Image and Helm Chart
on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths: [
      'Dockerfile', '.dockerignore', 'go/**',
      'deploy/helm/**', '.github/workflows/docker-publish.yml', 'scripts/ci/select-docker-publish-lanes.sh', 'scripts/ci/push-helm-chart.sh', 'scripts/verify-apk-floors.sh',
      'scripts/test-verify-apk-floors.sh', 'scripts/fixtures/apk-floors/**',
      'scripts/verify-runtime-image-tools.sh', 'scripts/test-verify-runtime-image-tools.sh',
    ]
  workflow_dispatch:
    inputs:
      mode:
        description: Normal release publication or pinned CI service image mirror
        required: true
        default: release
        type: choice
        options:
          - release
          - ci-mirrors-publish
          - ci-mirrors-verify-public
      expected_sha:
        description: Exact independently reviewed branch SHA required for mirror publication
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: ci-leaf-docker-publish-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_BUILDKIT_IMAGE: ghcr.io/eshu-hq/ci-mirror-buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  ESHU_XX_IMAGE: ghcr.io/eshu-hq/ci-mirror-xx@sha256:0c6a569797744e45955f39d4f7538ac344bfb7ebf0a54006a0a4297b153ccf0f
  ESHU_GO_IMAGE: ghcr.io/eshu-hq/ci-mirror-golang@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
  ESHU_ALPINE_IMAGE: ghcr.io/eshu-hq/ci-mirror-alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_PATH: deploy/helm/eshu
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
  IMAGE_PLATFORMS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
jobs:
  queue-selection:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'queue-selection')) && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release') }}
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: docker-publish.yml
  changes:
    needs: queue-selection
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'changes')) && (github.event_name != 'workflow_dispatch' || inputs.mode == 'release') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.filter.outputs.image }}
      chart: ${{ steps.filter.outputs.chart }}
      apkfloors: ${{ steps.filter.outputs.apkfloors }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'package-and-push-chart') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-apk-floors') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide release artifact lanes
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'package-and-push-chart') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-apk-floors') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility')) }}
        id: filter
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/select-docker-publish-lanes.sh
  verify-apk-floors:
    needs: [queue-selection, changes]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'verify-apk-floors')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && needs.changes.outputs.apkfloors == 'true'))) }}
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.apkfloors }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-apk-floors'))) && (env.LANE_APPLIES == 'true') }}
        uses: actions/checkout@v5
      - name: Self-test the apk floor verifier
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-apk-floors'))) && (env.LANE_APPLIES == 'true') }}
        run: bash scripts/test-verify-apk-floors.sh
      - name: Verify apk floors against the Alpine repository
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-apk-floors'))) && (env.LANE_APPLIES == 'true') }}
        run: bash scripts/verify-apk-floors.sh
  build-and-push-image:
    needs: [queue-selection, changes]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'build-and-push-image')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && (github.event_name == 'merge_group' || needs.changes.outputs.image == 'true')) }}
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.image }}
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}
      - name: Log in to Container Registry
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
      - name: Compute source date epoch
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Pin deterministic labels
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        id: labels
        run: |
          CREATED="$(date -u -d "@${{ steps.epoch.outputs.epoch }}" '+%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' '${{ steps.meta.outputs.labels }}' > /tmp/labels.txt
          sed -i "s|org\.opencontainers\.image\.created=.*|org.opencontainers.image.created=${CREATED}|" /tmp/labels.txt
          { echo 'labels<<EOF'; cat /tmp/labels.txt; echo 'EOF'; } >> "${GITHUB_OUTPUT}"
      - name: Build and push Docker image
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          build-args: |
            ESHU_XX_IMAGE=${{ env.ESHU_XX_IMAGE }}
            ESHU_GO_IMAGE=${{ env.ESHU_GO_IMAGE }}
            ESHU_ALPINE_IMAGE=${{ env.ESHU_ALPINE_IMAGE }}
            ESHU_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: runtime
          platforms: ${{ env.IMAGE_PLATFORMS }}
      - name: Generate artifact attestation
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        uses: sigstore/cosign-installer@v4.1.0
      - name: Sign Docker image
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"
      - name: Verify Docker image signature
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Prepare release metadata output
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        run: mkdir -p dist
      - name: Generate image SBOM
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/eshu-image.spdx.json
          artifact-name: eshu-image-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Generate SBOM attestation
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/eshu-image.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify image attestations
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'build-and-push-image') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3
  promote-moving-tags:
    needs: [queue-selection, changes, build-and-push-image]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'promote-moving-tags')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && needs.changes.outputs.image == 'true' && needs.build-and-push-image.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags')) }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}
      - name: Log in to Container Registry
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags')) }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote moving tags behind the ancestry guard
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'promote-moving-tags')) }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
          MY_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/promote-moving-tags.sh
  verify-reproducibility:
    needs: [queue-selection, changes, build-and-push-image]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'verify-reproducibility')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && (github.event_name == 'merge_group' || needs.changes.outputs.image == 'true')) }}
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.image }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}
      - name: Compute source date epoch
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build image (first)
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        run: |
          bash scripts/ci/build-reproducibility-image.sh /tmp/out1 "${{ steps.epoch.outputs.epoch }}"
      - name: Self-test the runtime image tool verifier
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        run: bash scripts/test-verify-runtime-image-tools.sh
      - name: Verify runtime image ships required tools
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        # #7762: git execs ssh for ESHU_GIT_AUTH_METHOD=ssh and the
        # HEALTHCHECK execs curl. Assert both, plus git itself, against the
        # rootfs this job just built rather than the Dockerfile text.
        run: bash scripts/verify-runtime-image-tools.sh /tmp/out1
      - name: Build image (second, no cache)
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        run: |
          bash scripts/ci/build-reproducibility-image.sh /tmp/out2 "${{ steps.epoch.outputs.epoch }}"
      - name: Compare builds
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-reproducibility'))) && (env.LANE_APPLIES == 'true') }}
        run: |
          (cd /tmp/out1 && find . -type f -exec sha256sum {} \; | sort -k2) > /tmp/out1.sha256
          (cd /tmp/out2 && find . -type f -exec sha256sum {} \; | sort -k2) > /tmp/out2.sha256
          grep './usr/local/bin/' /tmp/out1.sha256 | sort -k2 > /tmp/out1.binaries.sha256
          grep './usr/local/bin/' /tmp/out2.sha256 | sort -k2 > /tmp/out2.binaries.sha256
          if ! diff /tmp/out1.binaries.sha256 /tmp/out2.binaries.sha256; then
            echo "::error::Go binaries differ across builds. Reproducibility failed."
            exit 1
          fi
          echo "::notice::All Go binaries are byte-identical across builds."
          echo "Reproducibility summary:"
          echo "  Go binaries in /usr/local/bin: IDENTICAL"
          echo "  Total files compared: $(wc -l < /tmp/out1.sha256)"
          if diff /tmp/out1.sha256 /tmp/out2.sha256 > /tmp/repro.diff 2>&1; then
            echo "  Full filesystem: IDENTICAL"
          else
            DIFF_COUNT=$(grep -c '^<' /tmp/repro.diff 2>/dev/null || echo 0)
            echo "  Full filesystem: ${DIFF_COUNT} files differ (acceptable: apk-installed system package metadata variance)"
          fi
  attach-release-sbom:
    needs: [queue-selection, changes, build-and-push-image]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'attach-release-sbom')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && needs.changes.outputs.image == 'true' && github.ref_type == 'tag') }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Download image SBOM artifact
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom')) }}
        uses: actions/download-artifact@v4
        with:
          name: eshu-image-sbom.spdx.json
          path: dist
      - name: Wait for GitHub Release
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..30}; do
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
      - name: Attach image SBOM to GitHub Release
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'attach-release-sbom')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "dist/eshu-image-sbom.spdx.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
  package-and-push-chart:
    needs: [queue-selection, changes]
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'package-and-push-chart')) && ((github.event_name != 'workflow_dispatch' || inputs.mode == 'release') && (github.event_name == 'merge_group' || needs.changes.outputs.chart == 'true')) }}
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.chart }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'package-and-push-chart'))) && (env.LANE_APPLIES == 'true') }}
        uses: actions/checkout@v5
      - name: Set up Helm
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'package-and-push-chart'))) && (env.LANE_APPLIES == 'true') }}
        uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.3
      - name: Lint Helm chart
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'package-and-push-chart'))) && (env.LANE_APPLIES == 'true') }}
        run: helm lint ${{ env.CHART_PATH }}
      - name: Package Helm chart
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'package-and-push-chart'))) && (env.LANE_APPLIES == 'true') }}
        run: mkdir -p dist && helm package ${{ env.CHART_PATH }} --destination dist
      - name: Push Helm chart to GHCR
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'package-and-push-chart'))) && (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/push-helm-chart.sh
  publish-ci-service-mirrors:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ci-mirrors-publish' && github.repository == 'eshu-hq/eshu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Install pinned crane
        run: GOBIN="${RUNNER_TEMP}" scripts/ci/go-install-retry.sh github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test publisher safety contract
        run: bash scripts/dev/test-publish-ci-image-mirrors.sh
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy exact upstream indexes
        env:
          CRANE_BIN: ${{ runner.temp }}/crane
          EXPECTED_REVIEWED_SHA: ${{ inputs.expected_sha }}
        run: bash scripts/dev/publish-ci-image-mirrors.sh publish
  verify-public-ci-service-mirrors:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ci-mirrors-verify-public' && github.repository == 'eshu-hq/eshu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Install pinned crane
        run: GOBIN="${RUNNER_TEMP}" scripts/ci/go-install-retry.sh github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test publisher safety contract
        run: bash scripts/dev/test-publish-ci-image-mirrors.sh
      - name: Verify anonymous digests
        env:
          CRANE_BIN: ${{ runner.temp }}/crane
        run: bash scripts/dev/publish-ci-image-mirrors.sh verify-public
