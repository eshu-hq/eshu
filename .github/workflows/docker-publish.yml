name: Publish Image and Helm Chart

on:
  # Merge-queue entries (#7111): every job runs, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - Dockerfile
      - .dockerignore
      - go/**
      - deploy/helm/**
      - .github/workflows/docker-publish.yml
      - scripts/verify-apk-floors.sh
      - scripts/test-verify-apk-floors.sh
      - scripts/fixtures/apk-floors/**
  pull_request:
    branches:
      - main
    # PR lane intentionally OMITS `go/**`: a pure-Go change's compilation is
    # already proven by test.yml (`go build ./...` + `go vet ./...`), so the
    # ~16-22m in-container build plus the ~24m verify-reproducibility
    # double-build add no code-correctness coverage on a Go-only PR. The image
    # build's unique coverage is Dockerfile/packaging + reproducibility, which
    # only regress when the image definition below changes — so those PRs still
    # get the full build smoke + reproducibility check pre-merge. The push lane
    # above keeps `go/**` as the backstop: every Go change to main is built,
    # pushed, signed, and reproducibility-checked there before any release.
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/helm/**
      - .github/workflows/docker-publish.yml
      - scripts/verify-apk-floors.sh
      - scripts/test-verify-apk-floors.sh
      - scripts/fixtures/apk-floors/**
  workflow_dispatch:
    inputs:
      mode:
        description: Normal release publication or pinned CI service image mirror
        required: true
        default: release
        type: choice
        options:
          - release
          - ci-mirrors-publish
          - ci-mirrors-verify-public
      expected_sha:
        description: Exact independently reviewed branch SHA required for mirror publication
        required: false
        type: string

concurrency:
  # Main pushes key on the commit sha (#7699): GitHub keeps only one running
  # plus one pending run per group, and a publish run outlasts the ~30m merge
  # cadence, so a per-ref group drops intermediate commits' images. Per-sha
  # groups give every main commit its own lossless run (hosted-runner queuing
  # is FIFO: bursts delay but never drop). Tags stay on the ref — one run per
  # tag push, and a re-pushed tag supersedes. PR, merge_group, and dispatch
  # keep ref grouping (dispatch is manual; queue refs are unique per entry).
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_PATH: deploy/helm/eshu
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
  IMAGE_PLATFORMS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

jobs:
  changes:
    # Mirror dispatches must never enter the normal release graph.
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.filter.outputs.image }}
      chart: ${{ steps.filter.outputs.chart }}
      apkfloors: ${{ steps.filter.outputs.apkfloors }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide release artifact lanes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "image=true"
              echo "chart=true"
              echo "apkfloors=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # merge_group is a pre-merge build: it diffs against the merge base
          # with main (a superset of what required-gates.yml selects for the
          # same entry, since main only moves forward while the entry waits)
          # and, matching the PR lane's `on.paths` and the registry's
          # docker-image-* triggers, does not rebuild the image for go/**.
          # The push lane keeps go/** as the post-merge backstop.
          merge_group_lane=false
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            merge_group_lane=true
            head_sha="${GITHUB_SHA}"
            base_sha="$(git merge-base origin/main "${head_sha}")"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${GITHUB_SHA}"
            if [[ "${base_sha}" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse "${head_sha}^")"
            fi
          fi

          image=false
          chart=false
          apkfloors=false
          while IFS= read -r path; do
            case "${path}" in
              Dockerfile)
                image=true
                apkfloors=true
                ;;
              .dockerignore)
                image=true
                ;;
              scripts/verify-apk-floors.sh|scripts/test-verify-apk-floors.sh|scripts/fixtures/apk-floors/*)
                apkfloors=true
                ;;
              go/*)
                if [[ "${merge_group_lane}" == "false" ]]; then
                  image=true
                fi
                ;;
              deploy/helm/*)
                chart=true
                ;;
              .github/workflows/docker-publish.yml)
                image=true
                chart=true
                apkfloors=true
                ;;
            esac
          done < <(git diff --name-only "${base_sha}" "${head_sha}")

          {
            echo "image=${image}"
            echo "chart=${chart}"
            echo "apkfloors=${apkfloors}"
          } >> "${GITHUB_OUTPUT}"

  # Pull-request and merge-queue gate for a change to the Dockerfile, this
  # workflow, or the verifier itself and its fixtures (#7571): compares the
  # Dockerfile's `apk add` version floors with what the Alpine repository
  # serves and fails closed on a fetch error. It never runs on push, tag, or
  # workflow_dispatch: a floor that goes stale after merge must not turn the
  # publish run red, because the image still pushes and a red run skips the
  # post-publish Trivy scan (security-scan.yml runs it only for a successful
  # publish). apk-floors-drift.yml reports that case daily instead. A queue
  # entry that touches none of the paths passes as a no-op.
  verify-apk-floors:
    needs: changes
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'release') &&
      (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && needs.changes.outputs.apkfloors == 'true'))
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.apkfloors }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: env.LANE_APPLIES == 'true'
        uses: actions/checkout@v5

      - name: Self-test the apk floor verifier
        if: env.LANE_APPLIES == 'true'
        run: bash scripts/test-verify-apk-floors.sh

      - name: Verify apk floors against the Alpine repository
        if: env.LANE_APPLIES == 'true'
        run: bash scripts/verify-apk-floors.sh

  build-and-push-image:
    needs: changes
    # Always runs on merge_group so a truncated queue selection (every
    # blocking gate) never sees it SKIPPED; LANE_APPLIES gates the steps,
    # and a queue entry that does not touch this lane passes as a no-op.
    # `changes` diffs the full merge-base range with no file cap, a superset
    # of what required-gates.yml selects, so a selected lane always builds.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'release') &&
      (github.event_name == 'merge_group' || needs.changes.outputs.image == 'true')
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.image }}
      # #7886: true only when both Docker Hub secrets exist (fork and Dependabot
      # PRs get none). Expose the boolean, not the secrets, so no step sees them.
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        if: env.LANE_APPLIES == 'true'
        uses: actions/checkout@v5

      # #7886: authenticated pulls avoid the shared anonymous Docker Hub limit
      # on hosted runners. Skipped, not failed, when the secrets are absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: env.LANE_APPLIES == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: env.LANE_APPLIES == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Immutable tags only (#7699): the moving branch and latest tags are
          # promoted by promote-moving-tags AFTER the push, behind an ancestry
          # guard, so overlapping runs cannot move them backward. The sha tag
          # is pinned long: the scan resolver and the promotion sanity check
          # both address sha-<full sha>.
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long

      - name: Compute source date epoch
        if: env.LANE_APPLIES == 'true'
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Pin deterministic labels
        if: env.LANE_APPLIES == 'true'
        id: labels
        run: |
          CREATED="$(date -u -d "@${{ steps.epoch.outputs.epoch }}" '+%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' '${{ steps.meta.outputs.labels }}' > /tmp/labels.txt
          sed -i "s|org\.opencontainers\.image\.created=.*|org.opencontainers.image.created=${CREATED}|" /tmp/labels.txt
          { echo 'labels<<EOF'; cat /tmp/labels.txt; echo 'EOF'; } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        if: env.LANE_APPLIES == 'true'
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          build-args: |
            ESHU_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The final Dockerfile stage (named `runtime`) never reuses the gha
          # layer cache, so its `apk add` resolves fresh packages on every
          # publish. Without this, an unchanged RUN line reshipped stale
          # libssl3/libcrypto3 from a cached layer (#7571).
          no-cache-filters: runtime
          platforms: ${{ env.IMAGE_PLATFORMS }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign Docker image
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Verify Docker image signature
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Prepare release metadata output
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: mkdir -p dist

      - name: Generate image SBOM
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/eshu-image.spdx.json
          artifact-name: eshu-image-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Generate SBOM attestation
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/eshu-image.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify image attestations
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" \
            -R "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3

  # Moves the pushed per-commit digest to the moving `main` and `latest` tags
  # (#7699). Runs after the build pushes, in its own short job: with per-sha
  # push concurrency several publish runs overlap, and the ancestry guard in
  # scripts/ci/promote-moving-tags.sh keeps an older run from moving the tags
  # backward. There is deliberately no job-level concurrency group here: GitHub
  # keeps only one pending run per group, so a mutex would DROP intermediate
  # promotions and cancel their runs, skipping their Trivy scans.
  promote-moving-tags:
    needs:
      - changes
      - build-and-push-image
    # Push lane only: tag pushes carry immutable semver tags already, and PR
    # and merge_group runs never push, so there is nothing to promote there.
    # The image lane must have run: a chart-only push has no digest (the guard
    # script also refuses an empty digest).
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'release') &&
      needs.changes.outputs.image == 'true' &&
      needs.build-and-push-image.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    env:
      # #7886: true only when both Docker Hub secrets exist (fork and Dependabot
      # PRs get none). Expose the boolean, not the secrets, so no step sees them.
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # #7886: setup-buildx bootstraps a moby/buildkit builder image from Docker
      # Hub, so the login comes first. Skipped, not failed, when the secrets are
      # absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote moving tags behind the ancestry guard
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
          MY_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/promote-moving-tags.sh

  verify-reproducibility:
    needs:
      - changes
      - build-and-push-image
    # Always runs on merge_group so a truncated queue selection (every
    # blocking gate) never sees it SKIPPED; LANE_APPLIES gates the steps,
    # and a queue entry that does not touch this lane passes as a no-op.
    # `changes` diffs the full merge-base range with no file cap, a superset
    # of what required-gates.yml selects, so a selected lane always builds.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'release') &&
      (github.event_name == 'merge_group' || needs.changes.outputs.image == 'true')
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.image }}
      # #7886: true only when both Docker Hub secrets exist (fork and Dependabot
      # PRs get none). Expose the boolean, not the secrets, so no step sees them.
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: env.LANE_APPLIES == 'true'
        uses: actions/checkout@v5

      # #7886: authenticated pulls avoid the shared anonymous Docker Hub limit
      # on hosted runners. Skipped, not failed, when the secrets are absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: env.LANE_APPLIES == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Compute source date epoch
        if: env.LANE_APPLIES == 'true'
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build image (first)
        if: env.LANE_APPLIES == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH="${{ steps.epoch.outputs.epoch }}" \
            --build-arg ESHU_VERSION=reproducibility-test \
            --provenance=false \
            --no-cache \
            --output type=local,dest=/tmp/out1 \
            .

      - name: Build image (second, no cache)
        if: env.LANE_APPLIES == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH="${{ steps.epoch.outputs.epoch }}" \
            --build-arg ESHU_VERSION=reproducibility-test \
            --provenance=false \
            --no-cache \
            --output type=local,dest=/tmp/out2 \
            .

      - name: Compare builds
        if: env.LANE_APPLIES == 'true'
        run: |
          (cd /tmp/out1 && find . -type f -exec sha256sum {} \; | sort -k2) > /tmp/out1.sha256
          (cd /tmp/out2 && find . -type f -exec sha256sum {} \; | sort -k2) > /tmp/out2.sha256
          grep './usr/local/bin/' /tmp/out1.sha256 | sort -k2 > /tmp/out1.binaries.sha256
          grep './usr/local/bin/' /tmp/out2.sha256 | sort -k2 > /tmp/out2.binaries.sha256
          if ! diff /tmp/out1.binaries.sha256 /tmp/out2.binaries.sha256; then
            echo "::error::Go binaries differ across builds. Reproducibility failed."
            exit 1
          fi
          echo "::notice::All Go binaries are byte-identical across builds."
          echo "Reproducibility summary:"
          echo "  Go binaries in /usr/local/bin: IDENTICAL"
          echo "  Total files compared: $(wc -l < /tmp/out1.sha256)"
          if diff /tmp/out1.sha256 /tmp/out2.sha256 > /tmp/repro.diff 2>&1; then
            echo "  Full filesystem: IDENTICAL"
          else
            DIFF_COUNT=$(grep -c '^<' /tmp/repro.diff 2>/dev/null || echo 0)
            echo "  Full filesystem: ${DIFF_COUNT} files differ (acceptable: apk-installed system package metadata variance)"
          fi

  attach-release-sbom:
    needs:
      - changes
      - build-and-push-image
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'release') &&
      needs.changes.outputs.image == 'true' && github.ref_type == 'tag'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download image SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: eshu-image-sbom.spdx.json
          path: dist

      - name: Wait for GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"

      - name: Attach image SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "dist/eshu-image-sbom.spdx.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  package-and-push-chart:
    needs: changes
    # Always runs on merge_group so a truncated queue selection (every
    # blocking gate) never sees it SKIPPED; LANE_APPLIES gates the steps,
    # and a queue entry that does not touch this lane passes as a no-op.
    # `changes` diffs the full merge-base range with no file cap, a superset
    # of what required-gates.yml selects, so a selected lane always builds.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'release') &&
      (github.event_name == 'merge_group' || needs.changes.outputs.chart == 'true')
    env:
      LANE_APPLIES: ${{ needs.changes.outputs.chart }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        if: env.LANE_APPLIES == 'true'
        uses: actions/checkout@v5

      - name: Set up Helm
        if: env.LANE_APPLIES == 'true'
        uses: azure/setup-helm@v5.0.0
        with:
          # Pinned: setup-helm installs latest by default, and a newer helm
          # changed values-schema error text (JSON-pointer paths became
          # dot-separated), spontaneously reddening the go/internal/runtime
          # Helm contract tests with no code change. See eshu-hq/eshu#5566.
          version: v4.2.3

      - name: Lint Helm chart
        if: env.LANE_APPLIES == 'true'
        run: helm lint ${{ env.CHART_PATH }}

      - name: Package Helm chart
        if: env.LANE_APPLIES == 'true'
        run: |
          mkdir -p dist
          helm package ${{ env.CHART_PATH }} --destination dist

      - name: Push Helm chart to GHCR
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          helm registry login ${{ env.REGISTRY }} \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"
          # Overlapping publish runs (#7699) can push the same chart version
          # twice: tolerate the duplicate only when the published bytes are
          # identical to this run's, so a real versioning error stays red.
          set +e
          push_output="$(helm push dist/eshu-*.tgz ${{ env.CHART_REGISTRY }} 2>&1)"
          push_status=$?
          set -e
          if [[ "${push_status}" -eq 0 ]]; then
            printf '%s\n' "${push_output}"
            exit 0
          fi
          version="$(awk '/^version:/ {print $2; exit}' "${{ env.CHART_PATH }}/Chart.yaml")"
          remote_dir="$(mktemp -d)"
          if helm pull "${{ env.CHART_REGISTRY }}/eshu" --version "${version}" \
              --destination "${remote_dir}" >/dev/null 2>&1; then
            for local_tgz in dist/eshu-*.tgz; do
              if cmp -s "${local_tgz}" "${remote_dir}/eshu-${version}.tgz"; then
                echo "::notice::Chart ${version} already published with identical bytes; treating the duplicate push as success."
                exit 0
              fi
            done
          fi
          printf '%s\n' "${push_output}" >&2
          echo "::error::Helm push failed and the published ${version} differs (or is unreadable); not overwriting." >&2
          exit "${push_status}"

  publish-ci-service-mirrors:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'ci-mirrors-publish' &&
      github.repository == 'eshu-hq/eshu' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/ci-owned-image-mirror-20261009')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Install pinned crane
        run: GOBIN="${RUNNER_TEMP}" go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Test publisher safety contract
        run: bash scripts/dev/test-publish-ci-image-mirrors.sh
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy exact upstream indexes
        env:
          CRANE_BIN: ${{ runner.temp }}/crane
          EXPECTED_REVIEWED_SHA: ${{ inputs.expected_sha }}
        run: bash scripts/dev/publish-ci-image-mirrors.sh publish

  verify-public-ci-service-mirrors:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'ci-mirrors-verify-public' &&
      github.repository == 'eshu-hq/eshu' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/ci-owned-image-mirror-20261009')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Install pinned crane
        run: GOBIN="${RUNNER_TEMP}" go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Test publisher safety contract
        run: bash scripts/dev/test-publish-ci-image-mirrors.sh
      - name: Verify anonymous digests
        env:
          CRANE_BIN: ${{ runner.temp }}/crane
        run: bash scripts/dev/publish-ci-image-mirrors.sh verify-public
