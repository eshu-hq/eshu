name: End-to-end Tests

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-leaf-e2e-tests-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"
  ESHU_CI_IMAGES: "1"
  POSTGRES_IMAGE: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  NEO4J_IMAGE: ghcr.io/eshu-hq/ci-neo4j-community@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
  ESHU_XX_IMAGE: ghcr.io/eshu-hq/ci-mirror-xx@sha256:0c6a569797744e45955f39d4f7538ac344bfb7ebf0a54006a0a4297b153ccf0f
  ESHU_GO_IMAGE: ghcr.io/eshu-hq/ci-mirror-golang@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
  ESHU_ALPINE_IMAGE: ghcr.io/eshu-hq/ci-mirror-alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'test') }}
    name: test (${{ matrix.graph_backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph_backend: nornicdb
            compose_file: eshu-deploy/compose/docker-compose.yaml
            graph_service: nornicdb
            database: nornic
          - graph_backend: neo4j
            compose_file: eshu-deploy/compose/docker-compose.neo4j.yml
            graph_service: neo4j
            database: neo4j
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # Deploy lanes (Compose files, env examples) moved to eshu-deploy
      # under #8871. Gates check that repo out at the pinned extraction
      # commit and address Compose files inside it.
      - name: Check out eshu-deploy at the pinned extraction commit
        uses: actions/checkout@v5
        with:
          repository: eshu-hq/eshu-deploy
          ref: 6b6164d4fd95b8959284c5af0ba9a233fe032134
          path: eshu-deploy

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as an E2E failure
      # that never compiled anything (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Build Go binaries
        working-directory: go
        run: |
          BIN_DIR="${GITHUB_WORKSPACE}/bin"
          mkdir -p "${BIN_DIR}"
          echo "${BIN_DIR}" >> "${GITHUB_PATH}"
          VERSION="${GITHUB_SHA::12}"
          LDFLAGS="-X github.com/eshu-hq/eshu/go/internal/buildinfo.Version=${VERSION}"
          CGO_ENABLED=1 go build -ldflags "${LDFLAGS}" -o "${BIN_DIR}/eshu-bootstrap-index" ./cmd/bootstrap-index
          CGO_ENABLED=1 go build -ldflags "${LDFLAGS}" -o "${BIN_DIR}/eshu-api" ./cmd/api
          CGO_ENABLED=1 go build -ldflags "${LDFLAGS}" -o "${BIN_DIR}/eshu-ingester" ./cmd/ingester
          CGO_ENABLED=1 go build -ldflags "${LDFLAGS}" -o "${BIN_DIR}/eshu-reducer" ./cmd/reducer

      - name: Start Docker-backed graph and Postgres
        env:
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
        run: bash scripts/ci/compose.sh -f "${{ matrix.compose_file }}" -- up -d "${{ matrix.graph_service }}" postgres

      - name: Wait for graph backend and Postgres
        env:
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
        run: |
          COMPOSE_FILE="${{ matrix.compose_file }}"
          GRAPH_SERVICE="${{ matrix.graph_service }}"
          for _ in $(seq 1 60); do
            graph_ready=false
            if [ "${GRAPH_SERVICE}" = "nornicdb" ]; then
              bash scripts/ci/compose.sh -f "${COMPOSE_FILE}" -- exec -T nornicdb wget --spider -q http://localhost:7474/health >/dev/null 2>&1 && graph_ready=true
            else
              bash scripts/ci/compose.sh -f "${COMPOSE_FILE}" -- exec -T neo4j cypher-shell -u neo4j -p "${ESHU_NEO4J_PASSWORD}" "RETURN 1" >/dev/null 2>&1 && graph_ready=true
            fi
            if [ "${graph_ready}" = "true" ] && \
               bash scripts/ci/compose.sh -f "${COMPOSE_FILE}" -- exec -T postgres pg_isready -U eshu -d eshu >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          bash scripts/ci/compose.sh -f "${COMPOSE_FILE}" -- logs "${GRAPH_SERVICE}"
          bash scripts/ci/compose.sh -f "${COMPOSE_FILE}" -- logs postgres
          exit 1

      - name: Run live backend conformance
        env:
          ESHU_GRAPH_BACKEND: ${{ matrix.graph_backend }}
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: change-me
          DEFAULT_DATABASE: ${{ matrix.database }}
          ESHU_NEO4J_DATABASE: ${{ matrix.database }}
          NEO4J_DATABASE: ${{ matrix.database }}
        run: ./scripts/verify_backend_conformance_live.sh

      - name: Run bootstrap-index against fixture ecosystems
        env:
          ESHU_GRAPH_BACKEND: ${{ matrix.graph_backend }}
          ESHU_QUERY_PROFILE: local_full_stack
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: change-me
          DEFAULT_DATABASE: ${{ matrix.database }}
          ESHU_NEO4J_DATABASE: ${{ matrix.database }}
          NEO4J_DATABASE: ${{ matrix.database }}
          ESHU_CONTENT_STORE_DSN: postgresql://eshu:change-me@localhost:15432/eshu
          ESHU_POSTGRES_DSN: postgresql://eshu:change-me@localhost:15432/eshu
          ESHU_HOME: /tmp/.eshu-${{ matrix.graph_backend }}
          ESHU_REPOS_DIR: /tmp/repos-${{ matrix.graph_backend }}
          ESHU_REPO_SOURCE_MODE: filesystem
          ESHU_FILESYSTEM_ROOT: ./tests/fixtures/ecosystems
          ESHU_GIT_AUTH_METHOD: none
          ESHU_REPOSITORY_RULES_JSON: "[]"
        run: |
          mkdir -p "${ESHU_REPOS_DIR}"
          eshu-bootstrap-index

      - name: Verify API health
        env:
          ESHU_GRAPH_BACKEND: ${{ matrix.graph_backend }}
          ESHU_QUERY_PROFILE: local_full_stack
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: change-me
          DEFAULT_DATABASE: ${{ matrix.database }}
          ESHU_NEO4J_DATABASE: ${{ matrix.database }}
          NEO4J_DATABASE: ${{ matrix.database }}
          ESHU_CONTENT_STORE_DSN: postgresql://eshu:change-me@localhost:15432/eshu
          ESHU_POSTGRES_DSN: postgresql://eshu:change-me@localhost:15432/eshu
          ESHU_HOME: /tmp/.eshu-${{ matrix.graph_backend }}
          ESHU_REPOS_DIR: /tmp/repos-${{ matrix.graph_backend }}
          ESHU_RUNTIME_ROLE: api
          ESHU_AUTO_GENERATE_API_KEY: "true"
          # ESHU_AUTH_BOOTSTRAP_MODE defaults to "generated" (#4963), which
          # requires a configured data-encryption key to seal the one-time
          # admin credential; without it the API fails closed at startup and
          # never binds :8080. Fixed, publicly-known, all-zero dev-only
          # placeholder — never a real secret.
          ESHU_AUTH_SECRET_ENC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          eshu-api &
          API_PID=$!
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          kill $API_PID || true

      - name: Tear down Docker services
        if: ${{ always() }}
        run: bash scripts/ci/compose.sh -f "${{ matrix.compose_file }}" -- down -v
