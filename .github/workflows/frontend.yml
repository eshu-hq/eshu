name: Frontend
on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ci-leaf-frontend-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"
  ESHU_CI_IMAGES: "1"
  POSTGRES_IMAGE: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  NEO4J_IMAGE: ghcr.io/eshu-hq/ci-neo4j-community@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
  ESHU_XX_IMAGE: ghcr.io/eshu-hq/ci-mirror-xx@sha256:0c6a569797744e45955f39d4f7538ac344bfb7ebf0a54006a0a4297b153ccf0f
  ESHU_GO_IMAGE: ghcr.io/eshu-hq/ci-mirror-golang@sha256:ae52b5bc6ed045a9ed26ab03dc19327a802a9cc9aa8b27ed57f5c6b60579b0bb
  ESHU_ALPINE_IMAGE: ghcr.io/eshu-hq/ci-mirror-alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d

jobs:
  marketing-site:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'marketing-site') }}
    name: Marketing site (root Vite)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (clean, lockfile-pinned)
        run: npm ci
      - name: Typecheck root site
        run: npm run typecheck
      - name: Test root site
        run: npm test
      - name: Build root site
        run: npm run build
  console:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'console') }}
    name: Console (apps/console)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      # D3: browsers install and run from a workspace-local dir so the
      # cache below restores them without a second apt-get.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (clean, lockfile-pinned)
        run: npm ci
      - name: Install live harness dependencies
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify live console harness contracts
        run: |
          bash scripts/test-run-console-live-e2e.sh
          bash scripts/test-run-console-retained-e2e.sh
      - name: Typecheck console
        run: npm run console:typecheck
      - name: Test console
        run: npm run console:test
      - name: Build console
        run: npm run console:build
      # D3: OS-deps install retries transient apt/install-deps DNS flakes
      # (5-attempt backoff). The browser install below drops --with-deps so
      # it never re-runs apt, restores from cache when warm, and proceeds
      # idempotently whenever the deps are already present in the run.
      - name: Install Playwright OS dependencies (retry apt DNS flakes)
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && sudo npx playwright install-deps chromium && break; sleep $((i*15)); [ $i -eq 5 ] && exit 1; done
      - name: Restore Playwright browser cache
        id: playwright-browsers
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Playwright browsers (cached; no second apt-get)
        run: npx playwright install chromium
      - name: Save Playwright browser cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ steps.playwright-browsers.outputs.cache-primary-key }}
      - name: Run per-page e2e (mocked)
        run: npm run console:e2e:mock
  auth-sso-e2e:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'auth-sso-e2e') }}
    name: SSO auth E2E (browser, fresh stack)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      # D3: browsers install and run from a workspace-local dir so the
      # cache below restores them without a second apt-get.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (clean, lockfile-pinned)
        run: npm ci
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the auth E2E CLI build contract
        run: bash scripts/test-auth-e2e-cli.sh
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      # D3: OS-deps install retries transient apt/install-deps DNS flakes
      # (5-attempt backoff). The browser install below drops --with-deps so
      # it never re-runs apt, restores from cache when warm, and proceeds
      # idempotently whenever the deps are already present in the run.
      - name: Install Playwright OS dependencies (retry apt DNS flakes)
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && sudo npx playwright install-deps chromium && break; sleep $((i*15)); [ $i -eq 5 ] && exit 1; done
      - name: Restore Playwright browser cache
        id: playwright-browsers
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Playwright browsers (cached; no second apt-get)
        run: npx playwright install chromium
      - name: Save Playwright browser cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ steps.playwright-browsers.outputs.cache-primary-key }}
      # The auth E2E stack moved to eshu-deploy under #8871. The job
      # checks that repo out at the pinned extraction commit.
      - name: Check out eshu-deploy at the pinned extraction commit
        uses: actions/checkout@v5
        with:
          repository: eshu-hq/eshu-deploy
          ref: 1e306ec52529732aa3f21029bbb47fd508e44311
          path: eshu-deploy
      - name: Run the fresh-stack SSO auth E2E
        env:
          ESHU_DEPLOY_CHECKOUT: ${{ github.workspace }}/eshu-deploy
        run: bash scripts/run-auth-e2e.sh
      - name: Upload auth E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: auth-sso-e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
  auth-mcp-e2e:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'auth-mcp-e2e') }}
    name: MCP-identity auth E2E (browser + scripted OAuth, fresh stack)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      # D3: browsers install and run from a workspace-local dir so the
      # cache below restores them without a second apt-get.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (clean, lockfile-pinned)
        run: npm ci
      # D3: OS-deps install retries transient apt/install-deps DNS flakes
      # (5-attempt backoff). The browser install below drops --with-deps so
      # it never re-runs apt, restores from cache when warm, and proceeds
      # idempotently whenever the deps are already present in the run.
      - name: Install Playwright OS dependencies (retry apt DNS flakes)
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && sudo npx playwright install-deps chromium && break; sleep $((i*15)); [ $i -eq 5 ] && exit 1; done
      - name: Restore Playwright browser cache
        id: playwright-browsers
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Playwright browsers (cached; no second apt-get)
        run: npx playwright install chromium
      - name: Save Playwright browser cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ steps.playwright-browsers.outputs.cache-primary-key }}
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      # The auth E2E stack moved to eshu-deploy under #8871. The job
      # checks that repo out at the pinned extraction commit.
      - name: Check out eshu-deploy at the pinned extraction commit
        uses: actions/checkout@v5
        with:
          repository: eshu-hq/eshu-deploy
          ref: 1e306ec52529732aa3f21029bbb47fd508e44311
          path: eshu-deploy
      - name: Run the fresh-stack MCP-identity auth E2E
        env:
          ESHU_DEPLOY_CHECKOUT: ${{ github.workspace }}/eshu-deploy
        run: bash scripts/run-auth-mcp-e2e.sh
      - name: Verify the report against the named baseline manifest
        run: bash scripts/verify-auth-mcp-e2e-manifest.sh
      - name: Run the mutation-sensitivity gate
        env:
          ESHU_DEPLOY_CHECKOUT: ${{ github.workspace }}/eshu-deploy
        run: bash scripts/verify-auth-mcp-e2e-sensitivity.sh
      - name: Upload MCP-identity auth E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: auth-mcp-e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
  console-a11y:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'console-a11y') }}
    name: Console a11y audit (axe-core)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      # D3: browsers install and run from a workspace-local dir so the
      # cache below restores them without a second apt-get.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (clean, lockfile-pinned)
        run: npm ci
      # D3: OS-deps install retries transient apt/install-deps DNS flakes
      # (5-attempt backoff). The browser install below drops --with-deps so
      # it never re-runs apt, restores from cache when warm, and proceeds
      # idempotently whenever the deps are already present in the run.
      - name: Install Playwright OS dependencies (retry apt DNS flakes)
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update && sudo npx playwright install-deps chromium && break; sleep $((i*15)); [ $i -eq 5 ] && exit 1; done
      - name: Restore Playwright browser cache
        id: playwright-browsers
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Playwright browsers (cached; no second apt-get)
        run: npx playwright install chromium
      - name: Save Playwright browser cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ steps.playwright-browsers.outputs.cache-primary-key }}
      - name: Run a11y audit gate (critical + serious fail)
        run: npm run console:a11y
  lint:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'lint') }}
    name: "ESLint flat config (issue #3763)"
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (clean, lockfile-pinned)
        run: npm ci
      - name: Lint (eslint flat config, src + apps/console/src)
        run: scripts/verify-eslint-config.sh
      - name: Test eslint config catches no-console + no-unused-vars + import/order
        run: scripts/test-eslint-config.sh
  format:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'format') }}
    name: "Prettier format check (issue #3763)"
    continue-on-error: true
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (clean, lockfile-pinned)
        run: npm ci
      - name: Prettier check on changed frontend files
        shell: bash
        run: scripts/verify-frontend-format-changed.sh
  audit:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'audit') }}
    name: npm audit (fail on high/critical)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (clean, lockfile-pinned)
        run: npm ci
      - name: Report all advisories (non-blocking)
        run: npm audit || true
      - name: Fail on high/critical advisories
        run: npm audit --audit-level=high
