name: Golden Corpus Gate

# B-7 golden end-to-end corpus gate (#3800). Runs the full pipeline over a
# minimal repo corpus with the B-10 cassette collectors and diffs the result
# against the B-12 golden snapshot. Required on every PR that touches a pipeline
# phase (sync/discover/parse/collect/reduce/query), because those are exactly the
# changes that can silently break end-to-end behaviour.

on:
  # Merge-queue entries (#7111): every job runs, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  merge_group:
    types: [checks_requested]
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/lib/stage-differential-capture.sh'
      - 'scripts/test-stage-differential-capture.sh'
      - 'scripts/lib/golden-corpus-capture-leg-cases.sh'
      - 'go/internal/collector/**'
      - 'go/internal/parser/**'
      - 'go/internal/projector/**'
      - 'go/internal/reducer/**'
      - 'go/internal/query/**'
      - 'go/internal/relationships/**'
      - 'go/internal/storage/**'
      - 'sdk/go/factschema/**'
      - 'go/cmd/bootstrap-index/**'
      - 'go/cmd/ingester/**'
      - 'go/cmd/projector/**'
      - 'go/cmd/reducer/**'
      - 'go/cmd/collector-**'
      - 'go/cmd/api/**'
      - 'go/cmd/golden-corpus-gate/**'
      - 'go/cmd/mock-prometheus-mimir/**'
      - 'go/cmd/mock-openai-compatible/**'
      - 'go/internal/demospec/**'
      # #5538 wider audit: every other package `go list -deps` confirms is
      # compiled into the six binaries this gate builds (bootstrap-index,
      # projector, reducer, api, mcp-server, golden-corpus-gate) and that can
      # alter projected graph, content, or query/MCP truth. See
      # scripts/lib/golden-corpus-mirror-workflow-paths.sh for the rationale
      # behind each entry.
      - 'go/cmd/mcp-server/**'
      - 'go/internal/mcp/**'
      - 'go/internal/goldengate/**'
      - 'go/internal/graph/**'
      - 'go/internal/graphowner/**'
      - 'go/internal/graphschemacompat/**'
      - 'go/internal/graphbackpressure/**'
      - 'go/internal/facts/**'
      - 'go/internal/queue/**'
      - 'go/internal/replay/**'
      - 'go/internal/content/**'
      - 'go/internal/contentrefs/**'
      - 'go/internal/codeprovenance/**'
      - 'go/internal/packageidentity/**'
      - 'go/internal/repositoryidentity/**'
      - 'go/internal/sourcetool/**'
      - 'go/internal/terraformschema/**'
      - 'go/internal/workloadid/**'
      # Reachability-checked against the B-12 snapshot's asserted MCP/query
      # shapes (not assumed): each backs a non-trivial asserted response.
      - 'go/internal/environment/**'
      - 'go/internal/exposure/**'
      - 'go/internal/doctruth/**'
      - 'go/internal/serviceintel/**'
      - 'go/internal/serviceintelhttp/**'
      # #5538 review follow-up: correcting two wrong exclusions from the prior
      # widening round. "reducer correlation" was excluded as "owned by other
      # lanes" -- wrong, see scripts/lib/golden-corpus-mirror-workflow-paths.sh
      # for the direct-import evidence against rc-1 (CORRELATES_DEPLOYABLE_UNIT).
      - 'go/internal/correlation/**'
      - 'go/internal/truth/**'
      - 'go/internal/scope/**'
      - 'go/internal/factenvelope/**'
      - 'go/internal/ghactionsref/**'
      # "workflowimage" was excluded as "adjacent to the container_image_identity
      # lane" -- also wrong, see the lib file for the direct-import evidence.
      - 'go/internal/workflowimage/**'
      # The search/semantic family backing the search_semantic_context MCP tool
      # shape (14 required_response_fields, asserted live). See the lib file for
      # the per-package import evidence and the packages checked and left out.
      - 'go/internal/searchretrieval/**'
      - 'go/internal/searchdocs/**'
      - 'go/internal/searchbench/**'
      - 'go/internal/searchdecay/**'
      - 'go/internal/searchhybrid/**'
      - 'go/internal/searchrerank/**'
      - 'go/internal/searchembed/**'
      - 'go/internal/searchembedprovider/**'
      - 'go/internal/searchembedruntime/**'
      - 'go/internal/searchvector/**'
      - 'go/internal/semanticqueue/**'
      - 'go/internal/semanticpolicy/**'
      - 'go/internal/semanticguard/**'
      - 'go/internal/semanticprofile/**'
      - 'go/internal/ask/**'
      - 'go/internal/askwiring/**'
      - 'go/internal/answerguardrail/**'
      - 'go/internal/answernarration/**'
      - 'go/internal/iacreachability/**'
      - 'go/internal/rubycontroller/**'
      # #5538 second review round: capability/status/version surface backing
      # get_capability_catalog, get_surface_inventory,
      # list_collector_extraction_readiness, get_collector_extraction_readiness,
      # get_hosted_governance_status, get_ingester_status, get_index_status,
      # list_collectors, list_ingesters, get_hosted_readiness. See the lib file
      # for the per-package import evidence, and for why internal/component was
      # checked and confirmed correctly excluded (unlike the two corrections
      # above).
      - 'go/internal/capabilitycatalog/**'
      - 'go/internal/extraction/**'
      - 'go/internal/governanceaudit/**'
      - 'go/internal/status/**'
      - 'go/internal/buildinfo/**'
      # #5877 review: two exclusions were wrong. internal/boundedset backs
      # DedupeSortCap, called directly by the already-covered internal/query
      # and internal/reducer (sbom_attestation_attachment_rows.go,
      # sbom_attestation_attachment_evidence_bounds.go) to shape the
      # asserted attachments[].component_count/component_evidence_truncated/
      # component_evidence[] fields. internal/tfstatewarning was excluded as
      # "not one of the 9 credentialed collectors" -- wrong, terraform-state
      # IS cassette-replayed; internal/status/tfstate/tfstate.go (already-covered
      # internal/status) unconditionally classifies its recent warnings into
      # get_index_status's required "terraform_state" field. See the lib file
      # for the per-package import evidence.
      - 'go/internal/boundedset/**'
      - 'go/internal/tfstatewarning/**'
      # #4045 review: GET /api/v0/evidence/bundle (go/internal/query/
      # evidence_bundle_live.go, already covered above) composes its response
      # from go/internal/evidencebundle, and the snapshot's
      # "GET /api/v0/evidence/bundle" query shape now asserts that response.
      # A change to the composer can alter what that shape checks, so it must
      # trigger the gate too, replacing the prior exclusion-list entry.
      - 'go/internal/evidencebundle/**'
      # #6119: internal/urlredact answers "does this URL carry credentials?" for
      # the collector sanitizers. It reaches this gate through the STATIC-PARSE
      # path, not live collection: go/internal/collector/
      # git_service_catalog_facts.go parses catalog-info.yaml straight out of the
      # repo corpus and calls servicecatalog.BackstageManifestEnvelopes, whose
      # stripSensitiveURL/isSafeURL/redactSensitiveText (go/internal/collector/
      # servicecatalog/envelope.go) call urlredact.CarriesUserinfo -- and
      # tests/fixtures/ecosystems/deployable-config/catalog-info.yaml is in this
      # gate's own fixture list (scripts/lib/golden-corpus-fixtures.sh). Change
      # what CarriesUserinfo answers and the service-catalog facts this gate
      # projects change with it. That static-parse reach is also why this package
      # is covered while go/internal/redact stays excluded: redact only runs on
      # the live-collection path cassette replay bypasses.
      - 'go/internal/urlredact/**'
      - 'testdata/golden/**'
      - 'testdata/cassettes/**'
      - 'tests/fixtures/ecosystems/**'
      - 'specs/demo-first-answers.v1.yaml'
      - 'scripts/verify-golden-corpus-gate.sh'
      - 'scripts/test-verify-golden-corpus-gate.sh'
      # The orchestrator sources these; an edit to one changes what the gate
      # does, so they must trigger it too (the live-gate mutex included).
      - 'scripts/lib/golden-corpus-*.sh'
      - 'scripts/lib/test-golden-corpus-*.sh'
      - 'scripts/lib/live-gate-lock.sh'
      - 'scripts/ci/install-apt-packages.sh'
      - 'scripts/ci/go-mod-download-retry.sh'
      # The Neo4j matrix leg boots from this file (compose_file), which pins
      # the Neo4j image digest; a digest-only bump must re-run the gate too
      # (#6782 round-4 review P3-4).
      - 'docker-compose.neo4j.yml'
      # The NornicDB matrix leg boots from this file (compose_file), which
      # pins the NornicDB image digest; a digest-only bump must re-run the
      # gate too (#6918 round-1 review P1, second instance).
      - 'docker-compose.yaml'
      # #6782: the differential job compares the two backends' recordings with
      # the committed allowlist, so an allowlist edit must re-run it too.
      - 'specs/backend-divergence-allowlist.v1.yaml'
      # #6988: specs/ci-gates.v1.yaml is a trigger of the differential job
      # (golden-corpus-differential in the ci-gates registry), so the
      # required-gates publisher selects that job as blocking on any PR
      # touching the registry. Without this entry the workflow never starts
      # on a registry-only PR, the job stays MISSING, and the publisher
      # awaits until timeout leaving required-gates-complete pending
      # forever. An edit to a gate's own definition must run the gate,
      # never deadlock it.
      - 'specs/ci-gates.v1.yaml'
      # #6782: the comparison itself (CompareRecordings, record shape) lives
      # here; a change that alters what is compared must re-run the oracle.
      - 'go/internal/backendconformance/**'
      # #6783: the statement-coverage manifest, discovery, and validator live
      # here; a manifest or rule change must re-run the differential legs it
      # joins against.
      - 'go/internal/queryplan/**'
      - '.github/workflows/golden-corpus-gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the gate only checks out and reads the repo.
permissions:
  contents: read

jobs:
  queue-selection:
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: golden-corpus-gate.yml

  static-mirror:
    needs: queue-selection
    name: static mirror
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # #7886: true only when both Docker Hub secrets exist (fork and Dependabot
      # PRs get none). Expose the boolean, not the secrets, so no step sees them.
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - uses: actions/checkout@v5
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror') }}

      # #7886: authenticated pulls avoid the shared anonymous Docker Hub limit
      # on hosted runners. Skipped, not failed, when the secrets are absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror') }}
        run: scripts/ci/install-apt-packages.sh ripgrep
      - name: Validate orchestrator contract
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror') }}
        run: bash scripts/test-verify-golden-corpus-gate.sh
      - name: Validate differential capture staging
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror') }}
        run: bash scripts/test-stage-differential-capture.sh

  corpus-gate:
    needs: queue-selection
    name: corpus-gate (${{ matrix.graph_backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph_backend: nornicdb
            compose_file: docker-compose.yaml
          # #6782: the Neo4j backend runs the same corpus. Its registry row
          # (golden-corpus-gate-neo4j) is the blocking truth gate (#7362).
          # The NornicDB cell above is watch-only: its row (golden-corpus-gate)
          # is blocking: false, layer secondary.
          - graph_backend: neo4j
            compose_file: docker-compose.neo4j.yml
    env:
      # The orchestrator names its compose project from this; pinning it lets
      # the failure-dump and teardown steps address the same project with the
      # same per-backend compose file the script used.
      GATE_COMPOSE_PROJECT: eshu-golden-corpus-${{ matrix.graph_backend }}
      # #7886: true only when both Docker Hub secrets exist (fork and Dependabot
      # PRs get none). Expose the boolean, not the secrets, so no step sees them.
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'corpus-gate') }}
        uses: actions/checkout@v5

      # #7886: authenticated pulls avoid the shared anonymous Docker Hub limit
      # on hosted runners. Skipped, not failed, when the secrets are absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'corpus-gate') }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'corpus-gate') }}
        run: scripts/ci/install-apt-packages.sh ripgrep

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a B-7 golden
      # corpus gate failure that never ran (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'corpus-gate') }}
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run B-7 golden corpus gate
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'corpus-gate') }}
        env:
          ESHU_GRAPH_BACKEND: ${{ matrix.graph_backend }}
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
        run: bash scripts/verify-golden-corpus-gate.sh

      - name: Dump service logs on failure
        if: ${{ (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'corpus-gate')) && (failure()) }}
        run: docker compose -p "${GATE_COMPOSE_PROJECT}" -f "${{ matrix.compose_file }}" logs --tail=200 || true

      - name: Tear down Docker services
        if: ${{ (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'corpus-gate')) && (always()) }}
        run: docker compose -p "${GATE_COMPOSE_PROJECT}" -f "${{ matrix.compose_file }}" down -v || true

  # Four independent B-7 recordings run on separate hosted runners. Every
  # backend/pairing retains its own capture; a failed leg or upload blocks the
  # required join even though the backend comparison itself stays advisory.
  differential-capture:
    needs: queue-selection
    name: differential capture (pair ${{ matrix.pair }}, ${{ matrix.graph_backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2]
        graph_backend: [nornicdb, neo4j]
    env:
      GATE_COMPOSE_PROJECT: eshu-differential-pair${{ matrix.pair }}-${{ matrix.graph_backend }}
      COMPOSE_FILE: ${{ matrix.graph_backend == 'neo4j' && 'docker-compose.neo4j.yml' || 'docker-compose.yaml' }}
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j')) }}
        uses: actions/checkout@v5

      # #7886: authenticated pulls avoid the shared anonymous Docker Hub limit
      # on hosted runners. Skipped, not failed, when the secrets are absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep

      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j')) }}
        run: scripts/ci/go-mod-download-retry.sh

      # The absolute local_path is part of the statement fingerprint. Hosted
      # Ubuntu runners share this runner.temp path despite isolated filesystems.
      - name: Run B-7 with differential capture
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j')) }}
        env:
          ESHU_GRAPH_BACKEND: ${{ matrix.graph_backend }}
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
          ESHU_DIFFERENTIAL_CAPTURE: 1
          ESHU_DIFFERENTIAL_CAPTURE_DIR: ${{ runner.temp }}/diff-capture/pair${{ matrix.pair }}/${{ matrix.graph_backend }}
          ESHU_REPOS_DIR: ${{ runner.temp }}/eshu-diff-corpus
        run: bash scripts/verify-golden-corpus-gate.sh

      - name: Require non-empty capture before upload
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j')) }}
        run: bash scripts/lib/stage-differential-capture.sh check-leg "${{ runner.temp }}/diff-capture/pair${{ matrix.pair }}/${{ matrix.graph_backend }}"

      - name: Upload capture recording
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j')) }}
        uses: actions/upload-artifact@v4
        with:
          name: differential-capture-${{ github.run_attempt }}-pair${{ matrix.pair }}-${{ matrix.graph_backend }}
          path: ${{ runner.temp }}/diff-capture/pair${{ matrix.pair }}/${{ matrix.graph_backend }}/
          if-no-files-found: error

      - name: Dump service logs on failure
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j'))) && (failure()) }}
        run: docker compose -p "${GATE_COMPOSE_PROJECT}" -f "${COMPOSE_FILE}" logs --tail=200 || true

      - name: Tear down Docker services
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j'))) && (always()) }}
        run: docker compose -p "${GATE_COMPOSE_PROJECT}" -f "${COMPOSE_FILE}" down -v || true

  differential:
    name: differential nornicdb vs neo4j
    needs: [queue-selection, differential-capture]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j') }}
        uses: actions/checkout@v5

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j') }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j') }}
        run: scripts/ci/go-mod-download-retry.sh

      - name: Download this attempt's capture artifacts
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j') }}
        uses: actions/download-artifact@v4
        with:
          pattern: differential-capture-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/diff-artifacts
          merge-multiple: false

      # Reconstruct the original pair/backend layout and reject missing or
      # empty artifacts. A matrix failure remains blocking even if it uploaded.
      - name: Require and stage all four recordings
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j') }}
        run: >
          bash scripts/lib/stage-differential-capture.sh stage
          "${{ runner.temp }}/diff-artifacts"
          "${{ runner.temp }}/diff-capture"
          "${{ github.run_attempt }}"
          "${{ needs.differential-capture.result }}"

      - name: Build golden-corpus-gate
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j') }}
        run: go -C go build -o "${{ runner.temp }}/golden-corpus-gate" ./cmd/golden-corpus-gate

      # Comparison remains advisory discovery (#6965). Capture completion and
      # the two coverage checks below remain blocking.
      - name: Compare backend recordings
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j') }}
        id: compare
        continue-on-error: true
        run: >
          "${{ runner.temp }}/golden-corpus-gate" -phase=backend-diff
          "-diff-left=${{ runner.temp }}/diff-capture/pair1/nornicdb"
          "-diff-right=${{ runner.temp }}/diff-capture/pair1/neo4j"
          "-diff-left2=${{ runner.temp }}/diff-capture/pair2/nornicdb"
          "-diff-right2=${{ runner.temp }}/diff-capture/pair2/neo4j"
          -diff-allowlist=specs/backend-divergence-allowlist.v1.yaml
          -diff-executions-advisory-max=200

      # Statement coverage is Neo4j-only (#7331), merging both pairings.
      - name: Check statement coverage on capture recordings
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j') }}
        run: >
          "${{ runner.temp }}/golden-corpus-gate" -phase=statement-coverage
          -coverage-manifest=go/internal/queryplan/testdata/statement-builders.yaml
          "-coverage-dirs=${{ runner.temp }}/diff-capture/pair1/neo4j,${{ runner.temp }}/diff-capture/pair2/neo4j"

      # Writer coverage includes all four backend/pairing recordings (#7212).
      - name: Check id writer coverage on capture recordings
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j') }}
        run: >
          "${{ runner.temp }}/golden-corpus-gate" -phase=writer-coverage
          "-coverage-dirs=${{ runner.temp }}/diff-capture/pair1/neo4j,${{ runner.temp }}/diff-capture/pair2/neo4j,${{ runner.temp }}/diff-capture/pair1/nornicdb,${{ runner.temp }}/diff-capture/pair2/nornicdb"

      - name: Report an advisory backend divergence
        if: ${{ (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j')) && (steps.compare.outcome == 'failure') }}
        run: |
          echo "::warning title=Backend divergence (advisory)::Compare backend recordings found a divergence. It does not block this PR (#6965); file an issue for the owning package. The differential-capture artifacts hold the recordings."
          {
            echo "### Backend divergence (advisory)"
            echo
            echo "\`Compare backend recordings\` failed. It is discovery, not a merge gate (#6965)."
            echo "Read its step log for the diverging statements, and file an issue for the owning package."
            echo "The \`differential-capture\` artifacts hold the recordings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload capture recordings on failure
        if: ${{ (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'differential nornicdb vs neo4j')) && (failure() || steps.compare.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: differential-joined-capture-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diff-capture
          if-no-files-found: warn
