name: Ifa Determinism Gate

# P4 (#4397) advisory->blocking flip (design doc
# docs/internal/design/4389-ifa-conformance-platform.md, line 517's RULE): the
# Ifa graph-determinism matrix (Layer 2, scripts/verify-ifa-determinism.sh)
# and its dead-letter failure-path leg (scripts/verify-ifa-dead-letter-
# matrix.sh) become per-PR path-filtered BLOCKING CI gates, mirroring
# golden-corpus-gate.yml. The RULE requires the N-sensitive Tier 2 run (the
# demo-org cassette PLUS the 8-project synth-multiscope cassette) — a gate
# that only ever ran the single-generation demo-org cassette could stay green
# forever without ever exercising a genuine worker-count race. Both matrix
# scripts already drive that Tier 2 combination; this workflow wires them
# into per-PR CI instead of leaving them local-only.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'go/internal/ifa/graphdump/**'
      - 'go/internal/ifa/catalog_seed.go'
      - 'go/internal/ifa/code_call_family_catalog.go'
      - 'go/internal/ifa/materialized_edges*.go'
      - 'go/cmd/reducer/main.go'
      - 'go/cmd/reducer/config.go'
      - 'go/cmd/reducer/config_projection.go'
      - 'go/cmd/reducer/main_helpers.go'
      - 'go/internal/reducer/intent.go'
      - 'go/internal/reducer/domain.go'
      - 'go/internal/reducer/defaults.go'
      - 'go/internal/reducer/defaults_registry.go'
      - 'go/internal/reducer/registry.go'
      - 'go/internal/reducer/defaults_domain_catalog.go'
      - 'go/internal/reducer/code_call*.go'
      - 'go/internal/reducer/python_metaclass_materialization.go'
      - 'go/internal/reducer/factschema_decode_codegraph.go'
      - 'go/internal/reducer/factschema_decode.go'
      - 'go/internal/reducer/fact_kind_loader.go'
      - 'sdk/go/factschema/decode_codegraph.go'
      - 'sdk/go/factschema/codegraph/v1/file.go'
      - 'go/internal/reducer/service*.go'
      - 'go/internal/reducer/shared_projection*.go'
      - 'go/internal/storage/cypher/*code_call*.go'
      - 'go/internal/storage/cypher/edge_writer_payload.go'
      - 'go/internal/storage/cypher/canonical_instantiates_edges.go'
      - 'go/internal/storage/cypher/edge_writer.go'
      - 'go/internal/storage/cypher/canonical_retract.go'
      - 'go/internal/storage/cypher/edge_writer_retract*.go'
      - 'go/internal/content/writer.go'
      - 'go/internal/projector/canonical_entity_identity.go'
      - 'go/internal/projector/runtime_stages.go'
      - 'go/cmd/projector/runtime_wiring.go'
      - 'go/internal/storage/postgres/code_call_intent_writer.go'
      - 'go/internal/storage/postgres/facts_active_code_call_symbols.go'
      - 'go/internal/storage/postgres/facts_filtered.go'
      - 'go/internal/storage/postgres/shared_intent_acceptance_writer.go'
      - 'go/internal/storage/postgres/shared_projection_acceptance*.go'
      - 'go/internal/storage/postgres/accepted_generation.go'
      - 'go/internal/storage/postgres/graph_projection_phase_state.go'
      - 'go/internal/storage/postgres/reducer_queue_conflict.go'
      - 'go/internal/storage/postgres/shared_intents*.go'
      # The determinism matrix drives the Tier-2 synth-multiscope cassette
      # generated by go/internal/synth/gcp (GenerateMultiScope). A change there
      # that broke scope disjointness would make the worker matrix go inert, so
      # it MUST retrigger this gate.
      - 'go/internal/synth/gcp/**'
      - 'go/internal/ifa/mutate.go'
      - 'go/internal/ifa/dead_letters.go'
      - 'go/cmd/ifa/**'
      - 'go/internal/reducer/gcp_resource_materialization.go'
      - 'go/internal/reducer/gcp_resource_materialization_teeth.go'
      - 'go/internal/reducer/gcp_resource_materialization_teeth_off.go'
      - 'go/internal/storage/cypher/cloud_resource_node_writer.go'
      - 'go/internal/storage/cypher/cloud_resource_node_writer_teeth.go'
      - 'go/internal/storage/cypher/cloud_resource_node_writer_teeth_off.go'
      - 'scripts/verify-ifa-determinism.sh'
      - 'scripts/test-verify-ifa-determinism.sh'
      - 'scripts/verify-ifa-dead-letter-matrix.sh'
      - 'scripts/test-verify-ifa-dead-letter-matrix.sh'
      - 'scripts/lib/ifa_determinism_common.sh'
      - 'scripts/lib/ifa_determinism_lifecycle.sh'
      # P6 (#4580) deterministic fault-injection: the in-binary decorator, its
      # build-tagged classification regression test, the reducer fault wiring,
      # and the Docker gate that proves real recovery (zero dead letters, graph
      # identical to the fault-free baseline). A change to any of these must
      # re-run the fault matrix.
      - 'go/internal/storage/cypher/fault_executor.go'
      - 'go/internal/storage/cypher/fault_executor_off.go'
      - 'go/internal/storage/cypher/fault_executor_classification_test.go'
      - 'go/internal/replay/faultreplay/**'
      - 'go/cmd/reducer/ifa_fault_wiring.go'
      - 'go/cmd/reducer/ifa_fault_wiring_off.go'
      - 'scripts/verify-ifa-fault-injection.sh'
      - 'scripts/test-verify-ifa-fault-injection.sh'
      - 'scripts/lib/test-ifa-fault-injection-assertions.sh'
      - 'scripts/lib/test-ifa-fault-injection-review-cases.sh'
      - 'scripts/lib/ifa_fault_injection_collateral_nodes.sh'
      - 'scripts/lib/ifa_fault_injection_common.sh'
      - 'scripts/lib/ifa_fault_injection_cells.sh'
      - 'scripts/lib/ifa_fault_injection_driver.sh'
      - 'scripts/lib/ifa_fault_injection_sql_cells.sh'
      - 'scripts/lib/ifa_fault_injection_delivery_cells.sh'
      - 'scripts/lib/ifa_fault_injection_code_call_cells.sh'
      - 'scripts/lib/ifa_code_call_live.sh'
      - 'scripts/lib/ifa_sql_delta_live.sh'
      # #5351 materialized-edge exhaustiveness gate: the SQL relationship family
      # cassette is driven into every determinism cell (with a per-cell
      # `ifa assert-edges`) and every fault-injection cell (with a baseline
      # `ifa assert-edges`), so the materialized_edges:sql_relationships manifest
      # row's proof_gate: ifa-determinism / ifa-fault-injection claims are backed
      # by a live replay of the family. A write-path-only regression to the SQL
      # edge writer or materialization handler is exactly the silent-no-op class
      # the pure seam cannot catch, so it MUST retrigger these live lanes.
      - 'go/internal/reducer/sql_relationship_materialization.go'
      - 'go/internal/reducer/sql_relationship_embedded_query.go'
      - 'go/internal/storage/cypher/edge_writer_sql.go'
      - 'specs/ifa-materialized-edge-coverage.v1.yaml'
      - 'testdata/cassettes/sqlrelationships/**'
      # code_calls (#5991) is driven and set-exactly asserted in every
      # determinism cell and in the fault-free and domain-scoped recovery cells.
      # Any cassette change therefore retriggers both live proof lanes.
      - 'testdata/cassettes/codecalls/**'
      # The expected-edge-set assertion files `ifa assert-edges` compares the
      # live graph against live under this package-local testdata tree (NOT
      # testdata/cassettes/, which the offline cassette validator scans). A
      # change to the expected set changes what the live lanes assert, so it
      # MUST retrigger them.
      - 'go/internal/ifa/testdata/sqlrelationships/**'
      # The live lanes compare code_calls against this exact expected set.
      - 'go/internal/ifa/testdata/codecalls/**'
      - 'go/internal/storage/cypher/materialized_edge_*.go'
      - 'go/internal/storage/cypher/canonical_code_call_edges.go'
      - 'go/internal/storage/cypher/canonical_inheritance_edges.go'
      - '.github/workflows/ifa-determinism-gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the gate only checks out and reads the repo.
permissions:
  contents: read

jobs:
  static-mirror:
    name: static mirror
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
      - name: Validate determinism matrix mirror
        run: bash scripts/test-verify-ifa-determinism.sh
      - name: Validate dead-letter matrix mirror
        run: bash scripts/test-verify-ifa-dead-letter-matrix.sh
      - name: Validate fault-injection matrix mirror
        run: bash scripts/test-verify-ifa-fault-injection.sh

  determinism-matrix:
    name: determinism-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # No retry-to-green: this platform's flake policy (design doc P4)
      # forbids normalizing a real divergence away by retrying or lowering N.
      - name: Run Ifa graph-determinism matrix (N=1,2,4; demo-org + synth-multiscope, Tier 2)
        env:
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
        run: bash scripts/verify-ifa-determinism.sh

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml logs --tail=200 || true

      - name: Tear down Docker services
        if: always()
        run: docker compose -f docker-compose.yaml down -v || true

  dead-letter-matrix:
    name: dead-letter-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run Ifa dead-letter-set determinism matrix (N=1,2,4)
        env:
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
        run: bash scripts/verify-ifa-dead-letter-matrix.sh

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml logs --tail=200 || true

      - name: Tear down Docker services
        if: always()
        run: docker compose -f docker-compose.yaml down -v || true

  fault-injection:
    name: fault-injection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The classification regression test that pins the P6 fault-error
      # fidelity fix is behind the ifafaultinjection build tag, so a normal
      # `go test ./...` never runs it. Run it explicitly here, alongside the
      # tagged decorator and reducer-wiring tests, so a revert of the
      # Retryable()/FailureClass() contract fails CI even before the Docker leg.
      - name: Run tagged fault-classification unit tests
        working-directory: go
        run: go test -tags ifafaultinjection ./internal/storage/cypher ./internal/replay/faultreplay ./cmd/reducer -count=1

      # No retry-to-green: a non-zero dead_letter count or a canonical graph
      # digest that diverges from the fault-free baseline is a real recovery
      # defect, never normalized away by retrying or lowering worker count.
      - name: Run Ifa fault-injection matrix (11 cells, fresh stack per cell)
        env:
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
        run: bash scripts/verify-ifa-fault-injection.sh

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml logs --tail=200 || true

      - name: Tear down Docker services
        if: always()
        run: docker compose -f docker-compose.yaml down -v || true
