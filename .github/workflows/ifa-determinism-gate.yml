      - 'sdk/go/factschema/*.go'
      - 'sdk/go/factschema/codegraph/v1/**'
      - 'sdk/go/factschema/gcp/v1/**'
      - 'specs/ci-gates.v1.yaml'
      - 'docker-compose.yaml'
      - 'testdata/cassettes/gcpcloud/supply-chain-demo.json'
      - 'testdata/golden/e2e-20repo-snapshot.json'
      - 'go/cmd/golden-corpus-gate/main.go'
      - 'go/cmd/golden-corpus-gate/runner.go'
      - 'go/cmd/golden-corpus-gate/drains.go'
      - 'go/cmd/golden-corpus-gate/shared.go'
      - 'go/internal/goldengate/snapshot.go'
      - 'go/internal/goldengate/evaluate_drains.go'
      - 'go/internal/goldengate/report.go'
      - 'go/internal/replay/cassette/**'
      - 'go/internal/replay/concurrentreplay/**'
      - 'go/internal/storage/postgres/ingestion.go'
      - 'go/internal/storage/postgres/ingestion_queries.go'
      - 'go/internal/storage/postgres/ingestion_catalog*.go'
      - 'go/internal/storage/postgres/ingestion_backfill_generation_guard.go'
      - 'go/internal/storage/postgres/facts_streaming.go'
      - 'go/internal/storage/postgres/facts.go'
      - 'go/internal/storage/postgres/facts_payload.go'
      - 'go/internal/storage/postgres/migrations/008_shared_projection_intents.sql'
      - 'go/internal/storage/postgres/migrations/011_shared_projection_acceptance.sql'
      - 'go/internal/storage/postgres/migrations/012_graph_projection_phase_state.sql'
      - 'go/cmd/bootstrap-data-plane/schema_adoption.go'
      - 'go/internal/graph/schema*.go'
      - 'go/cmd/projector/config.go'
      - 'go/cmd/projector/nornicdb_wiring.go'
      - 'go/internal/projector/service.go'
      - 'go/internal/projector/service_superseded.go'
      - 'go/internal/storage/postgres/projector_queue.go'
      - 'go/internal/storage/postgres/projector_queue_claim_sql.go'
      - 'go/internal/storage/postgres/projector_queue_scan.go'
      - 'go/internal/storage/postgres/projector_queue_sql.go'
      - 'go/internal/storage/nornicdb/**'
      - 'go/internal/storage/cypher/canonical_node_writer_options.go'
      - 'go/internal/storage/cypher/instrumented.go'
      - 'go/internal/storage/cypher/retrying_executor.go'
      - 'go/internal/storage/cypher/retryable_error.go'
      - 'go/internal/storage/cypher/timeout_executor.go'
      - 'go/internal/graphbackpressure/**'
      - 'go/cmd/reducer/observed_service_wiring.go'
      - 'go/cmd/reducer/neo4j_wiring.go'
      - 'go/cmd/reducer/reducer_executor_adapters.go'
      - 'go/cmd/reducer/graph_write_backpressure_wiring.go'
      - 'go/cmd/reducer/worker_gauge.go'
      - 'go/internal/storage/postgres/reducer_queue.go'
      - 'go/internal/storage/postgres/reducer_queue_batch.go'
      - 'go/internal/storage/postgres/reducer_queue_batch_query.go'
      - 'go/internal/storage/postgres/reducer_queue_helpers.go'
      - 'go/internal/storage/postgres/reducer_queue_readiness_sql.go'
      - 'go/internal/storage/postgres/reducer_queue_validation.go'
      - 'go/internal/storage/postgres/reducer_queue_ack.go'
      - 'go/internal/ifa/graphdump/**'
      # The guards moved to go/internal/ifa/materializededges/ (#6053), so the
      # former per-file glob for those guards matched nothing once they moved, so
      # it was dropped here and from all three gate blocks in ci-gates.v1.yaml
      # together -- the registry-subset-of-workflow lockstep compares trigger
      # strings, so removing it from one side alone breaks the mirror.
      #
      # Without the line below both live gates are SELECTED as blocking by the
      # registry and then never started by GitHub, because a PR touching only the
      # moved package matches no path here. The determinism mirror's
      # registry-subset-of-workflow loop is the only check that sees this -- the
      # registry lane and --drift both pass while it is broken.
      - 'go/internal/ifa/materializededges/**'
      - 'go/cmd/bootstrap-data-plane/main.go'
      - 'go/cmd/reducer/main.go'
      - 'go/cmd/reducer/canonical_graph_writers.go'
      - 'go/internal/graphowner/family_writers.go'
      - 'go/internal/graphowner/gated_writer.go'
      - 'go/internal/storage/postgres/graph_node_owner_store.go'
      - 'go/cmd/reducer/run.go'
      - 'go/cmd/reducer/config.go'
      - 'go/cmd/reducer/config_projection.go'
      - 'go/cmd/reducer/main_helpers.go'
      - 'go/internal/storage/cypher/*code_call*.go'
      - 'go/internal/storage/cypher/edge_writer_payload.go'
      - 'go/internal/storage/cypher/canonical_instantiates_edges.go'
      - 'go/internal/storage/cypher/edge_writer.go'
      - 'go/internal/storage/cypher/canonical_retract.go'
      - 'go/internal/storage/cypher/edge_writer_retract*.go'
      - 'go/internal/storage/cypher/canonical_node_writer.go'
      - 'go/internal/storage/cypher/canonical_node_writer_phases.go'
      - 'go/internal/storage/cypher/canonical_node_writer_entities.go'
      - 'go/internal/storage/cypher/canonical_node_writer_metadata.go'
      - 'go/internal/storage/cypher/canonical_node_cypher.go'
      - 'go/internal/storage/cypher/canonical_node_writer_retract.go'
      - 'go/internal/storage/cypher/canonical_node_writer_delta_retract.go'
      - 'go/internal/storage/cypher/canonical_node_writer_retract_labels.go'
      - 'go/internal/content/writer.go'
      - 'go/internal/projector/canonical_builder.go'
      - 'go/internal/projector/canonical_codegraph_extract.go'
      - 'go/internal/projector/canonical_delta.go'
