concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  queue-selection:
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: ifa-determinism-gate.yml
  static-mirror:
    needs: queue-selection
    name: static mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - uses: actions/checkout@v5
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror')) }}
      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Validate determinism matrix mirror
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror')) }}
        run: bash scripts/test-verify-ifa-determinism.sh
      - name: Validate dead-letter matrix mirror
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror')) }}
        run: bash scripts/test-verify-ifa-dead-letter-matrix.sh
      - name: Validate fault-injection matrix mirror
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static mirror')) }}
        run: bash scripts/test-verify-ifa-fault-injection.sh
  determinism-matrix:
    needs: queue-selection
    name: determinism-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DETERMINISM_COMPOSE_PROJECT: eshu-ifa-determinism-${{ github.run_id }}-${{ github.run_attempt }}
      # #7886: true only when both Docker Hub secrets exist (fork and Dependabot
      # PRs get none). Expose the boolean, not the secrets, so no step sees them.
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'determinism-matrix')) }}
        uses: actions/checkout@v5

      # #7886: authenticated pulls avoid the shared anonymous Docker Hub limit
      # on hosted runners. Skipped, not failed, when the secrets are absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'determinism-matrix')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'determinism-matrix')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run Ifa graph-determinism matrix (N=1,2,4; demo-org + synth-multiscope, Tier 2)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'determinism-matrix')) }}
        id: determinism_matrix
        env:
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
        run: bash scripts/verify-ifa-determinism.sh --keep
      - name: Dump service logs on failure
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'determinism-matrix'))) && (failure()) }}
        run: docker compose -p "${DETERMINISM_COMPOSE_PROJECT}" -f docker-compose.yaml logs --tail=200 || true
      - name: Upload determinism-matrix diagnostics
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'determinism-matrix'))) && (failure() && steps.determinism_matrix.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ifa-determinism-matrix-attempt-${{ github.run_attempt }}-failure
          path: |
            /tmp/ifa-determinism.*/graph-n*.dump
            /tmp/ifa-determinism.*/rationale-delta-n*.dump
            /tmp/ifa-determinism.*/logs/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Tear down Docker services
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'determinism-matrix'))) && (always()) }}
        run: docker compose -p "${DETERMINISM_COMPOSE_PROJECT}" -f docker-compose.yaml down -v || true
  dead-letter-matrix:
    needs: queue-selection
    name: dead-letter-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEADLETTER_MATRIX_COMPOSE_PROJECT: eshu-ifa-deadletter-matrix-${{ github.run_id }}-${{ github.run_attempt }}
      # #7886: true only when both Docker Hub secrets exist (fork and Dependabot
      # PRs get none). Expose the boolean, not the secrets, so no step sees them.
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dead-letter-matrix')) }}
        uses: actions/checkout@v5

      # #7886: authenticated pulls avoid the shared anonymous Docker Hub limit
      # on hosted runners. Skipped, not failed, when the secrets are absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dead-letter-matrix')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dead-letter-matrix')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run Ifa dead-letter-set determinism matrix (N=1,2,4)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dead-letter-matrix')) }}
        id: dead_letter_matrix
        env:
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
        run: bash scripts/verify-ifa-dead-letter-matrix.sh --keep
      - name: Dump service logs on failure
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dead-letter-matrix'))) && (failure()) }}
        run: docker compose -p "${DEADLETTER_MATRIX_COMPOSE_PROJECT}" -f docker-compose.yaml logs --tail=200 || true
      - name: Upload dead-letter-matrix diagnostics
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dead-letter-matrix'))) && (failure() && steps.dead_letter_matrix.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ifa-dead-letter-matrix-attempt-${{ github.run_attempt }}-failure
          path: |
            /tmp/ifa-deadletter-matrix.*/mutated.json
            /tmp/ifa-deadletter-matrix.*/logs/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Tear down Docker services
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dead-letter-matrix'))) && (always()) }}
        run: docker compose -p "${DEADLETTER_MATRIX_COMPOSE_PROJECT}" -f docker-compose.yaml down -v || true
  fault-injection:
    needs: queue-selection
    name: fault-injection (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FAULT_COMPOSE_PROJECT: eshu-ifa-fault-injection-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      # #7886: true only when both Docker Hub secrets exist (fork and Dependabot
      # PRs get none). Expose the boolean, not the secrets, so no step sees them.
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'fault-injection')) }}
        uses: actions/checkout@v5

      # #7886: authenticated pulls avoid the shared anonymous Docker Hub limit
      # on hosted runners. Skipped, not failed, when the secrets are absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'fault-injection')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'fault-injection')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'fault-injection')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
      - name: Run tagged fault-classification unit tests
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'fault-injection')) }}
        working-directory: go
        run: go test -tags ifafaultinjection ./internal/storage/cypher ./internal/storage/cypher/fault/executor ./internal/replay/faultreplay ./cmd/reducer -count=1
      - name: Run Ifa fault-injection matrix shard (fresh stack per cell)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'fault-injection')) }}
        id: fault_matrix
        env:
          ESHU_NEO4J_PASSWORD: change-me
          ESHU_POSTGRES_PASSWORD: change-me
          IFA_FAULT_SHARD: ${{ matrix.shard }}
        run: bash scripts/verify-ifa-fault-injection.sh --keep --shard "${IFA_FAULT_SHARD}/4"
      - name: Verify fault-injection diagnostic completeness
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'fault-injection'))) && (failure() && steps.fault_matrix.outcome == 'failure') }}
        run: |
          shopt -s nullglob
          completeness=(/tmp/ifa-fault-injection.*/diagnostics-complete)
          [[ ${#completeness[@]} -eq 1 && -s "${completeness[0]}" ]]
      - name: Upload fault-injection diagnostics
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'fault-injection'))) && (failure() && steps.fault_matrix.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ifa-fault-injection-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}-failure
          path: |
            /tmp/ifa-fault-injection.*/graph-*.dump
            /tmp/ifa-fault-injection.*/graph-manifest.tsv
            /tmp/ifa-fault-injection.*/work-items.csv
            /tmp/ifa-fault-injection.*/gcp-facts.jsonl
            /tmp/ifa-fault-injection.*/fault-restart-backend.json
            /tmp/ifa-fault-injection.*/restart-watch-result
            /tmp/ifa-fault-injection.*/fault-restart-backend.json.restart-sentinel.trigger.json
            /tmp/ifa-fault-injection.*/backend-image.txt
            /tmp/ifa-fault-injection.*/backend-compose-config.json
            /tmp/ifa-fault-injection.*/backend-container.json
            /tmp/ifa-fault-injection.*/backend-runtime-image.json
            /tmp/ifa-fault-injection.*/backend-provenance.json
            /tmp/ifa-fault-injection.*/nornicdb-environment.txt
            /tmp/ifa-fault-injection.*/diagnostics-manifest.tsv
            /tmp/ifa-fault-injection.*/diagnostics-complete
            /tmp/ifa-fault-injection.*/current-cell
            /tmp/ifa-fault-injection.*/**/*.error
            /tmp/ifa-fault-injection.*/logs/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Tear down Docker services
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'fault-injection'))) && (always()) }}
        run: docker compose -p "${FAULT_COMPOSE_PROJECT}" -f docker-compose.yaml down -v || true
