name: Ifa Determinism Gate

# P4 (#4397) advisory->blocking flip (design doc
# docs/internal/design/4389-ifa-conformance-platform.md, line 517's RULE): the
# Ifa graph-determinism matrix (Layer 2, scripts/verify-ifa-determinism.sh)
# and its dead-letter failure-path leg (scripts/verify-ifa-dead-letter-
# matrix.sh) become per-PR path-filtered BLOCKING CI gates, mirroring
# golden-corpus-gate.yml. The RULE requires the N-sensitive Tier 2 run (the
# demo-org cassette PLUS the 8-project synth-multiscope cassette) — a gate
# that only ever ran the single-generation demo-org cassette could stay green
# forever without ever exercising a genuine worker-count race. Both matrix
# scripts already drive that Tier 2 combination; this workflow wires them
# into per-PR CI instead of leaving them local-only.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/lib/ifa_live_gate_selector_cases.sh'
      # The family registry and the libraries that consume it. The registry
      # decides which families each gate drives and which blocker every kill
      # cell takes, so a wrong edit here changes what both live gates actually
      # prove -- and until these globs existed, editing any of them re-ran
      # nothing at all. A gate that never runs is worse than one that cannot
      # fail: it does not even look like a check.
      - 'scripts/lib/ifa_family_registry.sh'
      # The per-family row files, not just the orchestrator. The orchestrator
      # holds no family data at all -- every blocker_kind, wait_key and anchor
      # lives under rows/. Naming only the parent file would leave the exact
      # edit we make most often (correcting one family's row) triggering
      # nothing.
      - 'scripts/lib/ifa_family_registry/**'
      - 'scripts/lib/test-ifa-determinism-family-cases.sh'
      - 'scripts/lib/test-ifa-determinism-pin-behaviour-cases.sh'
      - 'scripts/lib/test-ifa-determinism-registry-lockstep-cases.sh'
      - 'scripts/lib/test-ifa-family-registry-derived-pins-cases.sh'
      - 'scripts/lib/ifa_fault_shard.sh'
      # Glob, not one literal: the dispatcher sources its three mechanism files
      # through a VARIABLE path, so the sourced-to-triggered drift check cannot
      # see them (it only resolves a literal "scripts/" inside a source line).
      # ifa_fault_generic_shared_intent_lock.sh holds the mandatory
      # non-vacuity precondition the whole change rests on -- without this,
      # weakening that precondition would re-run no gate at all.
      # The literal stays alongside the glob: the registry lists this exact
      # path, and the registry-subset-of-workflow lockstep compares trigger
      # strings rather than expanding globs, so dropping the literal makes the
      # gate selectable-but-never-started.
      - 'scripts/lib/ifa_fault_generic_cells.sh'
      - 'scripts/lib/ifa_fault_generic_*.sh'
      - 'scripts/lib/test-ifa-fault-injection-shard-cases.sh'
      # The table_lock precondition's ONLY committed proof. The dispatcher
      # sources it by variable path, so the sourced-to-triggered drift walk
      # cannot see it, and the `ifa_fault_generic_*.sh` glob above does not
      # match a `test-`-prefixed, hyphenated name. Without this line, weakening
      # the one test standing behind that file's "unit-tested" claim re-runs
      # nothing at all.
      - 'scripts/lib/test-ifa-fault-injection-generic-table-lock-cases.sh'
      - 'scripts/lib/test-ifa-fault-injection-generic-shared-intent-lock-cases.sh'
      - 'scripts/lib/test-ifa-fault-injection-generic-family-drive-cases.sh'
      - 'scripts/lib/test-ifa-fault-injection-generic-modules.sh'
      # The per-family pin files, sourced by variable path from the pins
      # module. Their governing rule is that pins are hand-derived and never
      # generated from the registry; editing one to "just make it match" has
      # to re-run the gate that would object.
      - 'scripts/lib/ifa_family_registry_pins/**'
      - 'go/internal/storage/postgres/migrations/**'
      - 'go/internal/graphschemacompat/**'
      - 'go/internal/projector/retry.go'
