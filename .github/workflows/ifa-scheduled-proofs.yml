name: Ifá Scheduled Live Proofs

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  schedule:
    - cron: '50 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-leaf-ifa-scheduled-proofs-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  # PR runs cancel when superseded like every other PR workflow; the
  # scheduled singleton group keeps cancel-in-progress false, so a proof
  # run on the schedule is never cancelled by a later schedule tick.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  ifa-scheduled:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'ifa-scheduled') }}
    name: Ifá scheduled proof vs NornicDB and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: eshu_ifa_proof
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eshu -d eshu_ifa_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify Ifá runner contract
        run: |
          python3 scripts/test-ifa-scheduled-events.py
          python3 scripts/test-ifa-scheduled-manifest.py
          python3 scripts/test-ifa-scheduled-bundle.py
          python3 scripts/lib/ifa_scheduled_events.py
          bash scripts/verify-live-tests-ledger.sh
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run tagged Ifá proofs
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -z "${GOFLAGS:-}"
          test -z "${GOWORK:-}"
          effective_config="$(go env GOFLAGS GOWORK)"
          test -z "$effective_config"
          proof_status="$(git status --porcelain --untracked-files=all)"
          test -z "$proof_status"
          bash scripts/run-ifa-scheduled-proofs.sh
      - name: Upload Ifá proof events
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ifa-scheduled-events
          path: |
            ${{ runner.temp }}/ifa-scheduled/*.jsonl
            ${{ runner.temp }}/ifa-scheduled/manifest.json
          if-no-files-found: error
