name: Live Backend Tests

# Issue #6784 (epic #6788): every CI-class row from specs/live-tests.v1.yaml
# runs against NornicDB and Neo4j. The ledger (specs/live-tests.v1.yaml)
# decides what is blocking: promoting a test is a ledger edit, not a
# workflow edit. scripts/run-live-backend-tests.sh gives each ledger file
# a fresh single-service backend (down -v + up per file) because several
# tests assert exact whole-graph counts against an empty database.
#
# This row is blocking: required-gates judges a PR with main's registry,
# so the new blocking check_name could not be introduced in the PR that
# first produced it (see the golden-corpus-gate-neo4j row comment in
# specs/ci-gates.v1.yaml). Blocking flipped to true in the follow-up once
# main went green on this job.

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  # Merge-queue entries (#7111): selected shards run, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  # Main has no merge queue since 2026-10-16 (#8288): inert until re-enabled.
  merge_group:
    types: [checks_requested]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-leaf-live-backend-tests-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ESHU_CI_IMAGES: "1"
  POSTGRES_IMAGE: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  NEO4J_IMAGE: ghcr.io/eshu-hq/ci-neo4j-community@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
  ESHU_XX_IMAGE: ghcr.io/eshu-hq/ci-mirror-xx@sha256:0c6a569797744e45955f39d4f7538ac344bfb7ebf0a54006a0a4297b153ccf0f
  ESHU_GO_IMAGE: ghcr.io/eshu-hq/ci-mirror-golang@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
  ESHU_ALPINE_IMAGE: ghcr.io/eshu-hq/ci-mirror-alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d

jobs:
  queue-selection:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'queue-selection') }}
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: live-backend-tests.yml

  # The ledger validator, both seed harnesses, and the runner's static
  # probes are cheap and need no Docker, so a broken gate fails here in
  # seconds instead of after the heavy job below.
  static-mirror:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'static-mirror') }}
    needs: queue-selection
    name: static-mirror (ledger and runner probes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (ledger and runner probes)')) }}
        uses: actions/checkout@v5

      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (ledger and runner probes)')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate the live-test ledger
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (ledger and runner probes)')) }}
        run: bash scripts/verify-live-tests-ledger.sh

      - name: Test the ledger validator
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (ledger and runner probes)')) }}
        run: bash scripts/test-verify-live-tests-ledger.sh
      - name: Test Nornic conformance enrollment
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (ledger and runner probes)')) }}
        run: python3 scripts/test-nornic-conformance-events.py

      - name: Test the live-backend runner
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (ledger and runner probes)')) }}
        run: |
          bash scripts/test-run-live-backend-tests.sh
          python3 scripts/test-live-backend-shards.py
          python3 scripts/test-live-backend-lifecycle.py
          python3 scripts/test-live-backend-workflow.py
          python3 scripts/test-postgres-scheduled-runner.py
          python3 scripts/test-postgres-scheduled-fragments.py
          python3 scripts/test-postgres-scheduled-ledger-policy.py
          python3 scripts/test-ifa-scheduled-events.py
          python3 scripts/test-ifa-scheduled-manifest.py
          python3 scripts/test-ifa-scheduled-bundle.py
          python3 scripts/test-ifa-scheduled-ledger-policy.py

  live-backend-shards:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'live-backend-shards')) && (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)')) }}
    needs: queue-selection
    name: live-backend shard (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # CI runners are isolated: no sibling worktree contends for the
      # fixed host ports, so the cross-run mutex is bypassed.
      ESHU_SKIP_LIVE_GATE_LOCK: 1
      ESHU_LIVE_COMPOSE_PROJECT: eshu-live-backend-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)')) }}
        uses: actions/checkout@v5

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)')) }}
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run live-backend tests on both backends
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)')) }}
        run: bash scripts/run-live-backend-tests.sh --shard "${{ matrix.shard }}/4" --results live-backend-result.json

      - name: Upload exact-source shard coverage
        if: ${{ always() && (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)')) }}
        uses: actions/upload-artifact@v4
        with:
          name: live-backend-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: live-backend-result.json
          if-no-files-found: error

      - name: Tear down backend stacks
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)'))) && (always()) }}
        run: |
          bash scripts/ci/compose.sh -p "${ESHU_LIVE_COMPOSE_PROJECT}" -f docker-compose.live-backend-nornicdb.yml -- down -v || true
          bash scripts/ci/compose.sh -p "${ESHU_LIVE_COMPOSE_PROJECT}" -f docker-compose.live-backend-neo4j.yml -- down -v || true

  live-backend:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'live-backend')) && (always()) }}
    name: live-backend (nornicdb and neo4j)
    needs: [queue-selection, live-backend-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require selection and every shard to succeed
        env:
          SELECTION_RESULT: ${{ needs.queue-selection.result }}
          SHARD_RESULT: ${{ needs.live-backend-shards.result }}
          RUN_LIVE: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)') }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$RUN_LIVE:$SHARD_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac

      - name: Check out exact source
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)') }}
        uses: actions/checkout@v5

      - name: Download run coverage
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)') }}
        uses: actions/download-artifact@v4
        with:
          pattern: live-backend-${{ github.run_id }}-*
          path: live-backend-reports

      - name: Verify complete live-backend coverage
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'live-backend (nornicdb and neo4j)') }}
        run: |
          python3 scripts/lib/live_backend_test_targets.py specs/live-tests.v1.yaml . |
            python3 scripts/lib/live_backend_shards.py expand > live-backend-full.plan
          python3 scripts/lib/live_backend_shards.py select --head "$(git rev-parse HEAD)" \
            --plan live-backend-full.plan --output-dir live-backend-selected \
            live-backend-reports/*/live-backend-result.json
          python3 scripts/lib/live_backend_shards.py verify --head "$(git rev-parse HEAD)" \
            --plan live-backend-full.plan live-backend-selected/*.json
