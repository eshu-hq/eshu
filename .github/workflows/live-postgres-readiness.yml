name: Live PostgreSQL Readiness

# The readiness, dead-code incoming, status route-selection, quiet-generation,
# activation obligation, targeted-maintenance, reindex watermark and #7209
# projector zombie-heal proofs listed in scripts/lib/live_postgres_readiness_inventory*.py
# use EXPLAIN and correctness assertions against separately created disposable
# databases. The merge queue retains the check and selects payload from the
# registry; PR and main-push events use their existing path filters.
on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'go/internal/query/supply/chain/**'
      - 'go/internal/query/supply/chain/impact/**'
      - 'go/internal/query/admin/**'
      - 'go/internal/query/iac/**'
      - 'go/internal/query/content_reader_dead_code*.go'
      - 'go/internal/query/code_topic*.go'
      - 'go/internal/query/content_reader_code_topic.go'
      - 'go/internal/query/content_reader_search_page.go'
      - 'go/internal/query/codetopicparallel/**'
      - 'go/internal/runtime/postgres/**'
      - 'go/internal/query/status*.go'
      - 'go/internal/query/search/unscoped/**'
      - 'go/internal/query/content_reader_search*.go'
      - 'go/internal/query/contentread/content_handler*.go'
      - 'go/internal/status/**'
      - 'go/internal/relationships/**'
      - 'go/internal/storage/postgres/**'
      - 'go/cmd/reducer/**'
      - 'go/internal/reducer/maintenance/**'
      - 'go/internal/reducer/freshness/links/**'
      - 'go/internal/testutil/postgresproof/**'
      - 'go/internal/reducer/status/**'
      - 'go/internal/cigates/readiness_job_split_test.go'
      - 'go/internal/cigates/readiness_matrix_test.go'
      - 'go/go.mod'
      - 'go/go.sum'
      - 'specs/live-tests.v1.yaml'
      - 'specs/live-tests.d/**'
      - 'specs/ci-gates.v1.yaml'
      - 'specs/ci-gates.d/**'
      - 'scripts/run-live-postgres-readiness-tests.sh'
      - 'scripts/test-run-live-postgres-readiness-tests.sh'
      - 'scripts/lib/test-run-live-postgres-readiness-seed-cases.sh'
      - 'scripts/lib/test-run-live-postgres-readiness-shards.sh'
      - 'scripts/lib/live_postgres_readiness_results.py'
      - 'scripts/lib/live_postgres_readiness_inventory*.py'
      - 'scripts/lib/live_postgres_readiness_env.sh'
      - 'scripts/lib/live_postgres_readiness_records.py'
      - 'scripts/lib/live_postgres_readiness_shards.py'
      - 'scripts/lib/live_postgres_readiness_weights*.py'
      - 'scripts/lib/live_postgres_readiness_balance_cases.py'
      - 'scripts/lib/live_postgres_readiness_v2.py'
      - 'scripts/lib/live_postgres_readiness_v2_planner.py'
      - 'scripts/lib/live_postgres_readiness_v2_cases.py'
      - 'scripts/lib/live_postgres_readiness_row_split.py'
      - 'scripts/lib/live_postgres_readiness_row_clock_cases.py'
      - 'scripts/lib/live_postgres_readiness_reports.py'
      - 'scripts/lib/live_postgres_readiness_refresh_v2.py'
      - 'scripts/lib/live_postgres_readiness_refresh_v2_provenance.py'
      - 'scripts/test-live-postgres-readiness-refresh-v2.py'
      - 'specs/live-postgres-readiness-weights.v1.json'
      - 'specs/live-postgres-readiness-weights.v2.json'
      - 'scripts/test-live-postgres-readiness-shards.py'
      - 'scripts/test-live-postgres-readiness-helper.py'
      - 'scripts/lib/live_postgres_readiness_gen_scan.py'
      - 'scripts/lib/live_postgres_readiness_events.py'
      - 'scripts/lib/live_postgres_readiness_proof_cases.py'
      - 'scripts/lib/live_postgres_readiness_batch_mutant.py'
      - 'scripts/lib/test-run-live-postgres-readiness-proofs.sh'
      - 'scripts/ci/live-postgres-readiness-job-summary.sh'
      - 'scripts/ci/test-live-postgres-readiness-job-summary.sh'
      - 'scripts/test-run-live-postgres-readiness-selftest-seeds.sh'
      - 'scripts/lib/live_tests_registry.py'
      - 'scripts/lib/verify-live-tests-ledger.py'
      - 'scripts/test-live-tests-registry.py'
      - 'scripts/verify-live-tests-ledger.sh'
      - 'scripts/test-verify-live-tests-ledger.sh'
      - 'scripts/ci/go-mod-download-retry.sh'
      - 'scripts/ci/install-apt-packages.sh'
      - 'scripts/ci/live-postgres-standby-fixture.sh'
      - 'scripts/test-live-postgres-standby-fixture.sh'
      - '.github/workflows/live-postgres-readiness.yml'
      - '.github/workflows/required-gates.yml'

concurrency:
  group: ci-leaf-live-postgres-readiness-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"
  ESHU_LIVE_POSTGRES_IMAGE: ghcr.io/eshu-hq/ci-postgres-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c

jobs:
  hermetic:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'hermetic') }}
    name: live-postgres-readiness hermetic
    runs-on: ubuntu-24.04
    # The fake-Go runner checks every ledger-selected proof and its fail-closed
    # accounting, and the shard contract checks the planner the matrix legs
    # use. Keep them in a separate job so they cannot consume a live
    # PostgreSQL/Neo4j leg's 30-minute budget.
    #
    # A job that reaches the cap is cancelled, not failed. The first step
    # records the start time inline (it runs before checkout, so it cannot
    # depend on a repo file) and the last step (always) writes a summary that
    # names a cap cancel, a failure, or an early cancel (#8241). The summary
    # step skips itself with a warning when checkout did not run, and cannot
    # fail the job. Keep CAP_MINUTES on that step equal to this value; the
    # cigates readiness test pins it. Measured with the 30-minute cap: the self-test took about
    # 5 minutes after #8263, so the margin is wide.
    timeout-minutes: 30
    steps:
      - name: Record hermetic job start
        run: echo "READINESS_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install ripgrep for readiness self-test checks
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check runner fail-closed behavior
        run: bash scripts/test-run-live-postgres-readiness-tests.sh

      - name: Check self-test seeded violations
        run: bash scripts/test-run-live-postgres-readiness-selftest-seeds.sh

      - name: Check helper source dependency
        run: python3 scripts/test-live-postgres-readiness-helper.py

      - name: Check shard planner fail-closed behavior
        run: python3 scripts/test-live-postgres-readiness-shards.py

      - name: Check v2 refresher provenance
        run: python3 scripts/test-live-postgres-readiness-refresh-v2.py

      - name: Check job summary classifier
        run: bash scripts/ci/test-live-postgres-readiness-job-summary.sh

      - name: Summarize hermetic job outcome
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          CAP_MINUTES: '30'
        run: |
          script=scripts/ci/live-postgres-readiness-job-summary.sh
          if [ ! -f "$script" ]; then
            echo "::warning title=hermetic job summary skipped::$script is absent (checkout did not run)"
            exit 0
          fi
          bash "$script" finish || echo "::warning title=hermetic job summary failed::$script finish exited $?"

  readiness-plan:
    if: ${{ github.event_name != 'pull_request' || (contains(fromJSON(inputs.plan_jobs || '[]'), 'readiness-plan') || contains(fromJSON(inputs.plan_jobs || '[]'), 'live-postgres-readiness-shards')) }}
    name: live-postgres-readiness plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce readiness matrix
        id: matrix
        run: |
          matrix=$(python3 scripts/lib/live_postgres_readiness_shards.py matrix)
          test -n "$matrix"
          printf '%s' "$matrix" | python3 -m json.tool > /dev/null
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  live-postgres-readiness-shards:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'live-postgres-readiness-shards') }}
    needs: [readiness-plan]
    name: live-postgres-readiness (postgres18) shard (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.readiness-plan.outputs.matrix) }}
    # 30-minute leg budget (#7864). The ledger-selected suite grows with
    # enrollment, so each leg runs one contiguous slice of the plan. The cuts
    # use the same committed model in plan, runner, and aggregate. The
    # present v2 weights file cuts six row-aware legs; without it the
    # matrix falls back to four v1 legs. The shard contract fails
    # above 80% of this cap, so a near-cap leg needs a measured refit.
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-proof-only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      neo4j:
        image: ghcr.io/eshu-hq/ci-neo4j-community@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
        env:
          NEO4J_AUTH: neo4j/local-proof-only
          NEO4J_PLUGINS: '[]'
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p local-proof-only 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Install ripgrep for readiness fixture checks
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check physical-standby fixture fail-closed behavior
        run: bash scripts/test-live-postgres-standby-fixture.sh

      - name: Start disposable physical standby
        run: bash scripts/ci/live-postgres-standby-fixture.sh start '${{ job.services.postgres.id }}' '${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}'

      - name: Run live readiness proofs
        env:
          # BEGIN GENERATED READINESS ENV (scripts/generate-live-postgres-readiness.py; do not hand-edit)
          ESHU_ADMIN_REOPEN_PROOF_DISPOSABLE: '1'
          ESHU_ADMIN_REOPEN_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_APPSYNC_LEGACY_KEYS_PROOF_DISPOSABLE: '1'
          ESHU_APPSYNC_LEGACY_KEYS_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_AWS_DRIFT_ARN_PROOF_DISPOSABLE: '1'
          ESHU_AWS_DRIFT_ARN_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_CONTAINER_IMAGE_IDENTITY_EPOCH_PROOF_DISPOSABLE: '1'
          ESHU_CONTAINER_IMAGE_IDENTITY_EPOCH_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_CONTENT_FILES_LANGUAGE_PROOF_DISPOSABLE: '1'
          ESHU_CONTENT_FILES_LANGUAGE_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_CONTENT_SEARCH_PROOF_DISPOSABLE: '1'
          ESHU_CONTENT_SEARCH_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_DEAD_CODE_INCOMING_BOUND_PROOF_DISPOSABLE: '1'
          ESHU_DEAD_CODE_INCOMING_BOUND_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_DEFERRED_PARTITION_PROOF_DISPOSABLE: '1'
          ESHU_DEFERRED_PARTITION_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_DRIFTED_BUCKET_SKIP_PROOF_DISPOSABLE: '1'
          ESHU_DRIFTED_BUCKET_SKIP_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_FLUX_EVIDENCE_IDENTITY_PROOF_DISPOSABLE: '1'
          ESHU_FLUX_EVIDENCE_IDENTITY_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_GENERATION_RETENTION_PROOF_DISPOSABLE: '1'
          ESHU_GENERATION_RETENTION_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_GRAPH_BACKEND: neo4j
          ESHU_IAC_INVENTORY_LIVE: '1'
          ESHU_IDENTITY_EPOCH_PROOF_DISPOSABLE: '1'
          ESHU_IDENTITY_EPOCH_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_NEO4J_DATABASE: neo4j
          ESHU_NEO4J_PASSWORD: local-proof-only
          ESHU_NEO4J_URI: neo4j://127.0.0.1:7687
          ESHU_NEO4J_USERNAME: neo4j
          ESHU_PACKAGE_CONSUMPTION_SCOPE_PROOF_DISPOSABLE: '1'
          ESHU_PACKAGE_CONSUMPTION_SCOPE_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_PACKAGE_MANIFEST_REPO_SCOPE_EXPLAIN_PROOF_DISPOSABLE: '1'
          ESHU_PACKAGE_MANIFEST_REPO_SCOPE_EXPLAIN_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_POISON_LIVENESS_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_POSTGRES_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_POSTGRES_TEST_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_PREFETCH_BATCH_PLAN_PROOF_DISPOSABLE: '1'
          ESHU_PREFETCH_BATCH_PLAN_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_PROJECTOR_CLAIM_DEADLOCK_PROOF_DISPOSABLE: '1'
          ESHU_PROJECTOR_CLAIM_DEADLOCK_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_PROJECTOR_SUPERSESSION_PROOF_DISPOSABLE: '1'
          ESHU_PROJECTOR_SUPERSESSION_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_REACHABILITY_COMPLETED_INDEX_PROOF_DISPOSABLE: '1'
          ESHU_REACHABILITY_COMPLETED_INDEX_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_REACHABILITY_EDGES_SCOPE_PROOF_DISPOSABLE: '1'
          ESHU_REACHABILITY_EDGES_SCOPE_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_READINESS_CONTAINER_IDENTITY_PROOF_DISPOSABLE: '1'
          ESHU_READINESS_CONTAINER_IDENTITY_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_RECOVERY_DELTA_ACTIVE_PROOF_DISPOSABLE: '1'
          ESHU_RECOVERY_DELTA_ACTIVE_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_REDUCER_ACK_RECLAIM_PROOF_DISPOSABLE: '1'
          ESHU_REDUCER_ACK_RECLAIM_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_REDUCER_FAIRNESS_PROOF_DISPOSABLE: '1'
          ESHU_REDUCER_FAIRNESS_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_RUNTIME_ENVIRONMENT_EVIDENCE_POSTGRES_DISPOSABLE: '1'
          ESHU_RUNTIME_ENVIRONMENT_EVIDENCE_POSTGRES_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_SCAN_TIER_READINESS_EXPLAIN_PROOF_DISPOSABLE: '1'
          ESHU_SCAN_TIER_READINESS_EXPLAIN_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_SCOPED_SEARCH_PROOF_DISPOSABLE: '1'
          ESHU_SCOPED_SEARCH_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_STATUS_SUMMARY_PROOF_DISPOSABLE: '1'
          ESHU_STATUS_SUMMARY_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_STATUS_TERRAFORM_SELECTION_PROOF_DISPOSABLE: '1'
          ESHU_STATUS_TERRAFORM_SELECTION_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_SUPPLY_CHAIN_IMPACT_EVIDENCE_PROOF_DISPOSABLE: '1'
          ESHU_SUPPLY_CHAIN_IMPACT_EVIDENCE_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_SUPPRESSION_PATHS_PROOF_DISPOSABLE: '1'
          ESHU_SUPPRESSION_PATHS_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_TARGETED_MAINTENANCE_PROOF_DISPOSABLE: '1'
          ESHU_TARGETED_MAINTENANCE_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_TEST_CONTENT_INDEX_POSTGRES_DISPOSABLE: '1'
          ESHU_TEST_CONTENT_INDEX_POSTGRES_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          ESHU_TEST_CONTENT_INDEX_POSTGRES_READ_DSN: postgres://postgres:local-proof-only@127.0.0.1:15433/postgres?sslmode=disable
          ESHU_WEBHOOK_CLAIM_LEASE_PROOF_DSN: postgres://postgres:local-proof-only@127.0.0.1:15432/postgres?sslmode=disable
          # END GENERATED READINESS ENV
        run: bash scripts/run-live-postgres-readiness-tests.sh --shard "${{ matrix.shard }}/${{ matrix.total }}" --report readiness-shard-report.json

      - name: Upload shard coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: readiness-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: readiness-shard-report.json
          if-no-files-found: error

      - name: Upload failed-package event streams
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: readiness-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: .readiness-debug/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop disposable physical standby
        if: always()
        run: bash scripts/ci/live-postgres-standby-fixture.sh stop '${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}'

  live-postgres-readiness:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'live-postgres-readiness')) && (always()) }}
    needs: [readiness-plan, live-postgres-readiness-shards]
    name: live-postgres-readiness (postgres18)
    runs-on: ubuntu-24.04
    # The aggregator carries no proof load: it reunites every shard's
    # reports and fails the check when any leg timed out, left no report,
    # or covered less than the full ledger plan.
    timeout-minutes: 10
    steps:
      - name: Require every shard to succeed
        env:
          PLAN_RESULT: ${{ needs.readiness-plan.result }}
          SHARD_RESULT: ${{ needs.live-postgres-readiness-shards.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SHARD_RESULT" = success

      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download run shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: readiness-shard-${{ github.run_id }}-*
          path: readiness-shard-reports

      - name: Verify complete readiness coverage
        run: |
          python3 scripts/lib/live_postgres_readiness_results.py list-packages > readiness-full.tsv
          python3 scripts/lib/live_postgres_readiness_shards.py select --head "$(git rev-parse HEAD)" \
            --plan readiness-full.tsv --output-dir readiness-shard-selected \
            readiness-shard-reports/*/readiness-shard-report.json
          python3 scripts/lib/live_postgres_readiness_shards.py verify --head "$(git rev-parse HEAD)" \
            --plan readiness-full.tsv readiness-shard-selected/*.json

      - name: Print suite summary
        run: python3 scripts/lib/live_postgres_readiness_results.py summary
