name: macOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    # Path-filtered (#4218): the macOS build only needs to run on Go changes.
    # main runs unconditionally above as the backstop.
    paths:
      - "go/**"
      - "scripts/ci/go-mod-download-retry.sh"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-latest
    # 45, not 30: `go test ./...` on macos-latest now takes 25-28 minutes, so
    # 30 cancelled 3 of the last 20 runs at exactly 30m on 2026-09-24 (PRs
    # #7067 twice, #7071), turning this blocking gate into a coin flip on
    # runner speed rather than a test signal.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Debug info
        run: |
          uname -a
          go version
          df -h

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a macOS build/test
      # failure that never compiled anything (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      # go/internal/replay/recorder and go/cmd/collector-aws-cloud run the
      # committed private-data gate library in-process; it needs ripgrep and
      # a bash >= 4.3 (the tests look for /opt/homebrew/bin/bash first, and
      # macOS ships 3.2). Without both the assertion skips or fails, and the
      # tests deliberately no longer skip on a missing rg (#6987 review).
      - name: Install ripgrep and bash
        run: brew install ripgrep bash

      - name: Build Go CLI
        working-directory: go
        run: |
          VERSION="${GITHUB_SHA::12}"
          CGO_ENABLED=1 go build -ldflags "-X github.com/eshu-hq/eshu/go/internal/buildinfo.Version=${VERSION}" -o eshu ./cmd/eshu

      - name: Run Go tests
        working-directory: go
        run: go test ./... -count=1 -timeout 300s

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: |
            ~/.eshu
            *.log
