name: macOS CI

# Nightly + on-demand only, and NOT a required check. It used to run on every
# Go-touching pull request and push to main and was a blocking gate, but 0 of
# the 29 macOS failures observed since 2026-09-21 were macOS-only (each also
# failed on the Linux go-race lane) while the lane cost ~2,800 macOS-minutes a
# day, so it added runner cost and queue latency without adding a merge signal.
# The nightly run is the backstop for macOS-specific regressions (bash 3.2,
# case-insensitive filesystem, CGO); a red run is a follow-up issue, not a
# merge blocker. There is deliberately no pull_request, push, or merge_group
# trigger; specs/ci-gates.v1.yaml records macos-build as blocking: false and
# required-gates.yml no longer waits on this workflow.
on:
  schedule:
    # 07:23 UTC = 03:23 US Eastern, off-peak for the shared macOS runner pool
    # and away from the :00/:30 marks when scheduled runs are delayed.
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    # 45, not 30: `go test ./...` on macos-latest takes 25-28 minutes, so 30
    # cancelled 3 of 20 runs at exactly 30m on 2026-09-24 (PRs #7067 twice,
    # #7071) and made the lane a coin flip on runner speed, not a test signal.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Debug info
        run: |
          uname -a
          go version
          df -h

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a macOS build/test
      # failure that never compiled anything (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      # go/internal/replay/recorder and go/cmd/collector-aws-cloud run the
      # committed private-data gate library in-process; it needs ripgrep and
      # a bash >= 4.3 (the tests look for /opt/homebrew/bin/bash first, and
      # macOS ships 3.2). Without both the assertion skips or fails, and the
      # tests deliberately no longer skip on a missing rg (#6987 review).
      - name: Install ripgrep and bash
        run: brew install ripgrep bash

      - name: Build Go CLI
        working-directory: go
        run: |
          VERSION="${GITHUB_SHA::12}"
          CGO_ENABLED=1 go build -ldflags "-X github.com/eshu-hq/eshu/go/internal/buildinfo.Version=${VERSION}" -o eshu ./cmd/eshu

      - name: Run Go tests
        working-directory: go
        run: go test ./... -count=1 -timeout 300s

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: |
            ~/.eshu
            *.log
