name: Main Health

# Post-merge watcher (#7111 F2). Nothing used to notice a required workflow
# going red on `main` after two green PRs merged: the guard-test red sat 4h44m
# and was found by PR authors, and the scheduled ruleset verifier failed every
# scheduled run with no owner. This workflow judges the NEWEST main commit after every
# required workflow finishes (and every 6 hours as a backstop), keeps exactly
# one pinned `main is red @<sha>` issue in step with the verdict, posts a
# `main-health` commit status, and closes the issue when main is green. Only
# jobs the registry marks blocking make main red; advisory failures are
# listed. The scheduled `Required Gates` ruleset verification
# (verify-live-ruleset) routes into the same issue.
#
# Like required-gates.yml this is a trusted publisher: workflow_run always
# runs the default-branch version, it checks out only the default branch, and
# it never executes pull-request code. The logic and its decisions live in
# scripts/ci/main-health.sh, exercised hermetically by
# scripts/test-main-health.sh. The workflow_run list below must equal the
# workflows the script judges (`main-health.sh --print-required`: the
# aggregator's list plus the registry's source workflow); that test enforces
# it. `Required Gates` itself is deliberately NOT a trigger: every one of its
# publisher runs, PR and merge-queue ones included, reports head_branch main
# (about 18 a minute measured), so it would flood this workflow. Its scheduled
# ruleset verification (cron 17 */6) is read on every evaluation, and this
# workflow's own schedule (cron 47 */6) runs 30 minutes after it.
#
# Reading the result: this job succeeds whenever the evaluation completed,
# red main or not, so the watcher never adds a red row of its own to main.
# Dry run: Actions -> Main Health -> Run workflow (dry_run defaults to true)
# prints the decision and the writes it would make, and makes none.
on:
  workflow_run:
    workflows:
      - Build Test
      - End-to-end Tests
      - Fact Schema Diff
      - Frontend
      - Golden Corpus Gate
      - Ifa Determinism Gate
      - Live Backend Tests
      - MCP Schema Drift
      - Payload Usage Manifest
      - Product Claim Ledger
      - Publish Image and Helm Chart
      - Race Graph Writes
      - Read API Latency Gate
      - Reducer Contention Gate
      - Replay Coverage Gate
      - Replay Tier (offline NornicDB)
      - Scorecard Example Conformance
      - SDK Go Modules
      - Security Scan
      - Static Contract Gates
      - Verify Agent Hygiene
      - Verify CI Gate Registry
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the decision and the writes it would make; write nothing.
        type: boolean
        default: true
  schedule:
    - cron: "47 */6 * * *"

permissions:
  actions: read
  contents: read
  issues: write
  statuses: write

jobs:
  watch:
    # Allow-list, not deny-list: only the schedule, a manual dispatch, or a
    # completed push, schedule or workflow_run (Security Scan's image scan)
    # run of main in this repository wakes the watcher. A run of a fork
    # branch named `main`, and any pull_request, pull_request_target,
    # issue_comment or merge_group run, never matches.
    # scripts/test-main-health.sh evaluates this expression against each of
    # those contexts. For a workflow_run-type run head_branch is always main
    # (the default branch at creation), so that test is a floor, not the
    # filter: the script judges main's tip whatever woke it.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_run'))
    # Concurrency is on the JOB, not the workflow. GitHub documents a
    # workflow-level group as applying to the whole run, so a run whose only
    # job the guard skips could take the one pending slot and evict a queued
    # live evaluation. That was not measured. The job-level group assumes
    # GitHub evaluates `if:` before placing a job in its group (also not
    # measured); if wrong, a lost pending evaluation is re-created by the
    # next required-workflow completion or the 6h cron, and each evaluation
    # judges the current tip, so no verdict is stuck.
    # One live writer at a time so the single issue can never be
    # double-opened, and an in-progress live run is never cancelled. GitHub
    # keeps one pending job per group, so a newer pending live evaluation
    # replaces an older pending one; both judge the current tip of main when
    # they start, so the survivor reaches the same verdict. Dry runs (manual
    # dispatch with dry_run on) get their own group keyed on the same
    # predicate as MAIN_HEALTH_DRY_RUN below: they write nothing, so they must
    # never evict a queued live run or wait behind one.
    concurrency:
      group: main-health-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry' || 'live' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Judge the newest main commit
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_HEALTH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          MAIN_HEALTH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/main-health.sh
