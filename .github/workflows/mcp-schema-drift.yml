# MCP schema drift gate. Detects any tool defined in ReadOnlyTools()
# that is not accounted for in the capability matrix, any tool declared
# in the matrix but not registered, any change to the generated catalog
# artifact, and any change to the expected ReadOnlyTools count.
#
# Drift definition (what this gate catches):
#   1. ReadOnlyTools count changes without a corresponding
#      tools_test.go expected-count update (P0).
#   2. A tool name present in ReadOnlyTools but missing from every
#      capability matrix YAML file (P0 — orphaned tool).
#   3. A tool name declared in the matrix but not implemented in
#      ReadOnlyTools (P0 — phantom capability).
#   4. The committed catalog.generated.json or surface-inventory artifact
#      differs from a freshly generated payload (P0 — stale artifact).
#   5. A public product claim ledger row names an unknown capability, stale
#      maturity, missing owner/surface/path/proof, required semantic output, or
#      a moved source quote (P0 — public claim has lost its proof chain).
#
# What is NOT drift (cosmetic-only, not caught by this gate):
#   - Tool description wording changes (whitespace, punctuation, rephrasing).
#   - InputSchema property order or default value text.
#   - Comment changes in tools_*.go files.
#   - Go code formatting changes (caught by lint/gofumpt separately).
#
# When this gate fails on a PR:
#   1. Run: cd go && go run ./cmd/capability-inventory -mode generate
#   2. Commit the regenerated artifacts.
#   3. If the matrix or overlay changed, ensure every tool in
#      ReadOnlyTools() is accounted for and vice versa.
#
# Tool-count rule:
#   TestReadOnlyTools in tools_test.go asserts the exact count of tools
#   registered via ReadOnlyTools(). Adding or removing a tool requires
#   updating tools_test.go. Failing to update is the most common drift.
name: MCP Schema Drift

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decide whether a PR changed any non-docs path. The Go-only drift jobs
  # (mcp-tool-count, mcp-test-suite) skip a docs-only PR; capability-verify below
  # stays always-on because its `-mode docs` step is the only CI validation of
  # capability-state / collector-readiness / product-claim docs. Non-PR events
  # run everything.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Without this line the whole filter below is decorative. dorny
          # compiles each pattern separately and, by default
          # (predicate-quantifier: some), includes a file the moment ONE pattern
          # matches it. `**` matches everything, so it short-circuits first and
          # the five `!` negations can never subtract: the filter is exactly
          # equivalent to `code: ['**']`, and every job it gates runs on every
          # PR including a docs-only one. Confirmed against
          # dorny/paths-filter@v3's own src/filter.ts, which defines precisely
          # PredicateQuantifier { EVERY = 'every', SOME = 'some' } and falls
          # through to `patterns.some(...)`; v3 has no SOME_WITH_EXCLUDES case
          # (that arrived later on master), so 'every' is the only value that
          # makes a negation mean anything here. #5896.
          #
          # This is also what #5818 actually needed. That fix added the
          # `!.agents/**` negation below and it has been inert ever since —
          # under `some` no negation subtracts, however it is anchored, so the
          # root-anchoring of `!*.md` was never the operative cause of those
          # ~118 wasted runner-minutes.
          #
          # Scoped deliberately to the three filters that HAVE negations. Do not
          # copy this line to static-contract-gates.yml: its filters are all
          # positive patterns, and 'every' would require a file to match every
          # one of them at once, selecting almost nothing.
          predicate-quantifier: 'every'
          # `code` is true when ANY changed file is outside the docs set. The
          # bare `*.md` negation is ROOT-ANCHORED (no `/` in the pattern), so it
          # only strips root-level markdown (README.md, CLAUDE.md, AGENTS.md,
          # etc.) — nested markdown under go/**/*.md, sdk/**/*.md,
          # tests/**/*.md, and skill-fragments/**/*.md still counts as code
          # (deliberate: those trees are code-adjacent and tied to the Go
          # build/test/security surface these three workflows gate). The one
          # exception is `.agents/**`, negated explicitly: it holds
          # agent-instruction skills/SKILL.md/reference markdown with no
          # Go/build/lint/security consumer in this workflow — it is verified
          # only by verify-agent-canon.sh (verify-agent-hygiene.yml) and
          # verify-skill-roundtrip.sh (static-contract-gates.yml), neither of
          # which this filter gates. See #5818.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!mkdocs.yml'
              - '!.github/**/*.md'
              - '!.agents/**'

  # ── Gate 1: Tool count ──
  mcp-tool-count:
    name: Verify ReadOnlyTools count
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check ReadOnlyTools count
        working-directory: go
        run: go test ./internal/mcp/ -run '^TestReadOnlyTools$' -count=1

  # ── Gate 2: Capability matrix reconciliation + artifact staleness ──
  # Runs in parallel with mcp-tool-count (no data dependency) so both
  # failures surface in a single CI run.
  capability-verify:
    name: Verify capability inventory
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run capability inventory verify
        working-directory: go
        shell: bash
        run: |
          set -o pipefail
          go run ./cmd/capability-inventory -mode verify 2>&1 | tee /tmp/capability-verify.log

      - name: Run capability docs and product-claim verify
        working-directory: go
        shell: bash
        run: |
          set -o pipefail
          go run ./cmd/capability-inventory -mode docs 2>&1 | tee /tmp/capability-docs.log

      - name: Upload drift report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-schema-drift-report
          path: |
            /tmp/capability-verify.log
            /tmp/capability-docs.log
          if-no-files-found: warn

  # ── Gate 3: Full MCP test suite ──
  mcp-test-suite:
    name: Full MCP test suite
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run MCP test suite
        working-directory: go
        run: go test ./internal/mcp/ -count=1 -timeout 120s
