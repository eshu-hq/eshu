# MCP schema drift gate. Detects any tool defined in ReadOnlyTools()
# that is not accounted for in the capability matrix, any tool declared
# in the matrix but not registered, any change to the generated catalog
# artifact, and any change to the expected ReadOnlyTools count.
#
# Drift definition (what this gate catches):
#   1. ReadOnlyTools count changes without a corresponding
#      tools_test.go expected-count update (P0).
#   2. A tool name present in ReadOnlyTools but missing from every
#      capability matrix YAML file (P0 — orphaned tool).
#   3. A tool name declared in the matrix but not implemented in
#      ReadOnlyTools (P0 — phantom capability).
#   4. The committed catalog.generated.json or surface-inventory artifact
#      differs from a freshly generated payload (P0 — stale artifact).
#   5. A public product claim ledger row names an unknown capability, stale
#      maturity, missing owner/surface/path/proof, required semantic output, or
#      a moved source quote (P0 — public claim has lost its proof chain).
#
# What is NOT drift (cosmetic-only, not caught by this gate):
#   - Tool description wording changes (whitespace, punctuation, rephrasing).
#   - InputSchema property order or default value text.
#   - Comment changes in tools_*.go files.
#   - Go code formatting changes (caught by lint/gofumpt separately).
#
# When this gate fails on a PR:
#   1. Run: cd go && go run ./cmd/capability-inventory -mode generate
#   2. Commit the regenerated artifacts.
#   3. If the matrix or overlay changed, ensure every tool in
#      ReadOnlyTools() is accounted for and vice versa.
#
# Tool-count rule:
#   TestReadOnlyTools in tools_test.go asserts the exact count of tools
#   registered via ReadOnlyTools(). Adding or removing a tool requires
#   updating tools_test.go. Failing to update is the most common drift.
name: MCP Schema Drift

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main

concurrency:
  group: ci-leaf-mcp-schema-drift-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  # Decide whether a PR changed any non-docs path. The Go-only drift jobs
  # (mcp-tool-count, mcp-test-suite) skip a docs-only PR; capability-verify below
  # stays always-on because its `-mode docs` step is the only CI validation of
  # capability-state / collector-readiness / product-claim docs. Non-PR events
  # run everything.
  changes:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'changes') }}
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lockstep: ${{ steps.lockstep.outputs.lockstep }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Push has no base diff, so dorny treats everything as changed and
      # lets every selected job run, as test.yml's changes job does (#5814).
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Without this line the whole filter below is decorative. dorny
          # compiles each pattern separately and, by default
          # (predicate-quantifier: some), includes a file the moment ONE pattern
          # matches it. `**` matches everything, so it short-circuits first and
          # the five `!` negations can never subtract: the filter is exactly
          # equivalent to `code: ['**']`, and every job it gates runs on every
          # PR including a docs-only one. Confirmed against
          # dorny/paths-filter@v3's own src/filter.ts, which defines precisely
          # PredicateQuantifier { EVERY = 'every', SOME = 'some' } and falls
          # through to `patterns.some(...)`; v3 has no SOME_WITH_EXCLUDES case
          # (that arrived later on master), so 'every' is the only value that
          # makes a negation mean anything here. #5896.
          #
          # This is also what #5818 actually needed. That fix added the
          # `!.agents/**` negation below and it has been inert ever since —
          # under `some` no negation subtracts, however it is anchored, so the
          # root-anchoring of `!*.md` was never the operative cause of those
          # ~118 wasted runner-minutes.
          #
          # Scoped deliberately to the three filters that HAVE negations. Do not
          # copy this line to static-contract-gates.yml: its filters are all
          # positive patterns, and 'every' would require a file to match every
          # one of them at once, selecting almost nothing.
          predicate-quantifier: 'every'
          # `code` is true when ANY changed file is outside the docs set. The
          # bare `*.md` negation is ROOT-ANCHORED (no `/` in the pattern), so it
          # only strips root-level markdown on its own; the `'**/*.md'`
          # negation below strips nested markdown too (go/**/*.md,
          # sdk/**/*.md, tests/**/*.md, skill-fragments/**/*.md). Markdown
          # prose is never compiled, so it cannot break the Go
          # build/test/security surface these three workflows gate: the gates
          # that validate markdown content (skill-roundtrip, changelog,
          # claim-ledger, the docs build) live in always-on jobs
          # or explicitly markdown-triggered workflows this filter does not
          # gate. package-docs is the exception that proves the shape: it runs
          # in code-gated verify-contracts, but its script derives packages
          # only from changed Go files, so a pure-markdown PR is vacuous for
          # it with or without this filter. JSON stays narrow on purpose:
          # root, docs/, and scripts/ JSON
          # have no Go consumers, while specs/** (image pins feed the
          # query-plan image contract on purpose), go/**, sdk/**, tests/**,
          # and testdata/** JSON stays code because unit tests, live gates,
          # and go:embed directives consume it
          # (ask-overlay-inventory-coverage, parser fixtures). See #9200.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/*.md'
              - '!*.json'
              - '!docs/**/*.json'
              - '!scripts/**/*.json'
              - '!mkdocs.yml'
              - '!.github/**/*.md'
              - '!.agents/**'

      - name: Filter lockstep test inputs
        id: lockstep
        uses: dorny/paths-filter@v3
        with:
          # Unlike `code` above, this filter is all positives (the manifest-derived
          # lockstep list), so it needs the default `some` quantifier: a PR touching
          # ANY listed input must run the code-gated lanes. `every` would require a
          # file to match all entries at once and select nothing.
          predicate-quantifier: 'some'
          filters: |
            lockstep:
              - 'AGENTS.md'
              - 'docs/internal/design/430-nornicdb-graph-search-split.md'
              - 'docs/internal/design/5351-ifa-materialized-edge-known-gaps.md'
              - 'docs/internal/evidence/8870-vulnerability-intelligence-version-provenance.md'
              - 'docs/internal/evidence/8871-eshu-deploy-census.md'
              - 'docs/internal/evidence/8871-eshu-deploy-contract.md'
              - 'docs/internal/evidence/8874-eshu-cli-contract.md'
              - 'docs/internal/remote-validation/inventory.generated.json'
              - 'docs/public/deploy/kubernetes/helm-routing-and-storage-values.md'
              - 'docs/public/deploy/kubernetes/runtime-parity-matrix.md'
              - 'docs/public/deployment/credential-file-cleanup.md'
              - 'docs/public/deployment/service-runtimes-collectors.md'
              - 'docs/public/deployment/service-runtimes.md'
              - 'docs/public/languages/admitted-files.md'
              - 'docs/public/operate/3am-operator-runbook.md'
              - 'docs/public/reference/assistant-fast-path-hooks.md'
              - 'docs/public/reference/env-registry.md'
              - 'docs/public/reference/environment-collectors-supply-chain.md'
              - 'docs/public/reference/environment-collectors.md'
              - 'docs/public/reference/environment-ingestion-queues.md'
              - 'docs/public/reference/first-run-evidence.md'
              - 'docs/public/reference/generated/replay-coverage.md'
              - 'docs/public/reference/graph-backend-installation.md'
              - 'docs/public/reference/http-api.md'
              - 'docs/public/reference/http-api/collector-terminal-failure.md'
              - 'docs/public/reference/hybrid-retrieval-production-gate.md'
              - 'docs/public/reference/local-performance-envelope.md'
              - 'docs/public/reference/mcp-cookbook.md'
              - 'docs/public/reference/mcp-prompt-surface-audit.md'
              - 'docs/public/reference/mcp-tool-contract-matrix.md'
              - 'docs/public/reference/nornicdb-tuning.md'
              - 'docs/public/reference/reducer-claim-latency-gate.md'
              - 'docs/public/reference/searchbench-evidence/issue-1298-semantic-retrieval-proof-v1.json'
              - 'docs/public/reference/searchbench-evidence/issue-417-nornicdb-hybrid-retrieval-prototype-v1.json'
              - 'docs/public/reference/searchbench-evidence/issue-420-link-prediction-evaluation-v1.json'
              - 'docs/public/reference/searchbench-evidence/issue-421-rerank-protocol-evaluation-v1.json'
              - 'docs/public/run-locally/docker-compose.md'
              - 'go/cmd/README.md'
              - 'go/cmd/api/CUTOVER_OWNERSHIP.md'
              - 'go/cmd/audit-preflight/testdata/codegraphcontext-already-tracked.md'
              - 'go/cmd/audit-preflight/testdata/gitnexus-missing.md'
              - 'go/cmd/audit-preflight/testdata/graphify-foundation-exists.md'
              - 'go/cmd/audit-preflight/testdata/incomplete.md'
              - 'go/cmd/collector-vault-live/testdata/8869-collector-vault-live-census.md'
              - 'go/cmd/eshu/cli_extraction_inventory.md'
              - 'go/cmd/ifa/README.md'
              - 'go/cmd/mcp-server/CUTOVER_OWNERSHIP.md'
              - 'go/cmd/scanner-worker/EXTRACTION_PREP.md'
              - 'go/internal/ask/catalog/README.md'
              - 'go/internal/cli/demo/README.md'
              - 'go/internal/cli/hookpreflight/AGENTS.md'
              - 'go/internal/cli/hookpreflight/README.md'
              - 'go/internal/collector/README.md'
              - 'go/internal/collector/sbom/SHIM_MAP.md'
              - 'go/internal/content/artifacts/README.md'
              - 'go/internal/facts/FACT_KIND_REGISTRIES.md'
              - 'go/internal/ifa/README.md'
              - 'go/internal/ifa/materializededges/README.md'
              - 'go/internal/ifa/testdata/5998-rationale-relative-path.md'
              - 'go/internal/query/repository/README.md'
              - 'go/internal/reducer/AGENTS.md'
              - 'go/internal/reducer/README.md'
              - 'go/internal/reducer/testdata/5998-rationale-relative-path.md'
              - 'go/internal/runtime/README.md'
              - 'go/internal/runtime/testdata/8894-component-extension-activations.md'
              - 'testdata/golden/documentation-positive.md'

  # ── Gate 1: Tool count ──
  mcp-tool-count:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'mcp-tool-count')) && (github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' || needs.changes.outputs.lockstep == 'true')) }}
    name: Verify ReadOnlyTools count
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: [changes]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a tool-count
      # drift that never compiled (#6615 -- the golang.org/x/net stream
      # error that first exposed this job's missing pre-warm).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Check ReadOnlyTools count
        working-directory: go
        # go_test_run_guard (#6055) runs `go test -list` first and fails
        # loudly if the pattern matches fewer than the expected 1 test,
        # instead of the bare `go test -run` exiting 0 on a zero-match
        # rename/move.
        run: ../scripts/go-test-run-guard.sh 1 '^TestReadOnlyTools$' -- ./internal/mcp/ -count=1

  # ── Gate 2: Capability matrix reconciliation + artifact staleness ──
  # Runs in parallel with mcp-tool-count (no data dependency) so both
  # failures surface in a single CI run.
  capability-verify:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'capability-verify') }}
    name: Verify capability inventory
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a capability
      # drift that never ran (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run capability inventory verify
        working-directory: go
        shell: bash
        run: |
          set -o pipefail
          go run ./cmd/capability-inventory -mode verify 2>&1 | tee /tmp/capability-verify.log

      - name: Check MCP resource-only demo client
        run: python3 scripts/test-verify-demo-compose-answers-call-mcp-tool.py

      - name: Run capability docs and product-claim verify
        working-directory: go
        shell: bash
        run: |
          set -o pipefail
          go run ./cmd/capability-inventory -mode docs 2>&1 | tee /tmp/capability-docs.log

      - name: Upload drift report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-schema-drift-report
          path: |
            /tmp/capability-verify.log
            /tmp/capability-docs.log
          if-no-files-found: warn

  # ── Gate 3: Full MCP test suite ──
  mcp-test-suite:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'mcp-test-suite')) && (github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' || needs.changes.outputs.lockstep == 'true')) }}
    name: Full MCP test suite
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: [changes]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as an MCP test
      # failure that never compiled (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run MCP test suite
        working-directory: go
        run: go test ./internal/mcp/... -count=1 -timeout 120s

  # ── Gate 4: Router eval corpus and routing accuracy report ──
  # Report-only for accuracy (#8756): the test prints top-1 and top-5 routing
  # accuracy and every miss to the job summary and never fails on them. It does
  # fail on a malformed corpus or an expected tool that is not registered.
  mcp-router-eval:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'mcp-router-eval')) && (github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' || needs.changes.outputs.lockstep == 'true')) }}
    name: MCP router eval report
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [changes]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run router eval and publish the report
        working-directory: go
        env:
          ESHU_ROUTER_EVAL_REPORT: ${{ runner.temp }}/router-eval-report.txt
        shell: bash
        run: |
          set -euo pipefail
          # go_test_run_guard (#6055) fails loudly if the pattern matches
          # fewer than the expected 3 tests instead of a zero-match exit 0.
          ../scripts/go-test-run-guard.sh 3 '^(TestCorpusMatchesRegistry|TestUnregisteredExpectedToolFailsTheGate|TestRoutingAccuracyReport)$' -- ./internal/mcp/router/eval/ -count=1
          {
            echo '### MCP router routing accuracy (report-only)'
            echo '```text'
            cat "${ESHU_ROUTER_EVAL_REPORT}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
