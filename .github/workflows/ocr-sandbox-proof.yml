name: OCR Sandbox Proof

# Event-driven, non-blocking (#10071). Rebuilds the proof image from
# scripts/ocr-sandbox/Dockerfile and runs scripts/prove-ocr-sandbox.sh
# whenever the proof surface changes, so a pin edit or base-image bump is
# proven at upgrade time instead of rotting silently until a manual proof
# run. Exact `=` pins are invisible to the apk-floors drift detector (it
# audits `>=` floors), and base-preinstalled packages resolve stale instead
# of failing closed, so only a real build proves this image. The proof
# compiles the ocr/tesseract test binary into the image, so that package
# is trigger surface too: its sandbox tests Skip without the proof env,
# and a test-only desync would otherwise ship green. The paths filter
# means it never holds an unrelated change; upstream-side rot with no
# repo activity is discovered at the next base bump, when the fix is the
# same pin edit anyway.
on:
  push:
    paths:
      - ".github/workflows/ocr-sandbox-proof.yml"
      - "scripts/ocr-sandbox/Dockerfile"
      - "scripts/prove-ocr-sandbox.sh"
      - "go/internal/collector/document/ocr/tesseract/**"
  workflow_dispatch:

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  prove-ocr-sandbox:
    name: OCR sandbox proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # Same store pressure as build.yml (#9462, #9648): no cache.
          cache: false

      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run OCR sandbox proof
        run: bash scripts/prove-ocr-sandbox.sh --platform linux/amd64
