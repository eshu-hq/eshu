# Contract System v1 §6 enforcement gate 2: the payload-usage manifest
# (issue #4573, docs/internal/design/contract-system-v1.md#6-enforcement-gates).
# Derives typed factschema.Decode* usage across reducer/projector/query/loader/
# relationships/replay, fails when a handler reads a field no checked-in JSON
# Schema (sdk/go/factschema/schema/*.json) declares, and ratchets new raw
# payload reads on loader/relationships/replay behind explicit exemptions.
name: Payload Usage Manifest

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main

concurrency:
  group: ci-leaf-payload-usage-manifest-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  test-mirror:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'test-mirror') }}
    name: Verify payload-usage-manifest test mirror
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false

      - name: Install ripgrep and jq
        run: scripts/ci/install-apt-packages.sh ripgrep jq
        env:
          GH_TOKEN: ${{ github.token }}

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a payload-usage
      # test failure that never compiled (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run Go unit tests
        working-directory: go
        run: go test ./internal/payloadusage/... ./cmd/payload-usage-manifest/... -count=1

      - name: Run shell test mirror
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-verify-payload-usage-manifest.sh 2>&1 | tee /tmp/payload-usage-manifest-test.log

      - name: Upload test log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: payload-usage-manifest-test-log
          path: /tmp/payload-usage-manifest-test.log
          if-no-files-found: warn

  gate:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'gate') }}
    name: Verify payload-usage-manifest gate
    needs: [test-mirror]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a payload-usage
      # gate failure that never compiled (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run payload-usage-manifest gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-payload-usage-manifest.sh 2>&1 | tee /tmp/payload-usage-manifest-gate.log

      - name: Upload gate report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: payload-usage-manifest-report
          path: /tmp/payload-usage-manifest-gate.log
          if-no-files-found: warn
