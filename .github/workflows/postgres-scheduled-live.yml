          go test -json -race -p=1 -count=1 -timeout=10m ./internal/storage/postgres -run '^(TestContainerImageIdentityAckAttemptFenceMixedVersionLive|TestContainerImageIdentityAckAttemptFenceSurvivesSameOwnerReclaimAndReplayLive|TestContainerImageIdentityAckBatchAttemptExactnessLive|TestContainerImageIdentityAckMarkerOrderingLive|TestContainerImageIdentityAckStatusAuthorizationHonorsTransactionBoundariesLive|TestContainerImageIdentityCapableClaimQueriesLatchV2AndAdvanceEpochExplicitly|TestContainerImageIdentityCapablePreCutoverClaimSkipsTriggerFunctionLive|TestContainerImageIdentityClaimEpochAdvancesOnceUnderCompetingClaimersLive|TestContainerImageIdentityClaimEpochTriggerCatalogLive|TestContainerImageIdentityClaimEpochTriggerSkipsUnrelatedRowsLive|TestContainerImageIdentityClaimLatchSurvivesServiceRetryAndFencesLegacyCallbacksLive|TestContainerImageIdentityClaimRejectsInvalidEpochJumpLive|TestContainerImageIdentityCurrentBatchClaimAdvancesAndSucceedsLive|TestContainerImageIdentityCutoverMigrationAcceptsDurableClaimLatchWithoutMarkerLive|TestContainerImageIdentityFailureStatusAuthorizationLive|TestContainerImageIdentityLegacyCleanupProbeHonorsMarkerPresentRowsLive|TestContainerImageIdentityLegacyReclaimFencesExpiredSameOwnerAttemptLive|TestContainerImageIdentityPostCutoverLegacyClaimFailsUnchangedLive|TestCrossScopeCompletionConcurrentClaimHasOneLiveOwnerPerDomain|TestCrossScopeCompletionEventAfterFanoutSnapshotRemainsPendingLive|TestCrossScopeCompletionExpiredLeaseIsRootOfBoundedFanoutLive|TestCrossScopeCompletionFanoutRollsBackEventAndIntentTogetherLive|TestCrossScopeCompletionFanoutSchedulesOnlyEligibleConsumerStatesLive|TestCrossScopeCompletionIdentityActivationRaceReopensConsumerLive|TestCrossScopeCompletionIdentityThenCICDConvergesLive|TestCrossScopeCompletionLegacyRetryAndFailClearDirtyReplayLive|TestCrossScopeCompletionQueueMigrationLifecycleLive|TestCrossScopeCompletionQuietUpgradeSeedsCanonicalReplayOnceLive|TestCrossScopeCompletionRetryMergesPendingAndStaysBoundedLive|TestCrossScopeCompletionSourceIndexLifecycleLive|TestCrossScopeCompletionSuppressesUnchangedIdentityReplayLive|TestProvenanceEdgeIdentityUpgradeSeedsCurrentReplayOnceLive|TestReducerAckBatchAppendsOneCompletionEventPerProducerDomainLive|TestReducerAckCoalescesPendingCompletionEventsPerDomainLive|TestReducerAckEventInsertFailureRollsBackProducerSuccessLive|TestReducerContentionGateAckBatchDeadlockRetryLive|TestReducerContentionGateAckFanoutLockOrderLive|TestValueFlowRefreshAckBatchEmitsOnlyForGatedItemsLive|TestValueFlowRefreshAckEmitsEventWhenGatePassesLive|TestValueFlowRefreshAckFailsOpenWithoutSignalLive|TestValueFlowRefreshAckSuppressesEventOnExplicitZeroLive|TestValueFlowRefreshFanoutReopensSingletonLive|TestValueFlowRefreshGlobalScopeDoesNotHoldCanonicalLaneLive|TestValueFlowRefreshSeedMigrationSeedsGlobalSingletonLive|TestWorkflowImageCompletionForcedOrderConvergesLive)$' | tee "${RUNNER_TEMP}/ack_family.jsonl"
          python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/ack_family.jsonl" --group ack_family
          effective_config="$(go env GOFLAGS GOWORK)"
          test -z "$effective_config"
          proof_status="$(git -C .. status --porcelain --untracked-files=all)"
          test -z "$proof_status"
      - name: Upload ACK proof stream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-proof-streams-ack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ack_family.jsonl
          if-no-files-found: error
          retention-days: 14
  scheduled-bulk:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'scheduled-bulk') }}
    runs-on: ubuntu-24.04
    # Bulk leg: every family outside ACK, freshness and the root storage leg,
    # serially on one warm cache. #9488 predicts 7.6-12.7 min of steps.
    # 60 min covers the cold multi-package build with margin (#9492).
    timeout-minutes: 60
    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: eshu
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eshu -d eshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run bulk proof families
        uses: ./.github/actions/postgres-scheduled-bulk
        with:
          postgres_container: ${{ job.services.postgres.id }}
  scheduled-storage:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'scheduled-storage') }}
    runs-on: ubuntu-24.04
    # Root storage leg (#9488): the six families testing ./internal/storage/postgres
    # share its 11-21 min -race test build. #9488 predicts 16.9-29.8 min.
    timeout-minutes: 40
    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: eshu
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eshu -d eshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run storage proof families
        uses: ./.github/actions/postgres-scheduled-storage
        with:
          postgres_container: ${{ job.services.postgres.id }}
  scheduled-aggregate:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'scheduled-aggregate') }}
    needs: [scheduled-setup, scheduled-freshness-scale, scheduled-freshness-a, scheduled-freshness-b, scheduled-ack, scheduled-bulk, scheduled-storage]
    runs-on: ubuntu-24.04
    # Bundle assembly. No proof load and no database: 15 min covers checkout,
    # the artifact download, exact per-leg assembly, verification, and retention.
    # The needs list fails this job when any leg fails. Partial job reruns may
    # reuse same-run streams from prior attempts; missing legs cannot verify.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download proof streams
        uses: actions/download-artifact@v4
        with:
          pattern: scheduled-proof-streams-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/proof-streams
          merge-multiple: false
      - name: Assemble hosted proof bundle
        run: |
          python3 scripts/lib/postgres_scheduled_runner.py \
            --assemble-proof-streams "${RUNNER_TEMP}/proof-streams" \
            --output-proof-bundle "${RUNNER_TEMP}/proof-bundle"
      - name: Verify hosted proof bundle
        run: python3 scripts/lib/postgres_scheduled_runner.py --verify-proof-bundle "${RUNNER_TEMP}/proof-bundle"
      - name: Retain hosted proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-scheduled-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof-bundle/manifest.json
            ${{ runner.temp }}/proof-bundle/artifact_sources.json
            ${{ runner.temp }}/proof-bundle/admin.jsonl
            ${{ runner.temp }}/proof-bundle/completion.jsonl
            ${{ runner.temp }}/proof-bundle/reachability.jsonl
            ${{ runner.temp }}/proof-bundle/secret_lines.jsonl
            ${{ runner.temp }}/proof-bundle/crossplane.jsonl
            ${{ runner.temp }}/proof-bundle/infra_inventory.jsonl
            ${{ runner.temp }}/proof-bundle/disposable_gate.jsonl
            ${{ runner.temp }}/proof-bundle/disposable_query.jsonl
            ${{ runner.temp }}/proof-bundle/disposable_storage.jsonl
            ${{ runner.temp }}/proof-bundle/ack_family.jsonl
            ${{ runner.temp }}/proof-bundle/claim.jsonl
            ${{ runner.temp }}/proof-bundle/liveness.jsonl
            ${{ runner.temp }}/proof-bundle/fanout.jsonl
            ${{ runner.temp }}/proof-bundle/search.jsonl
            ${{ runner.temp }}/proof-bundle/readiness.jsonl
            ${{ runner.temp }}/proof-bundle/containerimage.jsonl
            ${{ runner.temp }}/proof-bundle/freshness_links_scale.jsonl
            ${{ runner.temp }}/proof-bundle/freshness_links_a.jsonl
            ${{ runner.temp }}/proof-bundle/freshness_links_b.jsonl
          if-no-files-found: error
          retention-days: 14
