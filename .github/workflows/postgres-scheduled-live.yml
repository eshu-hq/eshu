      - name: Upload bulk proof streams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-proof-streams-bulk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/crossplane.jsonl
            ${{ runner.temp }}/infra_inventory.jsonl
            ${{ runner.temp }}/disposable_gate.jsonl
            ${{ runner.temp }}/disposable_query.jsonl
            ${{ runner.temp }}/disposable_storage.jsonl
            ${{ runner.temp }}/claim.jsonl
            ${{ runner.temp }}/liveness.jsonl
            ${{ runner.temp }}/fanout.jsonl
            ${{ runner.temp }}/search.jsonl
            ${{ runner.temp }}/readiness.jsonl
            ${{ runner.temp }}/containerimage.jsonl
          if-no-files-found: error
          retention-days: 14
  scheduled-aggregate:
    needs: [scheduled-setup, scheduled-freshness-scale, scheduled-freshness-a, scheduled-freshness-b, scheduled-ack, scheduled-bulk]
    runs-on: ubuntu-latest
    # Bundle assembly. No proof load and no database: 15 min covers checkout,
    # the six artifact downloads, bundle verification, and retention. The
    # needs list fails this job when any leg fails, so a partial stream set
    # can never verify or retain.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download proof streams
        uses: actions/download-artifact@v4
        with:
          pattern: scheduled-proof-streams-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-bundle
          merge-multiple: true
      - name: Verify hosted proof bundle
        run: python3 scripts/lib/postgres_scheduled_runner.py --verify-proof-bundle "${RUNNER_TEMP}/proof-bundle"
      - name: Retain hosted proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-scheduled-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof-bundle/manifest.json
            ${{ runner.temp }}/proof-bundle/crossplane.jsonl
            ${{ runner.temp }}/proof-bundle/infra_inventory.jsonl
            ${{ runner.temp }}/proof-bundle/disposable_gate.jsonl
            ${{ runner.temp }}/proof-bundle/disposable_query.jsonl
            ${{ runner.temp }}/proof-bundle/disposable_storage.jsonl
            ${{ runner.temp }}/proof-bundle/ack_family.jsonl
            ${{ runner.temp }}/proof-bundle/claim.jsonl
            ${{ runner.temp }}/proof-bundle/liveness.jsonl
            ${{ runner.temp }}/proof-bundle/fanout.jsonl
            ${{ runner.temp }}/proof-bundle/search.jsonl
            ${{ runner.temp }}/proof-bundle/readiness.jsonl
            ${{ runner.temp }}/proof-bundle/containerimage.jsonl
            ${{ runner.temp }}/proof-bundle/freshness_links_scale.jsonl
            ${{ runner.temp }}/proof-bundle/freshness_links_a.jsonl
            ${{ runner.temp }}/proof-bundle/freshness_links_b.jsonl
          if-no-files-found: error
          retention-days: 14
