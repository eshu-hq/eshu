name: Scheduled PostgreSQL Live Proofs

# #7533: exact selected proofs run daily, on manual dispatch, and for PRs
# changing the enrolled proof. The live job is not a universally required check.
# #8617 step 7: the suite runs sharded across parallel jobs sharing one
# digest-pinned PostgreSQL 18.6 image. The setup job checks enrollment and
# records the manifest from its own same-image service (SELECT version() is
# identical across instances of one digest). Six proof legs each create fresh
# databases exactly as the serial suite did: the freshness scale leg keeps the
# scale fixture and the 30m-deadline scale proofs, freshness chunks A/B split
# the remaining files 9/9, ACK stays whole, and the bulk leg runs every other
# family serially sharing one warm build cache; #9488 moved the six root
# storage package families to their own storage leg. The aggregate job downloads
# every leg stream, verifies the bundle, and retains it. Measured walls from
# run 39339606297 (success): ACK 22.4m, freshness_links 45.7m, bulk families
# ~16m of tests; per-test artifact timings put the scale chunk at ~16.6m, chunk
# A at ~5.7m, and chunk B at ~4.3m. Acceptance (#8617 step 7, as amended
# 2026-10-20): slowest leg under 35 minutes; measured 32m20s in run 39421484741.
on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-scheduled-live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  scheduled-setup:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'scheduled-setup') }}
    runs-on: ubuntu-24.04
    # Enrollment gate and manifest writer. No proof load: 15 min covers
    # checkout, module pre-warm, the three negative-case suites, and the
    # manifest write with margin at several times the measured ~5 min.
    timeout-minutes: 15
    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: eshu
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eshu -d eshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Check exact enrollment and negative cases
        run: |
          python3 scripts/test-postgres-scheduled-runner.py
          python3 scripts/test-postgres-scheduled-rerun.py
          python3 scripts/test-postgres-scheduled-matrix.py
          python3 scripts/test-postgres-scheduled-fragments.py
          python3 scripts/test-postgres-scheduled-ledger-policy.py
          python3 scripts/lib/postgres_scheduled_runner.py
      - name: Record hosted proof manifest
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          reviewed_head_sha="${PR_HEAD_SHA:-$checkout_sha}"
          postgres_identity="$(docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -At -U eshu -d postgres -c 'SELECT version()')"
          python3 scripts/lib/postgres_scheduled_runner.py \
            --write-manifest "${RUNNER_TEMP}/manifest.json" \
            --event "${GITHUB_EVENT_NAME}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --reviewed-head-sha "$reviewed_head_sha" \
            --checkout-sha "$checkout_sha" \
            --event-sha "${GITHUB_SHA}" \
            --backend-identity "$postgres_identity"
      - name: Upload hosted proof manifest
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-proof-streams-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14
  scheduled-freshness-scale:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'scheduled-freshness-scale') }}
    runs-on: ubuntu-24.04
    # Scale chunk: the 30m-deadline scale proofs plus the retention-timing
    # template build and the scale fixture setup, isolated from the chunks.
    # Measured tests ~16.6m; 45 min covers the fixture load, the timing
    # build, and a cold links-package build with margin.
    timeout-minutes: 45
    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: eshu
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eshu -d eshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Create fresh freshness scale database
        run: docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_freshness_scheduled'
      - name: Run freshness scale proofs
        working-directory: go
        env:
          ESHU_POSTGRES_TEST_DSN: postgres://eshu:change-me@localhost:15432/eshu_freshness_scheduled?sslmode=disable
          ESHU_7127_W11_COST: "1"
          ESHU_RETENTION_TIMING_DSN: postgres://eshu:change-me@localhost:15432/eshu_freshness_scheduled?sslmode=disable
          ESHU_RETENTION_TIMING_LABEL: "freshness-links-scheduled"
          ESHU_RETENTION_TIMING_FIXTURES: "link"
          ESHU_RETENTION_TIMING_FIXTURE: "link"
          ESHU_RETENTION_TIMING_MODE: "run"
          ESHU_CHANGED_SINCE_LINK_SCALE_DSN: postgres://eshu:change-me@localhost:15432/eshu_freshness_scale?sslmode=disable
          ESHU_CHANGED_SINCE_LINK_SCALE_BASE_REF: "HEAD"
          ESHU_CHANGED_SINCE_LINK_SCALE_ROUNDS: "1"
          ESHU_CHANGED_SINCE_LINK_SCALE_VALID_ROUNDS: "1"
          ESHU_CHANGED_SINCE_LINK_SCALE_DEADLINE: "30m"
          ESHU_CHANGED_SINCE_LINK_SCALE_PROOF: "p3"
        run: |
          set -euo pipefail
          test -z "${GOFLAGS:-}"
          test -z "${GOWORK:-}"
          effective_config="$(go env GOFLAGS GOWORK)"
          test -z "$effective_config"
          proof_status="$(git -C .. status --porcelain --untracked-files=all)"
          test -z "$proof_status"
          ESHU_RETENTION_TIMING_MODE=build go test -race -p=1 -count=1 -timeout=10m ./internal/storage/postgres/freshness/links -run '^TestRetentionTimingP8$'
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'DROP DATABASE IF EXISTS eshu_freshness_scale WITH (FORCE)'
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_freshness_scale'
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -q -U eshu -d eshu_freshness_scale < internal/storage/postgres/migrations/001_ingestion_scopes.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -q -U eshu -d eshu_freshness_scale < internal/storage/postgres/migrations/002_scope_generations.sql
          python3 -c 'import re; path="internal/storage/postgres/migrations/003_fact_records.sql"; statements=[s.strip() for s in open(path).read().split(";")]; keep=[s for s in statements if s and not re.match(r"(?is)^(--[^\n]*\n\s*)*CREATE\s+(UNIQUE\s+)?INDEX", s)]; print(";\n".join(keep) + ";")' | docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -q -U eshu -d eshu_freshness_scale
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -q -U eshu -d eshu_freshness_scale < internal/storage/postgres/migrations/136_changed_since_link_ledger.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -q -U eshu -d eshu_freshness_scale < internal/storage/postgres/freshness/links/testdata/7127-link-writer-fixture.sql
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U eshu -d eshu_freshness_scale -c "CREATE INDEX IF NOT EXISTS fact_records_scope_generation_idx ON fact_records (scope_id, generation_id, fact_kind, observed_at DESC)"
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U eshu -d eshu_freshness_scale -c "CREATE INDEX IF NOT EXISTS fact_records_scope_generation_keyset_idx ON fact_records (scope_id, generation_id, observed_at, fact_id)"
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U eshu -d eshu_freshness_scale -c 'ANALYZE'
          go test -json -race -p=1 -count=1 -timeout=30m ./internal/storage/postgres/freshness/links -run '^(TestLinkScaleEvidence|TestLinkScaleProof|TestRetentionTimingCloneIsDropped|TestRetentionTimingP8)$' | tee "${RUNNER_TEMP}/freshness_links_scale.jsonl"
          python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/freshness_links_scale.jsonl" --group freshness_links_scale
          effective_config="$(go env GOFLAGS GOWORK)"
          test -z "$effective_config"
          proof_status="$(git -C .. status --porcelain --untracked-files=all)"
          test -z "$proof_status"
      - name: Upload freshness scale proof stream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-proof-streams-freshness-scale-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/freshness_links_scale.jsonl
          if-no-files-found: error
          retention-days: 14
  scheduled-freshness-a:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'scheduled-freshness-a') }}
    runs-on: ubuntu-24.04
    # Chunk A: 9 files / 33 tests, measured ~5.7m. 25 min covers a cold
    # links-package build with wide margin.
    timeout-minutes: 25
    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: eshu
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eshu -d eshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Create fresh freshness chunk A database
        run: docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_freshness_a'
      - name: Run freshness chunk A proofs
        working-directory: go
        env:
          ESHU_POSTGRES_TEST_DSN: postgres://eshu:change-me@localhost:15432/eshu_freshness_a?sslmode=disable
          ESHU_7127_W11_COST: "1"
        run: |
          set -euo pipefail
          test -z "${GOFLAGS:-}"
          test -z "${GOWORK:-}"
          effective_config="$(go env GOFLAGS GOWORK)"
          test -z "$effective_config"
          proof_status="$(git -C .. status --porcelain --untracked-files=all)"
          test -z "$proof_status"
          go test -json -race -p=1 -count=1 -timeout=10m ./internal/storage/postgres/freshness/links -run '^(TestAckJournalGateAndJournalPassExcludeEachOther|TestActivatingGenerationChainWaitTimesOut|TestBackfillChainWaitTimesOut|TestChainBreakKeepsStateThenIncremental|TestCursorHeldReturnsRetryWithoutWaiting|TestDeltaWithoutRootAndPrunedBeforeLink|TestDigestVersionChangeReRootsTheScope|TestFailingLinkIsPoisonedAfterMaxAttempts|TestGenerationLockedIsRetryable|TestJournalBackfillWalksRetainedChainInOrder|TestJournalPassIsExclusiveAcrossReplicas|TestJournalSweeperJournalsActiveGenerationsWithUnknownPrior|TestJournalSweeperLockWaitIsBounded|TestJournalSweeperSkipsAGenerationRetentionHoldsAndJournalsItNextPass|TestLedgerSchemaHasNoForeignKeys|TestLinkCostW11|TestLinkFenceOneWinnerPerActivation|TestLinkKilledMidStatementRerunsToIdenticalRows|TestLinkRootThenIncrementalStateEqualsAggregate|TestLockTimeoutDoesNotLeaveTheTransaction|TestOrphanScopeRowsAreDeletedUnlessLinking|TestPriorChainWaitTimesOut|TestRecordFailureSkipsAHeldCursor|TestRetentionActivationAboveCursorP4|TestRetentionBoundP3|TestRetentionCountsP5|TestRetentionRowLimitDoesNotStarveLedgerHeavyGenerations|TestRetentionRowLimitP5|TestRetentionRuleP1|TestRetentionStatementPlanShape|TestRetryErrorIsRetryable|TestSlotBusyBlocksFullLinksOnly|TestStaleFailureDoesNotCountAgainstANewerHead|TestStatsReportsBacklogAndLag|TestTransactionDeadlineEndsAStalledLink)$' | tee "${RUNNER_TEMP}/freshness_links_a.jsonl"
          python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/freshness_links_a.jsonl" --group freshness_links_a
          effective_config="$(go env GOFLAGS GOWORK)"
          test -z "$effective_config"
          proof_status="$(git -C .. status --porcelain --untracked-files=all)"
          test -z "$proof_status"
      - name: Upload freshness chunk A proof stream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-proof-streams-freshness-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/freshness_links_a.jsonl
          if-no-files-found: error
          retention-days: 14
  scheduled-freshness-b:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'scheduled-freshness-b') }}
    runs-on: ubuntu-24.04
    # Chunk B: 9 files / 21 tests, measured ~4.3m. 25 min covers a cold
    # links-package build with wide margin.
    timeout-minutes: 25
    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: eshu
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
