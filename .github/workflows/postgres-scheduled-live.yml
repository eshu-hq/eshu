          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Create fresh freshness chunk B database
        run: docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U eshu -d postgres -c 'CREATE DATABASE eshu_freshness_b'
      - name: Run freshness chunk B proofs
        working-directory: go
        env:
          ESHU_POSTGRES_TEST_DSN: postgres://eshu:change-me@localhost:15432/eshu_freshness_b?sslmode=disable
        run: |
          set -euo pipefail
          test -z "${GOFLAGS:-}"
          test -z "${GOWORK:-}"
          effective_config="$(go env GOFLAGS GOWORK)"
          test -z "$effective_config"
          proof_status="$(git -C .. status --porcelain --untracked-files=all)"
          test -z "$proof_status"
          go test -json -race -p=1 -count=1 -timeout=10m ./internal/storage/postgres/freshness/links -run '^(TestBackfillEndsTheChainAtAHeldGeneration|TestBackfillInsertFencesItsGeneration|TestGenerationLockChainWaitRaceShape|TestIncrementalLinkPlanClassUnderPlantedStatistics|TestIncrementalLinkSurvivesStaleScopeStatistics|TestLinkDeltaChainReadUsesPrimaryKey|TestLinkFailsWhenAFenceBreachSkipsADelete|TestLinkStatementPlanShape|TestLinkWriterDoesNotWaitOnRetentionInFlight|TestOrphansCountsPlantedRows|TestPriorHeldByRetentionIsGenerationLocked|TestPriorLockWithACommittedUpdaterDoesNotWait|TestRebaseLinkPlanShape|TestRebaseOnPrunedPriorWritesOnlyChangedKeys|TestRekeyLinkIsBoundedUnderAbsentStatistics|TestRetentionAndOrphanPurgeDoNotBlock|TestRetentionDoesNotWaitOnALinkInFlight|TestRetentionRacesLinkWriter|TestRetentionSkipsTheGenerationALinkHolds|TestSplitLedgerDeleteLeaksHeadlessDeltas|TestStalledLockDiffersFromShippedOnlyByTheStall)$' | tee "${RUNNER_TEMP}/freshness_links_b.jsonl"
          python3 ../scripts/lib/postgres_scheduled_runner.py --events "${RUNNER_TEMP}/freshness_links_b.jsonl" --group freshness_links_b
          effective_config="$(go env GOFLAGS GOWORK)"
          test -z "$effective_config"
          proof_status="$(git -C .. status --porcelain --untracked-files=all)"
          test -z "$proof_status"
      - name: Upload freshness chunk B proof stream
        if: always()
