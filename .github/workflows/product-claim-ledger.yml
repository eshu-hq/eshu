name: Product Claim Ledger

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/public/**
      - specs/product-claims.v1.yaml
      - specs/capability-catalog.v1.yaml
      - specs/capability-matrix.v1.yaml
      - specs/capability-matrix/**
      - go/internal/capabilitycatalog/**
      - go/cmd/capability-inventory/**
      - scripts/ci/install-apt-packages.sh
      - scripts/ci/go-mod-download-retry.sh
      - .github/workflows/product-claim-ledger.yml
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

concurrency:
  group: ci-leaf-product-claim-ledger-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  verify-product-claims:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'verify-product-claims') }}
    name: Verify product claim ledger
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false

      - name: Install workflow test dependencies
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a product-claim
      # ledger drift that never ran (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run product claim workflow contract mirror
        run: scripts/test-product-claim-ledger-workflow.sh

      # -mode product-claims runs only the product claim ledger guard (ledger
      # <-> marker <-> proof chain, plus the live issue-state check below). It
      # skips the capability-state and collector-state marker scans that
      # -mode docs also performs, because mcp-schema-drift.yml already runs
      # the full -mode docs scan on every PR; repeating that scan here just to
      # reach the ledger check wasted CI time as the docs tree grew (#4073).
      # The live issue-state check is bounded (30s) and PR-safe: it always
      # runs here (pull_request, push, schedule, and workflow_dispatch all hit
      # this one step) using the read-only Actions token.
      - name: Run product-claim ledger verify
        working-directory: go
        shell: bash
        env:
          ESHU_VERIFY_PRODUCT_CLAIM_ISSUES_LIVE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          go run ./cmd/capability-inventory -mode product-claims 2>&1 | tee /tmp/product-claims.log

      - name: Upload product claim report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-claim-ledger-report
          path: /tmp/product-claims.log
          if-no-files-found: warn
