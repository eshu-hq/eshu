name: Race Graph Writes

on:
  # Merge-queue entries (#7111): every job runs, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - "go/cmd/ingester/**"
      - "go/cmd/projector/**"
      - "go/internal/storage/cypher/**"
      - "go/internal/storage/nornicdb/**"
      - "go/internal/reducer/**"
      - "go/internal/projector/**"
      - "go/internal/correlation/**"
      - "go/internal/content/shape/**"
      - "go/internal/relationships/**"
      - "scripts/ci/go-mod-download-retry.sh"
      - ".github/workflows/race-graph-writes.yml"
  push:
    branches:
      - main
    paths:
      - "go/cmd/ingester/**"
      - "go/cmd/projector/**"
      - "go/internal/storage/cypher/**"
      - "go/internal/storage/nornicdb/**"
      - "go/internal/reducer/**"
      - "go/internal/projector/**"
      - "go/internal/correlation/**"
      - "go/internal/content/shape/**"
      - "go/internal/relationships/**"
      - "scripts/ci/go-mod-download-retry.sh"
      - ".github/workflows/race-graph-writes.yml"
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a race-detector
      # red that never ran a test (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run graph-write tests with race detector
        working-directory: go
        run: go test -race -count=1 -timeout 600s ./cmd/ingester/... ./cmd/projector/... ./internal/storage/cypher/... ./internal/storage/nornicdb/... ./internal/reducer/... ./internal/projector/... ./internal/correlation/... ./internal/content/shape/... ./internal/relationships/...
