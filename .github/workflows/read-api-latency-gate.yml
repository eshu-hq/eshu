name: Read API Latency Gate

# Issue #6797: backend-backed p95 latency benchmark for every no-arg GET read
# route, gated so a regression like #6793 (infra resource aggregate
# full-graph scan) or #6794 (status/readiness routes paying an expensive
# per-scope activeFactWorkItemsCTE query) cannot merge without this job going
# red. See go/cmd/read-api-latency-gate/README.md for what it seeds and
# measures. Two budget tables gate it: the latency ceilings in
# testdata/benchmarks/read-api-route-budgets.txt (the SLO contract; they catch
# catastrophic regressions and are NOT what fails a plan-shape regression at
# this seed scale) and the per-request Postgres work budgets in
# testdata/benchmarks/read-api-route-work-budgets.txt (the regression-sensitive
# mechanism, rendered from GREEN reports by
# scripts/refresh-read-api-work-budgets.sh).
#
# Merge order: this gate is in the required-gates aggregate. It fails on a base
# where the infra read model (#6793) is absent, because /infra/resources/count
# and /inventory then take the graph path and time out at the API's 10s
# deadline against the seeded 1.2M-node graph. Merge #6793's change first; the
# gate must be green on a tree that contains it before this row is required.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      # cmd/api compiles 363 of the repo's 558 internal packages (go list
      # -deps ./cmd/api, 2026-09) — a narrower,
      # hand-picked list drifts silently as eshu-api's own imports grow.
      # "go/**" mirrors the specs/ci-gates.v1.yaml registry row exactly
      # (kept in lockstep — verify with scripts/verify-ci-gates-registry.sh
      # --drift) and the same whole-module-compile-in problem the
      # golden-corpus-filter-exhaustive gate's own trigger solves the same
      # way.
      - 'go/**'
      - 'testdata/benchmarks/read-api-route-budgets.txt'
      - 'testdata/benchmarks/read-api-route-work-budgets.txt'
      - 'scripts/verify-read-api-latency-gate.sh'
      - 'scripts/refresh-read-api-work-budgets.sh'
      - 'scripts/test-refresh-read-api-work-budgets.sh'
      - 'scripts/compare-backend-latency.sh'
      - 'scripts/test-compare-backend-latency.sh'
      - 'scripts/lib/test-compare-backend-latency-report.json'
      - 'scripts/lib/live-gate-lock.sh'
      - 'scripts/lib/golden-corpus-host-helpers.sh'
      - 'scripts/lib/compose_verification_runtime_common.sh'
      - 'scripts/ci/install-apt-packages.sh'
      - 'scripts/ci/go-mod-download-retry.sh'
      - 'docker-compose.yaml'
      - 'docker-compose.read-api-latency-gate.yaml'
      - '.github/workflows/read-api-latency-gate.yml'
  workflow_dispatch:
    # Manual trigger, for calibrating budgets on the CI runner class. There is
    # deliberately no api_ref input: an earlier version built an
    # operator-supplied ref here to produce a RED run on the runner class, but
    # that checks out and executes untrusted code in a workflow whose trigger
    # can write to the default branch's Actions cache scope -- exactly the
    # shape CodeQL's actions/cache-poisoning/poisonable-step alert #1099
    # flagged. Its own "Correct Usage" remediation is to never run untrusted
    # code in that context at all, and the runner-injected cache token makes
    # which actions the job declares irrelevant, so isolating the build into
    # its own job (tried and reverted) does not close it. The RED evidence
    # this gate needs does not depend on CI building an arbitrary ref: see
    # "Producing a RED run" in
    # docs/public/reference/local-testing/read-api-latency-gate.md for the
    # local command, and the three RED runs already recorded verbatim in
    # docs/internal/evidence/6797-read-api-work-metric-shim.md.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The work budget table's generator has a test mirror that the heavy job below
  # never runs (it only executes the live gate). It is cheap and needs no Docker,
  # so a change to the jq formula fails here instead of silently going unproven.
  static-mirror:
    name: static-mirror (work budget refresh)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install ripgrep and jq
        run: scripts/ci/install-apt-packages.sh ripgrep jq

      - name: Test the work budget refresh script
        run: bash scripts/test-refresh-read-api-work-budgets.sh

  # #6965 phase 6: scripts/compare-backend-latency.sh reads two -latency-report
  # JSON legs and never runs the live gate itself, so its formulas and
  # identity-mismatch/non-comparable refusals get the same hermetic
  # static-mirror treatment as the work-budget-refresh job above, in a
  # separate job so specs/ci-gates.v1.yaml's registry row for it (
  # backend-latency-compare-mirror) can name its own job.
  static-mirror-backend-latency-compare:
    name: static-mirror (backend latency comparator)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install ripgrep and jq
        run: scripts/ci/install-apt-packages.sh ripgrep jq

      - name: Test the backend latency comparator script
        run: bash scripts/test-compare-backend-latency.sh

  latency-gate:
    name: latency-gate (nornicdb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fixed (not PID-derived) so the log-dump and teardown steps below can
      # target the exact same Compose project the run script used — the
      # `-p` project name is required for `docker compose logs`/`down` to
      # find containers created under a non-default project. A GHA runner is single-tenant per job, so a fixed name
      # cannot collide with another concurrent run.
      GATE_COMPOSE_PROJECT: eshu-read-api-latency-gate-ci
      ESHU_GRAPH_BACKEND: nornicdb
      GATE_NEO4J_PASSWORD: change-me
      GATE_POSTGRES_PASSWORD: change-me
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep

      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run read-API latency gate
        env:
          GATE_WORK_REPORT: ${{ runner.temp }}/read-api-work-report.json
        run: bash scripts/verify-read-api-latency-gate.sh

      - name: Upload per-route work report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-api-work-report
          path: ${{ runner.temp }}/read-api-work-report.json
          if-no-files-found: ignore

      - name: Show preserved eshu-api log on failure
        if: failure()
        run: cat "${TMPDIR:-/tmp}/read-api-latency-gate-api.log" 2>/dev/null || echo "no preserved eshu-api log found"

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -p "${GATE_COMPOSE_PROJECT}" -f docker-compose.yaml -f docker-compose.read-api-latency-gate.yaml logs --tail=200 || true

      - name: Tear down Docker services
        if: always()
        run: docker compose -p "${GATE_COMPOSE_PROJECT}" -f docker-compose.yaml -f docker-compose.read-api-latency-gate.yaml down -v || true
