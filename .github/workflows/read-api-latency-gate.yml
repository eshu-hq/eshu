name: Read API Latency Gate

# Issue #6797: backend-backed p95 latency benchmark for every no-arg GET read
# route, gated so a regression like #6793 (infra resource aggregate
# full-graph scan) or #6794 (status/readiness routes paying an expensive
# per-scope activeFactWorkItemsCTE query) cannot merge without this job going
# red. See go/cmd/read-api-latency-gate/README.md for what it seeds and
# measures. Two budget tables gate it: the latency ceilings in
# testdata/benchmarks/read-api-route-budgets.txt (the SLO contract; they catch
# catastrophic regressions and are NOT what fails a plan-shape regression at
# this seed scale) and the per-request Postgres work budgets in
# testdata/benchmarks/read-api-route-work-budgets.txt (the regression-sensitive
# mechanism, rendered from GREEN reports by
# scripts/refresh-read-api-work-budgets.sh).
#
# Merge order: this gate is in the required-gates aggregate. It fails on a base
# where the infra read model (#6793) is absent, because /infra/resources/count
# and /inventory then take the graph path and time out at the API's 10s
# deadline against the seeded 1.2M-node graph. Merge #6793's change first; the
# gate must be green on a tree that contains it before this row is required.

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  # Merge-queue entries (#7111): every job runs, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  # Main has no merge queue since 2026-10-16 (#8288): inert until re-enabled.
  merge_group:
    types: [checks_requested]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      status_diagnostic:
        description: Capture sanitized status diagnostics for the Neo4j scale run
        type: boolean
        default: false
    # Manual trigger, for calibrating budgets on the CI runner class. There is
    # deliberately no api_ref input: an earlier version built an
    # operator-supplied ref here to produce a RED run on the runner class, but
    # that checks out and executes untrusted code in a workflow whose trigger
    # can write to the default branch's Actions cache scope -- exactly the
    # shape CodeQL's actions/cache-poisoning/poisonable-step alert #1099
    # flagged. Its own "Correct Usage" remediation is to never run untrusted
    # code in that context at all, and the runner-injected cache token makes
    # which actions the job declares irrelevant, so isolating the build into
    # its own job (tried and reverted) does not close it. The RED evidence
    # this gate needs does not depend on CI building an arbitrary ref: see
    # "Producing a RED run" in
    # docs/public/reference/local-testing/read-api-latency-gate.md for the
    # local command, and the three RED runs already recorded verbatim in
    # docs/internal/evidence/6797-read-api-work-metric-shim.md.

concurrency:
  group: ci-leaf-read-api-latency-gate-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ESHU_CI_IMAGES: "1"
  POSTGRES_IMAGE: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  NEO4J_IMAGE: ghcr.io/eshu-hq/ci-neo4j-community@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
  ESHU_XX_IMAGE: ghcr.io/eshu-hq/ci-mirror-xx@sha256:0c6a569797744e45955f39d4f7538ac344bfb7ebf0a54006a0a4297b153ccf0f
  ESHU_GO_IMAGE: ghcr.io/eshu-hq/ci-mirror-golang@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
  ESHU_ALPINE_IMAGE: ghcr.io/eshu-hq/ci-mirror-alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d

jobs:
  queue-selection:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'queue-selection') }}
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: read-api-latency-gate.yml

  # Supported-backend scale/concurrency proof is a dedicated manual run.
  # Existing NornicDB PR, push and merge-group checks retain their identity.
  methodology-scale:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'methodology-scale')) && (github.event_name == 'workflow_dispatch') }}
    needs: queue-selection
    name: methodology scale (neo4j)
    runs-on: ubuntu-24.04
    # Run 38032713508 reached its serial report after 30m8s from first job
    # setup log, then the 30m job limit canceled the concurrent stage. Ten
    # operations (#7009 pilots included) x ceil(20 requests / 4 workers) x
    # 30s allow 25m more, plus 7m20s cleanup/headroom: 65m leaves about
    # 2m30s. That is the longest deadline the merge-queue publisher budget
    # admits (selection 10m + payload + 5m margin against the 80m await, and
    # the 85m aggregate job under the 90m check-response budget), so the
    # four added pilots consume its whole margin. A slower run fails here
    # and is retried by hand; it never blocks a merge.
    timeout-minutes: 65
    env:
      GATE_COMPOSE_PROJECT: eshu-methodology-scale-ci
      ESHU_GRAPH_BACKEND: neo4j
      GATE_NEO4J_PASSWORD: change-me
      GATE_POSTGRES_PASSWORD: change-me
      GATE_CONCURRENT_WORKERS: 4
      GATE_CONCURRENT_REQUESTS: 20
      GATE_RUNS: 3
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run scale and concurrent HTTP/MCP proof
        env:
          GATE_WORK_REPORT: ${{ runner.temp }}/methodology-work.json
          GATE_LATENCY_REPORT: ${{ runner.temp }}/methodology-latency.json
          GATE_CONCURRENT_REPORT: ${{ runner.temp }}/methodology-concurrency.json
          GATE_STATUS_DIAGNOSTIC_DIR: ${{ inputs.status_diagnostic && format('{0}/methodology-status-diagnostics', runner.temp) || '' }}
        run: |
          resource_report="${RUNNER_TEMP}/methodology-resources.txt"
          observer_stop="${RUNNER_TEMP}/.methodology-resource-observer-stop"
          rm -f "$observer_stop"
          {
            printf 'logical_cpus='; nproc
            printf 'start_load='; cat /proc/loadavg
          } > "$resource_report"
          (
            while [[ ! -e "$observer_stop" ]]; do
              date -u +%FT%TZ
              cat /proc/loadavg
              owned_ids="$(docker ps -q --filter "label=com.docker.compose.project=${GATE_COMPOSE_PROJECT}")"
              if [[ -n "$owned_ids" ]]; then
                mapfile -t containers <<< "$owned_ids"
                timeout 20s docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} memory={{.MemUsage}}' "${containers[@]}"
              fi
              for _ in {1..10}; do
                [[ ! -e "$observer_stop" ]] || break
                sleep 1
              done
            done
          ) >> "$resource_report" 2>&1 &
          observer=$!
          trap 'touch "$observer_stop"; kill "$observer" 2>/dev/null || true' EXIT
          gate_status=0
          bash scripts/verify-read-api-latency-gate.sh || gate_status=$?
          touch "$observer_stop"
          observer_status=0
          wait "$observer" || observer_status=$?
          trap - EXIT
          rm -f "$observer_stop"
          if [[ "$observer_status" -ne 0 ]]; then
            printf 'methodology resource observer failed: exit %s\n' "$observer_status" >&2
            [[ "$gate_status" -ne 0 ]] || gate_status=1
          fi
          for service in postgres neo4j; do
            if ! rg -q "^${GATE_COMPOSE_PROJECT}-${service}-[0-9]+ CPU=[0-9]+([.][0-9]+)?% memory=[0-9]" "$resource_report"; then
              printf 'methodology resource observer recorded no %s CPU/memory sample\n' "$service" >&2
              [[ "$gate_status" -ne 0 ]] || gate_status=1
            fi
          done
          exit "$gate_status"
      - name: Archive scale proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methodology-scale-${{ github.sha }}
          path: ${{ runner.temp }}/methodology-*
          if-no-files-found: error
      - name: Dump supported-backend logs on failure
        if: failure()
        run: bash scripts/ci/compose.sh -p "$GATE_COMPOSE_PROJECT" -f docker-compose.neo4j.yml -f docker-compose.read-api-latency-gate.yaml -- logs --tail=200 || true
      - name: Tear down supported-backend services
        if: always()
        run: bash scripts/ci/compose.sh -p "$GATE_COMPOSE_PROJECT" -f docker-compose.neo4j.yml -f docker-compose.read-api-latency-gate.yaml -- down -v || true

  # The work budget table's generator has a test mirror that the heavy job below
  # never runs (it only executes the live gate). It is cheap and needs no Docker,
  # so a change to the jq formula fails here instead of silently going unproven.
  static-mirror:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'static-mirror') }}
    needs: queue-selection
    name: static-mirror (work budget refresh)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (work budget refresh)')) }}
        uses: actions/checkout@v5

      - name: Install ripgrep and jq
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (work budget refresh)')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep jq
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test the work budget refresh script
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (work budget refresh)')) }}
        run: bash scripts/test-refresh-read-api-work-budgets.sh && bash scripts/test-extend-read-api-work-budgets.sh && bash scripts/test-methodology-scale-resource-observer.sh && python3 scripts/test-status-diagnostic-artifacts.py && python3 scripts/test-status-diagnostic-resources.py && bash scripts/test-status-diagnostic-runner.sh

  # #6965 phase 6: scripts/compare-backend-latency.sh reads two -latency-report
  # JSON legs and never runs the live gate itself, so its formulas and
  # identity-mismatch/non-comparable refusals get the same hermetic
  # static-mirror treatment as the work-budget-refresh job above, in a
  # separate job so specs/ci-gates.v1.yaml's registry row for it (
  # backend-latency-compare-mirror) can name its own job.
  static-mirror-backend-latency-compare:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'static-mirror-backend-latency-compare') }}
    needs: queue-selection
    name: static-mirror (backend latency comparator)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (backend latency comparator)')) }}
        uses: actions/checkout@v5

      - name: Install ripgrep and jq
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (backend latency comparator)')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep jq
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test the backend latency comparator script
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'static-mirror (backend latency comparator)')) }}
        run: bash scripts/test-compare-backend-latency.sh

  latency-gate:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'latency-gate') }}
    needs: queue-selection
    name: latency-gate (nornicdb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Fixed (not PID-derived) so the log-dump and teardown steps below can
      # target the exact same Compose project the run script used — the
      # `-p` project name is required for `docker compose logs`/`down` to
      # find containers created under a non-default project. A GHA runner is single-tenant per job, so a fixed name
      # cannot collide with another concurrent run.
      GATE_COMPOSE_PROJECT: eshu-read-api-latency-gate-ci
      ESHU_GRAPH_BACKEND: nornicdb
      GATE_NEO4J_PASSWORD: change-me
      GATE_POSTGRES_PASSWORD: change-me
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'latency-gate (nornicdb)')) }}
        uses: actions/checkout@v5

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'latency-gate (nornicdb)')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'latency-gate (nornicdb)')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'latency-gate (nornicdb)')) }}
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run read-API latency gate
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'latency-gate (nornicdb)')) }}
        env:
          GATE_WORK_REPORT: ${{ runner.temp }}/read-api-work-report.json
        run: bash scripts/verify-read-api-latency-gate.sh

      - name: Upload per-route work report
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'latency-gate (nornicdb)'))) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: read-api-work-report
          path: ${{ runner.temp }}/read-api-work-report.json
          if-no-files-found: ignore

      - name: Show preserved eshu-api log on failure
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'latency-gate (nornicdb)'))) && (failure()) }}
        run: cat "${TMPDIR:-/tmp}/read-api-latency-gate-api.log" 2>/dev/null || echo "no preserved eshu-api log found"

      - name: Dump service logs on failure
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'latency-gate (nornicdb)'))) && (failure()) }}
        run: bash scripts/ci/compose.sh -p "${GATE_COMPOSE_PROJECT}" -f docker-compose.yaml -f docker-compose.read-api-latency-gate.yaml -- logs --tail=200 || true

      - name: Tear down Docker services
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'latency-gate (nornicdb)'))) && (always()) }}
        run: bash scripts/ci/compose.sh -p "${GATE_COMPOSE_PROJECT}" -f docker-compose.yaml -f docker-compose.read-api-latency-gate.yaml -- down -v || true
