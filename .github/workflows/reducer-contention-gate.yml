name: Reducer Contention Gate

# Residual real-Postgres concurrency gate (issue #4124, R-15 of epic #4102).
#
# The deterministic replay framework runs credential-free and Docker-free, but
# by construction it cannot exercise the real `FOR UPDATE SKIP LOCKED` claim
# path, wall-clock lease expiry, or the per-claim attempt counter. This job
# keeps a small real-Postgres contention check for exactly those guarantees —
# the irreducible remainder replay does not subsume
# (docs/internal/design/4102-deterministic-replay-framework.md §10).
#
# It runs ONLY the TestReducerContentionGate* tests, not the whole
# storage/postgres package, so it asserts the deterministic guarantees and does
# not run the separately-tracked flaky conflict-fence proof.

on:
  # Merge-queue entries (#7111): every job runs, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  # On PRs, only spin Postgres when claim-path code could be affected. main runs
  # unconditionally above as the backstop, so a regression that reaches main via
  # an unfiltered path is still caught (the repo has no required-status-check
  # enforcement, so a skipped PR run never blocks merge).
  pull_request:
    paths:
      - "go/internal/storage/postgres/**"
      - "go/internal/reducer/**"
      - "go/internal/query/service_story_target_support*.go"
      - "schema/data-plane/postgres/**"
      - "scripts/ci/go-mod-download-retry.sh"
      - ".github/workflows/reducer-contention-gate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contention-gate:
    name: reducer contention gate
    runs-on: ubuntu-latest
    # main's runs of this job take 10-14 minutes (2026-09-26), so the old
    # 15-minute cap left no headroom and cancelled a PR run that added live
    # proofs (#6679). Each step keeps its own -timeout; this is job headroom.
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eshu
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eshu -d eshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a contention-gate
      # failure that never claimed a row (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run reducer contention gate
        working-directory: go
        env:
          ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_PROJECTOR_SUPERSESSION_PROOF_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_GENERATION_LIVENESS_PROOF_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_REDUCER_ACK_RECLAIM_PROOF_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_SUPERSEDED_GENERATION_PROOF_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_REQUIRE_ACCEPTANCE_MONOTONIC_PROOF: "1"
          ESHU_REQUIRE_SERVICE_LINEAGE_SCOPE_PROOF: "1"
          ESHU_REQUIRE_RETENTION_MIGRATED_SCHEMA_PROOF: "1"
        # TestReducerContentionGate* covers the claim/lease/fencing invariants and
        # the claim-batch latency guard (#4704); TestClaimBatchRankOnceRewrite runs
        # the #4703 rank-once candidate-set+order differential (0/0) against real
        # Postgres so a query-shape or O(N^2) regression on
        # reducer_queue_batch_query.go fails CI, not only a manual drain.
        # TestSignInPolicyConcurrencyGate runs the #4968 sign-in-policy
        # exactly-one-winner / no-lost-update row-lock proof against real
        # Postgres so the concurrency contract is proven in CI, not only when a
        # local DSN happens to be set.
        # TestReducerContentionGateCrossScopeReadiness* runs the #5709 real-queue
        # proof of the non-counting cross-scope readiness deferral: attempt_count
        # frozen across more claim/fail cycles than MaxAttempts, no durable write
        # while waiting, and convergence on producer activation or the elapsed
        # bound. A fake queue cannot establish any of it, which is why these live
        # here rather than beside the handler tests.
        # TestDeferredBackfillSharedScopeGenerationPublishesOneRowPerPartition
        # and TestDeferredBackfillDistinctScopesPublishOneRowEach run
        # the deferred-backfill shared-partition dup-key proofs: two repositories
        # sharing one (scope, generation) partition must publish exactly one
        # graph_projection_phase_state row and one deferred_backfill_partition_memo
        # row (not one per repo), while two repositories in distinct partitions
        # must still publish one row each. The regression is a real Postgres
        # ON CONFLICT DO UPDATE rejection (SQLSTATE 21000) when the batch upsert
        # carries duplicate conflict keys -- no fake DB enforces that constraint,
        # so this needs real Postgres too.
        # TestDeferredBackfillWithholdsPublication*, TestDeferredBackfillFanIn*,
        # TestDeferredBackfillCrashBetweenBatchesAndFanInConverges, and
        # TestFanInActiveGenerationMatchesCorpusLoader run the fan-in publication
        # proofs: a partition spans several evidence batches, so readiness and
        # the durable partition memo must be published only after every batch
        # commits, must be withheld entirely when a batch fails or is canceled,
        # and must be withheld for a generation that advanced mid-pass. A memo
        # row written for a half-committed partition suppresses that partition's
        # fact load on every later pass, so the failure is durable rather than
        # transient -- and only real Postgres transactions, real rollbacks, and
        # real advisory locks reproduce it.
        # TestActiveWorkSummaryMatchesStandaloneReads and
        # TestStatusActiveWorkQueriesPreserveSemantics (#6794) prove the status
        # snapshot's single active-work statement decodes to exactly what the
        # pre-change standalone reads return, and pin the stale-generation and
        # shared-projection backlog contract.
        # TestActiveFactWorkItemsFormsSelectTheSameRows keeps the per-row
        # active-work filter the drain EXISTS uses in step with the materialized
        # one. They need real Postgres because the parity lives in SQL
        # ordering, collation, and aggregation.
        # TestReducerConflictBlockageLeaseMixMatchesPreChangeJoin and
        # TestActiveWorkSummaryBlockageHashesLeasesOnce (#6794) pin the status
        # blockage filter: parity with the pre-change join over every lease
        # state, and a hashed lease set with no per-row rescan of eligible rows
        # or leases whether statistics are missing, current, or stale.
        # TestReducerQueueAckBatchFencesSupersededClaimLive runs the #6162
        # ack-reclaim lease-safety proof. It drives the Ifa expire-lease cell's
        # own UPDATE, so one work item genuinely carries two claim identities in
        # one ack batch, then proves the superseded claim alone acks nothing, the
        # batch carrying both acks the survivor and reports a claim rejection the
        # batch acker survives, and both pending orders resolve the same. The
        # regression it stops is a reducer that exits on an ordinary lease race
        # and leaves the row 'claimed' until the drain gate times out. Only real
        # Postgres expires a lease on the wall clock and applies the ack
        # statement's last_attempt_at fence.
        # TestSupersededGenerationIDs*AgainstPostgres runs the #7121
        # superseded-generation drain-lookup proofs: the lookup must return only
        # superseded generations and must defer to in-flight producers and
        # durable phase-repair rows. Only real Postgres executes that NOT EXISTS
        # safety predicate. Each test bootstraps its own private schema.
        # TestSharedProjectionAcceptance*Live and TestSharedIntentAcceptanceWriter*Live
        # (#6679) prove shared-projection acceptance is advance-only on
        # generation order: sequential and 4x50 lock-wait out-of-order writers,
        # a stored generation committed after the upsert's snapshot, the
        # ingested_at ordering key, legacy NULL-key rows resolved in the guard
        # (including a generation committed after the snapshot), reversed
        # 200-key batches with no 40P01, and the stale-write counter.
        # Only real READ COMMITTED row-lock rechecks and snapshots reproduce
        # them. ESHU_REQUIRE_ACCEPTANCE_MONOTONIC_PROOF makes an unset DSN fail
        # these tests here instead of skipping them.
        # TestGenerationRetentionStatementsPrepareAgainstMigratedSchemaLive and
        # TestGenerationRetentionPrunesMigratedSchemaLive (#6809) apply the real
        # bootstrap migrations to a private schema, prepare every generation
        # retention statement, and run a full prune with asserted row counts. A
        # hand-written fixture schema hid a missing table and a missing column
        # from the retention row-count query, so only the migrated schema can
        # catch that drift. ESHU_REQUIRE_RETENTION_MIGRATED_SCHEMA_PROOF makes an
        # unset DSN fail these tests here instead of skipping them.
        # TestGenerationRetentionContentPrunesDeleteExactRowsLive proves the three
        # content prunes delete exactly the rows only pruned generations hold, and
        # TestGenerationRetentionContentPrunesFinishWithoutPlannerStatisticsLive
        # fails if a prune's plan needs planner statistics: the earlier NOT EXISTS
        # shape rescanned the retained facts once per candidate key on a database
        # that had not been analyzed.
        # TestGenerationRetentionRowCountsAttributeSharedRowsOnceLive proves the
        # row count charges a content row shared by several pruned generations
        # to one of them, so each table's counts sum to the prunes' deletes.
        # The projector and generation-liveness proofs (#6738) run against the
        # same isolated PostgreSQL service; each test creates a private schema.
        # TestServiceMaterializationActiveIndexReplayConvergesLive,
        # TestServiceMaterializationWriterKeepsScopedLineagesLive, and
        # TestServiceChangedSinceResolvePicksAttributedNewestActiveLive, and
        # TestServiceChangedSinceBindsGrantToLineageScopeLive (#6475)
        # prove the service lineage is keyed by (scope_id, service_id): the
        # real bootstrap converges fresh and upgraded schemas, the scope_id
        # backfill attributes only witnessed rows, a tracked and an untracked
        # replay leave the rescoped index untouched while two scopes hold an
        # active generation for one service id, the writer supersedes only
        # within its scope, the changed-since resolve never serves the stale
        # unattributed row beside an active attributed one, and it binds the
        # caller's grant on each lineage row's scope_id. Only real unique indexes,
        # migrations, and SQL ordering reproduce them.
        # ESHU_REQUIRE_SERVICE_LINEAGE_SCOPE_PROOF makes an unset DSN fail these
        # tests here instead of skipping them. The timeout is 300s to hold their
        # four full bootstraps (about 32s under -race locally).
        # TestReducerContentionPostgresProofsRunInTheReducerContentionGate is
        # the hermetic guard that keeps every live PostgreSQL proof above, and
        # the DSNs they need, inside the -run filter below.
        run: go test ./internal/storage/postgres/ -run '^(TestReducerContentionGate|TestClaimBatchRankOnceRewrite|TestSignInPolicyConcurrencyGate|TestDeferredBackfillSharedScopeGenerationPublishesOneRowPerPartition|TestDeferredBackfillDistinctScopesPublishOneRowEach|TestDeferredBackfillWithholdsPublicationWhenSiblingBatch|TestDeferredBackfillPublishesOncePerPartitionAcrossBatches|TestDeferredBackfillFanIn|TestDeferredBackfillCrashBetweenBatchesAndFanInConverges|TestFanInActiveGenerationMatchesCorpusLoader|TestActiveWorkSummaryMatchesStandaloneReads|TestStatusActiveWorkQueriesPreserveSemantics|TestActiveFactWorkItemsFormsSelectTheSameRows|TestProjectorHeartbeatSupersessionPreservesActivePointer|TestProjectorHeartbeatRenewsLeaseWhileIngestionHoldsScope|TestProjectorAckDefersWhileIngestionHoldsScope|TestProjectorQueueRejectsReclaimedSameOwnerAttempt|TestProjectorQueueRejectsAttemptReclaimedDuringLockWait|TestProjectorCompletionDoesNotDeadlockSameGenerationCommit|TestPublishedGenerationRecommitIsIdempotentLive|TestFinalizedGenerationRecommitSkipsFactsLive|TestGenerationLivenessIntegration|TestSharedIntentGenerationPendingIndexLifecycleLive|TestReducerConflictBlockageLeaseMixMatchesPreChangeJoin|TestActiveWorkSummaryBlockageHashesLeasesOnce|TestReducerQueueAckBatchFencesSupersededClaimLive|TestSupersededGenerationIDsAgainstPostgres|TestSupersededGenerationIDsDefersToInFlightProducersAgainstPostgres|TestSupersededGenerationIDsDefersToPhaseRepairRowsAgainstPostgres|TestSharedProjectionAcceptance[A-Za-z]*Live|TestSharedIntentAcceptanceWriter[A-Za-z]*Live|TestServiceMaterializationActiveIndexReplayConvergesLive|TestServiceMaterializationWriterKeepsScopedLineagesLive|TestServiceChangedSinceResolvePicksAttributedNewestActiveLive|TestGenerationRetentionStatementsPrepareAgainstMigratedSchemaLive|TestGenerationRetentionPrunesMigratedSchemaLive|TestGenerationRetentionContentPrunesDeleteExactRowsLive|TestGenerationRetentionContentPrunesFinishWithoutPlannerStatisticsLive|TestGenerationRetentionRowCountsAttributeSharedRowsOnceLive|TestServiceChangedSinceBindsGrantToLineageScopeLive)' -race -count=1 -timeout 300s -v
      - name: Run story target-support semantics proof
        working-directory: go
        env:
          ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
        # TestServiceStoryTargetSupportSQLSemanticsLive (#6794) runs the story
        # target-support statements against a seeded fixture: only each scope's
        # own active generation counts, a repeated kind counts once, and the
        # observed_at tie order and the source-only rollup match the pre-change
        # statements. The parity lives in SQL, so it needs real Postgres.
        run: go test ./internal/query/ -run '^TestServiceStoryTargetSupportSQLSemanticsLive$' -race -count=1 -timeout 180s -v
