redIntentGenerationPendingIndexLifecycleLive|TestReducerConflictBlockageLeaseMixMatchesPreChangeJoin|TestActiveWorkSummaryBlockageHashesLeasesOnce|TestReducerQueueAckBatchFencesSupersededClaimLive|TestReducerClaimFencedSiblingBecomesClaimableAfterAck|TestReducerFairnessIsolatedSchemaDerivesFromBootstrap|TestReducerFairnessIsolatedSchemaDefinitionDriftLive|TestSupersededGenerationIDsAgainstPostgres|TestSupersededGenerationIDsDefersToInFlightProducersAgainstPostgres|TestSupersededGenerationIDsDefersToPhaseRepairRowsAgainstPostgres|TestCoveredByEmittedFullSuccessorShapesAgainstPostgres|TestSharedProjectionAcceptance[A-Za-z]*Live|TestSharedIntentAcceptanceWriter[A-Za-z]*Live|TestSharedIntentUpsertCreatedAtLastWriterWinsLive|TestServiceMaterializationActiveIndexReplayConvergesLive|TestServiceMaterializationWriterKeepsScopedLineagesLive|TestServiceChangedSinceResolvePicksAttributedNewestActiveLive|TestGenerationRetentionStatementsPrepareAgainstMigratedSchemaLive|TestGenerationRetentionPrunesMigratedSchemaLive|TestGenerationRetentionContentPrunesDeleteExactRowsLive|TestGenerationRetentionContentPrunesFinishWithoutPlannerStatisticsLive|TestGenerationRetentionRowCountsAttributeSharedRowsOnceLive|TestGenerationRetentionNarrowedCandidateTakenElsewhereLive|TestGenerationRetentionProbeMatchesGroupedPassLive|TestGenerationRetentionProbePlansStayOnKeyIndexesLive|TestGenerationRetentionRefusesWithoutValidKeyIndexLive|TestGenerationRetentionScopeMismatchedFactNeverOverDeletesLive|TestGenerationRetentionSelectsEligibleGenerationsAcrossScopesLive|TestGenerationRetentionLockSetMatchesEligibleScopesLive|TestGenerationRetentionFirstCountRunsWithoutScopeLocksLive|TestGenerationRetentionFairnessAcrossScopesLive|TestGenerationRetentionSkipsHeldScopeAndReplacesLive|TestGenerationRetentionEvalPlanQualDropsRacedCandidatesLive|TestGenerationRetentionCandidatePlanNeverLoopsFactWorkItemsLive|TestGenerationRetentionCountsReopenFingerprintsLive|TestGenerationRetentionRowCountsCoverCascadeTablesLive|TestGenerationRetentionSupportsArmCountsExactlyTheCascadeEnvelopeLive|TestGenerationRetentionRefusesWithoutValidSupportsGenerationIndexLive|TestServiceChangedSinceBindsGrantToLineageScopeLive|TestServiceCatalogCorpusFence[A-Za-z]*Live|TestProjectorHeartbeatWriteMarkerInterleave|TestProjectorWriteMarkerHeartbeatOrderingLive|TestProjectorHeartbeatWriteGateRowsLive|TestUncoveredProjectionWritersLive|TestReplayedFailedGenerationWritesAndActivatesLive|TestReplayAfterFullRecordsLatestWriteStartLive|TestProjectorHeartbeatNeverDeadlocksWithBaselineRefusal)'
      - name: Run status summary writer proofs
        working-directory: go
        env:
          ESHU_STATUS_SUMMARY_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_STATUS_SUMMARY_PROOF_DISPOSABLE: "1"
          ESHU_REQUIRE_STATUS_SUMMARY_WRITER_PROOF: "1"
        # The #7009 status summary writer proofs create and drop their own
        # databases on this service and apply every migration. After a pass the
        # stored row must equal the live active-work statement at its as_of in
        # one snapshot (several live fractions and empty); a killed pass keeps
        # the old row; a newer row is kept; a missing table is skipped; a row
        # from another statement digest is replaced; a second writer skips
        # while the first holds the advisory lock; and two writers beside the
        # production ReducerQueue claim and Ack loop cause no claim error and
        # no writer-attributable lock wait. Only real advisory locks, snapshots
        # and backend termination reproduce them.
        # ESHU_REQUIRE_STATUS_SUMMARY_WRITER_PROOF makes an unset DSN fail.
        # TestWriterLiveProofsRunInTheReducerContentionGate keeps this filter in
        # step with the proofs declared in the package's *_live_test.go files.
        run: go test ./internal/reducer/status/summary/ -run '^(TestWriterRowEqualsLiveStatementLive|TestWriterKilledMidPassKeepsTheOldRowLive|TestWriterCountsAGuardRejectionLive|TestWriterSkipsAMissingTableLive|TestWriterReplacesARowFromAnotherStatementLive|TestWriterPassRunsReadCommittedLive|TestSecondWriterSkipsWhileTheFirstHoldsTheLockLive|TestWritersBesideTheProductionClaimLoopLive|TestDrainActiveBackendsLive|TestReaderServesWhatTheWriterStoredEqualToLiveLive|TestReaderFallsBackAndNeverMixesWhenTheRowIsStaleLive|TestScrapeServesTheStoredRowAndNeverTheLiveStatementLive|TestScrapeStatementInventoryOnAnEmptyStoreLive|TestScrapeBytesEqualWithTheOmittedSectionsPopulatedLive|TestTerraformModelServedEqualToLiveLive|TestCoordinatorModelServedEqualToLiveLive|TestCoordinatorWritersBesideQueueTrafficLive|TestWriterKilledMidCompanionKeepsThePrimaryRowLive|TestWriterLiveProofsRunInTheReducerContentionGate|TestEnrollmentGuardRejectsAGapInTheGate|TestLiveProofMissingDSNFailsOnlyWhenRequired)$' -race -count=1 -timeout 600s -v
      - name: Run story target-support semantics proof
        working-directory: go
        env:
          ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_POSTGRES_DISPOSABLE: "1"
        # TestServiceStoryTargetSupportSQLSemanticsLive (#6794) runs the story
        # target-support statements against a seeded fixture: only each scope's
        # own active generation counts, a repeated kind counts once, and the
        # observed_at tie order and the source-only rollup match the pre-change
        # statements. The parity lives in SQL, so it needs real Postgres.
        run: |
          set -o pipefail
          go test ./internal/query/ -run '^TestServiceStoryTargetSupportSQLSemanticsLive$' -json -race -count=1 -timeout 180s -v | tee "${RUNNER_TEMP}/contention-query_story.jsonl"
          python3 ../scripts/lib/reducer_contention_events.py --events "${RUNNER_TEMP}/contention-query_story.jsonl" --package github.com/eshu-hq/eshu/go/internal/query --select '^TestServiceStoryTargetSupportSQLSemanticsLive$'
      - name: Run readiness wait ledger proofs
        working-directory: go
        env:
          ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
        # Six named tests cover the wait ledger's row, epoch, clear, and settle
        # fences against the same disposable PostgreSQL service.
        run: |
          set -o pipefail
          go test ./internal/storage/postgres/readiness/wait/ -run '^TestReadinessWait.*Live$' -json -race -count=1 -timeout 120s | tee "${RUNNER_TEMP}/contention-readiness_wait.jsonl"
          python3 ../scripts/lib/reducer_contention_events.py --events "${RUNNER_TEMP}/contention-readiness_wait.jsonl" --package github.com/eshu-hq/eshu/go/internal/storage/postgres/readiness/wait --select '^TestReadinessWait.*Live$'
      - name: Run status summary store proofs
        working-directory: go
        env:
          ESHU_STATUS_SUMMARY_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_STATUS_SUMMARY_PROOF_DISPOSABLE: "1"
          ESHU_REQUIRE_STATUS_SUMMARY_PROOF: "1"
        # The #7009 status summary store proofs run the guarded single-row upsert,
        # the writer advisory lock, migration 161 and its storage parameters, and
        # the one-row bloat bound against real PostgreSQL: the as_of guard that
        # keeps an older pass from overwriting a newer one, two concurrent
        # writers, crash safety, and HOT updates only reproduce on a real server.
        # Each test creates its own disposable database through the
        # administrative postgres database. ESHU_REQUIRE_STATUS_SUMMARY_PROOF
        # makes an unset DSN fail these tests here instead of skipping them, and
        # TestStatusSummaryProofsRunInTheReducerContentionGate keeps this filter
        # and these variables in step with the proofs declared in the package.
        run: go test ./internal/storage/postgres/status/summary/ -run 'Live$' -race -count=1 -timeout 300s -v

  contention-gate-storage-b:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'contention-gate-storage-b') }}
    name: reducer contention gate (supply-chain proofs)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: eshu
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eshu -d eshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository (supply-chain proofs job)
        uses: actions/checkout@v5

      - name: Set up Go (supply-chain proofs job)
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a contention-gate
      # failure that never claimed a row (#6615 follow-up to #6075).
      - name: Pre-warm Go modules (supply-chain proofs job)
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run supply-chain and holder fan-out proofs
        working-directory: go
        env:
          ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_POSTGRES_DISPOSABLE: "1"
          ESHU_REQUIRE_ACTIVE_WORK_PROJECTION_PROOF: "1"
          ESHU_PROJECTOR_SUPERSESSION_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_PROJECTOR_SUPERSESSION_PROOF_DISPOSABLE: "1"
          ESHU_REDUCER_FAIRNESS_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_REDUCER_FAIRNESS_PROOF_DISPOSABLE: "1"
          ESHU_GENERATION_LIVENESS_PROOF_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_REDUCER_ACK_RECLAIM_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_REDUCER_ACK_RECLAIM_PROOF_DISPOSABLE: "1"
          ESHU_SUPERSEDED_GENERATION_PROOF_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_POSTGRES_TEST_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_REQUIRE_SUPPLY_CHAIN_IMPACT_PROOF: "1"
          ESHU_SUPPLY_CHAIN_IMPACT_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_SUPPLY_CHAIN_IMPACT_PROOF_DISPOSABLE: "1"
          ESHU_REQUIRE_ACCEPTANCE_MONOTONIC_PROOF: "1"
          ESHU_REQUIRE_SERVICE_LINEAGE_SCOPE_PROOF: "1"
          ESHU_REQUIRE_RETENTION_MIGRATED_SCHEMA_PROOF: "1"
        # Second half of the storage/postgres contention suite (#11252): every
        # filter alternative from the #7141 supply-chain impact proofs onward
        # (the holder fan-out, enrichment, manifest, suppression, rekey and
        # stale-generation families). The first half, up to and including the
        # generation-retention proofs, runs in the contention-gate job. The two
        # filters partition the single filter that ran here before: their union
        # selects exactly the same tests, each once, and the enrollment guards
        # read both filters by union. Cap: 1200 s = 1.28x of about 937 s, this
        # half's test phase on the slowest run seen with today's test set. The
        # earlier 900 s cap (1.32x of about 684 s: same-test ratio x1.167 over
        # the 585.6 s of the reference run) was exceeded once #11325 added six
        # live proofs (50 s) and retired two (25 s): the PR run hit it at
        # 900.3 s with 898 s of passing tests and an estimated 937 s total (the
        # tests still pending, taken from the slowest completed run at the
        # x1.058 the shared tests ran slower), and main's run after the merge
        # (45291875349) hit it at 900.3 s with 269 tests passed (894 s), only
        # the closing enrollment guard (8 s in the reference run) unfinished,
        # so about 908 s. The slowest completed runs before it took 858.6,
        # 842.7 and 834.1 s (45280192739, 45221097657, 45272900266), about
        # 25 s more on today's set. The 937 s figure rests on two runs that
        # were both cut off at the cap. Worst case in this job: 1 min setup +
        # 13 min cold build + 1200 s cap + 240 s stress cap (the stress step
        # below reuses this job's hot build cache) = 38.0 min, inside 45. The
        # runner bound MAX_STEP_TIMEOUT_SECONDS (1200 s) is reached: the next
        # near-cap read of this half is the trigger to rebalance, by moving
        # the newest proofs to the other half's filter when the filters are
        # next touched, or by raising that bound with the arithmetic.
        # New supply-chain alternatives are appended at the end
        # of this filter, so growth lands here first; re-measure both halves
        # when either gets within 1.3x of its cap on a slow runner. The overlap
        # check in the events guard sees only the tests in the contention
        # inventory, not every test function in the package.
        run: |
          set -o pipefail
          go test ./internal/storage/postgres/ -run '^(TestSupplyChainImpact(Writer|ActiveDeadLetters|CappedScope|StalePass|EmptyFresherPass|RetractsLegacy|UpsertGuard|FencingToken|SeedAdvances|Supports|WinnersResweep|WinnersDirty|WinnersKeyedFanout|CVEListFullShardWriter)[A-Za-z]*Live|TestListOSPackageAdvisoryFactEnvelopes[A-Za-z]*Live|TestOSPackageNarrowedQueryUsesTheIndexAtScaleLive|TestAdvisoryOnlySuppressionHTTPStoreReducerQueryLive|TestAdvisorySuppressionIsolatedSchemaDerivesFromBootstrapLive|TestSupplyChainImpactLiveProofsRunInTheReducerContentionGate|TestProofsMissingFromFilterRejectsAnUnselectedProof|TestProofStepScopesTheEnvChecksToTheProofStep|TestLiveDSNOpenersFollowsWrappersTransitively|TestLiveProofFilesCoversDirectCallersAndFlagsMixedFiles|TestHelperFailsOnRequiredPinsTheOutcomeAction|TestSupplyChainImpactLiveDecision|TestWorkloadReplayOutcomeReportsSupersededStableItem|TestWorkloadFencedReplaySupersedesOnlyOlderInFlightToken|TestWorkloadReplayAndBatchAckContentionConvergesToPending|TestWorkloadReplayClaimAfterAckToleratesSkewedAppClock|TestWorkloadReplayConcurrentFirstScheduleReportsSuccess|TestWorkloadReplayDuringClaimReturnsAckToPending|TestFencedSupersededRevivalDropsAtMarkerLive|TestPostFenceRevivalGuardChainDerivedFromShippedSQL|TestFindHolderScopes|TestReopenHolder|TestReopenWidens|TestReopenStampsAnUnstamped|TestReopenLeavesAFlaggedUnstamped|TestReopenKeepsAnUnboundedStored|TestClearReplayFlag|TestEnqueueMissingHolder|TestListScopedFindingPackages|TestScopedWriteMatchesFullWrite|TestMutualFanOut|TestUpdateFanOutState|TestRejectedAdvisoryReopens|TestRestoredAdvisory|TestFailedHolderRead|TestFanOutReopenedPasses|TestHolderH3|TestHolderAdaptiveSplitRowIdentityLive|TestHolderMassProbe[A-Za-z]*Live|TestHolderKeyRange[A-Za-z]*Live|TestFanOutRaceFleetBurstCostOfTheInFlightReadLive|TestFanOutRaceAFlaggedRerunIsItselfFlaggableLive|TestFanOutRaceHolderCommitsAndAcksBetweenTheTwoReadsLive|TestFanOutRaceHolderSucceedsBetweenTheReadAndTheReopenLive|TestFan