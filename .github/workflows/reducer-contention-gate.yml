name: Reducer Contention Gate

# Residual real-Postgres concurrency gate (issue #4124, R-15 of epic #4102).
#
# The deterministic replay framework runs credential-free and Docker-free, but
# by construction it cannot exercise the real `FOR UPDATE SKIP LOCKED` claim
# path, wall-clock lease expiry, or the per-claim attempt counter. This job
# keeps a small real-Postgres contention check for exactly those guarantees —
# the irreducible remainder replay does not subsume
# (docs/internal/design/4102-deterministic-replay-framework.md §10).
#
# It runs ONLY the TestReducerContentionGate* tests, not the whole
# storage/postgres package, so it asserts the deterministic guarantees and does
# not run the separately-tracked flaky conflict-fence proof.

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main
  # On PRs, only spin Postgres when claim-path code could be affected. main runs
  # unconditionally above as the backstop, so a regression that reaches main via
  # an unfiltered path is still caught (the repo has no required-status-check
  # enforcement, so a skipped PR run never blocks merge).
  workflow_dispatch:

concurrency:
  group: ci-leaf-reducer-contention-gate-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  contention-gate:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'contention-gate') }}
    name: reducer contention gate
    runs-on: ubuntu-24.04
    # #11252: this job runs the first half of the storage/postgres contention
    # suite plus the other-package proof steps; the supply-chain half and the
    # fan-out stress proof run in contention-gate-storage-b, in parallel. The
    # single job outgrew 45 minutes of cold -race build plus tests: of 59
    # recent runs the five slowest passing ones took 1175.7 to 1202.7 s of test
    # phase (build 680 to 697 s) against a 1230 s cap, and the slowest passing
    # job took 2435 s of the 2700 s job cap; two runs hit the cap with 0 failed
    # tests (the same tests ran 15.2 and 16.0 % slower on the slow runner).
    # Runner speed varies 1.7x (fastest passing test phase 705 s, build 417 s).
    # Cap headroom is taken against the slowest passing runner, from SAME-TEST
    # ratios (the slowest passing run 136955226749 ran 404 of today's 430 tests,
    # so its package time cannot be compared with a 430-test run): half one took
    # 610.3 s there (x1.234 of the reference run 137217346469's 494.8 s), half
    # two about 683 s once its 27 missing tests are added (x1.167 of 585.6 s);
    # four more slow passing runs give 597.8 to 611.5 s and 662.0 to 680.8 s.
    # Caps 800 s (this half) and 900 s (the other half) were 1.31x and 1.32x of
    # those. The other half's step cap is now 1200 s, 1.28x of about 937 s, derived
    # in that step's comment. Worst case per job, from the caps: 1 min setup + 13
    # min cold build + test cap + tail (6 min here, the 240 s stress cap in the
    # other job) = 33.3 min here and 38.0 min there (it was 33.0 min with the 900
    # s cap), inside 45 (the job was 44.5 min worst case before the split).
    # Realistic slowest job: about 27 min against 40.6 min before. Each step keeps
    # its own -timeout; this cap is job headroom only.
    timeout-minutes: 45

    services:
      postgres:
        image: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: eshu
          POSTGRES_USER: eshu
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eshu -d eshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify contention runner contract
        run: |
          python3 scripts/lib/reducer_contention_events.py
          python3 scripts/test-reducer-contention-events.py
          python3 scripts/test-reducer-contention-ledger-policy.py
          bash scripts/verify-live-tests-ledger.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a contention-gate
      # failure that never claimed a row (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run reducer contention gate
        working-directory: go
        env:
          ESHU_POSTGRES_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_POSTGRES_DISPOSABLE: "1"
          ESHU_REQUIRE_ACTIVE_WORK_PROJECTION_PROOF: "1"
          ESHU_PROJECTOR_SUPERSESSION_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_PROJECTOR_SUPERSESSION_PROOF_DISPOSABLE: "1"
          ESHU_REDUCER_FAIRNESS_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_REDUCER_FAIRNESS_PROOF_DISPOSABLE: "1"
          ESHU_GENERATION_LIVENESS_PROOF_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_REDUCER_ACK_RECLAIM_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_REDUCER_ACK_RECLAIM_PROOF_DISPOSABLE: "1"
          ESHU_SUPERSEDED_GENERATION_PROOF_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_POSTGRES_TEST_DSN: postgres://eshu:change-me@localhost:15432/eshu?sslmode=disable
          ESHU_REQUIRE_SUPPLY_CHAIN_IMPACT_PROOF: "1"
          ESHU_SUPPLY_CHAIN_IMPACT_PROOF_DSN: postgres://eshu:change-me@localhost:15432/postgres?sslmode=disable
          ESHU_SUPPLY_CHAIN_IMPACT_PROOF_DISPOSABLE: "1"
          ESHU_REQUIRE_ACCEPTANCE_MONOTONIC_PROOF: "1"
          ESHU_REQUIRE_SERVICE_LINEAGE_SCOPE_PROOF: "1"
          ESHU_REQUIRE_RETENTION_MIGRATED_SCHEMA_PROOF: "1"
        # TestReducerContentionGate* covers the claim/lease/fencing invariants and
        # the claim-batch latency guard (#4704); TestClaimBatchRankOnceRewrite runs
        # the #4703 rank-once candidate-set+order differential (0/0) against real
        # Postgres so a query-shape or O(N^2) regression on
        # reducer_queue_batch_query.go fails CI, not only a manual drain.
        # TestSignInPolicyConcurrencyGate runs the #4968 sign-in-policy
        # exactly-one-winner / no-lost-update row-lock proof against real
        # Postgres so the concurrency contract is proven in CI, not only when a
        # local DSN happens to be set.
        # TestReducerContentionGateCrossScopeReadiness* runs the #5709 real-queue
        # proof of the non-counting cross-scope readiness deferral: attempt_count
        # frozen across more claim/fail cycles than MaxAttempts, no durable write
        # while waiting, and convergence on producer activation or the elapsed
        # bound. A fake queue cannot establish any of it, which is why these live
        # here rather than beside the handler tests.
        # TestDeferredBackfillSharedScopeGenerationPublishesOneRowPerPartition
        # and TestDeferredBackfillDistinctScopesPublishOneRowEach run
        # the deferred-backfill shared-partition dup-key proofs: two repositories
        # sharing one (scope, generation) partition must publish exactly one
        # graph_projection_phase_state row and one deferred_backfill_partition_memo
        # row (not one per repo), while two repositories in distinct partitions
        # must still publish one row each. The regression is a real Postgres
        # ON CONFLICT DO UPDATE rejection (SQLSTATE 21000) when the batch upsert
        # carries duplicate conflict keys -- no fake DB enforces that constraint,
        # so this needs real Postgres too.
        # TestDeferredBackfillWithholdsPublication*, TestDeferredBackfillFanIn*,
        # TestDeferredBackfillCrashBetweenBatchesAndFanInConverges, and
        # TestFanInActiveGenerationMatchesCorpusLoader run the fan-in publication
        # proofs: a partition spans several evidence batches, so readiness and
        # the durable partition memo must be published only after every batch
        # commits, must be withheld entirely when a batch fails or is canceled,
        # and must be withheld for a generation that advanced mid-pass. A memo
        # row written for a half-committed partition suppresses that partition's
        # fact load on every later pass, so the failure is durable rather than
        # transient -- and only real Postgres transactions, real rollbacks, and
        # real advisory locks reproduce it.
        # TestActiveWorkSummaryDropsTerminalTextFromMaterializedRows (#7009)
        # rejects wide consumer-only fields on succeeded and superseded work.
        # ESHU_REQUIRE_ACTIVE_WORK_PROJECTION_PROOF makes an unset DSN fail.
        # TestActiveWorkSummaryMatchesPreHistoryGroupsOracle (#7009) runs the
        # pre-change summary SQL beside the shipped gated query and both of its
        # forced branches in one statement over the shim edge cases and the S5
        # live-share states, and requires identical section rows;
        # TestActiveWorkSummaryOracleCatchesSeededHistoryMutations and
        # TestActiveWorkSummaryGateMutationsAgainstOracle prove that differential
        # catches each seeded grouped-history and gate fault, and
        # TestActiveWorkSummaryGateResolvesTableByRegclass that the gate reads
        # the scanned table's pg_stats. TestStatusActiveFactWorkItemsCTEUsesGenerationIndex
        # (#4446, #7009) plans the summary on 100,000 generations in both gate
        # branches and as a forced generic plan, and requires the gate to run
        # once and every full scope_generations scan to be one hashed, sorted,
        # or gathered pass per CTE (loops at most Workers Launched + 1); a
        # seeded nested-loop plan must be rejected. Only a real planner
        # produces the plans it checks.
        # TestActiveWorkSummaryMatchesStandaloneReads and
        # TestStatusActiveWorkQueriesPreserveSemantics (#6794) prove the status
        # snapshot's single active-work statement decodes to exactly what the
        # pre-change standalone reads return, and pin the stale-generation and
        # shared-projection backlog contract.
        # TestActiveFactWorkItemsFormsSelectTheSameRows keeps the per-row
        # active-work filter the drain EXISTS uses in step with the materialized
        # one. They need real Postgres because the parity lives in SQL
        # ordering, collation, and aggregation.
        # TestReducerConflictBlockageLeaseMixMatchesPreChangeJoin and
        # TestActiveWorkSummaryBlockageHashesLeasesOnce (#6794) pin the status
        # blockage filter: parity with the pre-change join over every lease
        # state, and a hashed lease set with no per-row rescan of eligible rows
        # or leases whether statistics are missing, current, or stale.
        # TestReducerQueueAckBatchFencesSupersededClaimLive runs the #6162
        # ack-reclaim lease-safety proof. It drives the Ifa expire-lease cell's
        # own UPDATE, so one work item genuinely carries two claim identities in
        # one ack batch, then proves the superseded claim alone acks nothing, the
        # batch carrying both acks the survivor and reports a claim rejection the
        # batch acker survives, and both pending orders resolve the same. The
        # regression it stops is a reducer that exits on an ordinary lease race
        # and leaves the row 'claimed' until the drain gate times out. Only real
        # Postgres expires a lease on the wall clock and applies the ack
        # statement's last_attempt_at fence.
        # TestSupersededGenerationIDs*AgainstPostgres runs the #7121
        # superseded-generation drain-lookup proofs: the lookup must return only
        # superseded generations and must defer to in-flight producers and
        # durable phase-repair rows. Only real Postgres executes that NOT EXISTS
        # safety predicate. Each test bootstraps its own private schema.
        # TestCoveredByEmittedFullSuccessorShapesAgainstPostgres runs the #7165
        # emitted-full-successor drain-lookup proofs: the issue's four
        # (full/delta) shapes plus the guard cases (unemitted or other-domain
        # successor, in-flight producer, live repair row, completed rows, a
        # failed successor). Only real Postgres executes the covering EXISTS
        # predicate. It reuses ESHU_SUPERSEDED_GENERATION_PROOF_DSN and its own
        # private schema.
        # TestSharedProjectionAcceptance*Live and TestSharedIntentAcceptanceWriter*Live
        # (#6679) prove shared-projection acceptance is advance-only on
        # generation order: sequential and 4x50 lock-wait out-of-order writers,
        # a stored generation committed after the upsert's snapshot, the
        # ingested_at ordering key, legacy NULL-key rows resolved in the guard
        # (including a generation committed after the snapshot), reversed
        # 200-key batches with no 40P01, and the stale-write counter.
        # Only real READ COMMITTED row-lock rechecks and snapshots reproduce
        # them. ESHU_REQUIRE_ACCEPTANCE_MONOTONIC_PROOF makes an unset DSN fail
        # these tests here instead of skipping them.
        # TestGenerationRetentionStatementsPrepareAgainstMigratedSchemaLive and
        # TestGenerationRetentionPrunesMigratedSchemaLive (#6809) apply the real
        # bootstrap migrations to a private schema, prepare every generation
        # retention statement, and run a full prune with asserted row counts. A
        # hand-written fixture schema hid a missing table and a missing column
        # from the retention row-count query, so only the migrated schema can
        # catch that drift. ESHU_REQUIRE_RETENTION_MIGRATED_SCHEMA_PROOF makes an
        # unset DSN fail these tests here instead of skipping them.
        # TestGenerationRetentionContentPrunesDeleteExactRowsLive proves the three
        # content prunes delete exactly the rows only pruned generations hold, and
        # TestGenerationRetentionContentPrunesFinishWithoutPlannerStatisticsLive
        # fails if a prune's plan needs planner statistics: the earlier NOT EXISTS
        # shape rescanned the retained facts once per candidate key on a database
        # that had not been analyzed.
        # TestGenerationRetentionRowCountsAttributeSharedRowsOnceLive proves the
        # row count charges a content row shared by several pruned generations
        # to one of them, so each table's counts sum to the prunes' deletes.
        # #7279 replaced the grouped prunes with a per-candidate key-index
        # probe: TestGenerationRetentionProbeMatchesGroupedPassLive compares it
        # row for row with the frozen #6809 statements,
        # TestGenerationRetentionProbePlansStayOnKeyIndexesLive fails on any
        # fact_records read that grows with the table (cold and generic plans,
        # with a seeded missing-index RED),
        # TestGenerationRetentionRefusesWithoutValidKeyIndexLive proves a
        # dropped, invalid, or misshaped key index refuses the cycle, and
        # TestGenerationRetentionScopeMismatchedFactNeverOverDeletesLive pins the
        # scope-join invariant's leak-only direction.
        # #7334 section 1 replaced the per-scope candidate query with a single
        # all-scope eligibility statement that locks only scopes owning an
        # eligible generation.
        # TestGenerationRetentionSelectsEligibleGenerationsAcrossScopesLive proves
        # the whole BatchGenerationLimit lock budget never goes to scopes that
        # only own an old-but-retained generation while eligible scopes sort
        # after them.
        # TestGenerationRetentionLockSetMatchesEligibleScopesLive proves the
        # statement locks exactly the scopes that own an eligible generation,
        # and no others.
        # TestGenerationRetentionFairnessAcrossScopesLive proves the pruned
        # batch is the globally-oldest eligible generations, not the ones that
        # sort first by scope_id.
        # TestGenerationRetentionSkipsHeldScopeAndReplacesLive proves a held
        # scope row is skipped under SKIP LOCKED rather than waited on, and the
        # next-oldest candidate is pruned instead.
        # TestGenerationRetentionEvalPlanQualDropsRacedCandidatesLive is the
        # EvalPlanQual proof: a candidate deleted or reactivated by another
        # session between the statement's snapshot and its row lock is dropped
        # correctly in both directions, using the same blocking-lock mirror
        # technique the reducer queue's own lock-recheck proof uses.
        # TestGenerationRetentionCandidatePlanNeverLoopsFactWorkItemsLive proves
        # the live_work CTE's fact_work_items access node has Actual Loops = 1
        # in every plan state, guarding against the O(n) growth a per-row
        # correlated NOT EXISTS would reintroduce.
        # TestGenerationRetentionNarrowedCandidateTakenElsewhereLive (#7127) proves
        # an over-limit batch of one, narrowed by a savepoint rollback, prunes
        # nothing when another session takes its candidate before the re-lock.
        # The projector and generation-liveness proofs (#6738) run against the
        # same isolated PostgreSQL service; each test creates a private schema.
        # #7437: the six ESHU_GENERATION_LIVENESS_PROOF_DSN-gated proofs are
        # enrolled in the -run filter by exact name below, and the hermetic
        # enrollment guard discovers them from source, so a new env-gated
        # proof cannot silently sit out the gate.
        # TestServiceMaterializationActiveIndexReplayConvergesLive,
        # TestServiceMaterializationWriterKeepsScopedLineagesLive, and
        # TestServiceChangedSinceResolvePicksAttributedNewestActiveLive, and
        # TestServiceChangedSinceBindsGrantToLineageScopeLive (#6475)
        # prove the service lineage is keyed by (scope_id, service_id): the
        # real bootstrap converges fresh and upgraded schemas, the scope_id
        # backfill attributes only witnessed rows, a tracked and an untracked
        # replay leave the rescoped index untouched while two scopes hold an
        # active generation for one service id, the writer supersedes only
        # within its scope, the changed-since resolve never serves the stale
        # unattributed row beside an active attributed one, and it binds the
        # caller's grant on each lineage row's scope_id. Only real unique indexes,
        # migrations, and SQL ordering reproduce them. The #7258 service catalog
        # corpus-fence proofs drive the correlation handler through the real
        # RelationshipStore and service materialization writer: it must defer
        # while a foreign relationship generation is pending, and the unfenced
        # negative control must reproduce the spurious changed-since removal.
        # ESHU_REQUIRE_SERVICE_LINEAGE_SCOPE_PROOF makes an unset DSN fail these
        # tests here instead of skipping them; their four full bootstraps take
        # about 32s under -race locally.
        # #7389: TestProjectorHeartbeatWriteMarkerInterleave races the
        # projection write-start marker against the heartbeat supersede 1,000
        # times and requires exactly one winner, no deadlock, and only the two
        # legal end states; TestProjectorWriteMarkerHeartbeatOrderingLive and
        # TestProjectorHeartbeatWriteGateRowsLive pin each ordering and gate
        # case (SKIP LOCKED no-op, EvalPlanQual drop, lease fence, latest write start,
        # lock-timeout deferral, no generation lock in steady state), and
        # TestUncoveredProjectionWritersLive pins the collector's graph-dirty
        # probe. TestReplayedFailedGenerationWritesAndActivatesLive and
        # TestReplayAfterFullRecordsLatestWriteStartLive prove a replayed
        # failed generation is marked, activates, and records its latest write
        # start. TestProjectorHeartbeatNeverDeadlocksWithBaselineRefusal holds
        # the delta-baseline refusal on the work row and proves the heartbeat
        # skips it instead of deadlocking (40P01 stops the worker pool).
        # Only real row locks and EvalPlanQual rechecks reproduce them.
        # TestReducerContentionPostgresProofsRunInTheReducerContentionGate is
        # the hermetic guard that keeps every live PostgreSQL proof above, and
        # the DSNs they need, inside the -run filter below.
        #
        # #11252: this step runs the first half of the storage/postgres
        # suite: every -run alternative before the #7141 supply-chain impact
        # proofs (queue, projector, generation liveness and retention, shared
        # projection, service materialization). The second half runs in the
        # contention-gate-storage-b job; the two filters partition the filter
        # this step ran alone before (430 tests: 190 here, 240 there, none
        # selected twice; the stress step adds the 431st), and the contention events guard refuses an overlap.
        # Cap: 800 s = 1.31x of 610.3 to 611.5 s, the first half's test phase
        # on the slowest passing runs (same-test ratio x1.234 over the 494.8 s
        # this half took in the reference run 137217346469, whose 430 tests
        # total 1080.3 s; see the job comment above).
        # -timeout bounds the test binary only, not the go build ahead of it:
        # the cold -race build measured 680 to 717 s on slow runners. Worst
        # case in this job: 1 min setup + 13 min build + 800 s cap + 6 min
        # tail (status summary, story, wait ledger, store proofs: 203 s
        # measured) = 33.3 min, inside the 45-minute job cap. A step timeout
        # reports failure (`panic: test timed out`), distinct from the
        # job-level cancelled the job cap reports. History: #10148 S5 derived
        # 1230 s from 720.36 s of tests at 1.7x; the suite has since grown to
        # 1080.3 s (54 tests enrolled by prefix alternatives after c6f3fdf8a2
        # account for 165.7 s of it).
        # #7141: the supply-chain impact retraction proofs run here so a change
        # to the writer, the retraction, the fencing admission (#7142) or the
        # capped-evidence drain (#7154) cannot merge without them. The
        # TestSupplyChainImpact(Writer|ActiveDeadLetters|CappedScope|StalePass|...)*Live alternatives
        # (WinnersResweep adds the #9774 write-on-change winners proofs;
        # WinnersDirty adds the #10827 versioned-upsert writer proofs:
        # in-flight re-mark survival and the 150-mark collapse)
        # cover the #6831 replace-set proofs (retraction of superseded findings,
        # idempotence, boundary, partial-evidence skip, overlapping-pass
        # serialization and convergence under the advisory lock), the #7154
        # capped-scope convergence proof and the #7142 fencing
        # proofs. TestListOSPackageAdvisoryFactEnvelopes*Live and
        # TestOSPackageNarrowedQueryUsesTheIndexAtScaleLive run the narrowed
        # OS-package drain: paging, purl forms against the Go matcher, the
        # one-snapshot drain across a generation flip, and the index plan at
        # 50,000 rows. Only real Postgres advisory locks, row locks, snapshots and
        # query plans reproduce them. They read ESHU_POSTGRES_TEST_DSN, and
        # ESHU_REQUIRE_SUPPLY_CHAIN_IMPACT_PROOF makes an unset DSN fail them here
        # instead of skipping. Proofs that read the lane query surface bootstrap
        # a fresh database through ESHU_SUPPLY_CHAIN_IMPACT_PROOF_DSN plus
        # ESHU_SUPPLY_CHAIN_IMPACT_PROOF_DISPOSABLE (the lane's authority
        # migrations are public-only). TestSupplyChainImpactLiveProofsRunInTheReducerContentionGate
        # keeps this filter in step with the proofs declared in those files.
        # The guard and its seeded RED/GREEN tests are hermetic and also run in the
        # job's own filter, so a change to this workflow cannot drop a proof from the
        # filter while the job stays green.
        # #6680/#7493: the advisory proofs below derive their databases
        # from the production bootstrap instead of hand-picked definition
        # lists, and the derivation guards fail when a helper-built database
        # lacks a production object. TestReducerClaimFencedSiblingBecomesClaimableAfterAck
        # proves a fenced sibling becomes claimable after ack; the advisory
        # proofs run the live supply-chain impact reducer over an
        # advisory-only suppression. About 18s locally without -race (four
        # full bootstraps plus the guard diffs); the step timeout stays
        # untouched.
        # #9695: the supply_chain_impact holder fan-out proofs (the holder read,
        # the reopen transitions and lock wait, the lease-fenced state update, the
        # statement timeout, the mutual-fan-out deadlock race, and the end-to-end
        # convergence and race tests (except the stress test, which has its own
        # step below): O1/O2/V2, retry, one hop, stamp and
        # continuation races, an in-flight first pass) need real Postgres row
        # locks, collation, the 093 acknowledgement trigger, and the real winners
        # rebuild. The filter alternatives TestFindHolderScopes, TestReopenHolder,
        # TestMutualFanOut, TestUpdateFanOutState, TestRejectedAdvisoryReopens,
        # TestRestoredAdvisory, TestFailedHolderRead, TestFanOutReopenedPasses,
        # TestHolderH3, TestFanOutRace, TestRescan, TestWriterReportsChanges,
        # TestFindInFlight, TestOwedMarker, TestFailureBeforeTheCommit and
        # TestZombiePass (prefixes, the
        # filter is not end-anchored) select them. The #9878 enrichment re-trigger
        # proofs ride the same step via TestEPSSLowered, TestNewKEVListing,
        # TestEnrichmentCommitted and TestIdenticalEPSSRescan. The #9874 manifest
        # trigger proofs ride it via TestFindPackageHolderCandidates,
        # TestFindRepositoryFindingHolders,
        # TestReadManifestDependencyGeneration, TestManifestTriggerReopens,
        # TestManifestWatermark, TestManifestStamp, TestManifestChainEndToEnd,
        # TestManifestChainDepthCap, TestManifestChainPruned, TestManifestMarkerFlags,
        # TestManifestPassReads and TestTwoConcurrentMarkers. The #10055 commit-skew
        # fence chain proofs ride it via TestGoFence.
        # #10415: the out-of-stamp fallback proofs ride it via
        # TestHasOutOfStampActiveRowsLive and TestScopedFallbackConvergesLive:
        # the trigger probe edges and the full-pass convergence over real
        # finding rows. They read ESHU_POSTGRES_TEST_DSN and bootstrap a
        # fresh database through ESHU_SUPPLY_CHAIN_IMPACT_PROOF_DSN plus
        # ESHU_SUPPLY_CHAIN_IMPACT_PROOF_DISPOSABLE. About 5s locally
        # without -race; the step timeout stays untouched.
        # #10422: the stale-generation fence proof rides it via
        # TestStaleGenerationPassPreservesScopePassStateLive: a stale
        # generation's late pass with a higher fencing token leaves the
        # per-scope pass-state row untouched once a lifecycle-newer
        # generation is reader-visible. #10460 adds the concurrent overlap
        # proof (TestStaleGenerationPassOverlapsNewerCommitLive): the newer
        # generation commits while the stale bulk is in flight and the
        # stale record-last write still skips. Same DSNs; about 9s locally
        # without -race; the step timeout stays untouched.
        run: |
          set -o pipefail
