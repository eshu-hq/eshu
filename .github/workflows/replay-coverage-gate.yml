name: Replay Coverage Gate

# C-1/C-8/C-9/C-10 replay coverage manifest + lockstep gate (#4173, #4187, #4188, #4189, epic #4172).
# Enumerates every surface Eshu claims to support from the source-of-truth
# registries and reports any required surface/scenario_type pair lacking a green
# replay scenario. Static, credential-free, Docker-free — it composes with (does
# not replace) the gates that actually replay the scenarios it counts.
#
# BLOCKING: C-2..C-10 have burned the replay coverage gaps down, so any uncovered
# surface/scenario_type pair now fails this job and the uploaded C-7 coverage
# report is the regression artifact. Keep the gate blocking so new supported
# surfaces and required scenario types land with their replay scenarios.

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches: [ main ]

concurrency:
  group: ci-leaf-replay-coverage-gate-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the gate only checks out and reads the repo.
permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  static-mirror:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'static-mirror') }}
    name: static mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate gate contract
        run: bash scripts/test-verify-replay-coverage-gate.sh

  coverage-gate:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'coverage-gate') }}
    name: coverage-gate (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a coverage-gate
      # failure that never compiled anything (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run replay coverage gate (blocking)
        env:
          RCOV_REPORT_OUT: replay-coverage-report.json
        run: bash scripts/verify-replay-coverage-gate.sh --blocking
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: replay-coverage-report
          path: replay-coverage-report.json
          if-no-files-found: error
