name: Replay Coverage Gate

# C-1/C-8/C-9/C-10 replay coverage manifest + lockstep gate (#4173, #4187, #4188, #4189, epic #4172).
# Enumerates every surface Eshu claims to support from the source-of-truth
# registries and reports any required surface/scenario_type pair lacking a green
# replay scenario. Static, credential-free, Docker-free — it composes with (does
# not replace) the gates that actually replay the scenarios it counts.
#
# BLOCKING: C-2..C-10 have burned the replay coverage gaps down, so any uncovered
# surface/scenario_type pair now fails this job and the uploaded C-7 coverage
# report is the regression artifact. Keep the gate blocking so new supported
# surfaces and required scenario types land with their replay scenarios.

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches: [ main ]
    paths:
      - go/cmd/replay-coverage-gate/**
      - go/cmd/eshu/**
      - go/internal/cli/**
      - go/internal/replaycoverage/**
      - go/internal/cigates/**
      - go/internal/query/**
      - go/internal/mcp/**
      - go/internal/scopedtoken/**
      - go/internal/replay/inputtape/**
      - go/internal/replay/parserfixture/**
      - go/internal/replay/schedulereplay/**
      - go/internal/replay/crashreplay/**
      - go/internal/replay/costcounting/**
      - go/internal/capabilitycatalog/**
      - go/internal/facts/**
      - go/internal/goldengate/**
      - go/internal/storage/cypher/**
      - specs/ci-gates.v1.yaml
      - specs/ci-gates.d/**
      - specs/capability-budget-proof.v1.yaml
      - specs/capability-catalog.v1.yaml
      - specs/replay-coverage-manifest.v1.yaml
      - specs/replay-depth-requirements.v1.yaml
      - specs/authorization-catalog.v1.yaml
      - specs/authorization-replay-coverage.v1.yaml
      - specs/parser-backing-ledger.v1.yaml
      - specs/language-feature-parity-ledger.v1.yaml
      - specs/fact-kind-registry.v1.yaml
      - specs/surface-inventory.v1.yaml
      - specs/capability-matrix.v1.yaml
      - specs/capability-matrix/**
      - specs/product-claims.v1.yaml
      - testdata/golden/e2e-20repo-snapshot.json
      - testdata/cassettes/**
      - scripts/verify-replay-coverage-gate.sh
      - scripts/test-verify-replay-coverage-gate.sh
      - scripts/lib/go-test-run-guard.sh
      - scripts/go-test-run-guard.sh
      - scripts/lib/ci-gates-resolved-fixtures.sh
      - scripts/ci/install-apt-packages.sh
      - scripts/ci/go-mod-download-retry.sh
      - .github/workflows/replay-coverage-gate.yml
      - .github/workflows/golden-corpus-gate.yml
      - specs/ci-pr-workflows.d/replay-coverage-gate.yml

concurrency:
  group: ci-leaf-replay-coverage-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

# Least privilege: the gate only checks out and reads the repo.
permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  coverage-gate:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'coverage-gate') }}
    name: coverage-gate (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false
      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a coverage-gate
      # failure that never compiled anything (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      # The blocking gate now runs the mirror self-test
      # (test-verify-replay-coverage-gate.sh via the Go mirror contract), which
      # needs rg; carried over from the removed static-mirror job (#10988).
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run replay coverage gate (blocking)
        env:
          RCOV_REPORT_OUT: replay-coverage-report.json
        run: bash scripts/verify-replay-coverage-gate.sh --blocking
      # D2: retry wrapper hardens the upload against the transient
      # artifact-service HTML-response flake; see retry-upload-artifact.
      # The report is a terminal regression artifact with no in-repo
      # downstream consumer, so no always()/fallback step applies here.
      - name: Upload coverage report
        if: ${{ always() }}
        uses: ./.github/actions/retry-upload-artifact
        with:
          name: replay-coverage-report
          path: replay-coverage-report.json
          if-no-files-found: error
