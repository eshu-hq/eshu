name: Required Gates

# This workflow used to be the trusted required-status publisher: a
# workflow_run fan-in over every blocking source workflow aggregated
# path-selected gates and published required-gates-complete on each PR head.
# The owner disabled the aggregate job on 2026-11-03 (#9805) because the live
# ruleset requires only go-core-complete and go-race-complete, and deleted
# the fan-in in #10584 because each merge fanned dozens of no-op runs into
# one per-SHA concurrency group. Only the live-ruleset audit below remains,
# on its schedule and manual dispatch. The leaf checks remain ordinary
# pull-request CI and rely on branch-protected review.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 *"

concurrency:
  # Single-flight the audit; schedule ticks are 6h apart and dispatch is
  # manual, so this only serializes an overlap.
  group: required-gates-live-ruleset
  cancel-in-progress: false

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  verify-live-ruleset:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing inside the
      # ruleset-verification script below (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Verify effective required-status rules
        env:
          GH_TOKEN: ${{ github.token }}
          GOCACHE: ${{ runner.temp }}/go-build-required-rules
          # GitHub omits bypass_actors unless the caller can write the ruleset.
          # The scheduled token audits every read-visible field; an admin-run
          # invocation of the script retains the privileged no-bypass check.
          ESHU_REQUIRE_VISIBLE_BYPASS_ACTORS: "false"
        run: scripts/verify-live-required-status-checks.sh
