name: Required Gates

# This workflow is a trusted status publisher. workflow_run always executes the
# version on the default branch, so a pull request cannot weaken the registry,
# selector, or publisher that judges its own head. It never checks out PR code.
# The leaf checks remain ordinary pull-request CI and rely on branch-protected
# review; this publisher is not an immutable-CI boundary against a collaborator
# who can both rewrite a leaf check and approve or merge that rewrite.
on:
  workflow_run:
    workflows:
      - Build Test
      - End-to-end Tests
      - Fact Schema Diff
      - Frontend
      - Golden Corpus Gate
      - Ifa Determinism Gate
      - macOS CI
      - MCP Schema Drift
      - Payload Usage Manifest
      - Product Claim Ledger
      - Publish Image and Helm Chart
      - Race Graph Writes
      - Reducer Contention Gate
      - Replay Coverage Gate
      - Replay Tier (offline NornicDB)
      - Scorecard Example Conformance
      - SDK Go Modules
      - Security Scan
      - Static Contract Gates
      - Value Flow Conformance Expectation
      - Verify Agent Hygiene
      - Verify CI Gate Registry
    types: [in_progress, completed]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  # Keep the active status writer alive. GitHub retains only the latest pending
  # run in this per-head group, so terminal writes stay serialized.
  group: required-gates-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aggregate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Publish pending required status
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context=required-gates-complete \
            -f description='Waiting for path-selected blocking gates' \
            -f target_url="${TARGET_URL}"

      - name: Check out trusted default-branch policy
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Resolve pull request identity
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Selection lives in scripts/resolve-required-gates-pr.sh so it can be
          # exercised locally; scripts/test-resolve-required-gates-pr.sh replays
          # real commits/<sha>/pulls payload shapes against it. It sat inline
          # here before, which is why nobody caught that base.ref == the default
          # branch matches ZERO open PRs for a stacked lane: that endpoint
          # returns the lane plus the lanes ABOVE it, none of them main-based.
          # The step then exited 1, aggregate never wrote code=, and the
          # publisher fell through to its catch-all (run 33308583604: "...got 0").
          # This runs from the trusted default-branch checkout above, never from
          # the pull request's own tree.
          number="$(bash scripts/resolve-required-gates-pr.sh)"
          echo "number=${number}" >> "${GITHUB_OUTPUT}"

      - name: Await every selected blocking gate
        id: aggregate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GOCACHE: ${{ runner.temp }}/go-build-required-gates
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        working-directory: go
        run: |
          # BUILD FIRST, then execute. `go run` does NOT propagate the compiled
          # binary's exit status -- `go help run` says so outright, and a local
          # probe confirms it: a program calling os.Exit(10) surfaces as shell
          # status 1 through `go run`, and as 10 when the built binary is
          # executed. Reading $? after `go run` would collapse every classified
          # code (10/11/12/13) to 1, so the publisher below would never reach
          # its failure, still-running, or cancelled arms and would label
          # everything `error` -- reintroducing the #6075 bug under a
          # different status.
          go build -o "${RUNNER_TEMP}/ci-gates-bin" ./cmd/ci-gates
          set +e
          "${RUNNER_TEMP}/ci-gates-bin" await \
            --registry ../specs/ci-gates.v1.yaml \
            --repo-root .. \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" \
            --poll-interval 30s \
            --timeout 55m
          code=$?
          set -e
          # The code, not just success/failure, is what the publisher below
          # needs (#6075): 0 passed, 10 a selected gate failed, 11 gates still
          # running, 12 aggregation itself broke, 13 every selected gate is
          # terminal and at least one was cancelled (#6189). Codes start at 10
          # so a `go run` build failure (1) or usage error (2) cannot be
          # mistaken for a gate result.
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Publish terminal required status
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PENDING_OUTCOME: ${{ steps.pending.outcome }}
          AGGREGATE_CODE: ${{ steps.aggregate.outputs.code }}
        run: |
          # #6075: publish what actually happened, not "failure" for every
          # non-success. `main` is guarded by a repository ruleset, not classic
          # branch protection, and this status is that ruleset's summary of
          # every other gate, so a red that only means "not finished yet" trains
          # people to ignore the one check that is supposed to be
          # authoritative, and makes any lander abandon a green PR.
          #
          # `failure` is reserved for a gate that genuinely concluded failure.
          # A gate that never produced a verdict is not one (#6189). Four
          # shapes qualify: a CANCELLED check, a STALE one GitHub orphaned,
          # one GitHub marked SKIPPED because the run that owned it was
          # cancelled, and one MISSING outright because that run was cancelled
          # before the job was created, so no check run exists to report at
          # all. All four are background noise, all four want the same
          # repair, and calling any of them "A required gate failed" is the
          # same overclaim in a different costume. They publish `error`, which
          # still blocks the merge -- the ruleset requires `success`, and a
          # commit status can only be error, failure, pending, or success, so
          # `error` cannot satisfy it by any route -- but it names the actual
          # repair (re-run the workflow) instead of sending someone hunting for
          # a red gate that does not exist. It is not folded into the `*)` arm
          # because that arm's description blames the aggregator, which is a
          # different 3 AM investigation.
          #
          # A gate GitHub skipped for its OWN reasons still publishes
          # `failure`. The registry selected it for these paths, so a skip the
          # workflow chose is a real disagreement about whether the gate should
          # have run, and it must keep failing closed. Only the run conclusion
          # separates the two, which is why the aggregate reads it.
          # Gates still running publish nothing at all -- another Required
          # Gates run for this same head is already queued behind the
          # workflows that are still going, and it is authoritative. Writing
          # `pending` here instead would be harmless but pointless: the status
          # is already pending from the earlier step.
          if [[ "${PENDING_OUTCOME}" != "success" ]]; then
            state=error
            description='Required gate aggregation could not start'
          else
            case "${AGGREGATE_CODE}" in
              0) state=success; description='All path-selected blocking gates passed' ;;
              10) state=failure; description='A required gate failed' ;;
              11)
                echo "::notice::selected gates still running; leaving required-gates-complete pending for the next run"
                exit 0
                ;;
              13) state=error; description='A required gate was cancelled or never ran; re-run it (no gate failed)' ;;
              # An empty code is not a broken aggregator: the aggregate step
              # produced no verdict. Two things do that. A step before it failed,
              # so GitHub skipped it -- `continue-on-error` does not add
              # `always()`. Or it started and died before `echo "code="`: the
              # `go build` on its first line runs outside the `set +e` window
              # under the default `bash -e` shell, and `continue-on-error: true`
              # carries the job here anyway. Neither is the aggregator breaking,
              # which is what `*)` says and would send someone reading exit codes
              # for a verdict that was never produced. This arm must not name
              # WHICH step failed, because it cannot know.
              "") state=error; description='Required gate aggregation produced no verdict; the step was skipped or failed before classifying (see the run log)' ;;
              *) state=error; description='Required gate aggregation broke (not a gate result)' ;;
            esac
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context=required-gates-complete \
            -f description="${description}" \
            -f target_url="${TARGET_URL}"
          [[ "${state}" == "success" ]]

  verify-live-ruleset:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify effective required-status rules
        env:
          GH_TOKEN: ${{ github.token }}
          GOCACHE: ${{ runner.temp }}/go-build-required-rules
          # GitHub omits bypass_actors unless the caller can write the ruleset.
          # The scheduled token audits every read-visible field; an admin-run
          # invocation of the script retains the privileged no-bypass check.
          ESHU_REQUIRE_VISIBLE_BYPASS_ACTORS: "false"
        run: scripts/verify-live-required-status-checks.sh
