# Reference Scorecard example CI (#4583, #4572).
#
# The scorecard example under examples/collector-extensions/scorecard is the
# out-of-tree proof that an external collector can build against the public
# sdk/go/collector and sdk/go/factschema modules, run the conformance harness
# against a pinned fixture pack, and pass in its own CI config — without the
# eshu binary or any go/internal package. This workflow is that CI config: it
# runs the example's own `go test ./...` (its own go.mod, resolved in-repo via
# `replace` directives against the SDK module paths) on any PR that touches
# the example or either SDK module, so "the external collector proves
# conformance in its own CI" is a real, running gate rather than a manual
# command a maintainer might forget to run.
name: Scorecard Example Conformance

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main

concurrency:
  group: ci-leaf-scorecard-example-conformance-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'test') }}
    name: Scorecard example go test
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: examples/collector-extensions/scorecard/go.mod
          cache-dependency-path: examples/collector-extensions/scorecard/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a conformance
      # failure that never compiled anything (#6615 follow-up to #6075). This
      # example is its own module (go.mod outside go/), so it warms its own
      # directory rather than the default go/.
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh examples/collector-extensions/scorecard

      - name: Run scorecard example tests
        working-directory: examples/collector-extensions/scorecard
        run: go test ./... -count=1
