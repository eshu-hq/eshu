name: Security Scan
run-name: "${{ github.event_name == 'workflow_run' && format('Security Scan: triggered by {0} @ {1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha) || ' ' }}"
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  workflow_run:
    workflows: ["Publish Image and Helm Chart"]
    types: [completed]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  queue-selection:
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: security-scan.yml
  changes:
    needs: queue-selection
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_run'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'gosec (Go static analysis)') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'govulncheck (Go vulnerability database)') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'nancy (Sonatype dep CVE + license scan)')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Filter changed paths
        id: filter
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'gosec (Go static analysis)') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'govulncheck (Go vulnerability database)') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'nancy (Sonatype dep CVE + license scan)'))) && (github.event_name != 'merge_group') }}
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!mkdocs.yml'
              - '!.github/**/*.md'
              - '!.agents/**'
  trivy-fs:
    needs: queue-selection
    name: Trivy filesystem scan (vuln + secret + config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_run'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Trivy filesystem scan (vuln + secret + config)')) }}
        uses: actions/checkout@v5
      - name: Read trivy skip-dirs from scripts/lib/trivy-skip-dirs.sh
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Trivy filesystem scan (vuln + secret + config)')) }}
        id: skipdirs
        shell: bash
        run: |
          source scripts/lib/trivy-skip-dirs.sh
          dirs="$(trivy_skip_dirs_csv .)"
          echo "dirs=${dirs}" >> "${GITHUB_OUTPUT}"
      - name: Run Trivy filesystem scan (vuln + secret + config)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Trivy filesystem scan (vuln + secret + config)')) }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: ${{ steps.skipdirs.outputs.dirs }}
      - name: Upload Trivy fs SARIF to GitHub Security tab
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Trivy filesystem scan (vuln + secret + config)'))) && (always()) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
  trivy-image:
    needs: queue-selection
    name: Trivy image scan (ghcr.io/eshu-hq/eshu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Log in to GHCR
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Trivy image scan (ghcr.io/eshu-hq/eshu)')) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image reference from triggering workflow_run
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Trivy image scan (ghcr.io/eshu-hq/eshu)')) }}
        id: image
        env:
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/resolve-image-scan-ref.sh
      - name: Run Trivy image scan
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Trivy image scan (ghcr.io/eshu-hq/eshu)'))) && (steps.image.outputs.skip != 'true') }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
      - name: Upload Trivy image SARIF to GitHub Security tab
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Trivy image scan (ghcr.io/eshu-hq/eshu)'))) && (always() && steps.image.outputs.skip != 'true' && steps.image.outcome == 'success') }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
  govulncheck:
    name: govulncheck (Go vulnerability database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [queue-selection, changes]
    if: ${{ github.event_name != 'workflow_run' && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'govulncheck (Go vulnerability database)')) }}
        uses: actions/checkout@v5
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'govulncheck (Go vulnerability database)')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'govulncheck (Go vulnerability database)')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Install govulncheck (pinned)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'govulncheck (Go vulnerability database)')) }}
        run: scripts/ci/go-install-retry.sh golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck on every Go package
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'govulncheck (Go vulnerability database)')) }}
        working-directory: go
        run: |
          set -euo pipefail
          ../scripts/ci/run-scan-with-tee.sh govulncheck govulncheck.out \
            'govulncheck: vulnerabilities found, see govulncheck.out above\n' \
            -- govulncheck -scan package ./...
      - name: Upload govulncheck output as workflow artifact
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'govulncheck (Go vulnerability database)'))) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-output
          path: go/govulncheck.out
          if-no-files-found: ignore
  gosec:
    name: gosec (Go static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [queue-selection, changes]
    if: ${{ github.event_name != 'workflow_run' && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'gosec (Go static analysis)')) }}
        uses: actions/checkout@v5
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'gosec (Go static analysis)')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'gosec (Go static analysis)')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Install gosec (pinned)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'gosec (Go static analysis)')) }}
        run: scripts/ci/go-install-retry.sh github.com/securego/gosec/v2/cmd/gosec@v2.27.1
      - name: Run gosec on every Go package (SARIF)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'gosec (Go static analysis)')) }}
        working-directory: go
        run: |
          set -euo pipefail
          gosec -severity=low -confidence=low -no-fail -fmt=sarif -out gosec.sarif ./...
          findings="$(jq '[.runs[].results[]] | length' gosec.sarif)"
          printf 'gosec: %s finding(s) in SARIF\n' "${findings}"
          if [ "${findings}" -ne 0 ]; then
            printf 'gosec: security findings present — see the SARIF / Security tab\n' >&2
            exit 1
          fi
      - name: Upload gosec SARIF to GitHub Security tab
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'gosec (Go static analysis)'))) && (always()) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: go/gosec.sarif
          category: gosec
  nancy:
    name: nancy (Sonatype dep CVE + license scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [queue-selection, changes]
    if: ${{ github.event_name != 'workflow_run' && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'nancy (Sonatype dep CVE + license scan)')) }}
        uses: actions/checkout@v5
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'nancy (Sonatype dep CVE + license scan)')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'nancy (Sonatype dep CVE + license scan)')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Install nancy (pinned)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'nancy (Sonatype dep CVE + license scan)')) }}
        run: scripts/ci/go-install-retry.sh github.com/sonatype-nexus-community/nancy@latest
      - name: Run nancy sleuth on go.sum
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'nancy (Sonatype dep CVE + license scan)')) }}
        working-directory: go
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! go list -json -deps ./... >deps.json 2>deps.err; then
            cat deps.err >&2
            printf 'nancy: go list -json -deps ./... failed, see deps.err above\n' >&2
            exit 1
          fi
          ../scripts/ci/run-scan-with-tee.sh nancy nancy.out \
            'nancy: sleuth exited %s, see nancy.out above (a real finding, or an OSS Index transport/auth failure — see #5804)\n' \
            -- nancy sleuth --no-color <deps.json
      - name: Upload nancy output as workflow artifact
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'nancy (Sonatype dep CVE + license scan)'))) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: nancy-output
          path: go/nancy.out
          if-no-files-found: ignore
