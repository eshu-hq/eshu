name: Security Scan
run-name: "${{ github.event_name == 'workflow_run' && format('Security Scan: triggered by {0} @ {1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha) || ' ' }}"
on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  workflow_run:
    workflows: ["Publish Image"]
    types: [completed]
concurrency:
  group: ci-leaf-security-scan-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  changes:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'changes')) && (github.event_name != 'workflow_run') }}
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lockstep: ${{ steps.lockstep.outputs.lockstep }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/*.md'
              - '!*.json'
              - '!docs/**/*.json'
              - '!scripts/**/*.json'
              - '!mkdocs.yml'
              - '!.github/**/*.md'
              - '!.agents/**'

      - name: Filter lockstep test inputs
        id: lockstep
        uses: dorny/paths-filter@v3
        with:
          # Unlike `code` above, this filter is all positives (the manifest-derived
          # lockstep list), so it needs the default `some` quantifier: a PR touching
          # ANY listed input must run the code-gated lanes. `every` would require a
          # file to match all entries at once and select nothing.
          predicate-quantifier: 'some'
          filters: |
            lockstep:
              - 'AGENTS.md'
              - 'docs/internal/design/430-nornicdb-graph-search-split.md'
              - 'docs/internal/design/5351-ifa-materialized-edge-known-gaps.md'
              - 'docs/internal/evidence/8869-collector-vault-live-census.md'
              - 'docs/internal/evidence/8870-vulnerability-intelligence-version-provenance.md'
              - 'docs/internal/evidence/8871-eshu-deploy-census.md'
              - 'docs/internal/evidence/8871-eshu-deploy-contract.md'
              - 'docs/internal/evidence/8874-eshu-cli-contract.md'
              - 'docs/internal/remote-validation/inventory.generated.json'
              - 'docs/public/deployment/credential-file-cleanup.md'
              - 'docs/public/deployment/service-runtimes-collectors.md'
              - 'docs/public/deployment/service-runtimes.md'
              - 'docs/public/languages/admitted-files.md'
              - 'docs/public/operate/3am-operator-runbook.md'
              - 'docs/public/reference/assistant-fast-path-hooks.md'
              - 'docs/public/reference/env-registry.md'
              - 'docs/public/reference/environment-collectors-supply-chain.md'
              - 'docs/public/reference/environment-collectors.md'
              - 'docs/public/reference/environment-ingestion-queues.md'
              - 'docs/public/reference/first-run-evidence.md'
              - 'docs/public/reference/generated/replay-coverage.md'
              - 'docs/public/reference/graph-backend-installation.md'
              - 'docs/public/reference/http-api.md'
              - 'docs/public/reference/http-api/collector-terminal-failure.md'
              - 'docs/public/reference/hybrid-retrieval-production-gate.md'
              - 'docs/public/reference/local-performance-envelope.md'
              - 'docs/public/reference/mcp-cookbook.md'
              - 'docs/public/reference/mcp-prompt-surface-audit.md'
              - 'docs/public/reference/mcp-tool-contract-matrix.md'
              - 'docs/public/reference/nornicdb-tuning.md'
              - 'docs/public/reference/reducer-claim-latency-gate.md'
              - 'docs/public/reference/searchbench-evidence/issue-1298-semantic-retrieval-proof-v1.json'
              - 'docs/public/reference/searchbench-evidence/issue-417-nornicdb-hybrid-retrieval-prototype-v1.json'
              - 'docs/public/reference/searchbench-evidence/issue-420-link-prediction-evaluation-v1.json'
              - 'docs/public/reference/searchbench-evidence/issue-421-rerank-protocol-evaluation-v1.json'
              - 'go/cmd/README.md'
              - 'go/cmd/api/CUTOVER_OWNERSHIP.md'
              - 'go/cmd/audit-preflight/testdata/codegraphcontext-already-tracked.md'
              - 'go/cmd/audit-preflight/testdata/gitnexus-missing.md'
              - 'go/cmd/audit-preflight/testdata/graphify-foundation-exists.md'
              - 'go/cmd/audit-preflight/testdata/incomplete.md'
              - 'go/cmd/collector-vault-live/testdata/8869-collector-vault-live-census.md'
              - 'go/cmd/eshu/cli_extraction_inventory.md'
              - 'go/cmd/ifa/README.md'
              - 'go/cmd/mcp-server/CUTOVER_OWNERSHIP.md'
              - 'go/cmd/scanner-worker/EXTRACTION_PREP.md'
              - 'go/internal/ask/catalog/README.md'
              - 'go/internal/cli/demo/README.md'
              - 'go/internal/cli/hookpreflight/AGENTS.md'
              - 'go/internal/cli/hookpreflight/README.md'
              - 'go/internal/collector/README.md'
              - 'go/internal/collector/sbom/SHIM_MAP.md'
              - 'go/internal/content/artifacts/README.md'
              - 'go/internal/facts/FACT_KIND_REGISTRIES.md'
              - 'go/internal/ifa/README.md'
              - 'go/internal/ifa/materializededges/README.md'
              - 'go/internal/ifa/testdata/5998-rationale-relative-path.md'
              - 'go/internal/query/repository/README.md'
              - 'go/internal/reducer/AGENTS.md'
              - 'go/internal/reducer/README.md'
              - 'go/internal/reducer/testdata/5998-rationale-relative-path.md'
              - 'go/internal/runtime/README.md'
              - 'go/internal/runtime/testdata/8894-component-extension-activations.md'
              - 'testdata/golden/documentation-positive.md'
  trivy-fs:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'trivy-fs')) && (github.event_name != 'workflow_run') }}
    name: Trivy filesystem scan (vuln + secret + config)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Read trivy skip-dirs from scripts/lib/trivy-skip-dirs.sh
        id: skipdirs
        shell: bash
        run: |
          source scripts/lib/trivy-skip-dirs.sh
          dirs="$(trivy_skip_dirs_csv .)"
          echo "dirs=${dirs}" >> "${GITHUB_OUTPUT}"
      - name: Run Trivy filesystem scan (vuln + secret + config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: ${{ steps.skipdirs.outputs.dirs }}
      - name: Upload Trivy fs SARIF to GitHub Security tab
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
  trivy-image:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'trivy-image')) && (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    name: Trivy image scan (ghcr.io/eshu-hq/eshu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out trusted default-branch policy
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve image reference from triggering workflow_run
        id: image
        env:
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/resolve-image-scan-ref.sh
      - name: Run Trivy image scan
        if: ${{ steps.image.outputs.skip != 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
      - name: Upload Trivy image SARIF to GitHub Security tab
        if: ${{ always() && steps.image.outputs.skip != 'true' && steps.image.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
  govulncheck:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'govulncheck')) && (github.event_name != 'workflow_run' && (github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' || needs.changes.outputs.lockstep == 'true'))) }}
    name: govulncheck (Go vulnerability database)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Install govulncheck (pinned)
        run: scripts/ci/go-install-retry.sh golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck on every Go package
        working-directory: go
        run: |
          set -euo pipefail
          ../scripts/ci/run-scan-with-tee.sh govulncheck govulncheck.out \
            'govulncheck: vulnerabilities found, see govulncheck.out above\n' \
            -- govulncheck -scan package ./...
      - name: Upload govulncheck output as workflow artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-output
          path: go/govulncheck.out
          if-no-files-found: ignore
  gosec:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'gosec')) && (github.event_name != 'workflow_run' && (github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' || needs.changes.outputs.lockstep == 'true'))) }}
    name: gosec (Go static analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Install gosec (pinned)
        run: scripts/ci/go-install-retry.sh github.com/securego/gosec/v2/cmd/gosec@v2.27.1
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run gosec on every Go package (SARIF)
        working-directory: go
        run: |
          set -euo pipefail
          gosec -severity=low -confidence=low -no-fail -fmt=sarif -out gosec.sarif ./...
          findings="$(jq '[.runs[].results[]] | length' gosec.sarif)"
          printf 'gosec: %s finding(s) in SARIF\n' "${findings}"
          if [ "${findings}" -ne 0 ]; then
            printf 'gosec: security findings present — see the SARIF / Security tab\n' >&2
            exit 1
          fi
      - name: Upload gosec SARIF to GitHub Security tab
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: go/gosec.sarif
          category: gosec
      - name: Fail-closed gosec gate (explicit package dirs)
        run: bash scripts/dev/precommit-go.sh gosec-all
  nancy:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'nancy')) && (github.event_name != 'workflow_run' && (github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' || needs.changes.outputs.lockstep == 'true'))) }}
    name: nancy (Sonatype dep CVE + license scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Install nancy (pinned)
        run: scripts/ci/go-install-retry.sh github.com/sonatype-nexus-community/nancy@latest
      - name: Run nancy sleuth on go.sum
        working-directory: go
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! go list -json -deps ./... >deps.json 2>deps.err; then
            cat deps.err >&2
            printf 'nancy: go list -json -deps ./... failed, see deps.err above\n' >&2
            exit 1
          fi
          ../scripts/ci/run-scan-with-tee.sh nancy nancy.out \
            'nancy: sleuth exited %s, see nancy.out above (a real finding, or an OSS Index transport/auth failure — see #5804)\n' \
            -- nancy sleuth --no-color <deps.json
      - name: Upload nancy output as workflow artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nancy-output
          path: go/nancy.out
          if-no-files-found: ignore
