# Shadow publish for the #8877 SBOM shadow window (Refs eshu-hq/eshu#8877).
#
# Dispatch-only: builds the shadow image FROM the in-tree pinned release worker
# digest (go/cmd/collector-sbom-shadow/Dockerfile.seed BASE_IMAGE), pushes
# ghcr.io/eshu-hq/eshu-sbom-shadow, runs the in-image smoke on the pushed
# digest as uid 10001, and emits the digest as a job output. No push, pull
# request, or workflow_call triggers: PRs never publish, and the emitted
# digest unblocks the pin grant-half after merge + dispatch.
#
# Permissions mirror the host release.yml push job (packages:write,
# id-token:write, attestations:write) and nothing broader. The build runs
# buildx with provenance + SBOM; the smoke asserts the window contract
# (complete, one result carrying the 13 pinned-document facts, nonzero exit
# on malformed input) through the real pushed bytes, not the local build.
#
# If dispatch fails at the push step (for example a denied token scope),
# this workflow stops there by design: a failed push is the re-escalation
# trigger, and no digest is emitted.

name: Shadow Publish (8877 sbom-shadow)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-publish-${{ github.ref }}
  cancel-in-progress: false

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"
  REGISTRY: ghcr.io
  SEED_IMAGE: ghcr.io/eshu-hq/eshu-sbom-shadow
  CI_BUILDKIT_IMAGE: ghcr.io/eshu-hq/ci-mirror-buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

jobs:
  build-push-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          # cache: false: setup-go would store the build cache a second time
          # in the 10 GB store (#9462, #9648). Pre-warm below downloads the modules.
          cache: false

      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh go

      - name: Build sbom-shadow extractor
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o cmd/collector-sbom-shadow/eshu-collector-sbom-shadow ./cmd/collector-sbom-shadow

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push shadow image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./go/cmd/collector-sbom-shadow/Dockerfile.seed
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.SEED_IMAGE }}:shadow-${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.SEED_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke the pushed digest as uid 10001
        env:
          SEED_REF: ${{ env.SEED_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Multi-arch push leaves nothing in the local store: pull the
          # pushed digest first so inspect and run assert the pushed bytes.
          docker pull "${SEED_REF}"
          user="$(docker image inspect --format '{{.Config.User}}' "${SEED_REF}")"
          test "${user}" = "10001:10001"
          cat > /tmp/shadow-smoke-request.json <<'EOF'
          {
            "protocol_version": "collector-sdk/v1alpha1",
            "claim": {
              "component_id": "dev.eshu.collector.sbom-8877-shadow",
              "instance_id": "sbom-8877-shadow-instance-1",
              "collector_kind": "sbom_document",
              "source_system": "sbom_document",
              "scope": {"id": "sbom://registry.example.com/library/example@sha256:1111", "kind": "image"},
              "source_run_id": "run-shadow-smoke",
              "generation_id": "gen-shadow-smoke",
              "work_item_id": "work-shadow-smoke",
              "fencing_token": "7",
              "attempt": 1,
              "deadline": "2026-11-07T04:00:00Z",
              "config_handle": "sbom-shadow-handle"
            },
            "contract": {"protocol_version": "collector-sdk/v1alpha1", "facts": []}
          }
          EOF
          docker run --user 10001 --rm -i "${SEED_REF}" \
            /usr/local/bin/eshu-collector-sbom-shadow \
            < /tmp/shadow-smoke-request.json > /tmp/shadow-smoke-result.json
          # Exactly one JSON value on stdout: the SDK result.
          jq -s -e 'length == 1' /tmp/shadow-smoke-result.json
          jq -e '.state == "complete"' /tmp/shadow-smoke-result.json
          jq -e '(.statuses // [] | length == 0)' /tmp/shadow-smoke-result.json
          jq -e '(.facts | length == 13)' /tmp/shadow-smoke-result.json
          jq -e '([.facts[] | .kind] | sort | join(" ") == "sbom.component sbom.component sbom.component sbom.component sbom.component sbom.dependency_relationship sbom.dependency_relationship sbom.dependency_relationship sbom.document sbom.external_reference sbom.warning sbom.warning sbom.warning")' /tmp/shadow-smoke-result.json
          jq -e '.generation.id == "gen-shadow-smoke" and (.generation.observed_at != null) and .page == null' /tmp/shadow-smoke-result.json
          # Malformed stdin fails closed: nonzero exit, no stdout bytes.
          if echo '{not-json' | docker run --user 10001 --rm -i "${SEED_REF}" \
            /usr/local/bin/eshu-collector-sbom-shadow > /tmp/shadow-smoke-bad.json 2>/tmp/shadow-smoke-bad.stderr; then
            echo "malformed input must exit nonzero" >&2
            exit 1
          fi
          test ! -s /tmp/shadow-smoke-bad.json

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Shadow publish"
            echo ""
            echo "Pushed \`${{ env.SEED_IMAGE }}@${DIGEST}\`; smoke passed as uid 10001 (complete, one result, 13 pinned facts; malformed input fails closed)."
          } >> "$GITHUB_STEP_SUMMARY"
