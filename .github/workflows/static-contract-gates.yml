name: Static Contract Gates

# Consolidates the credential-free static contract verifiers (#4218) that
# previously lived in one workflow file each (verify-openapi, verify-route-
# coverage, verify-edge-source-tool-coverage, verify-evidence-continuity,
# verify-skill-roundtrip, verify-telemetry-coverage, generate-operator-dashboard,
# contract-source-of-truth). One `changes` job (dorny/paths-filter) decides which
# gates the PR's changed paths select — mirroring specs/ci-gates.v1.yaml triggers
# — and a single matrix job runs only the selected gates, sharing one
# checkout + Go + ripgrep/jq setup instead of duplicating it across eight
# workflows. Each matrix entry keeps a readable, stable check name. On push to
# main every gate is included in the selected matrix.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed gate paths
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.filter.outputs.openapi }}
      route: ${{ steps.filter.outputs.route }}
      edge: ${{ steps.filter.outputs.edge }}
      evidence: ${{ steps.filter.outputs.evidence }}
      skill: ${{ steps.filter.outputs.skill }}
      skillworkflowrefs: ${{ steps.filter.outputs.skillworkflowrefs }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      envdoc: ${{ steps.filter.outputs.envdoc }}
      contract: ${{ steps.filter.outputs.contract }}
      bucketsync: ${{ steps.filter.outputs.bucketsync }}
      ifa: ${{ steps.filter.outputs.ifa }}
      ifaload: ${{ steps.filter.outputs.ifaload }}
      ifareplaydrive: ${{ steps.filter.outputs.ifareplaydrive }}
      heredoc: ${{ steps.filter.outputs.heredoc }}
      parserrelationship: ${{ steps.filter.outputs.parserrelationship }}
      docsrefs: ${{ steps.filter.outputs.docsrefs }}
      docsclienvrefs: ${{ steps.filter.outputs.docsclienvrefs }}
      querydoccommitrefs: ${{ steps.filter.outputs.querydoccommitrefs }}
      doccitations: ${{ steps.filter.outputs.doccitations }}
      measurementcite: ${{ steps.filter.outputs.measurementcite }}
      remotevalidation: ${{ steps.filter.outputs.remotevalidation }}
      maturitydrift: ${{ steps.filter.outputs.maturitydrift }}
      claudrules: ${{ steps.filter.outputs.claudrules }}
      rootcauseevidence: ${{ steps.filter.outputs.rootcauseevidence }}
      matrix: ${{ steps.gate-matrix.outputs.matrix }}
      any: ${{ steps.gate-matrix.outputs.any }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Filter changed paths against gate triggers
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # On push (no base), dorny treats everything as changed → all gates run.
          # Path sets mirror the gate triggers in specs/ci-gates.v1.yaml; the
          # gate-registry-drift check keeps the two in lockstep. Every filter
          # also includes this workflow + the registry so a change to either
          # re-runs all gates. (Self-check paths are inlined per filter rather
          # than via a YAML anchor — dorny's handling of an anchored *list* item
          # is version-dependent, and inlining is unambiguous.)
          filters: |
            openapi:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/query/**'
              - 'go/internal/mcp/**'
              - 'go/internal/serviceintelhttp/**'
              - 'specs/surface-inventory.v1.yaml'
              - 'specs/capability-catalog.v1.yaml'
              - 'specs/capability-matrix.v1.yaml'
              - 'scripts/*verify-openapi*.sh'
              - 'scripts/lib/*verify-openapi*.sh'
              - '.github/openapi-known-drift.txt'
            route:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/query/**'
              - 'go/cmd/api/**'
              - 'scripts/*verify-route-coverage*.sh'
            edge:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/relationships/**'
              - 'go/internal/collector/**'
              - 'go/internal/reducer/crossrepo/cross_repo_evidence_type.go'
              - 'specs/surface-inventory.v1.yaml'
              - 'scripts/*verify-edge-source-tool-coverage*.sh'
            evidence:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'specs/evidence-continuity.v1.yaml'
              - 'specs/capability-matrix.v1.yaml'
              - 'specs/capability-matrix/**'
              - 'go/cmd/eshu/**'
              - 'go/internal/capabilitycatalog/**'
              - 'go/internal/cigates/**'
              - 'go/internal/cli/**'
              - 'go/internal/collector/**'
              - 'go/internal/evidencecontinuity/**'
              - 'go/internal/facts/**'
              - 'go/internal/mcp/**'
              - 'go/internal/query/**'
              - 'go/internal/relationships/**'
              - 'scripts/*verify-evidence-continuity*.sh'
            skill:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/cmd/skillgen/**'
              - 'go/internal/extensions/skillgen/**'
              - '.agents/skills/**'
              - 'skill-fragments/**'
              # The gate compares fragments against this baseline, so a PR that
              # touches only expected/ must still create the named check; the
              # registry selects it and the two must not disagree.
              - 'expected/**'
              - 'scripts/*verify-skill-roundtrip*.sh'
            skillworkflowrefs:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - '.agents/skills/**'
              - '.github/workflows/**'
              - 'scripts/*verify-skill-workflow-refs*.sh'
            telemetry:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/**'
              - 'go/cmd/**'
              - 'docs/public/observability/telemetry-coverage.md'
              - 'scripts/*verify-telemetry-coverage*.sh'
              - 'scripts/lib/telemetry-coverage-*.sh'
              - 'scripts/lib/test-verify-telemetry-coverage-*'
            dashboard:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/query/**'
              - 'go/internal/mcp/**'
              - 'docs/public/observability/**'
              - 'scripts/*generate-operator-dashboard*.sh'
              - 'scripts/lib/operator-dashboard-*.json.tmpl'
              - 'scripts/lib/operator-dashboard-metrics.sh'
            envdoc:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/envregistry/**'
              - 'docs/public/reference/env-registry.md'
              - 'scripts/*env-registry-doc*.sh'
            contract:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/facts/**'
              - 'go/internal/collector/contracttest/**'
              - 'specs/fact-kind-registry.v1.yaml'
              - 'specs/collector_fact_contract.v1.yaml'
              - 'scripts/*verify-contracttest*.sh'
              - 'scripts/*fact-kind-registry*.sh'
            bucketsync:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/content/shape/**'
              - 'go/internal/collector/gitrepo/git_snapshot_entity_buckets.go'
              - 'go/internal/projector/canonical.go'
            ifa:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/ifa/**'
              - 'go/internal/synth/gcp/**'
              - 'go/cmd/ifa/**'
              - 'docs/internal/design/4389-ifa-conformance-platform.md'
              - 'specs/ifa-coverage-manifest.v1.yaml'
              - 'specs/fact-kind-registry.v1.yaml'
              - 'specs/replay-coverage-manifest.v1.yaml'
              - 'testdata/golden/e2e-20repo-snapshot.json'
              # The shell family registry. The Go blocker-shape lockstep test
              # parses these rows and binds each family's declared blocker_kind
              # to its real handler's write shape, so a row edit must select
              # this gate's CI check. A single '*' does not cross '/' in a
              # dorny filter, hence the explicit '**' on the rows directory.
              - 'scripts/lib/ifa_family_registry.sh'
              - 'scripts/lib/ifa_family_registry/**'
              # #5351 materialized-edge exhaustiveness gate: the SQL relationship
              # family's write path (edge_writer_sql.go, sql_relationship_*.go)
              # and its fixtures/manifest. A write-path-only regression here is
              # exactly the silent-no-op class the gate exists for and the pure
              # seam cannot catch, so it MUST retrigger the Ifa contract-layer
              # gate (which runs the pure ifa-materialized-edge-coverage go test).
              # The gate runs `go test ./internal/reducer/...` for the WHOLE TREE,
              # so any sibling file -- in the root or in a domain subpackage --
              # can change its verdict. It ran a
              # `-run TestMaterializedEdgeFamilies` filter until that regex went
              # stale twice, silently not selecting tests that had landed since.
              # specs/ci-gates.v1.yaml was broadened to 'go/internal/reducer/**'
              # for exactly that reason
              # (#5873) but this filter was not, so the registry could select the
              # gate as required while this workflow never scheduled it. The
              # aggregator then waited out its 55m timeout on a MISSING job and
              # failed required-gates-complete -- red that names no real defect
              # and points at no file. Keep this glob and the registry trigger in
              # lockstep; the per-file entries below stay as the reader's map of
              # what the gate is actually about.
              - 'go/internal/reducer/**'
              - 'go/internal/reducer/materialized_edge_families.go'
              - 'go/internal/reducer/shared_projection.go'
              - 'go/internal/reducer/sql_relationship_materialization.go'
              - 'go/internal/reducer/sql_relationship_embedded_query.go'
              - 'go/internal/reducer/sql_relationship_metadata.go'
              # The whole cypher package, mirroring the registry trigger
              # (#6181). The direct-family drift guard this gate runs parses
              # every non-test file in that package and follows each reducer
              # port through its call graph, so any file there can change the
              # verdict; the four per-file entries below reached 6 of 131 and
              # left every other direct writer unable to schedule this job.
              - 'go/internal/storage/cypher/**'
              - 'go/internal/storage/cypher/edge_writer_sql.go'
              - 'go/internal/storage/cypher/materialized_edge_*.go'
              - 'go/internal/storage/cypher/canonical_code_call_edges.go'
              - 'go/internal/storage/cypher/canonical_inheritance_edges.go'
              - 'specs/ifa-materialized-edge-coverage.v1.yaml'
              - 'specs/ifa-materialized-edge-coverage-direct.v1.yaml'
              - 'testdata/cassettes/sqlrelationships/**'
              - 'testdata/cassettes/codecalls/**'
              - 'testdata/cassettes/symbolruntime/**'
              - 'testdata/cassettes/codeowners/**'
              - 'testdata/cassettes/deployableunit/**'
              - 'testdata/cassettes/documentation/**'
              - 'testdata/cassettes/inheritance/**'
              - 'testdata/cassettes/iaminstanceprofilerole/**'
              - 'testdata/cassettes/kubernetesnamespaceenvironment/**'
              - 'testdata/cassettes/rationale/**'
              - 'testdata/cassettes/repodependency/**'
              - 'testdata/cassettes/shellexec/**'
              - 'testdata/cassettes/submodulepin/**'
              - 'testdata/cassettes/workloaddependency/**'
            ifaload:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/ifa/amplify.go'
              - 'go/internal/ifa/slots.go'
              - 'go/internal/ifa/saturation/**'
              - 'go/internal/ifa/throughput/**'
              - 'specs/scale-lab-corpus.v1.yaml'
              - 'go/internal/storage/cypher/backpressure_executor.go'
              - 'go/internal/storage/cypher/timeout_executor.go'
              - 'go/internal/storage/postgres/reducer_queue_helpers.go'
              - 'go/internal/storage/postgres/reducer_queue_readiness_sql.go'
              - 'go/internal/reducer/contract/intent.go'
              - 'go/internal/reducer/intent.go'
            ifareplaydrive:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'scripts/verify-ifa-replay-drive.sh'
              - 'scripts/test-verify-ifa-replay-drive.sh'
              - 'scripts/lib/ifa_mirror_pins.sh'
              - 'scripts/lib/ifa_private_data_pattern.sh'
              - 'scripts/lib/ifa_dead_command_line.sh'
            heredoc:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'scripts/**/*.sh'
              - 'scripts/heredoc-budget-baseline.txt'
              - 'go/cmd/heredoc-budget/**'
            parserrelationship:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'docs/**/*.md'
              - '*.md'
              - 'go/internal/parser/**'
              - 'go/internal/relationships/**'
              - 'specs/language-feature-parity-ledger.v1.yaml'
              - 'specs/parser-backing-ledger.v1.yaml'
              - 'scripts/lib/gate-diff-base.sh'
              - 'scripts/lib/parser_documented_test_commands.sh'
              - 'scripts/lib/parser_documented_test_goflags.sh'
              - 'scripts/lib/parser_documented_test_preamble_assignments.sh'
              - 'scripts/lib/parser_documented_test_scan.sh'
              - 'scripts/lib/parser_documented_test_selector.sh'
              - 'scripts/lib/parser_documented_test_workdir.sh'
              - 'scripts/lib/parser_selector_matcher.go'
              - 'scripts/lib/parser_relationship_language_ledger.sh'
              - 'scripts/lib/test-verify-parser-relationship-kit-*'
              - 'scripts/test-verify-parser-relationship-kit.sh'
              - 'scripts/verify-parser-relationship-kit.sh'
            docsrefs:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'docs/public/**'
              - 'docs/mkdocs.yml'
              - 'scripts/verify-docs-refs.sh'
              - 'scripts/test-verify-docs-refs.sh'
              - 'scripts/docs-refs-baseline.txt'
            docsclienvrefs:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'docs/public/**'
              - 'go/cmd/eshu/**'
              - 'go/internal/cli/**'
              - 'go/internal/envregistry/**'
              - 'go/cmd/docs-cli-env-refs/**'
              - 'scripts/verify-docs-cli-env-refs.sh'
              - 'scripts/test-verify-docs-cli-env-refs.sh'
              - 'scripts/lib/test-verify-docs-cli-env-refs-segment-cases.sh'
              - 'scripts/docs-cli-env-refs-baseline.txt'
              - 'scripts/docs-cli-env-refs-ceiling.txt'
            querydoccommitrefs:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'go/internal/query/*.md'
              - 'go/internal/queryplan/*.md'
              - 'scripts/verify-query-doc-commit-refs.sh'
              - 'scripts/test-verify-query-doc-commit-refs.sh'
            doccitations:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'docs/**'
              - 'go/**'
              - 'tests/fixtures/**'
              - 'scripts/verify-doc-citations.sh'
              - 'scripts/test-verify-doc-citations.sh'
              - 'scripts/lib/doc-citation-lines.sh'
              - 'scripts/lib/test-verify-doc-citations-line-cases.sh'
              - 'scripts/lib/test-verify-doc-citations-review-cases.sh'
              - 'scripts/lib/test-verify-doc-citations-binary-cases.sh'
              - 'scripts/lib/test-verify-doc-citations-preparation-cases.sh'
              - 'scripts/lib/gate-diff-base.sh'
              - 'scripts/docs-citations-baseline.txt'
            measurementcite:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'docs/internal/**'
              - 'docs/public/**'
              - 'go/**/evidence-*.md'
              - 'scripts/verify-measurement-citations.sh'
              - 'scripts/test-verify-measurement-citations.sh'
            remotevalidation:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'specs/capability-matrix.v1.yaml'
              - 'specs/capability-matrix/**'
              - 'go/internal/capabilitycatalog/**'
              - 'go/cmd/capability-inventory/**'
              - 'docs/internal/remote-validation/**'
              - 'docs/internal/evidence/**'
              - 'scripts/**/run-remote-e2e-*.sh'
              - 'scripts/**/verify-remote-e2e-*.sh'
              - 'scripts/**/*compose*.sh'
              - 'scripts/verify-golden-corpus-gate.sh'
              - 'scripts/**/run-k8s-*.sh'
              - 'scripts/**/verify-hosted-*.sh'
              - 'scripts/**/*e2e*.sh'
              - 'specs/remote-validation-baseline.txt'
              - 'specs/remote-validation-frozen.txt'
              - 'scripts/verify-remote-validation-artifacts.sh'
              - 'scripts/test-verify-remote-validation-artifacts.sh'
              - 'scripts/test-verify-remote-e2e-component-extension.sh'
              - 'scripts/generate-remote-validation-inventory.sh'
              - 'scripts/test-generate-remote-validation-inventory.sh'
              - 'tests/fixtures/component_extension_proof/**'
            claudrules:
              - '.claude/rules/**'
              - 'scripts/dev/claude-rules-lint.sh'
              - 'scripts/test-claude-rules-lint.sh'
              - 'specs/ci-gates.v1.yaml'
            maturitydrift:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'scripts/verify-golden-corpus-gate.sh'
              - 'testdata/golden/e2e-20repo-snapshot.json'
              - 'docs/public/languages/support-maturity.md'
              - 'specs/language-feature-parity-ledger.v1.yaml'
              - 'tests/fixtures/ecosystems/**'
              - 'scripts/verify-maturity-drift-guard.sh'
              - 'scripts/test-verify-maturity-drift-guard.sh'
              - 'scripts/lib/maturity-drift-guard-language-extensions.sh'
              - 'scripts/lib/golden-corpus-fixtures.sh'
            rootcauseevidence:
              - '.github/workflows/static-contract-gates.yml'
              - 'specs/ci-gates.v1.yaml'
              - 'docs/internal/evidence/**'
              - 'scripts/verify-root-cause-evidence.sh'
              - 'scripts/test-verify-root-cause-evidence.sh'
      - name: Build selected gate matrix
        id: gate-matrix
        run: |
          matrix_items=""
          any=false

          append_gate() {
            local selected="$1"
            local key="$2"
            local display="$3"
            local test="$4"
            local gate="$5"
            local run_gate=true

            if [[ "${test}" == "${gate}" ]]; then
              run_gate=false
            fi

            if [[ "${{ github.event_name }}" == "push" || "${selected}" == "true" ]]; then
              local item="{\"key\":\"${key}\",\"display\":\"${display}\",\"test\":\"${test}\",\"gate\":\"${gate}\",\"run_gate\":${run_gate}}"
              if [[ -n "${matrix_items}" ]]; then
                matrix_items="${matrix_items},${item}"
              else
                matrix_items="${item}"
              fi
              any=true
            fi
          }

          append_gate "${{ steps.filter.outputs.openapi }}" "openapi" "Verify OpenAPI gate" "bash scripts/test-verify-openapi.sh && bash scripts/test-verify-openapi-subpackage.sh" "scripts/verify-openapi.sh"
          append_gate "${{ steps.filter.outputs.route }}" "route" "Verify route coverage gate" "scripts/test-verify-route-coverage.sh" "scripts/verify-route-coverage.sh"
          append_gate "${{ steps.filter.outputs.edge }}" "edge" "Verify edge source-tool coverage gate" "bash scripts/test-verify-edge-source-tool-coverage.sh" "scripts/verify-edge-source-tool-coverage.sh"
          append_gate "${{ steps.filter.outputs.evidence }}" "evidence" "Verify evidence continuity gate" "scripts/test-verify-evidence-continuity.sh" "scripts/verify-evidence-continuity.sh"
          append_gate "${{ steps.filter.outputs.skill }}" "skill" "Verify skillgen roundtrip gate" "scripts/test-verify-skill-roundtrip.sh" "scripts/verify-skill-roundtrip.sh"
          append_gate "${{ steps.filter.outputs.skillworkflowrefs }}" "skillworkflowrefs" "Verify skill workflow refs gate" "bash scripts/test-verify-skill-workflow-refs.sh" "bash scripts/verify-skill-workflow-refs.sh"
          append_gate "${{ steps.filter.outputs.telemetry }}" "telemetry" "Verify telemetry coverage gate" "scripts/test-verify-telemetry-coverage.sh" "scripts/verify-telemetry-coverage.sh"
          append_gate "${{ steps.filter.outputs.dashboard }}" "dashboard" "Verify generate-operator-dashboard gate" "scripts/test-generate-operator-dashboard.sh" "scripts/generate-operator-dashboard.sh && git diff --exit-code -- docs/public/observability/dashboards/eshu-operator-overview.json"
          append_gate "${{ steps.filter.outputs.envdoc }}" "envdoc" "Verify environment registry reference gate" "scripts/test-generate-env-registry-doc.sh" "scripts/verify-env-registry-doc.sh"
          append_gate "${{ steps.filter.outputs.contract }}" "contract" "Verify contract source-of-truth gate" "scripts/test-verify-contracttest.sh && scripts/test-verify-fact-kind-registry.sh" "scripts/generate-contracttest.sh && scripts/generate-fact-kind-registry.sh && git diff --exit-code -- go/internal/collector/contracttest/contract_data.go go/internal/facts/fact_kind_registry.generated.go go/internal/facts/FACT_KIND_REGISTRIES.md"
          append_gate "${{ steps.filter.outputs.bucketsync }}" "bucketsync" "Verify content-entity bucket sync gate" "cd go && go test ./internal/content/shape -run 'TestContentEntityBucketsMatchCollectorTwin|TestContentEntityLabelsHaveProjectorLabels|TestBucketSyncDriftLedgerIsHonest|TestEveryProjectorLabelHasASource' -count=1" "cd go && go test ./internal/content/shape -run 'TestContentEntityBucketsMatchCollectorTwin|TestContentEntityLabelsHaveProjectorLabels|TestBucketSyncDriftLedgerIsHonest|TestEveryProjectorLabelHasASource' -count=1"
          append_gate "${{ steps.filter.outputs.ifa }}" "ifa" "Verify Ifa contract-layer gate" "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1" "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1"
          append_gate "${{ steps.filter.outputs.ifaload }}" "ifaload" "Verify Ifa P5 load/saturation gate" "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1" "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1"
          append_gate "${{ steps.filter.outputs.ifareplaydrive }}" "ifareplaydrive" "Verify Ifa replay-drive mirror gate" "bash scripts/test-verify-ifa-replay-drive.sh" "bash scripts/test-verify-ifa-replay-drive.sh"
          append_gate "${{ steps.filter.outputs.heredoc }}" "heredoc" "Verify heredoc budget gate" "cd go && go test ./cmd/heredoc-budget -count=1" "cd go && go run ./cmd/heredoc-budget -baseline ../scripts/heredoc-budget-baseline.txt"
          append_gate "${{ steps.filter.outputs.parserrelationship }}" "parserrelationship" "Verify parser relationship kit gate" "bash scripts/test-verify-parser-relationship-kit.sh" "bash scripts/verify-parser-relationship-kit.sh"
          append_gate "${{ steps.filter.outputs.docsrefs }}" "docsrefs" "Verify docs-refs gate" "bash scripts/test-verify-docs-refs.sh" "bash scripts/verify-docs-refs.sh"
          append_gate "${{ steps.filter.outputs.docsclienvrefs }}" "docsclienvrefs" "Verify docs CLI/env refs gate" "bash scripts/test-verify-docs-cli-env-refs.sh" "bash scripts/verify-docs-cli-env-refs.sh"
          append_gate "${{ steps.filter.outputs.querydoccommitrefs }}" "querydoccommitrefs" "Verify query-doc-commit-refs gate" "bash scripts/test-verify-query-doc-commit-refs.sh" "bash scripts/verify-query-doc-commit-refs.sh"
          append_gate "${{ steps.filter.outputs.doccitations }}" "doccitations" "Verify doc-citations gate" "bash scripts/test-verify-doc-citations.sh" "bash scripts/verify-doc-citations.sh"
          append_gate "${{ steps.filter.outputs.measurementcite }}" "measurementcite" "Verify measurement-citations gate" "bash scripts/test-verify-measurement-citations.sh" "bash scripts/verify-measurement-citations.sh"
          append_gate "${{ steps.filter.outputs.remotevalidation }}" "remotevalidation" "Verify remote-validation-artifacts gate" "bash scripts/test-generate-remote-validation-inventory.sh && bash scripts/test-verify-remote-validation-artifacts.sh && bash scripts/test-verify-dead-iac-compose.sh && bash scripts/test-verify-remote-e2e-component-extension.sh" "bash scripts/generate-remote-validation-inventory.sh && git diff --exit-code -- docs/internal/remote-validation/inventory.generated.json && bash scripts/verify-remote-validation-artifacts.sh"
          append_gate "${{ steps.filter.outputs.maturitydrift }}" "maturitydrift" "Verify maturity-drift-guard gate" "bash scripts/test-verify-maturity-drift-guard.sh" "bash scripts/verify-maturity-drift-guard.sh"
          append_gate "${{ steps.filter.outputs.claudrules }}" "claudrules" "Verify Claude path-scoped rules gate" "bash scripts/test-claude-rules-lint.sh" "bash scripts/dev/claude-rules-lint.sh"
          append_gate "${{ steps.filter.outputs.rootcauseevidence }}" "rootcauseevidence" "Verify root-cause-evidence gate" "bash scripts/test-verify-root-cause-evidence.sh" "bash scripts/verify-root-cause-evidence.sh"

          printf 'matrix={"include":[%s]}\n' "${matrix_items}" >>"${GITHUB_OUTPUT}"
          printf 'any=%s\n' "${any}" >>"${GITHUB_OUTPUT}"

  gate:
    name: ${{ matrix.display }}
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install ripgrep and jq
        run: scripts/ci/install-apt-packages.sh ripgrep jq
      - name: Run test mirror (${{ matrix.key }})
        run: ${{ matrix.test }}
      - name: Run gate (${{ matrix.key }})
        if: ${{ matrix.run_gate }}
        run: ${{ matrix.gate }}
