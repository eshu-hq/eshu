name: Static Contract Gates

# Runs the repository's genuine consumer-facing product-contract verifiers
# serially on a single runner (one checkout, one cache restore, one container).
# Meta-policing, doc-citation, and script self-test checks were retired from
# automatic PR/main runs; heavy build-tag sweeps run nightly in tagged-builds.yml.
on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'go/internal/**'
      - 'go/cmd/**'
      - 'go/go.mod'
      - 'go/go.sum'
      - 'specs/**'
      - 'testdata/cassettes/**'
      - 'docs/public/observability/**'
      - 'docs/public/reference/env-registry*'
      - 'docs/public/reference/env-registry/**'
      - '.github/openapi-known-drift.txt'
      - '.github/workflows/static-contract-gates.yml'
  workflow_dispatch:

concurrency:
  group: ci-leaf-static-contract-gates-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  gate:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'gate') }}
    name: Product Contract Gates
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    defaults: {run: {shell: bash}}
    container: ghcr.io/eshu-hq/ci-tools@sha256:5bd016995aa47cb5c292b99e2354b235fc5f5883882f14fadf31535579beda50
    env:
      GOTOOLCHAIN: local
      GOCACHE: /tmp/eshu-ci/go-build
      GOMODCACHE: /tmp/eshu-ci/go-mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Restore-only on pull requests (#9648). A main push saves a fresh copy
      # on a miss in the last step.
      - name: Restore static-contract cache
        id: static-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/eshu-ci
          key: "${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go/go.sum') }}"

      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Verify OpenAPI surface
        run: scripts/verify-openapi.sh

      - name: Verify edge source-tool coverage
        run: scripts/verify-edge-source-tool-coverage.sh

      - name: Verify evidence continuity
        run: scripts/verify-evidence-continuity.sh

      - name: Verify contract source-of-truth and fact-kind registry
        run: |
          scripts/generate-contracttest.sh
          scripts/generate-fact-kind-registry.sh
          git diff --exit-code -- \
            go/internal/collector/conformance/contract/data.go \
            go/internal/facts/fact_kind_registry.generated.go \
            go/internal/facts/FACT_KIND_REGISTRIES.md \
            specs/fact-kind-registry.v1.yaml \
            specs/fact-kind-registry-contracts.d

      - name: Verify parser relationship kit
        run: bash scripts/verify-parser-relationship-kit.sh

      - name: Verify telemetry coverage
        run: scripts/verify-telemetry-coverage.sh

      - name: Verify operator dashboard parity
        run: |
          scripts/generate-operator-dashboard.sh
          git diff --exit-code -- docs/public/observability/dashboards/eshu-operator-overview.json

      - name: Verify environment registry reference
        run: scripts/verify-env-registry-doc.sh

      # #6979: feed the cassette-author identifier check from a repository
      # secret on same-repo PRs and main pushes. Fork PRs cannot read secrets,
      # so this step is skipped there and the gate runs canary-only.
      - name: Provide private identifiers for cassette-author gate
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'eshu-hq/eshu' }}
        env:
          ESHU_PRIVATE_IDENTIFIERS: ${{ secrets.ESHU_PRIVATE_IDENTIFIERS }}
        run: |
          set -euo pipefail
          [[ -n "${ESHU_PRIVATE_IDENTIFIERS}" ]] || { echo "cassette-author identifiers: ESHU_PRIVATE_IDENTIFIERS secret is empty or missing" >&2; exit 1; }
          identifiers_file="$(mktemp -t eshu-private-identifiers.XXXXXX)"
          printf '%s\n' "${ESHU_PRIVATE_IDENTIFIERS}" > "${identifiers_file}"
          echo "ESHU_PRIVATE_IDENTIFIERS_FILE=${identifiers_file}" >> "${GITHUB_ENV}"
          echo "ESHU_PRIVATE_IDENTIFIERS_REQUIRED=1" >> "${GITHUB_ENV}"

      - name: Verify cassette author
        run: bash scripts/verify-cassette-author.sh

      - name: Save static-contract cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.static-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/eshu-ci
          key: ${{ steps.static-cache.outputs.cache-primary-key }}
