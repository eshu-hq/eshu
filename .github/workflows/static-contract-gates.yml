name: Static Contract Gates
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
jobs:
  queue-selection:
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: static-contract-gates.yml
  changes:
    needs: queue-selection
    name: Detect changed gate paths
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gate-matrix.outputs.matrix }}
      any: ${{ steps.gate-matrix.outputs.any }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Claude path-scoped rules gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Ifa P5 load/saturation gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Ifa contract-layer gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Ifa replay-drive mirror gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify OpenAPI gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify cassette author gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify content-entity bucket sync gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify contract source-of-truth gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify doc-citations gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify docker-publish shape gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify docs CLI/env refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify docs-refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify edge source-tool coverage gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify environment registry reference gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify evidence continuity gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify generate-operator-dashboard gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify heredoc budget gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify maturity-drift-guard gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify measurement-citations gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify moved-file-refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify parser relationship kit gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify pg-statement-report gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify query-doc-commit-refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify remote-validation-artifacts gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify root-cause-evidence gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify route coverage gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify skill workflow refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify skillgen roundtrip gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify tagged-builds gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Docker Hub login gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify telemetry coverage gate')) }}
        uses: actions/checkout@v5
      - name: Filter changed paths against gate triggers
        id: filter
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Claude path-scoped rules gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Ifa P5 load/saturation gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Ifa contract-layer gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Ifa replay-drive mirror gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify OpenAPI gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify cassette author gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify content-entity bucket sync gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify contract source-of-truth gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify doc-citations gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify docker-publish shape gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify docs CLI/env refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify docs-refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify edge source-tool coverage gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify environment registry reference gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify evidence continuity gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify generate-operator-dashboard gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify heredoc budget gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify maturity-drift-guard gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify measurement-citations gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify moved-file-refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify parser relationship kit gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify pg-statement-report gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify query-doc-commit-refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify remote-validation-artifacts gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify root-cause-evidence gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify route coverage gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify skill workflow refs gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify skillgen roundtrip gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify tagged-builds gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify Docker Hub login gate') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify telemetry coverage gate'))) && (github.event_name != 'merge_group') }}
