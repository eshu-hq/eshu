name: Static Contract Gates

# Consolidates credential-free static contract verifiers into one path-filtered
# matrix. PR selection mirrors specs/ci-gates.v1.yaml; pushes to main select every
# gate. Entries share one checkout and tool setup while retaining stable names.
on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  # Merge-queue entries (#7111): every job runs, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  # Main has no merge queue since 2026-10-16 (#8288): inert until re-enabled.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: ci-leaf-static-contract-gates-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  queue-selection:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'queue-selection') }}
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: static-contract-gates.yml
  changes:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'changes') }}
    needs: queue-selection
    name: Detect changed gate paths
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      openapi: ${{ steps.filter.outputs.openapi }}
      route: ${{ steps.filter.outputs.route }}
      edge: ${{ steps.filter.outputs.edge }}
      evidence: ${{ steps.filter.outputs.evidence }}
      skill: ${{ steps.filter.outputs.skill }}
      skillworkflowrefs: ${{ steps.filter.outputs.skillworkflowrefs }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      envdoc: ${{ steps.filter.outputs.envdoc }}
      contract: ${{ steps.filter.outputs.contract }}
      bucketsync: ${{ steps.filter.outputs.bucketsync }}
      ifa: ${{ steps.filter.outputs.ifa }}
      ifaload: ${{ steps.filter.outputs.ifaload }}
      ifareplaydrive: ${{ steps.filter.outputs.ifareplaydrive }}
      cassetteauthor: ${{ steps.filter.outputs.cassetteauthor }}
      heredoc: ${{ steps.filter.outputs.heredoc }}
      parserrelationship: ${{ steps.filter.outputs.parserrelationship }}
      docsrefs: ${{ steps.filter.outputs.docsrefs }}
      docsclienvrefs: ${{ steps.filter.outputs.docsclienvrefs }}
      querydoccommitrefs: ${{ steps.filter.outputs.querydoccommitrefs }}
      doccitations: ${{ steps.filter.outputs.doccitations }}
      movedfilerefs: ${{ steps.filter.outputs.movedfilerefs }}
      measurementcite: ${{ steps.filter.outputs.measurementcite }}
      remotevalidation: ${{ steps.filter.outputs.remotevalidation }}
      maturitydrift: ${{ steps.filter.outputs.maturitydrift }}
      claudrules: ${{ steps.filter.outputs.claudrules }}
      rootcauseevidence: ${{ steps.filter.outputs.rootcauseevidence }}
      pgstatementreport: ${{ steps.filter.outputs.pgstatementreport }}
      collectorcutoverrollback: ${{ steps.filter.outputs.collectorcutoverrollback }}
      dockerpublish: ${{ steps.filter.outputs.dockerpublish }}
      dockerhublogin: ${{ steps.filter.outputs.dockerhublogin }}
      workflowscriptcheckout: ${{ steps.filter.outputs.workflowscriptcheckout }}
      readinessderive: ${{ steps.filter.outputs.readinessderive }}
      matrix: ${{ steps.gate-matrix.outputs.matrix }}
      any: ${{ steps.gate-matrix.outputs.any }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        uses: actions/checkout@v5
      # merge_group: skip the diff and select every gate, exactly as push
      # does below. required-gates.yml selects which of them a queue entry
      # needs from its own three-dot diff against main, so every gate it can
      # select must have run.
      - name: Filter changed paths against gate triggers
        id: filter
        if: ${{ github.event_name != 'merge_group' }}
        uses: dorny/paths-filter@v3
        with:
          # On push (no base), dorny treats everything as changed → all gates run.
          # Path sets mirror the gate triggers in specs/ci-gates.v1.yaml; the
          # gate-registry-drift check keeps the two in lockstep. Every filter
          # also includes this workflow + the registry so a change to either
          # re-runs all gates. (Self-check paths are inlined per filter rather
          # than via a YAML anchor — dorny's handling of an anchored *list* item
          # is version-dependent, and inlining is unambiguous.)
          filters: .github/static-contract-filters.yml
      - name: Build selected gate matrix
        id: gate-matrix
        env:
          QUEUE_JOBS: ${{ needs.queue-selection.outputs.jobs }}
          PLAN_GATES: ${{ inputs.plan_gates }}
        run: |
          matrix_items=""
          any=false

          # $7 is the job timeout in minutes, defaulting to 15. It is per-gate
          # because every gate in this matrix shares one job definition, so a
          # blanket raise would also stop a genuine hang in the other 25 from
          # being cancelled.
          append_gate() {
            local selected="$1"
            local key="$2"
            local display="$3"
            local test="$4"
            local gate="$5"
            local gate_ids="$6"
            local timeout="${7:-15}"
            local run_gate=true
            local queue_selected=true
            if [[ "${{ github.event_name }}" == "merge_group" ]]; then
              queue_selected=$(jq --arg job "${display}" 'index($job) != null' <<< "${QUEUE_JOBS}")
              [[ "${queue_selected}" == true ]] || run_gate=false
            fi

            if [[ "${test}" == "${gate}" ]]; then
              run_gate=false
            fi
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              local id allowed=false
              IFS=',' read -r -a ids <<< "${gate_ids}"
              for id in "${ids[@]}"; do
                if jq -e --arg id "${id}" 'index($id) != null' <<< "${PLAN_GATES}" > /dev/null; then
                  allowed=true
                  break
                fi
              done
              [[ "${allowed}" == true ]] || return 0
            fi

            if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "merge_group" || "${selected}" == "true" ]]; then
              local item="{\"key\":\"${key}\",\"display\":\"${display}\",\"test\":\"${test}\",\"gate\":\"${gate}\",\"run_gate\":${run_gate},\"queue_selected\":${queue_selected},\"timeout\":${timeout}}"
              if [[ -n "${matrix_items}" ]]; then
                matrix_items="${matrix_items},${item}"
              else
                matrix_items="${item}"
              fi
              any=true
            fi
          }

          append_gate "${{ steps.filter.outputs.openapi }}" "openapi" "Verify OpenAPI gate" "bash scripts/test-verify-openapi.sh && bash scripts/test-verify-openapi-subpackage.sh" "scripts/verify-openapi.sh" "openapi-surface"
          append_gate "${{ steps.filter.outputs.route }}" "route" "Verify route coverage gate" "scripts/test-verify-route-coverage.sh && bash scripts/test-gate-fetch-base-guard.sh" "scripts/verify-route-coverage.sh" "route-coverage"
          append_gate "${{ steps.filter.outputs.edge }}" "edge" "Verify edge source-tool coverage gate" "bash scripts/test-verify-edge-source-tool-coverage.sh" "scripts/verify-edge-source-tool-coverage.sh" "edge-source-tool-coverage"
          append_gate "${{ steps.filter.outputs.evidence }}" "evidence" "Verify evidence continuity gate" "scripts/test-verify-evidence-continuity.sh" "scripts/verify-evidence-continuity.sh" "evidence-continuity"
          append_gate "${{ steps.filter.outputs.skill }}" "skill" "Verify skillgen roundtrip gate" "scripts/test-verify-skill-roundtrip.sh" "scripts/verify-skill-roundtrip.sh" "skill-roundtrip"
          append_gate "${{ steps.filter.outputs.skillworkflowrefs }}" "skillworkflowrefs" "Verify skill workflow refs gate" "bash scripts/test-verify-skill-workflow-refs.sh" "bash scripts/verify-skill-workflow-refs.sh" "skill-workflow-refs"
          append_gate "${{ steps.filter.outputs.telemetry }}" "telemetry" "Verify telemetry coverage gate" "scripts/test-verify-telemetry-coverage.sh" "scripts/verify-telemetry-coverage.sh" "telemetry-coverage"
          append_gate "${{ steps.filter.outputs.dashboard }}" "dashboard" "Verify generate-operator-dashboard gate" "scripts/test-generate-operator-dashboard.sh" "scripts/generate-operator-dashboard.sh && git diff --exit-code -- docs/public/observability/dashboards/eshu-operator-overview.json" "operator-dashboard"
          append_gate "${{ steps.filter.outputs.envdoc }}" "envdoc" "Verify environment registry reference gate" "scripts/test-generate-env-registry-doc.sh" "scripts/verify-env-registry-doc.sh" "env-registry-doc"
          append_gate "${{ steps.filter.outputs.contract }}" "contract" "Verify contract source-of-truth gate" "scripts/test-verify-contracttest.sh && scripts/test-verify-fact-kind-registry.sh" "scripts/generate-contracttest.sh && scripts/generate-fact-kind-registry.sh && git diff --exit-code -- go/internal/collector/conformance/contract/data.go go/internal/facts/fact_kind_registry.generated.go go/internal/facts/FACT_KIND_REGISTRIES.md specs/fact-kind-registry.v1.yaml specs/fact-kind-registry-contracts.d" "contract-source-of-truth,fact-kind-registry"
          append_gate "${{ steps.filter.outputs.bucketsync }}" "bucketsync" "Verify content-entity bucket sync gate" "cd go && go test ./internal/content/shape -run 'TestContentEntityBucketsMatchCollectorTwin|TestContentEntityLabelsHaveProjectorLabels|TestBucketSyncDriftLedgerIsHonest|TestEveryProjectorLabelHasASource' -count=1" "cd go && go test ./internal/content/shape -run 'TestContentEntityBucketsMatchCollectorTwin|TestContentEntityLabelsHaveProjectorLabels|TestBucketSyncDriftLedgerIsHonest|TestEveryProjectorLabelHasASource' -count=1" "content-entity-bucket-sync"
          append_gate "${{ steps.filter.outputs.ifa }}" "ifa" "Verify Ifa contract-layer gate" "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1" "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1" "ifa-contract-layer,ifa-materialized-edge-coverage"
          append_gate "${{ steps.filter.outputs.ifaload }}" "ifaload" "Verify Ifa P5 load/saturation gate" "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1" "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1" "ifa-load-saturation"
          append_gate "${{ steps.filter.outputs.ifareplaydrive }}" "ifareplaydrive" "Verify Ifa replay-drive mirror gate" "bash scripts/test-verify-ifa-replay-drive.sh" "bash scripts/test-verify-ifa-replay-drive.sh" "ifa-replay-drive"
          append_gate "${{ steps.filter.outputs.cassetteauthor }}" "cassetteauthor" "Verify cassette author gate" "bash scripts/test-verify-cassette-author.sh" "bash scripts/verify-cassette-author.sh" "cassette-author"
          append_gate "${{ steps.filter.outputs.heredoc }}" "heredoc" "Verify heredoc budget gate" "cd go && go test ./cmd/heredoc-budget -count=1" "cd go && go run ./cmd/heredoc-budget -baseline ../scripts/heredoc-budget-baseline.txt" "heredoc-budget"
          append_gate "${{ steps.filter.outputs.parserrelationship }}" "parserrelationship" "Verify parser relationship kit gate" "bash scripts/test-verify-parser-relationship-kit.sh" "bash scripts/verify-parser-relationship-kit.sh" "parser-relationship-kit"
          append_gate "${{ steps.filter.outputs.docsrefs }}" "docsrefs" "Verify docs-refs gate" "bash scripts/test-verify-docs-refs.sh" "bash scripts/verify-docs-refs.sh" "docs-refs"
          append_gate "${{ steps.filter.outputs.docsclienvrefs }}" "docsclienvrefs" "Verify docs CLI/env refs gate" "bash scripts/test-verify-docs-cli-env-refs.sh" "bash scripts/verify-docs-cli-env-refs.sh" "docs-cli-env-refs"
          append_gate "${{ steps.filter.outputs.querydoccommitrefs }}" "querydoccommitrefs" "Verify query-doc-commit-refs gate" "bash scripts/test-verify-query-doc-commit-refs.sh" "bash scripts/verify-query-doc-commit-refs.sh" "query-doc-commit-refs"
          append_gate "${{ steps.filter.outputs.doccitations }}" "doccitations" "Verify doc-citations gate" "bash scripts/test-verify-doc-citations.sh" "bash scripts/verify-doc-citations.sh" "doc-citations"
          append_gate "${{ steps.filter.outputs.movedfilerefs }}" "movedfilerefs" "Verify moved-file-refs gate" "bash scripts/test-verify-moved-file-refs.sh" "bash scripts/verify-moved-file-refs.sh" "moved-file-refs"
          append_gate "${{ steps.filter.outputs.measurementcite }}" "measurementcite" "Verify measurement-citations gate" "bash scripts/test-verify-measurement-citations.sh && bash scripts/test-verify-measurement-citations-wrapper.sh" "bash scripts/verify-measurement-citations.sh" "measurement-citations"
          append_gate "${{ steps.filter.outputs.remotevalidation }}" "remotevalidation" "Verify remote-validation-artifacts gate" "bash scripts/test-generate-remote-validation-inventory.sh && bash scripts/test-verify-remote-validation-artifacts.sh && bash scripts/test-verify-dead-iac-compose.sh && bash scripts/test-verify-remote-e2e-component-extension.sh && bash scripts/test-verify-k8s-two-team-governance-proof.sh && bash scripts/test-k8s-two-team-governance-provenance.sh" "bash scripts/generate-remote-validation-inventory.sh && git diff --exit-code -- docs/internal/remote-validation/inventory.generated.json && bash scripts/verify-remote-validation-artifacts.sh" "remote-validation-artifacts"
          append_gate "${{ steps.filter.outputs.maturitydrift }}" "maturitydrift" "Verify maturity-drift-guard gate" "bash scripts/test-verify-maturity-drift-guard.sh" "bash scripts/verify-maturity-drift-guard.sh" "maturity-drift-guard"
          append_gate "${{ steps.filter.outputs.claudrules }}" "claudrules" "Verify Claude path-scoped rules gate" "bash scripts/test-claude-rules-lint.sh" "bash scripts/dev/claude-rules-lint.sh" "claude-rules-scope"
          append_gate "${{ steps.filter.outputs.rootcauseevidence }}" "rootcauseevidence" "Verify root-cause-evidence gate" "bash scripts/test-verify-root-cause-evidence.sh" "bash scripts/verify-root-cause-evidence.sh" "root-cause-evidence"
          append_gate "${{ steps.filter.outputs.pgstatementreport }}" "pgstatementreport" "Verify pg-statement-report gate" "bash scripts/test-pg-statement-report.sh" "bash scripts/test-pg-statement-report.sh" "pg-statement-report"
          append_gate "${{ steps.filter.outputs.collectorcutoverrollback }}" "collectorcutoverrollback" "Verify collector-cutover-rollback gate" "bash scripts/test-collector-cutover-rollback.sh" "bash scripts/test-collector-cutover-rollback.sh" "collector-cutover-rollback"
          append_gate "${{ steps.filter.outputs.dockerpublish }}" "dockerpublish" "Verify docker-publish shape gate" "bash scripts/test-verify-docker-publish-moving-tags.sh && bash scripts/test-verify-docker-publish-pr-platforms.sh && bash scripts/test-promote-moving-tags.sh && bash scripts/test-resolve-image-scan-ref.sh && bash scripts/dev/test-publish-ci-image-mirrors.sh && bash scripts/dev/test-docker-publish-ci-mirror-mode.sh && bash scripts/ci/test-docker-publish-extracted-steps.sh" "bash scripts/test-verify-docker-publish-moving-tags.sh && bash scripts/test-verify-docker-publish-pr-platforms.sh && bash scripts/test-promote-moving-tags.sh && bash scripts/test-resolve-image-scan-ref.sh && bash scripts/dev/test-publish-ci-image-mirrors.sh && bash scripts/dev/test-docker-publish-ci-mirror-mode.sh && bash scripts/ci/test-docker-publish-extracted-steps.sh" "docker-publish-shape"
          # 30, not the default 15: the 142-check suite (bash scripts/test-verify-
          # dockerhub-login.sh) forks awk, rg and yq per case. Measured on loaded
          # 18-core Macs (three suites at once, load average 25 to 50): 688 to
          # 1004 s wall under BSD awk, 655 to 1088 s under gawk, 548 to 676 s under
          # mawk. The slowest sample is over the 900 s default, so a cell on the
          # default would be cancelled; 30 minutes (1800 s) leaves 1.65x margin
          # over the slowest sample.
          append_gate "${{ steps.filter.outputs.dockerhublogin }}" "dockerhublogin" "Verify Docker Hub login gate" "bash scripts/test-verify-dockerhub-login.sh && bash scripts/test-ci-image-compose.sh && bash scripts/ci/test-image-overrides.sh && bash scripts/ci/test-build-reproducibility-image.sh && bash scripts/ci/test-mirror-images.sh && python3 scripts/ci/test-tools-workflow.py" "bash scripts/verify-dockerhub-login.sh" "dockerhub-login" 30
          append_gate "${{ steps.filter.outputs.workflowscriptcheckout }}" "workflowscriptcheckout" "Verify workflow script checkout gate" "bash scripts/test-verify-workflow-script-checkout.sh" "bash scripts/verify-workflow-script-checkout.sh" "workflow-script-checkout"
          append_gate "${{ steps.filter.outputs.readinessderive }}" "readinessderive" "Verify live-readiness registration drift gate" "python3 scripts/test-live-postgres-readiness-child-env.py && bash scripts/test-generate-live-postgres-readiness.sh" "bash scripts/verify-live-postgres-readiness-drift.sh" "live-readiness-registration-drift"
          # The observed cold sweep took 25m31s for 73 configurations. Its old
          # 30m job expired during a 3m35s cache save, after vet passed. A 40m
          # envelope covers that recorded sweep, bounded restore, setup/cleanup, and
          # at least 25% sweep reserve. This cell restores but never saves.
          append_gate "${{ steps.filter.outputs.taggedbuilds }}" "taggedbuilds" "Verify tagged-builds gate" "bash scripts/test-verify-tagged-builds.sh && python3 scripts/ci/test-tagged-build-budget.py" "bash scripts/verify-tagged-builds.sh --all" "tagged-builds" 40

          printf 'matrix={"include":[%s]}\n' "${matrix_items}" >>"${GITHUB_OUTPUT}"
          printf 'any=%s\n' "${any}" >>"${GITHUB_OUTPUT}"

  gate:
    if: ${{ (github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'gate')) && (github.event_name == 'merge_group' || needs.changes.outputs.any == 'true') }}
    name: ${{ matrix.display }}
    needs: [queue-selection, changes]
    # merge_group lists every gate in the matrix (see append_gate), so `any`
    # is true there; the explicit arm lets ci-gates validate prove this job
    # always runs on a queue entry.
    timeout-minutes: ${{ matrix.timeout }}
    runs-on: ubuntu-24.04
    defaults: {run: {shell: bash}}
    container: ${{ (github.event_name != 'merge_group' || matrix.queue_selected) && 'ghcr.io/eshu-hq/ci-tools@sha256:2cd4305390057560cd876df8c3350e296b7df0b4b11a3d04e3a7d904d169a776' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env: {GOTOOLCHAIN: local, GOCACHE: /tmp/eshu-ci/go-build, GOMODCACHE: /tmp/eshu-ci/go-mod}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
        if: ${{ github.event_name != 'merge_group' || matrix.queue_selected }}
      - if: ${{ (github.event_name != 'merge_group' || matrix.queue_selected) && matrix.key != 'taggedbuilds' }}
        uses: actions/cache@v4
        with: {path: /tmp/eshu-ci, key: "${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go/go.sum') }}"}
      # Cache transport is acceleration, not proof. Tagged builds must run on a
      # cache miss and must not archive its large cache after the assertions.
      - name: Restore tagged-build cache
        id: tagged-cache
        if: ${{ (github.event_name != 'merge_group' || matrix.queue_selected) && matrix.key == 'taggedbuilds' }}
        uses: actions/cache/restore@v4
        timeout-minutes: 2
        continue-on-error: true
        with: {path: /tmp/eshu-ci, key: "${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go/go.sum') }}"}
      - name: Report tagged-build cache outcome
        id: tagged-cache-outcome
        if: ${{ !cancelled() && (github.event_name != 'merge_group' || matrix.queue_selected) && matrix.key == 'taggedbuilds' }}
        env:
          CACHE_OUTCOME: ${{ steps.tagged-cache.outcome }}
          CACHE_HIT: ${{ steps.tagged-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_OUTCOME}" != success ]]; then
            echo "::warning::Tagged-build cache restore failed or timed out; discard partial cache and run the full cold proof."
            # Go module-cache directories are read-only after extraction.
            for cache_dir in "${GOCACHE}" "${GOMODCACHE}"; do
              if [[ -d "${cache_dir}" ]]; then
                chmod -R u+w "${cache_dir}"
              fi
            done
            rm -rf -- "${GOCACHE}" "${GOMODCACHE}"
          elif [[ "${CACHE_HIT}" != true ]]; then
            echo "::notice::Tagged-build cache miss; run the full cold proof."
          else
            echo "Tagged-build cache restored; run the full proof."
          fi
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || matrix.queue_selected }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run test mirror (${{ matrix.key }})
        if: ${{ github.event_name != 'merge_group' || matrix.queue_selected }}
        run: ${{ matrix.test }}
      # #6979: feed the cassette-author identifier check from a repository
      # secret on same-repo PRs, merge-queue entries, and main pushes.
      # Fork PRs cannot read secrets, so this step is skipped there and the
      # gate runs canary-only with its warning. (push is main-only per this
      # workflow's on.push.branches, so the bare event check is correctly
      # scoped; without merge_group/push coverage a post-PR secret change
      # would pass the queue gate unnoticed.)
      # After the test mirror on purpose: the mirror asserts the
      # unset/canary-only behavior, which exported vars would mask. The
      # secret value is never echoed; the gate prints only the loaded count.
      - name: Provide private identifiers for cassette-author gate
        if: ${{ (github.event_name != 'merge_group' || matrix.queue_selected) && (matrix.key == 'cassetteauthor' && (github.event_name == 'merge_group' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == 'eshu-hq/eshu')) }}
        env:
          ESHU_PRIVATE_IDENTIFIERS: ${{ secrets.ESHU_PRIVATE_IDENTIFIERS }}
        run: |
          set -euo pipefail
          [[ -n "${ESHU_PRIVATE_IDENTIFIERS}" ]] || { echo "cassette-author identifiers: ESHU_PRIVATE_IDENTIFIERS secret is empty or missing" >&2; exit 1; }
          identifiers_file="$(mktemp -t eshu-private-identifiers.XXXXXX)"
          printf '%s\n' "${ESHU_PRIVATE_IDENTIFIERS}" > "${identifiers_file}"
          echo "ESHU_PRIVATE_IDENTIFIERS_FILE=${identifiers_file}" >> "${GITHUB_ENV}"
          echo "ESHU_PRIVATE_IDENTIFIERS_REQUIRED=1" >> "${GITHUB_ENV}"
      - name: Run gate (${{ matrix.key }})
        timeout-minutes: ${{ matrix.key == 'taggedbuilds' && 35 || matrix.timeout }}
        if: ${{ matrix.run_gate }}
        run: ${{ matrix.gate }}
