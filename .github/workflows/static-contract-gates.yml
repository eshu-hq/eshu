name: Static Contract Gates

# Consolidates credential-free static contract verifiers into one path-filtered
# matrix. PR selection mirrors specs/ci-gates.v1.yaml; pushes to main select every
# gate. Entries share one checkout and tool setup while retaining stable names.
on:
  # Merge-queue entries (#7111): every job runs, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed gate paths
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.filter.outputs.openapi }}
      route: ${{ steps.filter.outputs.route }}
      edge: ${{ steps.filter.outputs.edge }}
      evidence: ${{ steps.filter.outputs.evidence }}
      skill: ${{ steps.filter.outputs.skill }}
      skillworkflowrefs: ${{ steps.filter.outputs.skillworkflowrefs }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      envdoc: ${{ steps.filter.outputs.envdoc }}
      contract: ${{ steps.filter.outputs.contract }}
      bucketsync: ${{ steps.filter.outputs.bucketsync }}
      ifa: ${{ steps.filter.outputs.ifa }}
      ifaload: ${{ steps.filter.outputs.ifaload }}
      ifareplaydrive: ${{ steps.filter.outputs.ifareplaydrive }}
      cassetteauthor: ${{ steps.filter.outputs.cassetteauthor }}
      heredoc: ${{ steps.filter.outputs.heredoc }}
      parserrelationship: ${{ steps.filter.outputs.parserrelationship }}
      docsrefs: ${{ steps.filter.outputs.docsrefs }}
      docsclienvrefs: ${{ steps.filter.outputs.docsclienvrefs }}
      querydoccommitrefs: ${{ steps.filter.outputs.querydoccommitrefs }}
      doccitations: ${{ steps.filter.outputs.doccitations }}
      movedfilerefs: ${{ steps.filter.outputs.movedfilerefs }}
      measurementcite: ${{ steps.filter.outputs.measurementcite }}
      remotevalidation: ${{ steps.filter.outputs.remotevalidation }}
      maturitydrift: ${{ steps.filter.outputs.maturitydrift }}
      claudrules: ${{ steps.filter.outputs.claudrules }}
      rootcauseevidence: ${{ steps.filter.outputs.rootcauseevidence }}
      pgstatementreport: ${{ steps.filter.outputs.pgstatementreport }}
      dockerpublish: ${{ steps.filter.outputs.dockerpublish }}
      dockerhublogin: ${{ steps.filter.outputs.dockerhublogin }}
      matrix: ${{ steps.gate-matrix.outputs.matrix }}
      any: ${{ steps.gate-matrix.outputs.any }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # merge_group: skip the diff and select every gate, exactly as push
      # does below. required-gates.yml selects which of them a queue entry
      # needs from its own three-dot diff against main, so every gate it can
      # select must have run.
      - name: Filter changed paths against gate triggers
        id: filter
        if: ${{ github.event_name != 'merge_group' }}
        uses: dorny/paths-filter@v3
        with:
          # On push (no base), dorny treats everything as changed → all gates run.
          # Path sets mirror the gate triggers in specs/ci-gates.v1.yaml; the
          # gate-registry-drift check keeps the two in lockstep. Every filter
          # also includes this workflow + the registry so a change to either
          # re-runs all gates. (Self-check paths are inlined per filter rather
          # than via a YAML anchor — dorny's handling of an anchored *list* item
          # is version-dependent, and inlining is unambiguous.)
          filters: .github/static-contract-filters.yml
      - name: Build selected gate matrix
        id: gate-matrix
        run: |
          matrix_items=""
          any=false

          # $6 is the job timeout in minutes, defaulting to 15. It is per-gate
          # because every gate in this matrix shares one job definition, so a
          # blanket raise would also stop a genuine hang in the other 25 from
          # being cancelled.
          append_gate() {
            local selected="$1"
            local key="$2"
            local display="$3"
            local test="$4"
            local gate="$5"
            local timeout="${6:-15}"
            local run_gate=true

            if [[ "${test}" == "${gate}" ]]; then
              run_gate=false
            fi

            if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "merge_group" || "${selected}" == "true" ]]; then
              local item="{\"key\":\"${key}\",\"display\":\"${display}\",\"test\":\"${test}\",\"gate\":\"${gate}\",\"run_gate\":${run_gate},\"timeout\":${timeout}}"
              if [[ -n "${matrix_items}" ]]; then
                matrix_items="${matrix_items},${item}"
              else
                matrix_items="${item}"
              fi
              any=true
            fi
          }

          append_gate "${{ steps.filter.outputs.openapi }}" "openapi" "Verify OpenAPI gate" "bash scripts/test-verify-openapi.sh && bash scripts/test-verify-openapi-subpackage.sh" "scripts/verify-openapi.sh"
          append_gate "${{ steps.filter.outputs.route }}" "route" "Verify route coverage gate" "scripts/test-verify-route-coverage.sh" "scripts/verify-route-coverage.sh"
          append_gate "${{ steps.filter.outputs.edge }}" "edge" "Verify edge source-tool coverage gate" "bash scripts/test-verify-edge-source-tool-coverage.sh" "scripts/verify-edge-source-tool-coverage.sh"
          append_gate "${{ steps.filter.outputs.evidence }}" "evidence" "Verify evidence continuity gate" "scripts/test-verify-evidence-continuity.sh" "scripts/verify-evidence-continuity.sh"
          append_gate "${{ steps.filter.outputs.skill }}" "skill" "Verify skillgen roundtrip gate" "scripts/test-verify-skill-roundtrip.sh" "scripts/verify-skill-roundtrip.sh"
          append_gate "${{ steps.filter.outputs.skillworkflowrefs }}" "skillworkflowrefs" "Verify skill workflow refs gate" "bash scripts/test-verify-skill-workflow-refs.sh" "bash scripts/verify-skill-workflow-refs.sh"
          append_gate "${{ steps.filter.outputs.telemetry }}" "telemetry" "Verify telemetry coverage gate" "scripts/test-verify-telemetry-coverage.sh" "scripts/verify-telemetry-coverage.sh"
          append_gate "${{ steps.filter.outputs.dashboard }}" "dashboard" "Verify generate-operator-dashboard gate" "scripts/test-generate-operator-dashboard.sh" "scripts/generate-operator-dashboard.sh && git diff --exit-code -- docs/public/observability/dashboards/eshu-operator-overview.json"
          append_gate "${{ steps.filter.outputs.envdoc }}" "envdoc" "Verify environment registry reference gate" "scripts/test-generate-env-registry-doc.sh" "scripts/verify-env-registry-doc.sh"
          append_gate "${{ steps.filter.outputs.contract }}" "contract" "Verify contract source-of-truth gate" "scripts/test-verify-contracttest.sh && scripts/test-verify-fact-kind-registry.sh" "scripts/generate-contracttest.sh && scripts/generate-fact-kind-registry.sh && git diff --exit-code -- go/internal/collector/conformance/contract/data.go go/internal/facts/fact_kind_registry.generated.go go/internal/facts/FACT_KIND_REGISTRIES.md"
          append_gate "${{ steps.filter.outputs.bucketsync }}" "bucketsync" "Verify content-entity bucket sync gate" "cd go && go test ./internal/content/shape -run 'TestContentEntityBucketsMatchCollectorTwin|TestContentEntityLabelsHaveProjectorLabels|TestBucketSyncDriftLedgerIsHonest|TestEveryProjectorLabelHasASource' -count=1" "cd go && go test ./internal/content/shape -run 'TestContentEntityBucketsMatchCollectorTwin|TestContentEntityLabelsHaveProjectorLabels|TestBucketSyncDriftLedgerIsHonest|TestEveryProjectorLabelHasASource' -count=1"
          append_gate "${{ steps.filter.outputs.ifa }}" "ifa" "Verify Ifa contract-layer gate" "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1" "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1"
          append_gate "${{ steps.filter.outputs.ifaload }}" "ifaload" "Verify Ifa P5 load/saturation gate" "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1" "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1"
          append_gate "${{ steps.filter.outputs.ifareplaydrive }}" "ifareplaydrive" "Verify Ifa replay-drive mirror gate" "bash scripts/test-verify-ifa-replay-drive.sh" "bash scripts/test-verify-ifa-replay-drive.sh"
          append_gate "${{ steps.filter.outputs.cassetteauthor }}" "cassetteauthor" "Verify cassette author gate" "bash scripts/test-verify-cassette-author.sh" "bash scripts/verify-cassette-author.sh"
          append_gate "${{ steps.filter.outputs.heredoc }}" "heredoc" "Verify heredoc budget gate" "cd go && go test ./cmd/heredoc-budget -count=1" "cd go && go run ./cmd/heredoc-budget -baseline ../scripts/heredoc-budget-baseline.txt"
          append_gate "${{ steps.filter.outputs.parserrelationship }}" "parserrelationship" "Verify parser relationship kit gate" "bash scripts/test-verify-parser-relationship-kit.sh" "bash scripts/verify-parser-relationship-kit.sh"
          append_gate "${{ steps.filter.outputs.docsrefs }}" "docsrefs" "Verify docs-refs gate" "bash scripts/test-verify-docs-refs.sh" "bash scripts/verify-docs-refs.sh"
          append_gate "${{ steps.filter.outputs.docsclienvrefs }}" "docsclienvrefs" "Verify docs CLI/env refs gate" "bash scripts/test-verify-docs-cli-env-refs.sh" "bash scripts/verify-docs-cli-env-refs.sh"
          append_gate "${{ steps.filter.outputs.querydoccommitrefs }}" "querydoccommitrefs" "Verify query-doc-commit-refs gate" "bash scripts/test-verify-query-doc-commit-refs.sh" "bash scripts/verify-query-doc-commit-refs.sh"
          append_gate "${{ steps.filter.outputs.doccitations }}" "doccitations" "Verify doc-citations gate" "bash scripts/test-verify-doc-citations.sh" "bash scripts/verify-doc-citations.sh"
          append_gate "${{ steps.filter.outputs.movedfilerefs }}" "movedfilerefs" "Verify moved-file-refs gate" "bash scripts/test-verify-moved-file-refs.sh" "bash scripts/verify-moved-file-refs.sh"
          append_gate "${{ steps.filter.outputs.measurementcite }}" "measurementcite" "Verify measurement-citations gate" "bash scripts/test-verify-measurement-citations.sh && bash scripts/test-verify-measurement-citations-wrapper.sh" "bash scripts/verify-measurement-citations.sh"
          append_gate "${{ steps.filter.outputs.remotevalidation }}" "remotevalidation" "Verify remote-validation-artifacts gate" "bash scripts/test-generate-remote-validation-inventory.sh && bash scripts/test-verify-remote-validation-artifacts.sh && bash scripts/test-verify-dead-iac-compose.sh && bash scripts/test-verify-remote-e2e-component-extension.sh && bash scripts/test-verify-k8s-two-team-governance-proof.sh && bash scripts/test-k8s-two-team-governance-provenance.sh" "bash scripts/generate-remote-validation-inventory.sh && git diff --exit-code -- docs/internal/remote-validation/inventory.generated.json && bash scripts/verify-remote-validation-artifacts.sh"
          append_gate "${{ steps.filter.outputs.maturitydrift }}" "maturitydrift" "Verify maturity-drift-guard gate" "bash scripts/test-verify-maturity-drift-guard.sh" "bash scripts/verify-maturity-drift-guard.sh"
          append_gate "${{ steps.filter.outputs.claudrules }}" "claudrules" "Verify Claude path-scoped rules gate" "bash scripts/test-claude-rules-lint.sh" "bash scripts/dev/claude-rules-lint.sh"
          append_gate "${{ steps.filter.outputs.rootcauseevidence }}" "rootcauseevidence" "Verify root-cause-evidence gate" "bash scripts/test-verify-root-cause-evidence.sh" "bash scripts/verify-root-cause-evidence.sh"
          append_gate "${{ steps.filter.outputs.pgstatementreport }}" "pgstatementreport" "Verify pg-statement-report gate" "bash scripts/test-pg-statement-report.sh" "bash scripts/test-pg-statement-report.sh"
          append_gate "${{ steps.filter.outputs.dockerpublish }}" "dockerpublish" "Verify docker-publish shape gate" "bash scripts/test-verify-docker-publish-moving-tags.sh && bash scripts/test-verify-docker-publish-pr-platforms.sh && bash scripts/test-promote-moving-tags.sh && bash scripts/test-resolve-image-scan-ref.sh" "bash scripts/test-verify-docker-publish-moving-tags.sh && bash scripts/test-verify-docker-publish-pr-platforms.sh && bash scripts/test-promote-moving-tags.sh && bash scripts/test-resolve-image-scan-ref.sh"
          # 30, not the default 15: the 142-check suite (bash scripts/test-verify-
          # dockerhub-login.sh) forks awk, rg and yq per case. Measured on loaded
          # 18-core Macs (three suites at once, load average 25 to 50): 688 to
          # 1004 s wall under BSD awk, 655 to 1088 s under gawk, 548 to 676 s under
          # mawk. The slowest sample is over the 900 s default, so a cell on the
          # default would be cancelled; 30 minutes (1800 s) leaves 1.65x margin
          # over the slowest sample.
          append_gate "${{ steps.filter.outputs.dockerhublogin }}" "dockerhublogin" "Verify Docker Hub login gate" "bash scripts/test-verify-dockerhub-login.sh" "bash scripts/verify-dockerhub-login.sh" 30
          # 30, not the default 15: this gate vets every //go:build configuration
          # in the module serially (37 today) and takes about 14 minutes on main,
          # so it was being cancelled at the 15-minute mark rather than failing.
          append_gate "${{ steps.filter.outputs.taggedbuilds }}" "taggedbuilds" "Verify tagged-builds gate" "bash scripts/test-verify-tagged-builds.sh" "bash scripts/verify-tagged-builds.sh --all" 30

          printf 'matrix={"include":[%s]}\n' "${matrix_items}" >>"${GITHUB_OUTPUT}"
          printf 'any=%s\n' "${any}" >>"${GITHUB_OUTPUT}"

  gate:
    name: ${{ matrix.display }}
    needs: changes
    # merge_group lists every gate in the matrix (see append_gate), so `any`
    # is true there; the explicit arm lets ci-gates validate prove this job
    # always runs on a queue entry.
    if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.any == 'true' }}
    timeout-minutes: ${{ matrix.timeout }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      # #7886: true only when both Docker Hub secrets exist (fork and Dependabot
      # PRs get none). Expose the boolean, not the secrets, so no step sees them.
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # #7886: authenticated pulls avoid the shared anonymous Docker Hub limit
      # on hosted runners. Skipped, not failed, when the secrets are absent.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install ripgrep and jq
        run: scripts/ci/install-apt-packages.sh ripgrep jq
      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing inside whichever
      # gate happened to be selected (#6615 follow-up to #6075). Unconditional,
      # not gated per-gate: actions/setup-go's go/go.sum cache has no
      # restore-keys and saves only on a miss, so the FIRST job to finish
      # after a go.sum change owns that key with whatever GOMODCACHE it has --
      # every setup-go job on the key then re-downloads from the proxy until
      # a warmed job finishes first and re-saves it (confirmed on job
      # 102442878753, 2026-09-09: "Verify factschema-diff test mirror" saved
      # cache 7497506231, 14,716,033 bytes, with zero `go: downloading`). The
      # non-Go static gates in this matrix are usually the fastest finishers,
      # so skipping pre-warm for them would let that race lose again. Measured
      # cost: 10-44s per job on the current 14 MB entry, median 12.5s over 16
      # go-race samples (runs 35228125254, 35224651204, 35232001790,
      # 35231720759); expected to drop once a warmed job saves the key.
      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run test mirror (${{ matrix.key }})
        run: ${{ matrix.test }}
      # #6979: feed the cassette-author identifier check from a repository
      # secret on same-repo PRs, merge-queue entries, and main pushes.
      # Fork PRs cannot read secrets, so this step is skipped there and the
      # gate runs canary-only with its warning. (push is main-only per this
      # workflow's on.push.branches, so the bare event check is correctly
      # scoped; without merge_group/push coverage a post-PR secret change
      # would pass the queue gate unnoticed.)
      # After the test mirror on purpose: the mirror asserts the
      # unset/canary-only behavior, which exported vars would mask. The
      # secret value is never echoed; the gate prints only the loaded count.
      - name: Provide private identifiers for cassette-author gate
        if: ${{ matrix.key == 'cassetteauthor' && (github.event_name == 'merge_group' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == 'eshu-hq/eshu') }}
        env:
          ESHU_PRIVATE_IDENTIFIERS: ${{ secrets.ESHU_PRIVATE_IDENTIFIERS }}
        run: |
          set -euo pipefail
          [[ -n "${ESHU_PRIVATE_IDENTIFIERS}" ]] || { echo "cassette-author identifiers: ESHU_PRIVATE_IDENTIFIERS secret is empty or missing" >&2; exit 1; }
          identifiers_file="$(mktemp -t eshu-private-identifiers.XXXXXX)"
          printf '%s\n' "${ESHU_PRIVATE_IDENTIFIERS}" > "${identifiers_file}"
          echo "ESHU_PRIVATE_IDENTIFIERS_FILE=${identifiers_file}" >> "${GITHUB_ENV}"
          echo "ESHU_PRIVATE_IDENTIFIERS_REQUIRED=1" >> "${GITHUB_ENV}"
      - name: Run gate (${{ matrix.key }})
        if: ${{ matrix.run_gate }}
        run: ${{ matrix.gate }}
