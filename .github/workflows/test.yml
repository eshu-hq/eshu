# Workflow rationale: test.comments.md (verbatim source comments).
name: Build Test
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  ESHU_QUERYPLAN_PROFILE_IMAGE: ghcr.io/eshu-hq/ci-mirror-neo4j@sha256:6c162e2432f861f2c4e3da77a6ba478e7f10e2160b870541f85294532bc6ff5f
  ESHU_CI_IMAGES: "1"
  POSTGRES_IMAGE: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  NEO4J_IMAGE: ghcr.io/eshu-hq/ci-neo4j-community@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
  ESHU_XX_IMAGE: ghcr.io/eshu-hq/ci-mirror-xx@sha256:0c6a569797744e45955f39d4f7538ac344bfb7ebf0a54006a0a4297b153ccf0f
  ESHU_GO_IMAGE: ghcr.io/eshu-hq/ci-mirror-golang@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
  ESHU_ALPINE_IMAGE: ghcr.io/eshu-hq/ci-mirror-alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d

jobs:
  queue-selection:
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: test.yml
  changes:
    needs: queue-selection
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code || steps.merge_group_code.outputs.code }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-race-complete') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Force code=true on merge_group
        id: merge_group_code
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'merge_group' }}
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!mkdocs.yml'
              - '!.github/**/*.md'
              - '!.agents/**'
  # Tree-identical reuse probe (#8617 step 4b): on a pull request whose
  # head tree was already proven green by a previous head of the same PR,
  # go-core/go-race skip and their *-complete aggregates pass on the
  # transferred verdict. Always runs (a skipped need would skip its
  # dependents); the probe itself only executes on pull_request and any
  # probe failure leaves reuse=false, the pre-existing behavior.
  tree-reuse:
    needs: queue-selection
    name: Tree-identical reuse probe
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.probe.outputs.reuse }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      # Trusted build: the probe decides whether lanes may skip, so it is
      # built from the default branch like the required-gates publisher,
      # never from the PR tree it is judging.
      - name: Checkout trusted default branch
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Go
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Pre-warm Go modules
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Probe tree-identical reuse
        id: probe
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          (cd go && go build -o "${RUNNER_TEMP}/ci-gates-bin" ./cmd/ci-gates)
          "${RUNNER_TEMP}/ci-gates-bin" reuse \
            --registry specs/ci-gates.v1.yaml \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" | tee "${RUNNER_TEMP}/reuse.out" || true
          if ! grep -E '^(reuse|source_sha|tree)=' "${RUNNER_TEMP}/reuse.out" >> "$GITHUB_OUTPUT"; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
  markdown-file-cap:
    needs: queue-selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'markdown-file-cap')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'markdown-file-cap')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Markdown file cap (go/ and docs/)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'markdown-file-cap')) }}
        run: |
          scripts/test-verify-markdown-line-cap.sh
          MARKDOWN_LINE_CAP_REQUIRE_BASE=1 scripts/verify-markdown-line-cap.sh --all
  scripts-file-cap:
    needs: queue-selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'scripts-file-cap')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify scripts/ file cap
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'scripts-file-cap')) }}
        run: |
          scripts/test-verify-tooling-line-cap.sh
          TOOLING_LINE_CAP_REQUIRE_BASE=1 scripts/verify-tooling-line-cap.sh --all
  dirgate:
    needs: queue-selection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dirgate')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dirgate')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Test dirgate
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dirgate')) }}
        working-directory: go
        run: go test ./cmd/dirgate/ -count=1
      - name: Verify dirgate (derived ratchet)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dirgate')) }}
        run: bash scripts/verify-dirgate.sh --ci
  merge-group-slim:
    needs: [queue-selection, changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # Raised 15 -> 25 per #8665: cold-build-cache compile (~10.6m) + scoped vet
    # (~3.6m) already consume ~14.2m, leaving nothing for filecap and the
    # remaining parity steps on slow runners. Revisit if p95 exceeds 20m.
    timeout-minutes: 25
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Build all Go binaries
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        working-directory: go
        run: go build ./...
      - name: Scoped go vet (changed packages plus direct importers)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: bash scripts/verify-merge-group-slim-vet.sh
      - name: Go 500-line file cap
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: bash scripts/dev/precommit-go.sh filecap-all
      - name: Migration sequence uniqueness
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        working-directory: go
        run: go test ./internal/storage/postgres/migrations/ -run 'TestBootstrapDefinitionsHaveUniqueSequenceNumbers' -count=1
      - name: Generated collector entrypoints parity
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: |
          scripts/test-verify-collector-entrypoints-generated.sh
          scripts/verify-collector-entrypoints-generated.sh
      - name: Context and story reference layout
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: scripts/test-context-stories-doc-split.sh
  verify-contracts:
    needs: [queue-selection, changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install ripgrep and jq
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep jq
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Verify CodeQL setup model
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-codeql-setup.sh
          scripts/verify-codeql-setup.sh
      - name: Verify Markdown file cap during registry rollout
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-markdown-line-cap.sh
          MARKDOWN_LINE_CAP_REQUIRE_BASE=1 scripts/verify-markdown-line-cap.sh --all
      - name: Verify security-scan tee-status helper
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: scripts/test-security-scan-tee-status.sh
      - name: Verify hot-path evidence
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        env:
          ESHU_PERFORMANCE_EVIDENCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          scripts/test-verify-performance-evidence.sh
          scripts/verify-performance-evidence.sh
      - name: Set up Python for query methodology hook proof
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install query methodology hook runner
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: python -m pip install pre-commit==4.6.2
      - name: Verify query-plan regression gate
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 scripts/test-query-methodology-comparison-identity.py
          python3 scripts/test-verify-query-methodology-live-contract.py
          scripts/test-verify-query-methodology.sh
          scripts/test-verify-query-plan-regression.sh
          scripts/verify-query-plan-regression.sh
      - name: Archive query methodology evidence
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts'))) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: query-methodology-${{ github.sha }}
          path: .proof-artifacts/query-methodology/*.json
          if-no-files-found: error
      - name: Verify scale corpus suite
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-scale-corpus-suite.sh
          scripts/verify-scale-corpus-suite.sh
      - name: Verify scale benchmark artifact
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-scale-benchmark-artifact.sh
          scripts/verify-scale-benchmark-artifact.sh
      - name: Verify capability budget proof
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-capability-budget-proof.sh
          scripts/verify-capability-budget-proof.sh
      - name: Verify package docs
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-package-docs.sh
          scripts/verify-package-docs.sh
      - name: Verify shipped migration immutability
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-migration-immutability.sh
          scripts/verify-migration-immutability.sh
      - name: Verify Go license headers
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-license-header.sh
          scripts/verify-license-header.sh
      - name: Verify generated collector entrypoints
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-collector-entrypoints-generated.sh
          scripts/verify-collector-entrypoints-generated.sh
      - name: Verify vulnerability parity fixtures
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: scripts/verify_vulnerability_parity_fixtures.sh
      - name: Verify accuracy golden gate
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: scripts/verify_accuracy_golden_gate.sh
      - name: Verify golden-corpus filter exhaustiveness
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: |
          scripts/test-verify-golden-corpus-filter-exhaustive.sh
          scripts/verify-golden-corpus-filter-exhaustive.sh
  go-core:
    needs: [queue-selection, changes, tree-reuse]
    if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') && (github.event_name != 'pull_request' || needs.tree-reuse.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Persist the Go build cache across fresh runners (#8735). Module
    # downloads stay on setup-go's cache; only the compiler cache moves here.
    env: {GOCACHE: /tmp/eshu-ci/go-build}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Restore Go build cache
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}
        uses: actions/cache@v4
        with:
          path: /tmp/eshu-ci/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ hashFiles('go/go.sum') }}
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify CI apt/ripgrep installer test mirror
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        run: bash scripts/test-ci-install-apt-packages.sh
      - name: Verify go-mod-download-retry test mirror
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        run: bash scripts/test-ci-go-mod-download-retry.sh
      - name: Verify go-install-retry test mirror
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        run: bash scripts/test-ci-go-install-retry.sh
      - name: Pre-warm Go modules
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Install golangci-lint
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        run: scripts/ci/go-install-retry.sh github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Pre-warm golangci-lint filelength plugin modules
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        run: scripts/ci/go-mod-download-retry.sh tools/golangci-lint-filelength
      - name: Build golangci-lint filelength plugin
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        working-directory: tools/golangci-lint-filelength
        run: make build
      - name: Test golangci-lint filelength plugin
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        working-directory: tools/golangci-lint-filelength
        run: make test
      - name: Lint Go
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        working-directory: go
        run: golangci-lint run ./...
      - name: Check gofumpt formatting
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        working-directory: go
        run: golangci-lint fmt --diff
      - name: Build all Go binaries
        if: ${{ (github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) && (!cancelled()) }}
        working-directory: go
        run: go build ./...
  go-core-complete:
    needs: [queue-selection, changes, go-core, tree-reuse]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Assert go-core passed
        run: |
          changes_result="${{ needs.changes.result }}"
          result="${{ needs.go-core.result }}"
          echo "changes result: ${changes_result}"
          echo "aggregated go-core result: ${result}"
          if [ "${changes_result}" != "success" ]; then
            echo "::error::changes gate did not succeed (result=${changes_result}) - a skipped go-core cannot be trusted as a docs-only skip"
            exit 1
          fi
          if [ "${{ needs.tree-reuse.result }}" != "success" ]; then
            echo "::error::tree-reuse probe did not succeed (result=${{ needs.tree-reuse.result }}) - a skipped lane proves nothing without it"
            exit 1
          fi
          if [ "${{ needs.tree-reuse.outputs.reuse }}" = "true" ]; then
            echo "tree-identical reuse: go-core verdict transferred from a previous head of this PR (source in the reuse probe log)"
            exit 0
          fi
          if [ "${result}" = "cancelled" ]; then
            echo "::error::go-core timed out or was cancelled (result=cancelled) - not a lint or build finding; rerun the failed job"
            exit 1
          fi
          if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
            echo "::error::go-core did not succeed (result=${result})"
            exit 1
          fi
  go-race:
    needs: [queue-selection, changes, tree-reuse]
    if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') && (github.event_name != 'pull_request' || needs.tree-reuse.outputs.reuse != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Same persisted build cache as go-core (#8735); matrix legs share the
    # key because they compile the same tree.
    env: {GOCACHE: /tmp/eshu-ci/go-build}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-race-complete')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Restore Go build cache
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-race-complete')) }}
        uses: actions/cache@v4
        with:
          path: /tmp/eshu-ci/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ hashFiles('go/go.sum') }}
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-race-complete')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Set up Helm for race tests
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-race-complete')) }}
        uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.3
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-race-complete')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-race-complete')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run Go tests with race detector (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-race-complete')) }}
        working-directory: go
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          pkgs="$(go list ./... | awk -v n="${SHARD_TOTAL}" -v k="${SHARD_INDEX}" 'NR % n == (k % n)')"
          if [ -z "${pkgs}" ]; then
            echo "shard ${SHARD_INDEX}/${SHARD_TOTAL}: no packages selected — nothing to test"
            exit 0
          fi
          count="$(printf '%s\n' "${pkgs}" | wc -l | tr -d ' ')"
          echo "shard ${SHARD_INDEX}/${SHARD_TOTAL}: ${count} package(s)"
          printf '%s\n' "${pkgs}" | xargs go test -count=1 -race -timeout 900s -p 2
  go-race-complete:
    needs: [queue-selection, changes, go-race, tree-reuse]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Assert all race shards passed
        run: |
          changes_result="${{ needs.changes.result }}"
          result="${{ needs.go-race.result }}"
          echo "changes result: ${changes_result}"
          echo "aggregated go-race result: ${result}"
          if [ "${changes_result}" != "success" ]; then
            echo "::error::changes gate did not succeed (result=${changes_result}) - a skipped go-race matrix cannot be trusted as a docs-only skip"
            exit 1
          fi
          if [ "${{ needs.tree-reuse.result }}" != "success" ]; then
            echo "::error::tree-reuse probe did not succeed (result=${{ needs.tree-reuse.result }}) - a skipped lane proves nothing without it"
            exit 1
          fi
          if [ "${{ needs.tree-reuse.outputs.reuse }}" = "true" ]; then
            echo "tree-identical reuse: go-race verdict transferred from a previous head of this PR (source in the reuse probe log)"
            exit 0
          fi
          if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
            echo "::error::one or more go-race shards did not succeed (result=${result})"
            exit 1
          fi
  docs-helm-hygiene:
    needs: queue-selection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
