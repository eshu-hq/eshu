# Workflow rationale: test.comments.md (verbatim source comments).
name: Build Test
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"
  ESHU_QUERYPLAN_PROFILE_IMAGE: ghcr.io/eshu-hq/ci-mirror-neo4j@sha256:6c162e2432f861f2c4e3da77a6ba478e7f10e2160b870541f85294532bc6ff5f
  ESHU_CI_IMAGES: "1"
  POSTGRES_IMAGE: ghcr.io/eshu-hq/ci-postgres-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  NEO4J_IMAGE: ghcr.io/eshu-hq/ci-neo4j-community@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
  ESHU_XX_IMAGE: ghcr.io/eshu-hq/ci-mirror-xx@sha256:0c6a569797744e45955f39d4f7538ac344bfb7ebf0a54006a0a4297b153ccf0f
  ESHU_GO_IMAGE: ghcr.io/eshu-hq/ci-mirror-golang@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
  ESHU_ALPINE_IMAGE: ghcr.io/eshu-hq/ci-mirror-alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
jobs:
  queue-selection:
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: test.yml
  changes:
    needs: [queue-selection, pr-plan]
    if: ${{ github.event_name != 'pull_request' || (needs.pr-plan.result == 'success' && needs.pr-plan.outputs.mode != 'reuse') }}
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code || steps.merge_group_code.outputs.code }}
      lockstep: ${{ steps.lockstep.outputs.lockstep || steps.merge_group_code.outputs.lockstep }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-race-complete') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Force code=true on merge_group
        id: merge_group_code
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'merge_group' }}
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/*.md'
              - '!*.json'
              - '!docs/**/*.json'
              - '!scripts/**/*.json'
              - '!mkdocs.yml'
              - '!.github/**/*.md'
              - '!.agents/**'

      - name: Filter lockstep test inputs
        id: lockstep
        if: ${{ github.event_name != 'merge_group' }}
        uses: dorny/paths-filter@v3
        with:
          # Unlike `code` above, this filter is all positives (the manifest-derived
          # lockstep list), so it needs the default `some` quantifier: a PR touching
          # ANY listed input must run the code-gated lanes. `every` would require a
          # file to match all entries at once and select nothing.
          predicate-quantifier: 'some'
          filters: |
            lockstep:
              - 'AGENTS.md'
              - 'docs/internal/design/430-nornicdb-graph-search-split.md'
              - 'docs/internal/design/5351-ifa-materialized-edge-known-gaps.md'
              - 'docs/internal/evidence/5275-documentation-query-plan-shim.sql'
              - 'docs/internal/evidence/5998-rationale-relative-path.md'
              - 'docs/internal/evidence/7127-link-writer-g7-results.json'
              - 'docs/internal/evidence/8869-collector-vault-live-census.md'
              - 'docs/internal/remote-validation/inventory.generated.json'
              - 'docs/public/deploy/kubernetes/helm-routing-and-storage-values.md'
              - 'docs/public/deployment/credential-file-cleanup.md'
              - 'docs/public/deployment/service-runtimes-collectors.md'
              - 'docs/public/deployment/service-runtimes.md'
              - 'docs/public/languages/admitted-files.md'
              - 'docs/public/operate/3am-operator-runbook.md'
              - 'docs/public/reference/assistant-fast-path-hooks.md'
              - 'docs/public/reference/env-registry.md'
              - 'docs/public/reference/environment-collectors-supply-chain.md'
              - 'docs/public/reference/environment-collectors.md'
              - 'docs/public/reference/environment-ingestion-queues.md'
              - 'docs/public/reference/first-run-evidence.md'
              - 'docs/public/reference/generated/replay-coverage.md'
              - 'docs/public/reference/graph-backend-installation.md'
              - 'docs/public/reference/http-api.md'
              - 'docs/public/reference/http-api/collector-terminal-failure.md'
              - 'docs/public/reference/hybrid-retrieval-production-gate.md'
              - 'docs/public/reference/local-performance-envelope.md'
              - 'docs/public/reference/mcp-cookbook.md'
              - 'docs/public/reference/mcp-prompt-surface-audit.md'
              - 'docs/public/reference/mcp-tool-contract-matrix.md'
              - 'docs/public/reference/nornicdb-tuning.md'
              - 'docs/public/reference/reducer-claim-latency-gate.md'
              - 'docs/public/reference/searchbench-evidence/issue-1298-semantic-retrieval-proof-v1.json'
              - 'docs/public/reference/searchbench-evidence/issue-417-nornicdb-hybrid-retrieval-prototype-v1.json'
              - 'docs/public/reference/searchbench-evidence/issue-420-link-prediction-evaluation-v1.json'
              - 'docs/public/reference/searchbench-evidence/issue-421-rerank-protocol-evaluation-v1.json'
              - 'docs/public/run-locally/docker-compose.md'
              - 'go/cmd/README.md'
              - 'go/cmd/audit-preflight/testdata/codegraphcontext-already-tracked.md'
              - 'go/cmd/audit-preflight/testdata/gitnexus-missing.md'
              - 'go/cmd/audit-preflight/testdata/graphify-foundation-exists.md'
              - 'go/cmd/audit-preflight/testdata/incomplete.md'
              - 'go/cmd/ifa/README.md'
              - 'go/internal/ask/catalog/README.md'
              - 'go/internal/cli/demo/README.md'
              - 'go/internal/cli/hookpreflight/AGENTS.md'
              - 'go/internal/cli/hookpreflight/README.md'
              - 'go/internal/collector/README.md'
              - 'go/internal/collector/sbom/SHIM_MAP.md'
              - 'go/internal/content/artifacts/README.md'
              - 'go/internal/facts/FACT_KIND_REGISTRIES.md'
              - 'go/internal/ifa/README.md'
              - 'go/internal/ifa/materializededges/README.md'
              - 'go/internal/query/repository/README.md'
              - 'go/internal/reducer/AGENTS.md'
              - 'go/internal/reducer/README.md'
              - 'go/internal/runtime/README.md'
              - 'testdata/golden/documentation-positive.md'
  pr-plan:
    needs: queue-selection
    runs-on: ubuntu-24.04
    permissions: {checks: read, contents: read, pull-requests: read, statuses: read}
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reuse: ${{ steps.plan.outputs.reuse }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      tree: ${{ steps.plan.outputs.tree }}
      workflows: ${{ steps.plan.outputs.workflows }}
      jobs: ${{ steps.plan.outputs.jobs }}
      gates: ${{ steps.plan.outputs.gates }}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout trusted default branch
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Go
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-go@v6
        with: {go-version-file: go/go.mod, cache-dependency-path: go/go.sum}
      - name: Pre-warm Go modules
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Plan PR execution from trusted policy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != pull_request ]]; then
            printf '%s\n' 'mode=full' 'reuse=false' 'workflows=[]' 'jobs={}' 'gates=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          (cd go && go build -o "${RUNNER_TEMP}/ci-gates-bin" ./cmd/ci-gates)
          "${RUNNER_TEMP}/ci-gates-bin" pr-plan \
            --registry specs/ci-gates.v1.yaml \
            --repo-root . \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" > "${RUNNER_TEMP}/pr-plan.json"
          jq -e --arg sha "${HEAD_SHA}" --argjson run_id "${GITHUB_RUN_ID}" \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" -f scripts/ci/pr-plan-v2.jq \
            "${RUNNER_TEMP}/pr-plan.json" > /dev/null
          jq -r '"mode=\(.mode)", "reuse=\(.mode == "reuse")", "head_sha=\(.head_sha)", "source_sha=\(.source_sha // "")", "tree=\(.tree // "")", "workflows=\(.workflows | tojson)", "jobs=\(.jobs | tojson)", "gates=\(.gates | tojson)"' \
            "${RUNNER_TEMP}/pr-plan.json" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/pr-plan.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Record full plan mode
        if: ${{ steps.plan.outputs.mode == 'full' }}
        run: test "${{ steps.plan.outputs.mode }}" = full
      - name: Record reuse plan mode
        if: ${{ steps.plan.outputs.mode == 'reuse' }}
        run: test "${{ steps.plan.outputs.mode }}" = reuse
      - name: Record smoke plan mode
        if: ${{ steps.plan.outputs.mode == 'smoke' }}
        run: test "${{ steps.plan.outputs.mode }}" = smoke
  markdown-file-cap:
    if: ${{ github.event_name == 'merge_group' || (github.event_name != 'pull_request' || (needs.pr-plan.result == 'success' && contains(fromJSON(needs.pr-plan.outputs.jobs || '{}')['test.yml'], 'markdown-file-cap'))) }}
    needs: [queue-selection, pr-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'markdown-file-cap')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'markdown-file-cap')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Markdown file cap (go/ and docs/)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'markdown-file-cap')) }}
        run: |
          scripts/test-verify-markdown-line-cap.sh
          MARKDOWN_LINE_CAP_REQUIRE_BASE=1 scripts/verify-markdown-line-cap.sh --all
  scripts-file-cap:
    if: ${{ github.event_name == 'merge_group' || (github.event_name != 'pull_request' || (needs.pr-plan.result == 'success' && contains(fromJSON(needs.pr-plan.outputs.jobs || '{}')['test.yml'], 'scripts-file-cap'))) }}
    needs: [queue-selection, pr-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'scripts-file-cap')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify scripts/ file cap
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'scripts-file-cap')) }}
        run: |
          scripts/test-verify-tooling-line-cap.sh
          TOOLING_LINE_CAP_REQUIRE_BASE=1 scripts/verify-tooling-line-cap.sh --all
  dirgate:
    if: ${{ github.event_name == 'merge_group' || (github.event_name != 'pull_request' || (needs.pr-plan.result == 'success' && contains(fromJSON(needs.pr-plan.outputs.jobs || '{}')['test.yml'], 'dirgate'))) }}
    needs: [queue-selection, pr-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dirgate')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dirgate')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Test dirgate
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dirgate')) }}
        working-directory: go
        run: go test ./cmd/dirgate/ -count=1
      - name: Verify dirgate (derived ratchet)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'dirgate')) }}
        run: bash scripts/verify-dirgate.sh --ci
  merge-group-slim:
    if: ${{ github.event_name == 'merge_group' || ((github.event_name != 'pull_request' || (needs.pr-plan.result == 'success' && contains(fromJSON(needs.pr-plan.outputs.jobs || '{}')['test.yml'], 'merge-group-slim'))) && (github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' || needs.changes.outputs.lockstep == 'true'))) }}
    needs: [queue-selection, changes, pr-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Build all Go binaries
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        working-directory: go
        run: go build ./...
      - name: Scoped go vet (changed packages plus direct importers)
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: bash scripts/verify-merge-group-slim-vet.sh
      - name: Go 500-line file cap
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: bash scripts/dev/precommit-go.sh filecap-all
      - name: Migration sequence uniqueness
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        working-directory: go
        run: go test ./internal/storage/postgres/migrations/ -run 'TestBootstrapDefinitionsHaveUniqueSequenceNumbers' -count=1
      - name: Generated collector entrypoints parity
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: |
          scripts/test-verify-collector-entrypoints-generated.sh
          scripts/verify-collector-entrypoints-generated.sh
      - name: Context and story reference layout
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'merge-group-slim')) }}
        run: scripts/test-context-stories-doc-split.sh
  verify-contracts:
    if: ${{ github.event_name == 'merge_group' || ((github.event_name != 'pull_request' || (needs.pr-plan.result == 'success' && contains(fromJSON(needs.pr-plan.outputs.jobs || '{}')['test.yml'], 'verify-contracts'))) && (github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' || needs.changes.outputs.lockstep == 'true')) && (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts'))) }}
    needs: [queue-selection, changes, pr-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install ripgrep and jq
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep jq
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts')) }}
        run: scripts/ci/go-mod-download-retry.sh
      - name: Run selected contract checks
        if: ${{ github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'verify-contracts') }}
        uses: ./.github/actions/ci-verify-contracts
        with:
          mode: ${{ needs.pr-plan.outputs.mode }}
          gates: ${{ needs.pr-plan.outputs.gates }}
  go-core:
    if: ${{ github.event_name == 'merge_group' || ((github.event_name != 'pull_request' || (needs.pr-plan.result == 'success' && contains(fromJSON(needs.pr-plan.outputs.jobs || '{}')['test.yml'], 'go-core'))) && ((github.event_name != 'pull_request' || (needs.changes.outputs.code == 'true' || needs.changes.outputs.lockstep == 'true')) && (github.event_name != 'pull_request' || needs.pr-plan.outputs.mode != 'reuse')) && (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core'))) }}
    needs: [queue-selection, changes, pr-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env: {GOCACHE: /tmp/eshu-ci/go-build}
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Restore Go build cache
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}
        uses: actions/cache@v4
        with:
          path: /tmp/eshu-ci/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ hashFiles('go/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gobuild-
      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}
      - {name: Pre-warm Go modules, if: "${{ !cancelled() && (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}", run: scripts/ci/go-mod-download-retry.sh}
      - {name: Install golangci-lint, if: "${{ !cancelled() && (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) && (needs.pr-plan.outputs.mode != 'smoke' || contains(fromJSON(needs.pr-plan.outputs.gates || '[]'), 'go-lint') || contains(fromJSON(needs.pr-plan.outputs.gates || '[]'), 'go-fmt')) }}", run: scripts/ci/go-install-retry.sh github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2}
      - name: Run selected Go core checks
        if: ${{ !cancelled() && (github.event_name != 'merge_group' || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'go-core')) }}
        uses: ./.github/actions/ci-go-core
        env: {CI_SMOKE_GO_BUILD_FAIL_CANARY: "${{ vars.CI_SMOKE_GO_BUILD_FAIL_CANARY }}"}
        with:
          mode: ${{ needs.pr-plan.outputs.mode }}
          gates: ${{ needs.pr-plan.outputs.gates }}
      - name: Record full plan mode
        if: ${{ github.event_name == 'pull_request' && needs.pr-plan.outputs.mode == 'full' }}
        run: test "${{ needs.pr-plan.outputs.mode }}" = full
  go-core-complete:
    needs: [queue-selection, changes, go-core, pr-plan]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
