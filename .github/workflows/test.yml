# Workflow rationale: test.comments.md (verbatim source comments).
name: Build Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code || steps.merge_group_code.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Force code=true on merge_group
        id: merge_group_code
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "code=true" >> "$GITHUB_OUTPUT"

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'merge_group' }}
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!mkdocs.yml'
              - '!.github/**/*.md'
              - '!.agents/**'

  markdown-file-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep
      - name: Verify Markdown file cap (go/ and docs/)
        run: |
          scripts/test-verify-markdown-line-cap.sh
          MARKDOWN_LINE_CAP_REQUIRE_BASE=1 scripts/verify-markdown-line-cap.sh --all

  verify-contracts:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOCKERHUB_LOGIN_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep

      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Verify CodeQL setup model
        run: |
          scripts/test-verify-codeql-setup.sh
          scripts/verify-codeql-setup.sh

      - name: Verify Markdown file cap during registry rollout
        run: |
          scripts/test-verify-markdown-line-cap.sh
          MARKDOWN_LINE_CAP_REQUIRE_BASE=1 scripts/verify-markdown-line-cap.sh --all

      - name: Verify security-scan tee-status helper
        run: scripts/test-security-scan-tee-status.sh

      - name: Verify hot-path evidence
        env:
          ESHU_PERFORMANCE_EVIDENCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          scripts/test-verify-performance-evidence.sh
          scripts/verify-performance-evidence.sh

      - name: Verify query-plan regression gate
        run: |
          scripts/test-verify-query-plan-regression.sh
          scripts/verify-query-plan-regression.sh

      - name: Verify scale corpus suite
        run: |
          scripts/test-verify-scale-corpus-suite.sh
          scripts/verify-scale-corpus-suite.sh

      - name: Verify scale benchmark artifact
        run: |
          scripts/test-verify-scale-benchmark-artifact.sh
          scripts/verify-scale-benchmark-artifact.sh

      - name: Verify capability budget proof
        run: |
          scripts/test-verify-capability-budget-proof.sh
          scripts/verify-capability-budget-proof.sh

      - name: Verify package docs
        run: |
          scripts/test-verify-package-docs.sh
          scripts/verify-package-docs.sh

      - name: Verify shipped migration immutability
        run: |
          scripts/test-verify-migration-immutability.sh
          scripts/verify-migration-immutability.sh

      - name: Verify Go license headers
        run: |
          scripts/test-verify-license-header.sh
          scripts/verify-license-header.sh

      - name: Verify generated collector entrypoints
        run: |
          scripts/test-verify-collector-entrypoints-generated.sh
          scripts/verify-collector-entrypoints-generated.sh

      - name: Verify vulnerability parity fixtures
        run: scripts/verify_vulnerability_parity_fixtures.sh

      - name: Verify accuracy golden gate
        run: scripts/verify_accuracy_golden_gate.sh

      - name: Verify golden-corpus filter exhaustiveness
        run: |
          scripts/test-verify-golden-corpus-filter-exhaustive.sh
          scripts/verify-golden-corpus-filter-exhaustive.sh

  go-core:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep

      - name: Verify CI apt/ripgrep installer test mirror
        if: ${{ !cancelled() }}
        run: bash scripts/test-ci-install-apt-packages.sh

      - name: Verify go-mod-download-retry test mirror
        if: ${{ !cancelled() }}
        run: bash scripts/test-ci-go-mod-download-retry.sh

      - name: Verify go-install-retry test mirror
        if: ${{ !cancelled() }}
        run: bash scripts/test-ci-go-install-retry.sh

      - name: Pre-warm Go modules
        if: ${{ !cancelled() }}
        run: scripts/ci/go-mod-download-retry.sh

      - name: Install golangci-lint
        if: ${{ !cancelled() }}
        run: scripts/ci/go-install-retry.sh github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Pre-warm golangci-lint filelength plugin modules
        if: ${{ !cancelled() }}
        run: scripts/ci/go-mod-download-retry.sh tools/golangci-lint-filelength

      - name: Build golangci-lint filelength plugin
        if: ${{ !cancelled() }}
        working-directory: tools/golangci-lint-filelength
        run: make build

      - name: Test golangci-lint filelength plugin
        if: ${{ !cancelled() }}
        working-directory: tools/golangci-lint-filelength
        run: make test

      - name: Pre-warm golangci-lint dirgate plugin modules
        if: ${{ !cancelled() }}
        run: scripts/ci/go-mod-download-retry.sh tools/golangci-lint-dirgate

      - name: Build golangci-lint dirgate plugin
        if: ${{ !cancelled() }}
        working-directory: tools/golangci-lint-dirgate
        run: make build

      - name: Verify dirgate test mirrors
        if: ${{ !cancelled() }}
        run: bash scripts/test-verify-dirgate.sh && bash scripts/test-generate-dirgate-grandfather-go.sh

      - name: Test dirgate plugin
        if: ${{ !cancelled() }}
        working-directory: tools/golangci-lint-dirgate
        run: go test ./... -count=1

      - name: Verify dirgate (bash mirror)
        if: ${{ !cancelled() }}
        run: bash scripts/verify-dirgate.sh --all

      - name: Lint Go
        if: ${{ !cancelled() }}
        working-directory: go
        run: golangci-lint run ./...

      - name: Check gofumpt formatting
        if: ${{ !cancelled() }}
        working-directory: go
        run: golangci-lint fmt --diff

      - name: Build all Go binaries
        if: ${{ !cancelled() }}
        working-directory: go
        run: go build ./...

  go-core-complete:
    needs: [changes, go-core]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert go-core passed
        run: |
          changes_result="${{ needs.changes.result }}"
          result="${{ needs.go-core.result }}"
          echo "changes result: ${changes_result}"
          echo "aggregated go-core result: ${result}"
          if [ "${changes_result}" != "success" ]; then
            echo "::error::changes gate did not succeed (result=${changes_result}) - a skipped go-core cannot be trusted as a docs-only skip"
            exit 1
          fi
          if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
            echo "::error::go-core did not succeed (result=${result})"
            exit 1
          fi

  go-race:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Helm for race tests
        uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.3

      - name: Pre-warm Go modules
        run: scripts/ci/go-mod-download-retry.sh

      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep

      - name: Run Go tests with race detector (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        working-directory: go
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          pkgs="$(go list ./... | awk -v n="${SHARD_TOTAL}" -v k="${SHARD_INDEX}" 'NR % n == (k % n)')"
          if [ -z "${pkgs}" ]; then
            echo "shard ${SHARD_INDEX}/${SHARD_TOTAL}: no packages selected — nothing to test"
            exit 0
          fi
          count="$(printf '%s\n' "${pkgs}" | wc -l | tr -d ' ')"
          echo "shard ${SHARD_INDEX}/${SHARD_TOTAL}: ${count} package(s)"
          # -timeout is PER TEST BINARY, so this budget has to cover the single
          # slowest package in the shard, not the shard's total. internal/ifa
          # measures 107s under -race on a dev laptop and blew the old 300s on
          # a CI runner (run 31249051543, shard 2/4: "panic: test timed out
          # after 5m0s ... FAIL github.com/eshu-hq/eshu/go/internal/ifa
          # 300.894s") -- the suite completes, the budget was just sized with
          # no headroom for a slower, loaded runner.
          #
          # 900s keeps ~3x margin over that observed CI cost while still
          # failing a genuine hang in minutes. It is a sizing fix, not a mask:
          # ~78% of internal/ifa's race time is one test
          # (TestRepoDependencyBackfillProofOduCanonicalBytesAreDeterministic,
          # 83.4s for two CanonicalizeOdu calls), tracked separately in #5975.
          printf '%s\n' "${pkgs}" | xargs go test -count=1 -race -timeout 900s -p 2

  go-race-complete:
    needs: [changes, go-race]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert all race shards passed
        run: |
          changes_result="${{ needs.changes.result }}"
          result="${{ needs.go-race.result }}"
          echo "changes result: ${changes_result}"
          echo "aggregated go-race result: ${result}"
          if [ "${changes_result}" != "success" ]; then
            echo "::error::changes gate did not succeed (result=${changes_result}) - a skipped go-race matrix cannot be trusted as a docs-only skip"
            exit 1
          fi
          if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
            echo "::error::one or more go-race shards did not succeed (result=${result})"
            exit 1
          fi

  docs-helm-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Go for validated registry fragments
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install ripgrep
        run: scripts/ci/install-apt-packages.sh ripgrep

      - name: Verify docs-only CI carve-out wiring
        run: |
          scripts/test-verify-docs-only-ci-skip.sh
          scripts/verify-docs-only-ci-skip.sh

      - name: Verify docs catalog metadata
        run: |
          scripts/test-verify-docs-catalog.sh
          scripts/verify-docs-catalog.sh

      - name: Verify context and story reference layout
        run: |
          scripts/test-context-stories-doc-split.sh
          scripts/test-context-stories-markdown-visible.sh

      - name: Verify gate labelling annotations
        run: |
          scripts/test-issue-6184-gate-labelling.sh

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.3

      - name: Lint Helm chart
        run: helm lint deploy/helm/eshu

      - name: Verify bundled NornicDB storage example
        run: |
          scripts/test-verify-storage-doc-bundled-nornicdb-example.sh
          scripts/verify-storage-doc-bundled-nornicdb-example.sh

      - name: Verify docs build
        run: |
          pip install mkdocs mkdocs-material pymdown-extensions
          mkdocs build --strict --clean --config-file docs/mkdocs.yml

      - name: Check whitespace hygiene
        run: git show --check --format= HEAD
