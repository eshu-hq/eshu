name: Verify CI Gate Registry

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  # Merge-queue entries (#7111): every job runs, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  # Main has no merge queue since 2026-10-16 (#8288): inert until re-enabled.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: ci-leaf-verify-ci-gate-registry-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  queue-selection:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'queue-selection') }}
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: verify-ci-gate-registry.yml

  test-verify:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'test-verify') }}
    needs: queue-selection
    name: Verify ci-gate registry test mirror
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry test mirror')) }}
        uses: actions/checkout@v5

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry test mirror')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry test mirror')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a registry-drift
      # failure that never compiled anything (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry test mirror')) }}
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run test mirror
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift') || contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry test mirror')) }}
        run: |
          scripts/test-verify-ci-gates-registry.sh
          scripts/test-pre-pr-whole-module-gates.sh
          scripts/test-pre-push.sh
          scripts/test-no-prepr-stamp-references.sh
          scripts/test-generate-ci-gates-doc.sh
          scripts/test-verify-live-required-status-checks.sh
          scripts/test-resolve-required-gates-pr.sh
          scripts/test-main-health.sh
          scripts/dev/test-pre-enqueue-check.sh
          (cd go && go test ./internal/cigates -count=1)
          python3 scripts/ci/test_pr_scheduling.py

  verify:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'verify') }}
    name: Verify ci-gate registry + drift
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: [queue-selection, test-verify]
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Checkout repository
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift')) }}
        uses: actions/checkout@v5

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install ripgrep
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a registry-drift
      # failure that never compiled anything (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift')) }}
        run: scripts/ci/go-mod-download-retry.sh

      - name: Verify ci-gate registry integrity and hook/workflow drift
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Verify ci-gate registry + drift')) }}
        run: scripts/verify-ci-gates-registry.sh --drift
