name: Verify CI Gate Registry

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  push:
    branches:
      - main

concurrency:
  group: ci-leaf-verify-ci-gate-registry-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

# Container jobs run steps with sh by default; the inline scripts below
# need bash (set -o pipefail). The runner default is already bash, so this
# is a no-op outside containers.
defaults:
  run:
    shell: bash

jobs:
  test-verify:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'test-verify') }}
    name: Verify ci-gate registry test mirror
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    # Go 1.26.11 and ripgrep come from the pinned image (GOTOOLCHAIN=local
    # fails a go.mod toolchain bump until the image is rebuilt): no setup-go
    # or apt install. The recipe additionally bakes the go/ module seed,
    # and this pin carries that layer, so the offline probe below is
    # expected to pass; the retry script stays as the fallback path.
    # Repinned with the seed index for #10594.
    container: ghcr.io/eshu-hq/ci-tools@sha256:5bd016995aa47cb5c292b99e2354b235fc5f5883882f14fadf31535579beda50
    env:
      GOTOOLCHAIN: local
      GOCACHE: /tmp/eshu-ci/go-build
      GOMODCACHE: /tmp/eshu-ci/go-mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The recipe's seed covers the go/ module, so the probe below proves
      # the cache with no network. On any later go.sum drift the
      # fallback downloads with retries so a dropped proxy stream fails
      # THERE, named for what it is, instead of surfacing as a
      # registry-drift failure that never compiled anything (#6615
      # follow-up to #6075). continue-on-error keeps the probe from failing
      # the job when the fallback succeeds.
      - name: Probe baked module seed (offline)
        id: seed
        continue-on-error: true
        run: |
          set -euo pipefail
          cd go
          GOPROXY=off GOMODCACHE=/opt/ci-go-mod GOFLAGS=-mod=readonly go mod verify

      - name: Warm Go modules on seed miss
        if: steps.seed.outcome != 'success'
        run: scripts/ci/go-mod-download-retry.sh

      - name: Run test mirror
        run: |
          scripts/test-verify-ci-gates-registry.sh
          scripts/test-pre-pr-whole-module-gates.sh
          scripts/test-pre-push.sh
          scripts/test-go-toolchain.sh
          scripts/test-no-prepr-stamp-references.sh
          scripts/test-generate-ci-gates-doc.sh
          scripts/test-regen-conflicts.sh
          scripts/test-verify-live-required-status-checks.sh
          scripts/test-resolve-required-gates-pr.sh
          scripts/test-main-health.sh
          scripts/test-dirgate-main-alarm.sh
          scripts/dev/test-pre-enqueue-check.sh
          (cd go && go test ./internal/cigates -count=1)
          python3 scripts/ci/test_pr_scheduling.py

  verify:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'verify') }}
    name: Verify ci-gate registry + drift
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: [test-verify]
    # Same tooling as test-verify above (seeded image; retry script stays
    # fallback for go.sum drift): no setup-go or apt install.
    container: ghcr.io/eshu-hq/ci-tools@sha256:5bd016995aa47cb5c292b99e2354b235fc5f5883882f14fadf31535579beda50
    env:
      GOTOOLCHAIN: local
      GOCACHE: /tmp/eshu-ci/go-build
      GOMODCACHE: /tmp/eshu-ci/go-mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Same seed probe + retry-script fallback as test-verify above (the
      # probe is expected to pass; the retry script carries downloads on
      # a seed miss).
      - name: Probe baked module seed (offline)
        id: seed
        continue-on-error: true
        run: |
          set -euo pipefail
          cd go
          GOPROXY=off GOMODCACHE=/opt/ci-go-mod GOFLAGS=-mod=readonly go mod verify

      - name: Warm Go modules on seed miss
        if: steps.seed.outcome != 'success'
        run: scripts/ci/go-mod-download-retry.sh

      - name: Verify ci-gate registry integrity and hook/workflow drift
        run: scripts/verify-ci-gates-registry.sh --drift
