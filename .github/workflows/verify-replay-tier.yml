name: Replay Tier (offline NornicDB)

# R-5 offline replay gate tier (#4107, epic #4102). Spins up a single NornicDB
# via plain `docker run` (no Compose), replays the committed cassette through the
# production canonical projection writer, and asserts node/edge truth over Bolt.
#
# This job is what actually gates the backend-specific projection class in CI —
# #4019 nested-directory drop, commit-time MERGE races, NornicDB MATCH quirks. A
# fake/in-memory graph cannot reproduce those, so without this job a regression
# back to the full-atomic projection path would stay green on the default
# `go test ./...` run (where the live tier skips). It is deliberately lean (one
# container, no Postgres), complementing — not replacing — the full
# Compose B-7 golden-corpus gate.

on:
  workflow_call:
    inputs:
      plan_jobs:
        required: true
        type: string
      plan_gates:
        required: true
        type: string
      plan_mode:
        required: true
        type: string
  # Merge-queue entries (#7111): every job runs, publication stays off, and
  # required-gates.yml aggregates the merge_group check rows.
  # Main has no merge queue since 2026-10-16 (#8288): inert until re-enabled.
  merge_group:
    types: [checks_requested]
  push:
    branches: [ main ]

concurrency:
  group: ci-leaf-verify-replay-tier-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the gate only checks out and reads the repo.
permissions:
  contents: read

# #9066: -std=gnu17 keeps go-sitter-forest/perl compiling on GCC 15 + glibc 2.43 (C23
# bsearch macro) when the Go build cache is cold. "-O2 -g" is Go's own default, kept
# because setting CGO_CFLAGS replaces it. Remove with scripts/lib/cgo-cflags.sh.
env:
  CGO_CFLAGS: "-O2 -g -std=gnu17"

jobs:
  queue-selection:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'queue-selection') }}
    uses: ./.github/workflows/queue-selection.yml
    with:
      workflow: verify-replay-tier.yml

  replay-tier:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON(inputs.plan_jobs || '[]'), 'replay-tier') }}
    needs: queue-selection
    name: Offline replay tier vs real NornicDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require queue selection to succeed
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: test "${{ needs.queue-selection.result }}" = success
      - name: Check out code
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Offline replay tier vs real NornicDB')) }}
        uses: actions/checkout@v5

      - name: Set up Go
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Offline replay tier vs real NornicDB')) }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install contract dependencies
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Offline replay tier vs real NornicDB')) }}
        run: scripts/ci/install-apt-packages.sh ripgrep
        env:
          GH_TOKEN: ${{ github.token }}

      # Pre-warm Go modules with retries so a dropped proxy stream fails
      # HERE, named for what it is, instead of surfacing as a replay-tier
      # failure that never ran a test (#6615 follow-up to #6075).
      - name: Pre-warm Go modules
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Offline replay tier vs real NornicDB')) }}
        run: scripts/ci/go-mod-download-retry.sh

      - name: Verify replay tier contract
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Offline replay tier vs real NornicDB')) }}
        run: bash scripts/test-verify-replay-tier.sh

      - name: Run offline replay tier against real NornicDB
        if: ${{ github.event_name != 'merge_group' || (contains(fromJSON(needs.queue-selection.outputs.jobs || '[]'), 'Offline replay tier vs real NornicDB')) }}
        run: bash scripts/verify-replay-tier.sh
