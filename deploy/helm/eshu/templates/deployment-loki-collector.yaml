{{- if .Values.lokiCollector.enabled }}
{{- $activation := (include "eshu.lokiCollectorActivation" . | fromJson) }}
{{- $ctx := dict "root" . "activation" $activation }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eshu.lokiCollectorFullname" . }}
  labels:
    {{- include "eshu.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki-collector
spec:
  replicas: {{ .Values.lokiCollector.replicas }}
  revisionHistoryLimit: {{ .Values.lokiCollector.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "eshu.lokiCollectorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eshu.lokiCollectorSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/loki-activation: {{ include "eshu.componentActivationConfigYAML" $ctx | sha256sum | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "eshu.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "eshu.componentActivationInitContainers" (dict "root" . "activations" (list $activation)) | nindent 8 }}
      containers:
        - name: loki-collector
          # Extracted satellite (#9202): the in-tree producer is deleted. The
          # Eshu image stays the host and runs the component-extension
          # worker; the collector binary and manifest arrive from the
          # digest-pinned satellite seed image via the init containers above,
          # mirroring the live QA loki worker.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/eshu-collector-component-extension"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: ESHU_HOME
              value: /tmp/.eshu
            - name: HOME
              value: /tmp
            {{- include "eshu.renderContentStoreEnv" . | nindent 12 }}
            {{- include "eshu.renderConnectionTuningEnv" .Values.lokiCollector.connectionTuning | nindent 12 }}
            {{- include "eshu.renderLokiCollectorEnv" . | nindent 12 }}
            {{- include "eshu.renderComponentExtensionPolicyEnv" . | nindent 12 }}
            - name: ESHU_COMPONENT_COLLECTOR_INSTANCE_ID
              value: {{ .Values.lokiCollector.instanceId | quote }}
            - name: ESHU_COMPONENT_COLLECTOR_OWNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ESHU_COMPONENT_COLLECTOR_SCOPE_KIND
              value: {{ $activation.host.scope.kind | quote }}
            - name: ESHU_COMPONENT_COLLECTOR_POLL_INTERVAL
              value: {{ .Values.lokiCollector.pollInterval | quote }}
            {{- with .Values.lokiCollector.claimLeaseTTL }}
            - name: ESHU_COMPONENT_COLLECTOR_CLAIM_LEASE_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.lokiCollector.heartbeatInterval }}
            - name: ESHU_COMPONENT_COLLECTOR_HEARTBEAT_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- include "eshu.renderOtelEnv" (dict "Values" .Values "component" "loki-collector") | nindent 12 }}
            {{- include "eshu.renderPrometheusEnv" . | nindent 12 }}
            {{- include "eshu.renderEnvMap" .Values.env | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.observability.prometheus.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.prometheus.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.lokiCollector.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: component-home
              mountPath: {{ .Values.componentExtensionCollector.componentHome | quote }}
            - name: component-activations
              mountPath: {{ include "eshu.componentActivationConfigDir" . | quote }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: component-home
          emptyDir: {}
        - name: component-activations
          configMap:
            name: {{ include "eshu.lokiCollectorFullname" . }}-activation
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
