{{- if and (not .Values.schemaBootstrap.enabled) .Values.schemaBootstrap.argocdPreSync.enabled }}
{{- fail "schemaBootstrap.argocdPreSync.enabled=true requires schemaBootstrap.enabled=true; the Job is the PreSync hook" }}
{{- end }}
{{- if .Values.schemaBootstrap.enabled }}
{{- if and .Values.schemaBootstrap.useHelmHooks .Values.nornicdb.enabled }}
{{- fail "schemaBootstrap.useHelmHooks=true requires the graph backend to exist before Helm pre-install hooks run; set nornicdb.enabled=false or deploy bundled NornicDB separately before enabling the schema bootstrap hook" }}
{{- end }}
{{- if and .Values.schemaBootstrap.argocdPreSync.enabled .Values.nornicdb.enabled }}
{{- fail "schemaBootstrap.argocdPreSync.enabled=true requires the graph backend to exist before the ArgoCD PreSync hook runs; set nornicdb.enabled=false or deploy bundled NornicDB separately before enabling the schema bootstrap hook" }}
{{- end }}
{{- if and .Values.schemaBootstrap.useHelmHooks .Values.schemaBootstrap.argocdPreSync.enabled }}
{{- fail "schemaBootstrap.useHelmHooks and schemaBootstrap.argocdPreSync.enabled are mutually exclusive; set useHelmHooks=false when ArgoCD owns the sync because ArgoCD also processes helm.sh/hook annotations" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "eshu.schemaBootstrapFullname" . }}
  labels:
    {{- include "eshu.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-bootstrap
  {{- if or .Values.schemaBootstrap.useHelmHooks .Values.schemaBootstrap.argocdPreSync.enabled .Values.schemaBootstrap.annotations }}
  annotations:
    {{- if .Values.schemaBootstrap.useHelmHooks }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- end }}
    {{- if .Values.schemaBootstrap.argocdPreSync.enabled }}
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": {{ .Values.schemaBootstrap.argocdPreSync.syncWave | quote }}
    "argocd.argoproj.io/hook-delete-policy": {{ .Values.schemaBootstrap.argocdPreSync.hookDeletePolicy | quote }}
    {{- end }}
    {{- with .Values.schemaBootstrap.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.schemaBootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.schemaBootstrap.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.schemaBootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "eshu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schema-bootstrap
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $podAnnotations := mergeOverwrite (dict) .Values.podAnnotations .Values.schemaBootstrap.podAnnotations }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.schemaBootstrap.serviceAccountName }}
      serviceAccountName: {{ .Values.schemaBootstrap.serviceAccountName | quote }}
      {{- end }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Refuse to start while another session in this database holds a
        # backend_xmin older than 5 minutes (#7791). A CREATE INDEX
        # CONCURRENTLY build behind such a holder stalls in "waiting for old
        # snapshots" until the holder ends or this Job's deadline fires, and at
        # the deadline the index stays INVALID. The wait is per-database
        # (observed on PG 18, see #7791: an old snapshot in another database
        # does not block the build), so holders elsewhere in the cluster are ignored.
        # Five minutes because steady-state Eshu transactions finish in
        # seconds; the known exception is the package-manifest backfill's
        # hour-long transaction (#7663), which blocks a concurrent build
        # exactly like a park holder, so refusing there is correct too.
        # The default image pin follows docker-compose.yaml (override via
        # schemaBootstrap.precheckImage); the catalog columns used here need
        # no psql-to-server version match.
        - name: xmin-precheck
          image: "{{ .Values.schemaBootstrap.precheckImage.repository }}:{{ .Values.schemaBootstrap.precheckImage.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              : "${ESHU_POSTGRES_DSN:?xmin-precheck: ESHU_POSTGRES_DSN is not set}"
              holders="$(psql "$ESHU_POSTGRES_DSN" -v ON_ERROR_STOP=1 -tA -c "SELECT 'pid=' || pid || ' user=' || usename || ' app=' || COALESCE(application_name, '') || ' state=' || state || ' xact_start=' || xact_start || ' query=' || left(regexp_replace(COALESCE(query, ''), '\s+', ' ', 'g'), 160) FROM pg_stat_activity WHERE datname = current_database() AND backend_xmin IS NOT NULL AND xact_start IS NOT NULL AND xact_start < now() - interval '5 minutes' AND pid <> pg_backend_pid() ORDER BY xact_start;")"
              if [ -z "$holders" ]; then
                echo "xmin-precheck: no backend_xmin holder older than 5 minutes; starting schema bootstrap"
                exit 0
              fi
              db="$(psql "$ESHU_POSTGRES_DSN" -v ON_ERROR_STOP=1 -tA -c 'SELECT current_database()')"
              n="$(printf '%s\n' "$holders" | wc -l | tr -d ' ')"
              printf '%s\n' "xmin-precheck: refusing to start schema bootstrap: $n session(s) in database \"$db\" hold backend_xmin older than 5 minutes. A CREATE INDEX CONCURRENTLY build would stall in \"waiting for old snapshots\" until they end; see the park-holder runbook (docs/public/operate/park-holder-runbook.md). Holders, oldest first:"
              printf '%s\n' "$holders"
              exit 1
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGOPTIONS
              value: "-c statement_timeout=30000"
            {{- include "eshu.renderContentStoreEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: schema-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/eshu-bootstrap-data-plane"]
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "eshu.renderDataPlaneBootstrapEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.schemaBootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
