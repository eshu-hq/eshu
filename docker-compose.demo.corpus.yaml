# Demo corpus staging, cassette collectors, and the deferred-relationship
# maintenance orchestrator. Use docker-compose.demo.yaml as the operator
# entrypoint.
#
# The demo corpus is the manifest-declared subset of the golden-corpus-gate's
# proven fixture/cassette set (specs/demo-first-answers.v1.yaml artifacts):
# the union of repos and cassette families the five demo questions depend on.
# ESHU_GITHUB_ORG=acme (set on demo-corpus-orchestrator below) matches the
# gate's org pinning so the package-registry source_hint on lib-common
# resolves to the in-corpus orders-api -> lib-common owner repo (rc-3).

x-demo-runtime-env: &demo_runtime_env
  ESHU_GRAPH_BACKEND: nornicdb
  DEFAULT_DATABASE: nornic
  ESHU_NEO4J_DATABASE: nornic
  NEO4J_DATABASE: nornic
  NEO4J_URI: bolt://nornicdb:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${ESHU_DEMO_NEO4J_PASSWORD:-change-me}
  ESHU_CONTENT_STORE_DSN: postgresql://eshu:${ESHU_DEMO_POSTGRES_PASSWORD:-change-me}@postgres:5432/eshu
  ESHU_POSTGRES_DSN: postgresql://eshu:${ESHU_DEMO_POSTGRES_PASSWORD:-change-me}@postgres:5432/eshu
  ESHU_HOME: /tmp/.eshu
  HOME: /tmp
  ESHU_REPOS_DIR: /data/repos
  ESHU_REPO_SOURCE_MODE: filesystem
  # Source corpus (ESHU_FILESYSTEM_ROOT) and the managed working checkout
  # (ESHU_REPOS_DIR) MUST be different directories. In the default (non-direct)
  # filesystem mode, bootstrap-index cleans ESHU_REPOS_DIR and then copies each
  # discovered repo from ESHU_FILESYSTEM_ROOT into it (see
  # go/internal/collector/repo/git/selection_filesystem.go). Pointing both at the
  # same dir makes that clean wipe the staged fixtures before the copy reads
  # them. This mirrors scripts/verify-golden-corpus-gate.sh, which stages into
  # a corpus dir and syncs into a separate repos dir.
  ESHU_FILESYSTEM_ROOT: /data/corpus
  ESHU_GIT_AUTH_METHOD: none
  ESHU_GITHUB_ORG: acme
  ESHU_REPOSITORY_RULES_JSON: "[]"
  ESHU_QUERY_PROFILE: local_full_stack
  ESHU_DEPLOYMENT_ENVIRONMENT: local-compose-demo

# Cassette collectors are long-running: `-mode=cassette` replays a recorded
# fixture, commits its facts, then keeps its status server up (they run as a
# hosted service, not a one-shot). The orchestrator gates on service_healthy
# (status server serving = process alive) and then verifies every collector's
# facts actually landed in ingestion_scopes before running bootstrap, so a
# collector that is up but has not yet committed cannot let the pipeline
# proceed on a partial corpus. Teardown (down -v) stops them.
x-demo-collector: &demo_collector
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
  environment:
    <<: *demo_runtime_env
    ESHU_LISTEN_ADDR: "0.0.0.0:8080"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s
  depends_on:
    db-migrate:
      condition: service_completed_successfully

services:
  nornicdb:
    extends:
      file: docker-compose.yaml
      service: nornicdb
    ports: !override
      - "${ESHU_DEMO_NORNICDB_HTTP_PORT:-17474}:7474"
      - "${ESHU_DEMO_NORNICDB_BOLT_PORT:-17687}:7687"

  postgres:
    extends:
      file: docker-compose.yaml
      service: postgres
    ports: !override
      - "${ESHU_DEMO_POSTGRES_PORT:-18432}:5432"
    environment:
      POSTGRES_PASSWORD: ${ESHU_DEMO_POSTGRES_PASSWORD:-change-me}

  db-migrate:
    extends:
      file: docker-compose.yaml
      service: db-migrate
    build:
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    environment:
      <<: *demo_runtime_env

  # One-shot: COPIES (not symlinks) each manifest-declared repo fixture into
  # the shared source corpus dir /data/corpus (ESHU_FILESYSTEM_ROOT), which
  # bootstrap-index then syncs into ESHU_REPOS_DIR. The filesystem discovery
  # walker treats each immediate child of ESHU_FILESYSTEM_ROOT as a repo and
  # does not follow symlinks, so a symlinked fixture collapses to a single
  # scope and breaks the cross-repo DEPENDS_ON edge (rc-3) this demo shows.
  demo-corpus-staging:
    image: alpine:3.21
    user: "0:0"
    volumes:
      - type: volume
        source: eshu_demo_data
        target: /data
        volume:
          nocopy: true
      - ./tests/fixtures/ecosystems:/src-fixtures:ro
      - ./scripts/demo-corpus-staging.sh:/usr/local/bin/demo-corpus-staging.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/demo-corpus-staging.sh"]
    environment:
      ESHU_DEMO_CORPUS_REPOS: >-
        api-svc deployable-source deployable-config
        kustomize-deployable-overlay orders-api lib-common

  workspace-setup:
    extends:
      file: docker-compose.yaml
      service: workspace-setup
    build:
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    volumes:
      - type: volume
        source: eshu_demo_data
        target: /data
        volume:
          nocopy: true
    depends_on:
      demo-corpus-staging:
        condition: service_completed_successfully

  collector-kubernetes-live:
    <<: *demo_collector
    command: ["/usr/local/bin/eshu-collector-kubernetes-live", "-mode=cassette", "-cassette-file=/cassettes/supply-chain-demo.json"]
    volumes:
      - ./testdata/cassettes/kuberneteslive:/cassettes:ro

  collector-oci-registry:
    <<: *demo_collector
    command: ["/usr/local/bin/eshu-collector-oci-registry", "-mode=cassette", "-cassette-file=/cassettes/supply-chain-demo.json"]
    volumes:
      - ./testdata/cassettes/ociregistry:/cassettes:ro

  collector-gcp-cloud:
    <<: *demo_collector
    command: ["/usr/local/bin/eshu-collector-gcp-cloud", "-mode=cassette", "-cassette-file=/cassettes/supply-chain-demo.json"]
    volumes:
      - ./testdata/cassettes/gcpcloud:/cassettes:ro

  collector-package-registry:
    <<: *demo_collector
    command: ["/usr/local/bin/eshu-collector-package-registry", "-mode=cassette", "-cassette-file=/cassettes/supply-chain-demo.json"]
    volumes:
      - ./testdata/cassettes/packageregistry:/cassettes:ro

  collector-pagerduty:
    <<: *demo_collector
    command: ["/usr/local/bin/eshu-collector-pagerduty", "-mode=cassette", "-cassette-file=/cassettes/supply-chain-demo.json"]
    volumes:
      - ./testdata/cassettes/pagerduty:/cassettes:ro

  # One-shot: copy the collector binary and manifest out of the
  # digest-pinned satellite image into the shared component home, mirroring
  # the live QA tempo worker. Runs as root so the seeded files land in the
  # fresh root-owned named volume; the reconcile step hands ownership to the
  # runtime uid when the registry is ready.
  collector-tempo-seed:
    image: ghcr.io/eshu-hq/eshu-collector-tempo@sha256:0230e174284bb7a9831babac9b9927be05df02e8620c20e448e91dbb1ac2ecac
    restart: "no"
    user: "0:0"
    command: ["/usr/local/bin/collector", "seed", "--dest", "/components/runtime/tempo-primary", "--image-ref", "ghcr.io/eshu-hq/eshu-collector-tempo@sha256:0230e174284bb7a9831babac9b9927be05df02e8620c20e448e91dbb1ac2ecac"]
    volumes:
      - tempo_component_home:/components

  # One-shot: verify the seed, write the activation file, then grant, install
  # and enable the tempo component in the shared component home (host image,
  # has sh). The main worker starts only after this exits 0.
  collector-tempo-reconcile:
    <<: *demo_collector
    restart: "no"
    user: "0:0"
    # Disable the merged collector healthcheck: this is a one-shot with no
    # :8080 server, so the curl check would report it perpetually unhealthy.
    healthcheck:
      disable: true
    environment:
      <<: *demo_runtime_env
      ESHU_COMPONENT_HOME: /components
      COMPONENT_ID: dev.eshu.collector.tempo
      COMPONENT_VERSION: 0.1.3
      INSTANCE_ID: tempo-primary
      MODE: scheduled
      CONFIG_PATH: /components/activations/tempo-primary.yaml
      ALLOW_IDS: dev.eshu.collector.tempo
      ALLOW_PUBLISHERS: eshu-hq
    volumes:
      - tempo_component_home:/components
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        home="$${ESHU_COMPONENT_HOME:?ESHU_COMPONENT_HOME must be set}"
        runtime="$${home}/runtime/$${INSTANCE_ID:?INSTANCE_ID must be set}"
        if [ ! -x "$${runtime}/collector" ] || [ ! -s "$${runtime}/manifest.yaml" ]; then
          echo "seed image did not write $${runtime}/collector and $${runtime}/manifest.yaml" >&2
          exit 1
        fi
        mkdir -p "$$(dirname "$${CONFIG_PATH:?CONFIG_PATH must be set}")"
        cat > "$${CONFIG_PATH}" <<'ACTIVATION'
        config:
          limits:
            claimTimeoutSeconds: 300
            maxPayloadBytes: 1048576
            maxRecordsPerClaim: 50000
            maxResultBytes: 3145728
          targets:
            - provider: tempo
              scope_id: "tempo:supply-chain-demo-traces:supply-chain-demo"
              instance_id: supply-chain-demo
              base_url: ""
              resource_limit: 50
              stale_after: 24h
        host:
          scope:
            id: "tempo:supply-chain-demo-traces:supply-chain-demo"
            kind: trace_source
          sourceSystem: tempo
        process:
          args:
            - --sdk-stdio
          command: /components/runtime/tempo-primary/collector
          stdout_limit_bytes: 67108864
        ACTIVATION
        eshu component grant "$${COMPONENT_ID}" --component-home "$${home}" --version "$${COMPONENT_VERSION}" --kind 'observability.source_instance' --schema-version '1.0.0' --scope 'tempo' --expires-in '720h'
        eshu component grant "$${COMPONENT_ID}" --component-home "$${home}" --version "$${COMPONENT_VERSION}" --kind 'observability.observed_trace_signal' --schema-version '1.0.0' --scope 'tempo' --expires-in '720h'
        eshu component grant "$${COMPONENT_ID}" --component-home "$${home}" --version "$${COMPONENT_VERSION}" --kind 'observability.coverage_warning' --schema-version '1.0.0' --scope 'tempo' --expires-in '720h'
        eshu component install "$${runtime}/manifest.yaml" --component-home "$${home}" --trust-mode allowlist --allow-id "$${ALLOW_IDS}" --allow-publisher "$${ALLOW_PUBLISHERS}"
        raw="$$(eshu component list --component-home "$${home}" --json)"
        listed="$$(printf '%s' "$${raw}" | tr -d ' \n')"
        marker='{"id":"'
        rest=$${listed}
        found=""
        while :; do
          case "$${rest}" in
            *"$${marker}"*) ;;
            *) break ;;
          esac
          rest=$${rest#*"$${marker}"*}
          entry=$${rest%%"$${marker}"*}
          case "$${entry}" in
            "$${COMPONENT_ID}\",\""*"\"version\":\"$${COMPONENT_VERSION}\""*) found=1 ;;
          esac
        done
        if [ -z "$${found}" ]; then
          echo "seeded manifest is not $${COMPONENT_ID}@$${COMPONENT_VERSION}; fix COMPONENT_ID/COMPONENT_VERSION or the seed image" >&2
          exit 1
        fi
        status=0
        out="$$(eshu component enable "$${COMPONENT_ID}" --component-home "$${home}" --instance "$${INSTANCE_ID}" --mode "$${MODE}" --claims --config "$${CONFIG_PATH}" 2>&1)" || status=$$?
        printf '%s\n' "$${out}"
        if [ "$${status}" -ne 0 ]; then
          case "$${out}" in
            *"activation \"$${INSTANCE_ID}\" is already enabled for component \"$${COMPONENT_ID}\""*)
              echo "activation $${INSTANCE_ID} already enabled; continuing"
              ;;
            *) exit "$${status}" ;;
          esac
        fi
        chown -R 10001:10001 "$${home}"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      collector-tempo-seed:
        condition: service_completed_successfully

  collector-tempo:
    # Extracted satellite (#9172): the in-tree producer is deleted. The Eshu
    # image stays the host and runs the component-extension worker; the
    # collector binary and manifest arrive from the digest-pinned satellite
    # seed image via the seed and reconcile services above, mirroring the
    # live QA tempo worker.
    <<: *demo_collector
    command: ["/usr/local/bin/eshu-collector-component-extension"]
    environment:
      <<: *demo_runtime_env
      ESHU_LISTEN_ADDR: "0.0.0.0:8080"
      ESHU_COMPONENT_HOME: /components
      ESHU_COMPONENT_TRUST_MODE: allowlist
      ESHU_COMPONENT_ALLOW_IDS: dev.eshu.collector.tempo
      ESHU_COMPONENT_ALLOW_PUBLISHERS: eshu-hq
      ESHU_COMPONENT_COLLECTOR_INSTANCE_ID: tempo-primary
      ESHU_COMPONENT_COLLECTOR_OWNER_ID: tempo-primary-worker
      ESHU_COMPONENT_COLLECTOR_SCOPE_KIND: trace_source
      ESHU_COMPONENT_COLLECTOR_POLL_INTERVAL: 2s
    volumes:
      # The cassette mount stays: the seeded satellite v0.1.3 only collects
      # live over the SDK, so replay through the extension is not possible
      # yet and the demo tempo facts stay empty until a cassette-capable
      # satellite release lands. The cassette file remains the replay-coverage
      # manifest's proof artifact.
      - ./testdata/cassettes/tempo:/cassettes:ro
      - tempo_component_home:/components
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      collector-tempo-seed:
        condition: service_completed_successfully
      collector-tempo-reconcile:
        condition: service_completed_successfully

  collector-prometheus-mimir:
    <<: *demo_collector
    command: ["/usr/local/bin/eshu-collector-prometheus-mimir", "-mode=cassette", "-cassette-file=/cassettes/supply-chain-demo.json"]
    volumes:
      - ./testdata/cassettes/prometheusmimir:/cassettes:ro

  collector-grafana:
    <<: *demo_collector
    command: ["/usr/local/bin/eshu-collector-grafana", "-mode=cassette", "-cassette-file=/cassettes/supply-chain-demo.json"]
    volumes:
      - ./testdata/cassettes/grafana:/cassettes:ro

  # Loki runs the live-QA host-image-plus-seed shape (#9202): the in-tree
  # producer is deleted and the satellite image ships only an SDK-stdio
  # collector (no -mode=cassette, no status server, no shell), so compose
  # uses no init containers: a seed service runs the satellite seed command
  # into a named volume, a host-image reconcile step grants/installs/enables
  # the component, and collector-loki (host image) runs the
  # component-extension worker. Service name, cassette bind, env, the curl
  # healthcheck, orchestrator gating, and the expected-collector count stay
  # at 9.
  collector-loki-seed:
    # Digest-pinned satellite release (the tag documents the release, the
    # digest is the pin). Verified 2026-10-26: the image holds only
    # /usr/local/bin/collector (SDK-stdio plus the seed subcommand).
    image: ghcr.io/eshu-hq/eshu-collector-loki:v0.1.2@sha256:12eac89e7abd2988529c6f2854ba63293b5507502630764c3f6b8ffc7e3bf84d
    user: "0:0"
    # --dest must stay ${component home}/runtime/${instance} for the
    # ESHU_COMPONENT_HOME / ESHU_COMPONENT_COLLECTOR_INSTANCE_ID pair the
    # reconcile step and the worker share below.
    command: ["/usr/local/bin/collector", "seed", "--dest", "/data/.eshu/components/runtime/collector-loki-demo", "--image-ref", "ghcr.io/eshu-hq/eshu-collector-loki@sha256:12eac89e7abd2988529c6f2854ba63293b5507502630764c3f6b8ffc7e3bf84d"]
    volumes:
      - type: volume
        source: eshu_demo_loki_components
        target: /data
        volume:
          nocopy: true

  collector-loki-reconcile:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    # Root like the other one-shots in this file: the seed container writes
    # root-owned files and the worker reads them as the image's eshu user,
    # so this step fixes permissions before install.
    user: "0:0"
    # Disable the image's inherited HEALTHCHECK, as for the orchestrator
    # below: this is a one-shot script with no :8080 server.
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/demo-corpus-loki-reconcile.sh"]
    environment:
      <<: *demo_runtime_env
      ESHU_COMPONENT_HOME: /data/.eshu/components
      ESHU_COMPONENT_COLLECTOR_INSTANCE_ID: collector-loki-demo
    volumes:
      - type: volume
        source: eshu_demo_loki_components
        target: /data
        volume:
          nocopy: true
      - ./scripts/demo-corpus-loki-reconcile.sh:/usr/local/bin/demo-corpus-loki-reconcile.sh:ro
    depends_on:
      collector-loki-seed:
        condition: service_completed_successfully

  collector-loki:
    <<: *demo_collector
    command: ["/usr/local/bin/eshu-collector-component-extension"]
    environment:
      <<: *demo_runtime_env
      ESHU_LISTEN_ADDR: "0.0.0.0:8080"
      ESHU_COMPONENT_HOME: /data/.eshu/components
      ESHU_COMPONENT_TRUST_MODE: allowlist
      ESHU_COMPONENT_ALLOW_IDS: dev.eshu.collector.loki
      ESHU_COMPONENT_ALLOW_PUBLISHERS: eshu-hq
      ESHU_COMPONENT_CORE_VERSION: dev
      ESHU_COMPONENT_COLLECTOR_INSTANCE_ID: collector-loki-demo
      ESHU_COMPONENT_COLLECTOR_OWNER_ID: collector-loki-demo-worker
    volumes:
      # Retained for the follow-up replay wiring: the satellite runs
      # live-only today, so the credential-free demo carries no Loki target
      # and the worker idles healthy until live QA supplies targets through
      # the reconcile step's activation shape.
      - ./testdata/cassettes/loki:/cassettes:ro
      - type: volume
        source: eshu_demo_loki_components
        target: /data
        volume:
          nocopy: true
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      collector-loki-reconcile:
        condition: service_completed_successfully

  # One-shot orchestrator: verify collector commits landed -> bootstrap-index
  # -> drain -> deferred-relationship maintenance x2 -> drain, mirroring
  # scripts/verify-golden-corpus-gate.sh's approximation of the ingester's
  # continuous RunDeferredRelationshipMaintenance loop. Q2 (RUNS_IMAGE, rc-4)
  # and Q4 (cross-repo DEPENDS_ON, rc-3) only converge after this sequence — a
  # single bootstrap+reducer pass is NOT sufficient. Runs bootstrap-index and
  # the reducer/projector binaries directly (built into the same product image)
  # rather than depending on the gate-only eshu-golden-corpus-gate binary, which
  # is not part of the Dockerfile build.
  demo-corpus-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    user: "0:0"
    # Disable the image's inherited HEALTHCHECK: this is a one-shot that runs a
    # shell script and exits, with no :8080 server, so the curl healthcheck
    # would report it perpetually unhealthy and `docker compose up --wait` would
    # block on it forever instead of accepting its exit-0 completion (which is
    # what the api/mcp depends_on: service_completed_successfully keys off).
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/demo-corpus-orchestrator.sh"]
    environment:
      <<: *demo_runtime_env
      # bootstrap-index, reducer, and projector each start an operator status
      # server (ESHU_LISTEN_ADDR) and a metrics server (ESHU_METRICS_ADDR),
      # both defaulting to fixed ports 8080/9464. The orchestrator runs the
      # reducer and projector concurrently in one container, so a fixed port
      # collides ("bind: address already in use"). Give each an ephemeral port,
      # exactly as scripts/verify-golden-corpus-gate.sh does for the same
      # concurrently-run lifecycle binaries.
      ESHU_LISTEN_ADDR: "127.0.0.1:0"
      ESHU_METRICS_ADDR: "127.0.0.1:0"
      ESHU_DEMO_EXPECTED_COLLECTOR_SOURCES: ${ESHU_DEMO_EXPECTED_COLLECTOR_SOURCES:-9}
      ESHU_DEMO_DRAIN_TIMEOUT_SECONDS: ${ESHU_DEMO_DRAIN_TIMEOUT_SECONDS:-600}
      ESHU_DEMO_DRAIN_POLL_SECONDS: ${ESHU_DEMO_DRAIN_POLL_SECONDS:-3}
      ESHU_DEMO_DRAIN_SETTLE_SECONDS: ${ESHU_DEMO_DRAIN_SETTLE_SECONDS:-60}
    volumes:
      - type: volume
        source: eshu_demo_data
        target: /data
        volume:
          nocopy: true
      - ./scripts/demo-corpus-orchestrator.sh:/usr/local/bin/demo-corpus-orchestrator.sh:ro
    depends_on:
      workspace-setup:
        condition: service_completed_successfully
      collector-kubernetes-live:
        condition: service_healthy
      collector-oci-registry:
        condition: service_healthy
      collector-gcp-cloud:
        condition: service_healthy
      collector-package-registry:
        condition: service_healthy
      collector-pagerduty:
        condition: service_healthy
      collector-tempo:
        condition: service_healthy
      collector-prometheus-mimir:
        condition: service_healthy
      collector-grafana:
        condition: service_healthy
      collector-loki:
        condition: service_healthy

volumes:
  nornicdb_v132_data:
  postgres_data:
  eshu_demo_data:
  tempo_component_home:
  eshu_demo_loki_components:
