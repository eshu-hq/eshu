openapi: 3.1.0
info:
  title: Eshu Runtime Admin API
  version: 1.0.0
  summary: Shared probe and operator-status contract for long-running Go runtimes.
  description: >
    This contract describes the mounted runtime admin surface used by the Go
    data-plane services. It is separate from the public `/api/v0` query API
    schema and the public `/api/v0/admin/*` API-admin surface, and applies to service-local admin endpoints such as the API,
    ingester, projector, and reducer runtimes.
servers:
  - url: http://localhost:8080
    description: Example local runtime admin surface
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getRuntimeHealth
      description: Returns the runtime liveness probe body. Only `GET` and `HEAD` are supported.
      responses:
        "200":
          description: Runtime process is alive.
          content:
            text/plain:
              schema:
                type: string
              example: service=collector-git probe=healthz status=ok
        "405":
          description: Unsupported method.
          headers:
            Allow:
              schema:
                type: string
              example: GET, HEAD
    head:
      summary: Liveness probe metadata
      operationId: headRuntimeHealth
      description: Returns the liveness probe status without a response body.
      responses:
        "200":
          description: Runtime process is alive.
        "405":
          description: Unsupported method.
          headers:
            Allow:
              schema:
                type: string
              example: GET, HEAD
  /readyz:
    get:
      summary: Readiness probe
      operationId: getRuntimeReadiness
      description: Returns the runtime readiness probe body. Only `GET` and `HEAD` are supported.
      responses:
        "200":
          description: Runtime can satisfy its readiness contract.
          content:
            text/plain:
              schema:
                type: string
              example: service=collector-git probe=readyz status=ok
        "503":
          description: Runtime dependency check failed.
          content:
            text/plain:
              schema:
                type: string
              example: "service=collector-git probe=readyz status=error error=read status snapshot: postgres unavailable"
        "405":
          description: Unsupported method.
          headers:
            Allow:
              schema:
                type: string
              example: GET, HEAD
    head:
      summary: Readiness probe metadata
      operationId: headRuntimeReadiness
      description: Returns the readiness probe status without a response body.
      responses:
        "200":
          description: Runtime can satisfy its readiness contract.
        "503":
          description: Runtime dependency check failed.
        "405":
          description: Unsupported method.
          headers:
            Allow:
              schema:
                type: string
              example: GET, HEAD
  /admin/status:
    get:
      summary: Operator status report
      operationId: getRuntimeStatus
      description: >
        Returns the shared operator status report. When `format` is omitted, the
        handler serves text by default unless the request `Accept` header prefers
        `application/json`. Only `GET` and `HEAD` are supported.
      parameters:
        - in: query
          name: format
          required: false
          description: Report output format.
          schema:
            type: string
            enum:
              - text
              - json
            default: text
      responses:
        "200":
          description: Operator-facing status report.
          content:
            text/plain:
              schema:
                type: string
              example: |
                Health: progressing
                Queue: outstanding=2 in_flight=1 retrying=0 failed=0 oldest=45s overdue_claims=0
                Provenance edge identity upgrade: applied=true required=2
                Retry policies: projector max_attempts=3 retry_delay=30s; reducer max_attempts=3 retry_delay=30s
                Scope activity: active=2 changed=1 unchanged=1
                Scope statuses: active=2 pending=1
                Generation history: active=1 pending=1 completed=4 superseded=0 failed=0 other=0
                Generation transitions: scope=scope-123 generation=generation-b status=active trigger=snapshot freshness=changed files observed=2026-04-12T15:45:00Z activated=2026-04-12T15:46:00Z superseded= current_active=generation-b
                Registry collectors:
                  oci_registry instances=1 active_scopes=2 recent_completed_generations=4 retryable_failures=1 terminal_failures=0 last_completed_at=2026-05-13T14:28:00Z failure_classes=registry_rate_limited=1
            application/json:
              schema:
                $ref: "#/components/schemas/StatusReport"
        "400":
          description: Unsupported response format.
          content:
            text/plain:
              schema:
                type: string
              example: unsupported format "yaml"
        "405":
          description: Unsupported method.
          headers:
            Allow:
              schema:
                type: string
              example: GET, HEAD
        "499":
          description: >
            The caller canceled the request before the report loaded. Not a
            server fault; the body is the same fixed message as the 500 answers.
          content:
            text/plain:
              schema:
                type: string
              example: load status report failed
        "500":
          description: >
            Report load or render failure. The body is a fixed message
            (`load status report failed` or `render status report failed`) and
            never carries the backend error text; the error is logged
            server-side.
          content:
            text/plain:
              schema:
                type: string
              example: load status report failed
    head:
      summary: Operator status metadata
      operationId: headRuntimeStatus
      description: Returns the operator status response headers and status code without a body.
      parameters:
        - in: query
          name: format
          required: false
          description: Response content type selection rules match `GET /admin/status`.
          schema:
            type: string
            enum:
              - text
              - json
            default: text
      responses:
        "200":
          description: Operator-facing status report metadata.
        "400":
          description: Unsupported response format.
        "405":
          description: Unsupported method.
          headers:
            Allow:
              schema:
                type: string
              example: GET, HEAD
        "499":
          description: The caller canceled the request. Not a server fault.
        "500":
          description: Report load or render failure. No body detail beyond the fixed message.
  /admin/replay-collector-generations:
    post:
      summary: Request source-level replay for collector generation failures
      operationId: replayCollectorGenerations
      description: >
        Marks dead-lettered collector generation commit failures for
        source-level replay. The route does not reconstruct consumed fact
        streams; callers should use it after fixing the underlying commit
        failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectorGenerationReplayRequest"
      responses:
        "200":
          description: Collector generation replay request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorGenerationReplayResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid request body: unexpected EOF"
        "422":
          description: Filter validation failure. The body keeps the caller-actionable validation text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "collector generation replay requires collector_kind"
        "405":
          description: Unsupported method.
          headers:
            Allow:
              schema:
                type: string
              example: POST
        "499":
          description: >
            The caller canceled the request. Not a server fault; the body is
            the same fixed message as the 500 answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "collector generation replay failed"
        "500":
          description: >
            Store failure. The body is the fixed message
            (`collector generation replay failed`) and never carries the store
            error text; the error is logged server-side.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "collector generation replay failed"
components:
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
    CollectorGenerationReplayRequest:
      type: object
      additionalProperties: false
      required:
        - collector_kind
      properties:
        collector_kind:
          type: string
          description: Collector family to replay.
        scope_ids:
          type: array
          items:
            type: string
        failure_class:
          type: string
        limit:
          type: integer
    CollectorGenerationReplayResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - replayed
        - generation_ids
      properties:
        status:
          type: string
          enum:
            - replay_requested
        replayed:
          type: integer
        generation_ids:
          type: array
          items:
            type: string
    CollectorGenerationDeadLetters:
      type: object
      additionalProperties: false
      required:
        - dead_letter
        - replay_requested
        - replay_attempts
        - oldest_dead_letter_age
        - oldest_dead_letter_age_seconds
      properties:
        dead_letter:
          type: integer
        replay_requested:
          type: integer
        replay_attempts:
          type: integer
        oldest_dead_letter_age:
          type: string
        oldest_dead_letter_age_seconds:
          type: number
    HealthSummary:
      type: object
      additionalProperties: false
      required:
        - state
        - reasons
      properties:
        state:
          type: string
          enum:
            - healthy
            - progressing
            - degraded
            - stalled
        reasons:
          type: array
          items:
            type: string
    FlowSummary:
      type: object
      additionalProperties: false
      required:
        - lane
        - source
        - progress
        - backlog
      properties:
        lane:
          type: string
        source:
          type: string
          enum:
            - live
            - inferred
        progress:
          type: string
        backlog:
          type: string
    QueueSummary:
      type: object
      additionalProperties: false
      required:
        - total
        - outstanding
        - pending
        - in_flight
        - retrying
        - succeeded
        - failed
        - dead_letter
        - provenance_edge_identity_upgrade_applied
        - provenance_edge_identity_upgrade_required
        - oldest_outstanding_age
        - oldest_outstanding_age_seconds
        - overdue_claims
      properties:
        total:
          type: integer
        outstanding:
          type: integer
        pending:
          type: integer
        in_flight:
          type: integer
        retrying:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        dead_letter:
          type: integer
        provenance_edge_identity_upgrade_applied:
          type: boolean
        provenance_edge_identity_upgrade_required:
          type: integer
        oldest_outstanding_age:
          type: string
        oldest_outstanding_age_seconds:
          type: number
        overdue_claims:
          type: integer
    RetryPolicySummary:
      type: object
      additionalProperties: false
      required:
        - stage
        - max_attempts
        - retry_delay
        - retry_delay_seconds
      properties:
        stage:
          type: string
        max_attempts:
          type: integer
        retry_delay:
          type: string
        retry_delay_seconds:
          type: number
    ScopeActivitySummary:
      type: object
      additionalProperties: false
      required:
        - active
        - changed
        - unchanged
      properties:
        active:
          type: integer
        changed:
          type: integer
        unchanged:
          type: integer
    GenerationHistorySummary:
      type: object
      additionalProperties: false
      required:
        - active
        - pending
        - completed
        - superseded
        - failed
        - other
      properties:
        active:
          type: integer
        pending:
          type: integer
        completed:
          type: integer
        superseded:
          type: integer
        failed:
          type: integer
        other:
          type: integer
    GenerationTransitionSummary:
      type: object
      additionalProperties: false
      required:
        - scope_id
        - generation_id
        - status
        - trigger_kind
        - observed_at
      properties:
        scope_id:
          type: string
        generation_id:
          type: string
        status:
          type: string
        trigger_kind:
          type: string
        freshness_hint:
          type: string
        observed_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
        superseded_at:
          type: string
          format: date-time
        current_active_generation_id:
          type: string
    StageSummary:
      type: object
      additionalProperties: false
      required:
        - stage
        - pending
        - claimed
        - running
        - retrying
        - succeeded
        - failed
        - dead_letter
      properties:
        stage:
          type: string
        pending:
          type: integer
        claimed:
          type: integer
        running:
          type: integer
        retrying:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        dead_letter:
          type: integer
    DomainBacklog:
      type: object
      additionalProperties: false
      required:
        - domain
        - outstanding
        - in_flight
        - retrying
        - failed
        - dead_letter
        - oldest_age
        - oldest_age_seconds
      properties:
        domain:
          type: string
        outstanding:
          type: integer
        in_flight:
          type: integer
        retrying:
          type: integer
        failed:
          type: integer
        dead_letter:
          type: integer
        oldest_age:
          type: string
        oldest_age_seconds:
          type: number
    QueueBlockage:
      type: object
      additionalProperties: false
      required:
        - stage
        - domain
        - conflict_domain
        - conflict_key
        - holder_domain
        - blocked
        - oldest_age
        - oldest_age_seconds
      properties:
        stage:
          type: string
        domain:
          type: string
        conflict_domain:
          type: string
        conflict_key:
          type: string
        holder_domain:
          type: string
          description: >-
            Reducer domain of the live claimed or running row that holds this
            row's conflict fence. Empty when no lease holds it, as for a row
            gated by a missing readiness requirement.
        blocked:
          type: integer
        oldest_age:
          type: string
        oldest_age_seconds:
          type: number
    RegistryFailureClassCount:
      type: object
      additionalProperties: false
      required:
        - name
        - count
      properties:
        name:
          type: string
          enum:
            - registry_auth_denied
            - registry_not_found
            - registry_rate_limited
            - registry_retryable_failure
            - registry_canceled
            - registry_terminal_failure
        count:
          type: integer
    RegistryCollectorSummary:
      type: object
      additionalProperties: false
      required:
        - collector_kind
        - configured_instances
        - active_scopes
        - recent_completed_generations
        - retryable_failures
        - terminal_failures
      properties:
        collector_kind:
          type: string
          enum:
            - oci_registry
            - package_registry
        configured_instances:
          type: integer
        active_scopes:
          type: integer
        recent_completed_generations:
          description: Completed workflow items in the last 24 hours.
          type: integer
        last_completed_at:
          type: string
          format: date-time
        retryable_failures:
          type: integer
        terminal_failures:
          type: integer
        failure_class_counts:
          type: array
          items:
            $ref: "#/components/schemas/RegistryFailureClassCount"
        metadata_targets:
          type: array
          description: Package-registry metadata target counts by ecosystem.
          items:
            $ref: "#/components/schemas/RegistryMetadataTargetCount"
    RegistryMetadataTargetCount:
      type: object
      additionalProperties: false
      required:
        - ecosystem
        - planned
        - completed
        - skipped
        - stale
        - failed
        - rate_limited
      properties:
        ecosystem:
          type: string
        planned:
          type: integer
        completed:
          type: integer
        skipped:
          type: integer
        stale:
          type: integer
        failed:
          type: integer
        rate_limited:
          type: integer
    AWSCloudScanSummary:
      type: object
      additionalProperties: false
      required:
        - collector_instance_id
        - account_id
        - region
        - service_kind
        - status
        - commit_status
        - api_call_count
        - throttle_count
        - warning_count
        - resource_count
        - relationship_count
        - tag_observation_count
        - budget_exhausted
        - credential_failed
      properties:
        collector_instance_id:
          type: string
        account_id:
          type: string
        region:
          type: string
        service_kind:
          type: string
        status:
          type: string
          enum: [running, succeeded, partial, failed, credential_failed]
        commit_status:
          type: string
          enum: [pending, committed, failed]
        failure_class:
          type: string
        failure_message:
          description: Bounded, redacted failure detail. It must not contain raw
            AWS ARNs, request IDs, access keys, or unbounded SDK payloads.
          type: string
        api_call_count:
          type: integer
        throttle_count:
          type: integer
        warning_count:
          type: integer
        resource_count:
          type: integer
        relationship_count:
          type: integer
        tag_observation_count:
          type: integer
        budget_exhausted:
          type: boolean
        credential_failed:
          type: boolean
        last_started_at:
          type: string
          format: date-time
        last_observed_at:
          type: string
          format: date-time
        last_completed_at:
          type: string
          format: date-time
        last_successful_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AWSFreshnessStatusCount:
      type: object
      additionalProperties: false
      required:
        - name
        - count
      properties:
        name:
          type: string
          enum: [queued, claimed, handed_off, failed]
        count:
          type: integer
    AWSFreshnessSummary:
      type: object
      additionalProperties: false
      required:
        - status_counts
        - oldest_queued_age
        - oldest_queued_age_seconds
      properties:
        status_counts:
          type: array
          items:
            $ref: "#/components/schemas/AWSFreshnessStatusCount"
        oldest_queued_age:
          type: string
        oldest_queued_age_seconds:
          type: number
    StatusReport:
      type: object
      additionalProperties: false
      required:
        - version
        - as_of
        - health
        - flow
        - queue
        - retry_policies
        - scope_activity
        - generation_history
        - generation_transitions
        - scopes
        - generations
        - stages
        - domains
        - queue_blockages
        - collector_generation_dead_letters
        - semantic_extraction
        - answer_narration
      properties:
        version:
          type: string
          description: Eshu binary version that rendered the report.
        as_of:
          type: string
          format: date-time
        health:
          $ref: "#/components/schemas/HealthSummary"
        flow:
          type: array
          items:
            $ref: "#/components/schemas/FlowSummary"
        queue:
          $ref: "#/components/schemas/QueueSummary"
        retry_policies:
          type: array
          nullable: true
          description: Retry policies by stage. Null when the report carries none (nil slice, no omitempty).
          items:
            $ref: "#/components/schemas/RetryPolicySummary"
        scope_activity:
          $ref: "#/components/schemas/ScopeActivitySummary"
        generation_history:
          $ref: "#/components/schemas/GenerationHistorySummary"
        generation_transitions:
          type: array
          nullable: true
          description: Generation transitions observed by the reducer. Null when the report carries none (nil slice, no omitempty).
          items:
            $ref: "#/components/schemas/GenerationTransitionSummary"
        scopes:
          type: object
          additionalProperties:
            type: integer
        generations:
          type: object
          additionalProperties:
            type: integer
        stages:
          type: array
          items:
            $ref: "#/components/schemas/StageSummary"
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainBacklog"
        domain_backlogs_truncated:
          type: boolean
          description: >
            True when `domains` was capped at the configured row limit. Absent
            (false) when the full domain backlog list fit within the cap.
        domain_backlogs_limit:
          type: integer
          description: >
            The row cap applied to `domains` when domain_backlogs_truncated is
            true. Zero, and typically absent, when the list was not truncated.
        queue_blockages:
          type: array
          items:
            $ref: "#/components/schemas/QueueBlockage"
        collector_generation_dead_letters:
          $ref: "#/components/schemas/CollectorGenerationDeadLetters"
        collector_promotion_proofs:
          type: array
          description: >
            Per-collector-family promotion readiness derived from runtime status
            evidence. Present only for collectors with runtime evidence. Rows are
            redacted: they carry counts, evidence-source labels, bounded
            source-system names, and safe blocker strings, never credentials or
            raw provider payloads. The full-fleet enumeration is served by
            GET /api/v0/status/collector-readiness.
          items:
            type: object
            required:
              - collector_kind
              - promotion_state
            properties:
              collector_kind:
                type: string
              instance_id:
                type: string
              display_name:
                type: string
              promotion_state:
                type: string
                enum:
                  - implemented
                  - partial
                  - failed
                  - stale
                  - gated
                  - disabled
                  - permission_hidden
                  - unsupported
              runtime_category:
                type: string
              health:
                type: string
              claim_driven:
                type: boolean
              claim_state:
                type: string
              source_scope:
                type: string
              fixture_only:
                type: boolean
              evidence_sources:
                type: array
                items:
                  type: string
              source_systems:
                type: array
                items:
                  type: string
              observation_count:
                type: integer
              reducer_readback:
                type: string
                enum: [available, pending, unavailable]
              telemetry_handles:
                type: array
                items:
                  type: string
              blockers:
                type: array
                items:
                  type: string
              last_observed_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
              last_failure_class:
                type: string
                description: Bounded token for the newest unresolved terminal fetch failure. Absent when no such failure exists.
              last_failure_operation:
                type: string
                description: Bounded operation token accompanying last_failure_class. Absent when no such failure exists.
              last_failure_at:
                type: string
                format: date-time
                description: When the newest unresolved terminal fetch failure occurred. Absent when no such failure exists.
              acknowledged_failure:
                description: Operator-acknowledged terminal failure. Absent when there is none; never carries the operator's reason.
                $ref: "#/components/schemas/AcknowledgedFailure"
        registry_collectors:
          type: array
          description: >
            Aggregate OCI and package-registry runtime status. Rows must not
            include registry hosts, repository paths, package names, tags,
            digests, account IDs, metadata URLs, credential environment names,
            or credential values.
          items:
            $ref: "#/components/schemas/RegistryCollectorSummary"
        aws_cloud_scans:
          type: array
          description: >
            Per AWS collector tuple scanner and fact-commit status. Rows carry
            account IDs, regions, and service kinds because those are the AWS
            claim boundary; they must not include ARNs, resource names, tags,
            page tokens, or raw AWS error payloads.
          items:
            $ref: "#/components/schemas/AWSCloudScanSummary"
        aws_cloud_scans_truncated:
          type: boolean
          description: >
            True when the runtime returned only the configured AWS scan-status
            row cap instead of every collector/account/region/service tuple.
        aws_cloud_scan_limit:
          type: integer
          description: Configured AWS scan-status row cap when truncated.
        aws_freshness:
          description: >
            Aggregate AWS Config/EventBridge freshness trigger backlog. This
            section must not include event IDs, resource IDs, ARNs, tags, or raw
            provider payloads.
          $ref: "#/components/schemas/AWSFreshnessSummary"
        coordinator:
          description: >
            Coordinator registration, claim, and pressure snapshot. Absent when
            the report carries no coordinator evidence.
          $ref: "#/components/schemas/CoordinatorSnapshot"
        collector_runtimes:
          description: >
            Derived, additive per-instance runtime view over coordinator
            registration, direct collector status evidence, and persisted
            source or reducer fact evidence. Absent when no runtime evidence
            exists.
          type: array
          items:
            $ref: "#/components/schemas/CollectorRuntimeStatus"
        latest_failure:
          description: >
            Newest queue failure snapshot. Absent when no failure is recorded.
          $ref: "#/components/schemas/QueueFailure"
        active_work_source:
          description: >
            Which store answered the active-work read (model, live, or
            live_fallback) and why. Absent when the reader reported no source.
          $ref: "#/components/schemas/ActiveWorkSource"
        infra_inventory:
          description: >
            Infra read-model state (#6793). Absent when no infra inventory was
            reported.
          $ref: "#/components/schemas/InfraInventory"
        vulnerability_sources:
          description: >
            Durable OSV, NVD, KEV, EPSS, or derived source target state rows.
            Absent when no vulnerability source evidence exists.
          type: array
          items:
            $ref: "#/components/schemas/VulnerabilitySource"
        semantic_extraction:
          description: >
            Optional LLM-assisted semantic extraction status. Informational
            only; never marks health or readiness unhealthy.
          $ref: "#/components/schemas/SemanticExtraction"
        answer_narration:
          description: >
            Answer narration pipeline status: provider, policy, budget, and
            retention posture plus the supported state/reason vocabularies.
          $ref: "#/components/schemas/AnswerNarration"
        repository_selection:
          description: >
