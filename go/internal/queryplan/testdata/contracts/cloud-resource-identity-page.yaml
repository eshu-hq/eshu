workload: {"cardinality":"20001 owner rows and 20000 source facts across two scopes; 96 cases return at most 51 identities.","selectivity":"Provider/type/region/account repeat at moduli 4/20/8/16; combinations are correlated, so fractions cannot be multiplied. Scoped cases filter to allowed repository or scope before LIMIT.","skew":"One duplicate owner, one null resource type, one null provider, tombstone and retired generation, plus populated no-match pages.","depth":"One owner row with correlated fact, scope and generation EXISTS; no graph traversal.","fanout":"At most one current winner per UID; EXISTS stops after one eligible fact.","payload":"Only UID and resource_type. Fresh payload calibration's largest full statement row-array JSON is 2398 bytes.","max_result_payload_bytes":2398,"query_count":"One SQL statement per page; 64 emitted masks and 96 all/scoped/no-match cases.","budgets":"Normal <=2000 ms, one query, inclusive root buffers <=150000, temporary root blocks =0."}
