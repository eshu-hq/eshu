    query_fragment: 'MATCH (img:ContainerImage {digest: candidate_digest})<-[rel:RUNS_IMAGE]-(w:KubernetesWorkload)'
    cypher_sha256: 1900bbe55bc2f6e63da43ec9f8a6c1ed67e416702ab718aebd4db6ea2c794fee
    required_anchors:
      - {label: ContainerImage, property: digest}
      - {label: ContainerImageIndex, property: digest}
      - {label: ContainerImageDescriptor, property: digest}
    required_schema: [container_image_digest, container_image_index_digest, container_image_descriptor_digest]
    required_limits: [$limit]
    requires_order: true
    caveats:
      - The CALL wrapper preserves later UNION branches when an earlier concrete-label branch is empty on pinned NornicDB; each arm repeats the equality-indexed digest anchor. Every digest query is bounded to its balanced quota (plus one all-scope sentinel), for aggregate graph work of at most 200 scoped or 400 all-scope candidates.
    plan:
      operators: [NodeIndexSeek, Expand]
      forbidden_operators: [AllNodesScan, CartesianProduct, UnboundedExpand]

