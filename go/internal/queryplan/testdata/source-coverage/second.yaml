  - file: impact/trace_deployment_oci.go
    calls:
      # fan_out_multiplier: 3 -- ENFORCED by oci.RegistryTruthRowLimit
      # (impact/oci/bounds.go): every statement carries
      # LIMIT $row_limit (750 = 250 keys x 3), and oci.AdvanceBoundedRead
      # resumes any batch the limit cuts off with a continuation statement
      # keyed only by the still-incomplete keys, or withholds a key whose
      # rows alone fill the bound (an irreducible overflow -- never a
      # placeholder row); overflow is disclosed via
      # image_registry_truth_limits (#6590). Observation uid is
      # (repository_id, tag, resolved_digest), so multiplicity above 1 is
      # real, data-defined input, not a bug: 3x is declared headroom above
      # the 1 observation/ref measured on in-tree and reference corpora, not a
      # corpus worst case.
      - {symbol: "fetchOCIImageTagRows", count: 1, non_hot: {class: keyed_support, source_sha256: e00f260a8d9d3342bb81143d55d0fc1923e43ebcd4438a707147dc49edcc0581, key_bound: bounded_key_batch, max_keys: 250, fan_out_multiplier: 3, max_results: 750}}
      # fan_out_multiplier: 3 -- ENFORCED by oci.RegistryTruthRowLimit, same
      # bound and continuation mechanism as fetchOCIImageTagRows above
      # (#6590). Image uid multiplicity above 1 per digest per label is
      # data-defined, not a bug.
      - {symbol: "fetchOCIImagesByDigest", count: 1, non_hot: {class: keyed_support, source_sha256: ce9fe7c4fa80ebe3bb2e27f0fdad93b0a678458cb3f421b9de78eba39c34f44b, key_bound: bounded_key_batch, max_keys: 250, fan_out_multiplier: 3, max_results: 750}}
      # fan_out_multiplier: 1 -- enforced by the oci_registry_repository_uid_unique
      # constraint (go/internal/graph/schema_test.go): the batch key is
      # OciRegistryRepository.uid, which the schema guarantees unique, so
      # each key can match at most one repository row.
      - {symbol: "fetchOCIRepositoriesByUID", count: 1, non_hot: {class: keyed_support, source_sha256: b63226afd9a3ef88cc3f666c6ef56a4a5d840b8d2e4795e872ab430ba90e9d4c, key_bound: bounded_key_batch, max_keys: 250, fan_out_multiplier: 1, max_results: 250}}
