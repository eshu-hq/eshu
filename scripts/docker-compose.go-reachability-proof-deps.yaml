# Wave-3 proof overlay: the shared runtime stack gates workflow-coordinator
# on collector-security-alerts-preflight, whose binary is not shipped in a
# locally built eshu image (it runs from a pinned external image in hosted
# deployments). The go-reachability proof does not use security alerts, so
# the gate is optional here instead of blocking the whole bring-up. This
# overlay changes nothing else: every other dependency keeps its condition.
services:
  workflow-coordinator:
    depends_on:
      collector-security-alerts-preflight:
        condition: service_completed_successfully
        required: false

  # The shared runtime gates workflow-coordinator on
  # collector-security-alerts-preflight, whose binary is not shipped in a
  # locally built eshu image (hosted deployments run it from a pinned
  # external image). The go-reachability proof does not use security
  # alerts, so the preflight is stubbed to a no-op here instead of
  # failing container creation and aborting the bring-up. The
  # required:false above documents the intent; the stub makes `up`
  # succeed because Compose still creates every service in the graph.
  collector-security-alerts-preflight:
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    command: []

  # The fragment's worker defines its own environment without the fact and
  # content store DSNs the extension host requires at startup. Wire the
  # same Postgres DSN the runtime anchor uses for every other collector.
  collector-go-reachability:
    environment:
      ESHU_POSTGRES_DSN: postgresql://eshu:${ESHU_POSTGRES_PASSWORD:-change-me}@postgres:5432/eshu
      # Single-backend proof: the read surface is Neo4j-pinned, so the
      # whole stack records neo4j as-run (arbiter amendment to #10031).
      ESHU_GRAPH_BACKEND: neo4j

  # The D13 split moved the read API behind eshu-api (satellite), which
  # requires --core-base-url, but the shared stack defines no core-api
  # service. The proof runs core-api from the same eshu image and points
  # the frontend at it. Scoped to this proof; shared topology untouched.
  core-api:
    build:
      context: ${ESHU_REPO_ROOT:-.}
      dockerfile: Dockerfile
    command: ["/usr/local/bin/eshu-core-api"]
    environment:
      ESHU_GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${ESHU_NEO4J_PASSWORD:-change-me}
      ESHU_CONTENT_STORE_DSN: postgresql://eshu:${ESHU_POSTGRES_PASSWORD:-change-me}@postgres:5432/eshu
      ESHU_POSTGRES_DSN: postgresql://eshu:${ESHU_POSTGRES_PASSWORD:-change-me}@postgres:5432/eshu
      ESHU_HOME: /tmp/.eshu
      HOME: /tmp
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: on-failure

  eshu:
    command: ["/usr/local/bin/eshu-api", "--core-base-url=http://core-api:8080"]
    depends_on:
      core-api:
        condition: service_started

  # Single-backend proof graph (arbiter amendment to #10031): the shared
  # neo4j overlay is not included (it redefines services with bare build
  # contexts and profile-gates the coordinator), so the proof defines the
  # pinned Neo4j service itself and flips the graph writers to it.
  neo4j:
    image: neo4j:2026-community@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${ESHU_NEO4J_PASSWORD:-change-me}
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: ${ESHU_NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${ESHU_NEO4J_HEAP_MAX_SIZE:-512m}
      NEO4J_server_memory_pagecache_size: ${ESHU_NEO4J_PAGECACHE_SIZE:-512m}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${ESHU_NEO4J_PASSWORD:-change-me} RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  db-migrate:
    environment:
      ESHU_GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy

  bootstrap-index:
    environment:
      ESHU_GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy

  mcp-server:
    # Loopback proof harness only: the high-range host port is still the
    # operator's loopback. Never enable this where the port is public.
    environment:
      ESHU_MCP_ALLOW_UNAUTHENTICATED: "true"

volumes:
  neo4j_data:
