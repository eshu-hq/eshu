name: Fixture red dot-slash without checkout
# Seeded RED for scripts/test-verify-workflow-script-checkout.sh (#8008):
# mirrors red-no-checkout.yml but invokes the script via the `./scripts/`
# form (as in .github/workflows/e2e-tests.yml). The verifier must fail on
# this file.
on:
  workflow_dispatch:
jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
      - name: Resolve image reference from triggering workflow_run
        run: ./scripts/ci/resolve-image-scan-ref.sh
