name: Fixture red double-brace workspace without checkout
# Seeded RED for scripts/test-verify-workflow-script-checkout.sh (#8057
# follow-up): the step calls the repository script through the
# ${{ github.workspace }} path with no actions/checkout step anywhere in
# the job. The verifier must fail on this file.
on:
  workflow_dispatch:
jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image reference from triggering workflow_run
        run: bash ${{ github.workspace }}/scripts/ci/resolve-image-scan-ref.sh
