name: Fixture red env before sudo without checkout
# Seeded RED for scripts/test-verify-workflow-script-checkout.sh (#8057
# follow-up): the step executes a repository script with a VAR=value prefix
# stacked before sudo and no actions/checkout step anywhere in the job. The
# verifier must fail on this file.
on:
  workflow_dispatch:
jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image reference from triggering workflow_run
        run: A=1 sudo scripts/ci/resolve-image-scan-ref.sh
