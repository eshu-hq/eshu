name: Fixture red GITHUB_WORKSPACE without checkout
# Seeded RED for scripts/test-verify-workflow-script-checkout.sh (#8057):
# the step calls the repository script through the $GITHUB_WORKSPACE path
# with no actions/checkout step anywhere in the job. The verifier must fail
# on this file: the workspace is empty without a checkout, so the step exits
# 127 at run time.
on:
  workflow_dispatch:
jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
      - name: Resolve image reference from triggering workflow_run
        run: bash $GITHUB_WORKSPACE/scripts/ci/resolve-image-scan-ref.sh
