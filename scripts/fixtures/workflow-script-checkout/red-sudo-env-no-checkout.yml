name: Fixture red sudo env without checkout
# Seeded RED for scripts/test-verify-workflow-script-checkout.sh (#8107):
# the step executes a repository script through `sudo env A=1` (`env` is
# neither a sudo flag nor a VAR= prefix) and no actions/checkout step
# anywhere in the job. The verifier must fail on this file.
on:
  workflow_dispatch:
jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image reference with a clean environment
        run: sudo env A=1 scripts/ci/resolve-image-scan-ref.sh
