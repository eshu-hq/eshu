version: backend-divergence-allowlist/v1
updated_at: 2026-09-21
issue: 6782
parent_issue: 6788
owners:
  - graph
  - query

purpose: >
  Name the NornicDB-vs-Neo4j divergences the differential oracle is allowed
  to excuse. This spec is the acceptance oracle for issue #6782: the
  golden-corpus-gate backend-diff phase fails on every divergence this file
  does not name, so a silent semantic drift between the two backends can
  never pass as clean.

design: >
  Every divergence fails the gate until an entry names it with a reason, a
  tier, and an upstream issue link (enforced by ParseAllowlist — a missing
  reason, tier, or non-issue upstream link fails the parse). The tier scopes
  the excuse to one divergence kind (missing, results, failures, rowcount)
  or to the whole statement. There is no executions tier: execution-count
  differences with agreeing result sets are scheduling noise by the
  classifier's own definition (drain passes, retries, regrouped batches),
  the two backends drain at systematically different speeds so they
  reproduce across quorum pairings, and the gate holds them advisory
  (backendconformance.AdvisoryKind, #6782 permanent disposition
  2026-09-21) instead of excusing them one statement at a time. An entry
  must match at least one divergence in the run, so a fixed bug cannot
  linger as a permanent exemption (enforced by Excuse — a stale entry fails
  even a green run). Excuse narrowly: name the exact
  statement fingerprint, narrow parameters only when the divergence is
  binding-specific, and link the issue tracking the fix — #6906 for
  dialect-divergent reads, #6782 for oracle dispositions (by-design phased
  emission, scheduling noise, run-scoped lineage) that need no backend fix.

