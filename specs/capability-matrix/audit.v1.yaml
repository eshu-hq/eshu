      local_full_stack: {status: supported, max_truth_level: exact, required_runtime: full_stack, p95_latency_ms: 1500, max_scope_size: tenant_audit_summary, verification: [{go_test: ./internal/query}], notes: "bounded read over the persisted state with a stale or timed-out reader answering a retryable 503"}
      production: {status: experimental, max_truth_level: exact, required_runtime: deployed_services, p95_latency_ms: 2000, max_scope_size: tenant_audit_summary, verification: [{go_test: ./internal/query}], notes: "the read surface is proven by handler tests only (#8227). Stays experimental until a deployed run proves this route end to end"}
