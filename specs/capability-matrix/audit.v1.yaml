capabilities:
  - capability: audit.events.list
    tools: []
    profiles:
      local_lightweight: {status: supported, max_truth_level: exact, required_runtime: local_host_postgres, p95_latency_ms: 1000, max_scope_size: tenant_audit_event_page, verification: [{go_test: ./internal/query}], notes: "GET /api/v0/auth/admin/audit/events: bounded, filtered page of governance audit events for the caller's tenant"}
      local_authoritative: {status: supported, max_truth_level: exact, required_runtime: local_host_plus_graph, p95_latency_ms: 1000, max_scope_size: tenant_audit_event_page, verification: [{go_test: ./internal/query}], notes: "graph is not required for the Postgres-backed read; exact or derived follows the persisted state"}
      local_full_stack: {status: supported, max_truth_level: exact, required_runtime: full_stack, p95_latency_ms: 1500, max_scope_size: tenant_audit_event_page, verification: [{go_test: ./internal/query}], notes: "bounded read over the persisted state with a stale or timed-out reader answering a retryable 503"}
      production: {status: experimental, max_truth_level: exact, required_runtime: deployed_services, p95_latency_ms: 2000, max_scope_size: tenant_audit_event_page, verification: [{go_test: ./internal/query}], notes: "the read surface is proven by handler tests only (#8227). Stays experimental until a deployed run proves this route end to end"}
