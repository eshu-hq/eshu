version: v1
updated_at: 2026-07-30
owners:
  - platform-engineering
# Runtime drift readback across all three providers (issues #1997, #1998,
# #5759 follow-up). This aggregates two reducer-owned fact kinds in one query:
# reducer_multi_cloud_runtime_drift_finding (gcp, azure -- one row per
# canonical cloud_resource_uid) and reducer_aws_cloud_runtime_drift_finding
# (aws; DomainAWSCloudRuntimeDrift's exclusive fact kind, unchanged). It is a
# bounded, paginated, truth-labeled list filterable by provider (aws/gcp/azure),
# canonical scope, and finding_kind. The serving route (POST
# /api/v0/cloud/runtime-drift/findings) and MCP tools
# (list_cloud_runtime_drift_findings, export_cloud_runtime_drift_packet) read
# durable canonical drift facts; they never fabricate truth or leak raw
# provider locators (including the AWS ARN), and unsafe findings are refused
# (source_state=rejected with a refused action) rather than silently omitted.
# Before the read-side aggregation, provider=aws returned an empty page
# indistinguishable from "no AWS drift exists" even when
# DomainAWSCloudRuntimeDrift had live findings; the write-side partition
# (DomainMultiCloudRuntimeDrift never publishes an AWS finding, via
# excludeAWSOwnedRows) was always correct, only the read side did not follow
# it. Lightweight local runtime cannot materialize either fact kind's rows and
# returns unsupported_capability.
# See docs/public/reference/multi-cloud-collector-contract.md (Query Truth) and
# docs/public/reference/replatforming-source-state-taxonomy.md for the per-item
# source-state vocabulary surfaced alongside management_status.
capabilities:
  - capability: cloud_runtime_drift.readback.list
    tools: [list_cloud_runtime_drift_findings, export_cloud_runtime_drift_packet]
    profiles:
      local_lightweight: {status: unsupported, max_truth_level: unsupported, required_runtime: local_host, p95_latency_ms: null, max_scope_size: account_project_or_subscription, verification: [{integration_test: local-lightweight-unsupported-cloud-runtime-drift-readback}], notes: requires reducer-materialized reducer_multi_cloud_runtime_drift_finding and reducer_aws_cloud_runtime_drift_finding rows; lightweight local cannot serve a runtime drift readback and must return unsupported_capability}
      local_authoritative: {status: supported, max_truth_level: derived, required_runtime: local_host_plus_graph, p95_latency_ms: 5000, max_scope_size: account_project_or_subscription, verification: [{go_test: ./internal/query}], notes: bounded paginated readback aggregating reducer_multi_cloud_runtime_drift_finding (gcp, azure) and reducer_aws_cloud_runtime_drift_finding (aws) rows with provider, normalized identity, finding_kind, management_status, provider-neutral source state, and refusal-safety posture; an aws-origin row's safety verdict is derived through the same classification the AWS-specific aws_runtime_drift.findings.list capability uses, so the identical row never disagrees across capabilities}
      local_full_stack: {status: supported, max_truth_level: derived, required_runtime: full_stack, p95_latency_ms: 5000, max_scope_size: account_project_or_subscription, verification: [{go_test: ./internal/query}], notes: bounded paginated readback aggregating reducer_multi_cloud_runtime_drift_finding (gcp, azure) and reducer_aws_cloud_runtime_drift_finding (aws) rows with provider, normalized identity, finding_kind, management_status, provider-neutral source state, and refusal-safety posture; an aws-origin row's safety verdict is derived through the same classification the AWS-specific aws_runtime_drift.findings.list capability uses, so the identical row never disagrees across capabilities}
      production: {status: supported, max_truth_level: derived, required_runtime: deployed_services, p95_latency_ms: 5000, max_scope_size: account_project_or_subscription, verification: [{remote_validation: prod-cloud-runtime-drift-readback}], notes: bounded paginated readback aggregating reducer_multi_cloud_runtime_drift_finding (gcp, azure) and reducer_aws_cloud_runtime_drift_finding (aws) rows with provider, normalized identity, finding_kind, management_status, provider-neutral source state, and refusal-safety posture; an aws-origin row's safety verdict is derived through the same classification the AWS-specific aws_runtime_drift.findings.list capability uses, so the identical row never disagrees across capabilities}
