version: v1
gates:
  - id: go-fmt
    name: Go gofumpt formatting
    category: hygiene
    layer: hygiene
    purpose: "Checks Go source is formatted with gofumpt so diffs stay consistent."
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
      - "scripts/dev/precommit-go.sh"
      - "scripts/lib/precommit-go-gosec.sh"
    local:
      command: "bash scripts/dev/precommit-go.sh fmt-all"
      pre_push: floor
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-fmt

  - id: go-lint
    name: Go lint (golangci-lint)
    category: hygiene
    layer: hygiene
    purpose: "Runs golangci-lint across the Go module to catch style and correctness issues."
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
      - "scripts/dev/precommit-go.sh"
      - "scripts/lib/precommit-go-gosec.sh"
    local:
      command: "bash scripts/dev/precommit-go.sh lint-all"
      pre_push: floor
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-lint

  - id: go-build
    name: Go build (all binaries)
    category: build
    layer: hygiene
    purpose: "Builds every Go binary in the module to confirm the code still compiles."
    tier: pre-push
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "cd go && go build ./..."
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: go-vet
    name: Go vet
    category: hygiene
    layer: hygiene
    purpose: "Runs go vet across the Go module to catch suspicious constructs the compiler allows through."
    tier: pre-push
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "cd go && go vet ./..."
      pre_push: floor
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: go-file-cap
    name: Go 500-line file cap
    category: hygiene
    layer: hygiene
    purpose: "Fails when a Go file exceeds the 500-line cap, keeping files split and readable."
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
      - "scripts/dev/precommit-go.sh"
      - "scripts/lib/precommit-go-gosec.sh"
      - "scripts/test-precommit-go-filecap.sh"
      - "scripts/lib/test-precommit-go-filecap-cases.sh"
      # The Go plugin is the AUTHORITY the two bash variants mirror, and
      # tools/golangci-lint-filelength/skip_parity_test.go is what actually
      # compares them: it runs the plugin's skip() and the bash side (via
      # `precommit-go.sh filecap-skip`) over the same paths and fails when they
      # disagree. Before that test existed this trigger only re-ran a
      # bash-against-bash test, which is how the changed-files `filecap` variant
      # ended up rejecting long _test.go files that CI passed (#6104) with
      # nothing catching it.
      - "tools/golangci-lint-filelength/**"
    self_test_triggers:
      - "scripts/dev/precommit-go.sh"
      - "scripts/test-precommit-go-filecap.sh"
      - "scripts/lib/test-precommit-go-filecap-cases.sh"
      - "tools/golangci-lint-filelength/**"
    local:
      command: "bash scripts/dev/precommit-go.sh filecap-all"
      pre_push: floor
      # Half of this test_command now runs in CI and half does not, and the
      # split is deliberate. The plugin-module half (skip_parity_test.go, the
      # regression guard for the #6104 plugin-vs-bash drift) runs in test.yml's
      # go-core job via the "Test golangci-lint filelength plugin" step, because
      # a guard that only fires locally cannot stop the drift it exists to catch.
      # The shell half (test-precommit-go-filecap.sh) runs only under the local
      # runner (`make pre-pr` selects go-file-cap on a go/** change). That is the
      # existing convention, not an oversight. The closest precedent is
      # scripts/test-precommit-console.sh, the harness this one was modelled on:
      # a test_command names it here and nothing under .github/workflows/ ever
      # runs it. Six more are wired the same way. To re-derive that: pull every
      # scripts/*.sh token out of the test_command values in this file and
      # sort -u them (65 paths at this commit -- re-derive it rather than
      # trusting this number, it has gone stale twice), then rg each one under
      # .github/workflows/ -- 8 come back with no hit, the same 8 whether you
      # search the basename or the full path. CI still enforces the cap itself
      # through the golangci-lint plugin. What CI does not check is whether the
      # two bash variants still mirror that plugin.
      test_command: "bash scripts/test-precommit-go-filecap.sh && cd tools/golangci-lint-filelength && env -u GOROOT go test -count=1 ."
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-file-cap

  - id: go-dir-gate
    name: Go directory-size and naming gate
    category: hygiene
    layer: hygiene
    purpose: "Fails when a Go directory grows past max(40, its base count) without a Dirgate-Growth trailer, or a new file or package breaks the sibling-package naming rule."
    tier: pre-commit
    blocking: true
    triggers:
      # Every pull request must wait for this gate. The dirgate job runs on every
      # pull request, but required-gates-complete awaits only the jobs that
      # triggers select, and a stray Dirgate-Growth trailer on a docs-only change
      # still counts toward the absolute invariant's W. The specific paths below
      # stay for readers; "**" is what makes the check required.
      - "**"
      - "go/**"
      - "scripts/dev/precommit-go.sh"
      - "scripts/verify-dirgate.sh"
      - "go/cmd/dirgate/**"
    self_test_triggers:
      - "scripts/dev/precommit-go.sh"
      - "scripts/verify-dirgate.sh"
      - "go/cmd/dirgate/**"
    local:
      command: "bash scripts/dev/precommit-go.sh dirgate-all"
      pre_push: floor
      test_command: "cd go && env -u GOROOT go test -count=1 ./cmd/dirgate/"
    ci:
      workflow: test.yml
      # A dedicated job that needs only queue-selection, selected on every change
      # through the "**" trigger above. markdown-file-cap and scripts-file-cap are
      # path-scoped because their verdicts depend only on files under their
      # triggers. This gate also reads commit messages, which do not depend on
      # paths: a Dirgate-Growth trailer on a docs-only change still counts toward
      # the absolute invariant's W, so no change may skip it.
      job: "dirgate"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-dir-gate

  - id: markdown-file-cap
    name: Markdown 500-line file cap (go/ and docs/)
    category: hygiene
    layer: hygiene
    purpose: "Fails when a Markdown file under go/ or docs/ exceeds the 500-line cap."
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**/*.md"
      - "docs/**/*.md"
      - ".github/workflows/test.yml"
      - ".pre-commit-config.yaml"
      - "scripts/ci/install-apt-packages.sh"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - "scripts/verify-markdown-line-cap.sh"
      - "scripts/test-verify-markdown-line-cap.sh"
      # Glob, for the reason go-dir-gate globs its own lib files: the core
      # implementation, the pinned ledger, and the two case files the test
      # mirror sources all live under scripts/lib/ and all belong to this
      # gate. Listing them individually is what let the dirgate ledgers fall
      # out of their own gate's trigger list twice (#6054 review finding); a
      # glob cannot drift as files are added.
      - "scripts/lib/*markdown-line-cap*"
    self_test_triggers:
      - ".github/workflows/test.yml"
      - "scripts/verify-markdown-line-cap.sh"
      - "scripts/test-verify-markdown-line-cap.sh"
      - "scripts/lib/*markdown-line-cap*"
    local:
      command: "bash scripts/verify-markdown-line-cap.sh --all"
      pre_push: floor
      test_command: "bash scripts/test-verify-markdown-line-cap.sh"
    ci:
      workflow: test.yml
      job: "markdown-file-cap"
    # No `go` requirement, unlike go-file-cap and go-dir-gate: this gate is
    # pure bash plus `git ls-files`. The Go cap needs a toolchain because its
    # CI half is a golangci-lint plugin; Markdown has no such plugin, which is
    # exactly why #6187 needed a separate checker rather than a setting.
    requirements: []
    ci_only_reason: ""
    hook_id: markdown-file-cap

  - id: scripts-file-cap
    name: scripts/ 500-line file cap
    category: hygiene
    layer: hygiene
    purpose: "Fails when a tracked file under scripts/ exceeds the 500-line cap, or a pinned grandfather row grows (#8221)."
    tier: pre-commit
    blocking: true
    triggers:
      - "scripts/**"
      - ".github/workflows/test.yml"
      - ".pre-commit-config.yaml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - "scripts/verify-tooling-line-cap.sh"
      - "scripts/test-verify-tooling-line-cap.sh"
      - "scripts/lib/tooling-line-cap-*"
      - "scripts/lib/test-verify-tooling-line-cap-*"
    self_test_triggers:
      - ".github/workflows/test.yml"
      - "scripts/verify-tooling-line-cap.sh"
      - "scripts/test-verify-tooling-line-cap.sh"
      - "scripts/lib/tooling-line-cap-*"
      - "scripts/lib/test-verify-tooling-line-cap-*"
    local:
      command: "bash scripts/verify-tooling-line-cap.sh --all"
      pre_push: floor
      test_command: "bash scripts/test-verify-tooling-line-cap.sh"
    ci:
      workflow: test.yml
      job: "scripts-file-cap"
    # Pure bash plus git and awk, like markdown-file-cap: no Go toolchain.
    requirements: []
    ci_only_reason: ""
    hook_id: scripts-file-cap

  - id: package-docs
    name: Go package docs coverage
    category: hygiene
    layer: hygiene
    purpose: "Fails when a Go package is missing its doc.go, README.md or AGENTS.md."
    tier: pre-pr
    blocking: true
    triggers:
      - "go/**"
      - "scripts/test-verify-package-docs.sh"
      - "scripts/verify-package-docs.sh"
    self_test_triggers:
      - "scripts/test-verify-package-docs.sh"
      - "scripts/verify-package-docs.sh"
    local:
      command: "bash scripts/verify-package-docs.sh"
      pre_push: floor
      test_command: "bash scripts/test-verify-package-docs.sh"
    ci:
      workflow: test.yml
      job: "verify-contracts"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-package-docs

  - id: migration-immutability
    name: Shipped Postgres migration immutability and lock shape
    category: hygiene
    layer: hygiene
    purpose: "Fails when a shipped Postgres migration is edited instead of added as a new one, or an added one combines table-locking DDL with bulk DML (#7961)."
    tier: pre-push
    blocking: true
    triggers:
      - "go/internal/storage/postgres/migrations/*.sql"
      - "scripts/lib/migration_lock_shape.py"
      - "scripts/test-migration-lock-shape.py"
      - "scripts/test-verify-migration-immutability.sh"
      - "scripts/test-verify-migration-immutability-merge-group.sh"
      - "scripts/verify-migration-immutability.sh"
    self_test_triggers:
      - "scripts/lib/migration_lock_shape.py"
      - "scripts/test-migration-lock-shape.py"
      - "scripts/test-verify-migration-immutability.sh"
      - "scripts/test-verify-migration-immutability-merge-group.sh"
      - "scripts/verify-migration-immutability.sh"
    local:
      command: "bash scripts/verify-migration-immutability.sh"
      pre_push: floor
      test_command: "bash scripts/test-verify-migration-immutability.sh"
    ci:
      workflow: test.yml
      job: "verify-contracts"
    requirements: []
    ci_only_reason: ""
    hook_id: ""

  - id: gitignore-rg-parity
    name: Tracked files visible to ripgrep from every search root
    category: hygiene
    layer: hygiene
    purpose: "Fails when an anchored .gitignore line (e.g. go/<binary>) relativizes under a subdirectory search root and hides tracked files from rg (#7750)."
    tier: pre-push
    blocking: true
    triggers:
      - ".gitignore"
      - "**/.gitignore"
      - "scripts/test-verify-gitignore-rg-parity.sh"
      - "scripts/verify-gitignore-rg-parity.sh"
    self_test_triggers:
      - "scripts/test-verify-gitignore-rg-parity.sh"
      - "scripts/verify-gitignore-rg-parity.sh"
    local:
      command: "bash scripts/verify-gitignore-rg-parity.sh"
      pre_push: floor
      test_command: "bash scripts/test-verify-gitignore-rg-parity.sh"
    ci:
      workflow: verify-agent-hygiene.yml
      job: "Agent hygiene gate"
    requirements: []
    ci_only_reason: ""
    hook_id: ""

  # ─── MERGE-GROUP SLIM LANE ───────────────────────────────────────────────
  # Fixed-set gates for the merge_group event (#7859 P3). Each command below
  # also runs on pull requests through its full-size sibling gate; the slim
  # rows exist so the queue lane has slim-fast CI jobs to select instead of
  # the coarse go-core and verify-contracts jobs. Every slim row triggers
  # only on its own lane definition, so pull-request path selection is
  # unchanged for all other paths. All six share one CI job,
  # test.yml/merge-group-slim.
  - id: slim-go-build
    name: Slim lane Go build (all binaries)
    category: build
    layer: hygiene
    purpose: "Builds every Go binary in the module to confirm the queue entry still compiles."
    tier: pre-push
    blocking: true
    triggers:
      - ".github/workflows/test.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/gates-01.yaml"
    ci:
      workflow: test.yml
      job: "merge-group-slim"
    requirements:
      - go
    ci_only_reason: "merge_group lane step; pull requests run the identical command through go-build"
    hook_id: ""

  - id: slim-go-vet
    name: Slim lane scoped go vet (changed packages plus direct importers)
    category: hygiene
    layer: hygiene
    purpose: "Vets the queue entry's changed Go packages and their direct importers through the go list import graph."
    tier: pre-push
    blocking: true
    triggers:
      - ".github/workflows/test.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/gates-01.yaml"
      - "scripts/verify-merge-group-slim-vet.sh"
      - "scripts/test-verify-merge-group-slim-vet.sh"
    self_test_triggers:
      - "scripts/verify-merge-group-slim-vet.sh"
      - "scripts/test-verify-merge-group-slim-vet.sh"
    local:
      command: "bash scripts/verify-merge-group-slim-vet.sh"
      pre_push: floor
      test_command: "bash scripts/test-verify-merge-group-slim-vet.sh"
    ci:
      workflow: test.yml
      job: "merge-group-slim"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: ""

  - id: slim-go-filecap
    name: Slim lane Go 500-line file cap
    category: hygiene
    layer: hygiene
    purpose: "Fails the queue entry when a Go file exceeds the 500-line cap."
    tier: pre-push
    blocking: true
    triggers:
      - ".github/workflows/test.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/gates-01.yaml"
      - "scripts/dev/precommit-go.sh"
      - "scripts/lib/precommit-go-gosec.sh"
    local:
      command: "bash scripts/dev/precommit-go.sh filecap-all"
      test_command: ""
    ci:
      workflow: test.yml
      job: "merge-group-slim"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: ""

  - id: slim-migration-uniqueness
    name: Slim lane migration sequence uniqueness
    category: hygiene
    layer: hygiene
    purpose: "Fails the queue entry when shipped Postgres migration sequence numbers collide."
    tier: pre-push
    blocking: true
    triggers:
      - ".github/workflows/test.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/gates-01.yaml"
      - "go/internal/storage/postgres/migrations/**"
    local:
      command: "cd go && go test ./internal/storage/postgres/migrations/ -run 'TestBootstrapDefinitionsHaveUniqueSequenceNumbers' -count=1"
      pre_push: floor
      test_command: ""
    ci:
      workflow: test.yml
      job: "merge-group-slim"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: ""

  - id: slim-collector-entrypoints
    name: Slim lane generated collector entrypoints parity
    category: exactness
    layer: contract
    purpose: "Fails the queue entry when the generated collector entrypoints file drifts from the collector fact contract spec."
    tier: pre-push
    blocking: true
    triggers:
      - ".github/workflows/test.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/gates-01.yaml"
      - "scripts/test-verify-collector-entrypoints-generated.sh"
      - "scripts/verify-collector-entrypoints-generated.sh"
    self_test_triggers:
      - "scripts/test-verify-collector-entrypoints-generated.sh"
      - "scripts/verify-collector-entrypoints-generated.sh"
    local:
      command: "bash scripts/verify-collector-entrypoints-generated.sh"
      test_command: "bash scripts/test-verify-collector-entrypoints-generated.sh"
    ci:
      workflow: test.yml
      job: "merge-group-slim"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: ""

  - id: slim-doc-split
    name: Slim lane context and story reference layout
    category: docs
    layer: hygiene
    purpose: "Fails the queue entry when a context or story reference page exceeds its line cap or breaks the route map."
    tier: pre-push
    blocking: true
    triggers:
      - ".github/workflows/test.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/gates-01.yaml"
      - "scripts/test-context-stories-doc-split.sh"
    local:
      command: "bash scripts/test-context-stories-doc-split.sh"
      test_command: ""
    ci:
      workflow: test.yml
      job: "merge-group-slim"
    requirements: []
    ci_only_reason: ""
    hook_id: ""
