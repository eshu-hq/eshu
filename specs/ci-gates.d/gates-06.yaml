version: v1
gates:
  - id: doc-citations
    name: Doc test/fixture existence and raw-line recurrence guard
    category: exactness
    layer: contract
    purpose: "Fails when a doc cites a test, fixture, or source line that no longer exists or no longer matches."
    tier: pre-pr
    blocking: true
    triggers:
      - "docs/**"
      - "go/**"
      - "tests/fixtures/**"
      - "scripts/verify-doc-citations.sh"
      - "scripts/test-verify-doc-citations.sh"
      - "scripts/lib/doc-citation-lines.sh"
      - "scripts/lib/test-verify-doc-citations-line-cases.sh"
      - "scripts/lib/test-verify-doc-citations-review-cases.sh"
      - "scripts/lib/test-verify-doc-citations-binary-cases.sh"
      - "scripts/lib/test-verify-doc-citations-preparation-cases.sh"
      - "scripts/lib/test-verify-doc-citations-scope-cases.sh"
      - "scripts/lib/gate-diff-base.sh"
      - "scripts/docs-citations-baseline.txt"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - "scripts/lib/ci-gates-resolved-fixtures.sh"
      - ".github/static-contract-filters.yml"
      - ".github/workflows/static-contract-gates.yml"
    self_test_triggers:
      - "scripts/verify-doc-citations.sh"
      - "scripts/test-verify-doc-citations.sh"
      - "scripts/lib/doc-citation-lines.sh"
      - "scripts/lib/test-verify-doc-citations-line-cases.sh"
      - "scripts/lib/test-verify-doc-citations-review-cases.sh"
      - "scripts/lib/test-verify-doc-citations-binary-cases.sh"
      - "scripts/lib/test-verify-doc-citations-preparation-cases.sh"
      - "scripts/lib/test-verify-doc-citations-scope-cases.sh"
      - "scripts/lib/gate-diff-base.sh"
      - "scripts/docs-citations-baseline.txt"
      - "specs/ci-gates.v1.yaml"
      - ".github/workflows/static-contract-gates.yml"
    local:
      command: "bash scripts/verify-doc-citations.sh && bash scripts/test-verify-doc-citations.sh --repository-only"
      test_command: "bash scripts/test-verify-doc-citations.sh --fixtures-only"
      pre_push: deferred
      pre_push_reason: "Measured across 67 local pre-pr gate reports: median 70s, ~18% of total selected-gates time -- the single largest local contributor. Still runs in `make pre-pr`/`make pre-pr-full` and blocks merge via static-contract-gates.yml (required-gates-complete)."
    ci:
      workflow: static-contract-gates.yml
      job: "Verify doc-citations gate"
    requirements: []
    ci_only_reason: ""
    # Wired into CI (static-contract-gates.yml, the same lane as docs-refs)
    # because this is a blocking recurrence-prevention gate: a PR that edits a
    # cited doc, renames a Go test, or moves a fixture MUST run this gate in CI,
    # or a phantom citation could merge with all required checks green (AGENTS.md:
    # CI is the non-bypassable source of truth). The broad go/**, docs/**, and
    # tests/fixtures/** triggers are deliberate: a source edit, hidden tracked doc,
    # test-file split, or fixture move must re-run this gate in the SAME PR that
    # causes the drift, not wait for someone to notice a stale citation later.
  - id: moved-file-refs
    name: Moved-file reference guard
    category: exactness
    layer: contract
    purpose: "Fails when code or docs still reference a file path after it has been moved or renamed elsewhere in the repo."
    tier: pre-pr
    blocking: true
    triggers:
      - "go/**"
      - "scripts/verify-moved-file-refs.sh"
      - "scripts/test-verify-moved-file-refs.sh"
      - "scripts/moved-file-refs-allowlist.txt"
      - "scripts/lib/gate-diff-base.sh"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/static-contract-filters.yml"
      - ".github/workflows/static-contract-gates.yml"
    self_test_triggers:
      - "scripts/verify-moved-file-refs.sh"
      - "scripts/test-verify-moved-file-refs.sh"
      - "scripts/moved-file-refs-allowlist.txt"
      - "scripts/lib/gate-diff-base.sh"
      - "specs/ci-gates.v1.yaml"
      - ".github/workflows/static-contract-gates.yml"
    local:
      command: "bash scripts/verify-moved-file-refs.sh"
      test_command: "bash scripts/test-verify-moved-file-refs.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify moved-file-refs gate"
    requirements: []
    ci_only_reason: ""

  - id: measurement-citations
    name: Measurement ledger citation gate
    category: exactness
    layer: contract
    purpose: "Fails when a measurement figure quoted in docs or evidence write-ups is uncited or inconsistent with its source."
    tier: pre-pr
    blocking: true
    triggers:
      - "docs/internal/**"
      - "docs/public/**"
      - "go/**/evidence-*.md"
      - "scripts/verify-measurement-citations.sh"
      - "scripts/test-verify-measurement-citations.sh"
      - "scripts/test-verify-measurement-citations-wrapper.sh"
      - "scripts/dev/precommit-go.sh"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/static-contract-filters.yml"
      - ".github/workflows/static-contract-gates.yml"
    self_test_triggers:
      - "scripts/verify-measurement-citations.sh"
      - "scripts/test-verify-measurement-citations.sh"
      - "scripts/test-verify-measurement-citations-wrapper.sh"
      - "scripts/dev/precommit-go.sh"
    local:
      command: "bash scripts/verify-measurement-citations.sh"
      test_command: "bash scripts/test-verify-measurement-citations.sh && bash scripts/test-verify-measurement-citations-wrapper.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify measurement-citations gate"
    requirements: []
    ci_only_reason: ""
    hook_id: go-measurement-citations
    # Wired into CI (static-contract-gates.yml, same lane as doc-citations)
    # because this is a blocking recurrence-prevention gate for the #5837
    # incident: six of eleven review findings were uncited/inconsistent
    # measurement figures restated across docs/internal/evidence, design docs,
    # and go/**/evidence-*.md write-ups, and no prior gate read prose numbers
    # at all (mkdocs --strict does not cover docs/internal — docs_dir: public).
    # Triggers cover docs/internal/** and docs/public/** (where a measurement
    # claim can appear in prose) plus go/**/evidence-*.md (evidence write-ups
    # also live under go/, co-located with the code they measure rather than
    # under docs/; count them with `git ls-tree -r --name-only HEAD -- go |
    # rg -c '/evidence-[^/]*\.md$'` rather than trusting a number here -- this
    # file is not one the citation gate scans, so a figure written here can
    # never self-correct). Also dual-wired as a pre-push hook
    # (hook_id, mirroring telemetry-coverage): the script is a bash+rg diff
    # scan with no Go build or network dependency beyond a `git fetch`,
    # measured at 0.549s total against this repo's real origin/main diff —
    # cheap enough to catch the mistake locally before it reaches a
    # reviewer, which is the exact failure mode #5837 exposed.

  - id: remote-validation-artifacts
    name: Remote-validation deployed-evidence gate
    category: exactness
    layer: contract
    purpose: "Checks every remote_validation claim in the capability matrix links to a real, committed deployed-evidence artifact."
    tier: pre-pr
    blocking: true
    triggers:
      - "specs/capability-matrix.v1.yaml"
      - "specs/capability-matrix/**"
      - "go/internal/capabilitycatalog/**"
      - "go/cmd/capability-inventory/**"
      - "docs/internal/remote-validation/**"
      - "docs/internal/evidence/**"
      - "scripts/**/run-remote-e2e-*.sh"
      - "scripts/**/verify-remote-e2e-*.sh"
      - "scripts/**/*compose*.sh"
      - "scripts/verify-golden-corpus-gate.sh"
      - "scripts/**/*k8s*.sh"
      - "scripts/**/verify-hosted-*.sh"
      - "scripts/**/*e2e*.sh"
      - "specs/remote-validation-baseline.txt"
      - "specs/remote-validation-frozen.txt"
      - "scripts/verify-remote-validation-artifacts.sh"
      - "scripts/test-verify-remote-validation-artifacts.sh"
      - "scripts/test-verify-remote-e2e-component-extension.sh"
      - "scripts/generate-remote-validation-inventory.sh"
      - "scripts/test-generate-remote-validation-inventory.sh"
      - "tests/fixtures/component_extension_proof/**"
      - "tests/fixtures/governance_k8s_two_team_proof/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/static-contract-filters.yml"
    local:
      command: "bash scripts/generate-remote-validation-inventory.sh && git diff --exit-code -- docs/internal/remote-validation/inventory.generated.json && bash scripts/verify-remote-validation-artifacts.sh"
      test_command: "bash scripts/test-generate-remote-validation-inventory.sh && bash scripts/test-verify-remote-validation-artifacts.sh && bash scripts/test-verify-dead-iac-compose.sh && bash scripts/test-verify-remote-e2e-component-extension.sh && bash scripts/test-verify-k8s-two-team-governance-proof.sh && bash scripts/test-k8s-two-team-governance-provenance.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify remote-validation-artifacts gate"
    requirements:
      - go
    ci_only_reason: ""
    # Wired into CI (static-contract-gates.yml, same lane as doc-citations and
    # maturity-drift-guard) because this is a blocking recurrence-prevention
    # gate for #5336's part (d) finding: remote_validation proof-IDs in the
    # capability matrix were free-form slugs with no allow-list and no
    # required committed evidence, so a production:supported claim could ride
    # on an unverifiable reference indefinitely
    # (component_extensions.{inventory,diagnostics} were the flagged
    # example). convertVerification() in
    # go/internal/capabilitycatalog/matrix.go now hard-fails an unknown
    # verification kind at load time (covered by the existing
    # go test ./internal/capabilitycatalog gate); this gate covers the
    # second half — CheckRemoteValidationArtifacts requires every
    # remote_validation ref to resolve to a deployed-tier artifact at
    # docs/internal/remote-validation/<ref>.md or appear in the burn-down
    # baseline. The content check requires a dated command with direct exit
    # capture, exit 0, a permitted committed deployed source, and an assertion
    # for every production capability sharing the slug. The generated inventory
    # binds the matrix rows to their artifact paths without generating run data.

  - id: maturity-drift-guard
    name: Support-maturity matrix live-gate drift guard
    category: exactness
    layer: contract
    purpose: "Blocks drift between the support-maturity doc's language columns and the actual golden-corpus fixture/snapshot data."
    tier: pre-pr
    blocking: true
    triggers:
      - "scripts/verify-golden-corpus-gate.sh"
      - "testdata/golden/e2e-20repo-snapshot.json"
      - "docs/public/languages/support-maturity.md"
      - "specs/language-feature-parity-ledger.v1.yaml"
      - "tests/fixtures/ecosystems/**"
      - "scripts/verify-maturity-drift-guard.sh"
      - "scripts/test-verify-maturity-drift-guard.sh"
      - "scripts/lib/maturity-drift-guard-language-extensions.sh"
      - "scripts/lib/golden-corpus-fixtures.sh"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/static-contract-filters.yml"
    local:
      command: "bash scripts/verify-maturity-drift-guard.sh"
      test_command: "bash scripts/test-verify-maturity-drift-guard.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify maturity-drift-guard gate"
    requirements: []
    ci_only_reason: ""
    # Wired into CI (static-contract-gates.yml, same lane as doc-citations)
    # because this is the blocking recurrence-prevention gate for the exact
    # class of drift #5336 fixed by hand: the "Real-Repo Validation" /
    # "End-to-End Indexing" columns of support-maturity.md silently rotting
    # the next time scripts/verify-golden-corpus-gate.sh's corpus_fixtures
    # array or the B-12 snapshot changes. category is exactness (not docs --
    # #5340: category:docs is never run by any lane) so it actually blocks.
    # tests/fixtures/ecosystems/** is a trigger because the verifier scans
    # those fixture trees to attribute languages to fixtures (algorithm step
    # 4): a fixture-only change -- e.g. removing the last .rb file from a
    # staged app fixture -- can move a language in/out of the live-supported
    # set, so it MUST re-run this gate or the matrix could drift with all
    # required checks green.

  - id: mcp-client-auth-doc
    name: MCP client-auth doc lockstep guard
    category: exactness
    layer: contract
    purpose: "Checks the MCP client-auth doc stays word-for-word in step with the mcpsetup Go source; advisory, not yet wired into CI."
    tier: pre-pr
    blocking: false
    triggers:
      - "docs/public/operate/mcp-client-auth.md"
      - "go/internal/cli/mcpsetup/doc_lockstep_test.go"
      - "go/internal/cli/mcpsetup/snippet.go"
      - "go/internal/cli/mcpsetup/setup.go"
      - "scripts/verify-mcp-client-auth-doc.sh"
      - "scripts/test-verify-mcp-client-auth-doc.sh"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    local:
      command: "bash scripts/verify-mcp-client-auth-doc.sh"
      test_command: "bash scripts/test-verify-mcp-client-auth-doc.sh"
    ci:
      workflow: ""
      job: ""
    requirements: []
    ci_only_reason: ""
    local_only_reason: "New gate for issue #5169 (F-8); not yet wired into a CI workflow job. Follows the docs-contradiction precedent: register local-first, then wire a static-contract-gates.yml job (the docs-refs pattern) once proven stable."

  - id: docs-build-changed
    name: Verify Docs Build (changed)
    category: docs
    layer: hygiene
    purpose: "Builds the docs for changed files to catch broken doc builds and doc-generation script regressions before push."
    tier: pre-push
    blocking: true
    triggers:
      - "docs/**"
      - "specs/**"
      - "AGENTS.md"
      - "README.md"
      - "scripts/lib/context-stories-markdown-visible.awk"
      - "scripts/lib/test-verify-docs-build-changed-fake-uv.sh"
      - "scripts/test-context-stories-doc-split.sh"
      - "scripts/test-context-stories-markdown-visible.sh"
      - "scripts/test-verify-docs-build-changed.sh"
      - "scripts/verify-docs-build-changed.sh"
    self_test_triggers:
      - "docs/**"
      - "scripts/lib/context-stories-markdown-visible.awk"
      - "scripts/lib/test-verify-docs-build-changed-fake-uv.sh"
      - "scripts/test-context-stories-doc-split.sh"
      - "scripts/test-context-stories-markdown-visible.sh"
      - "scripts/test-verify-docs-build-changed.sh"
      - "scripts/verify-docs-build-changed.sh"
    local:
      command: "bash scripts/verify-docs-build-changed.sh"
      test_command: "bash scripts/test-verify-docs-build-changed.sh && bash scripts/test-context-stories-doc-split.sh && bash scripts/test-context-stories-markdown-visible.sh"
    ci:
      workflow: test.yml
      job: "docs-helm-hygiene"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: docs-build-changed

  - id: docs-only-ci-skip
    name: Docs-only CI skip wiring (#5818 regression guard)
    category: hygiene
    layer: hygiene
    purpose: "Guards that CI workflows correctly skip on docs-only changes, preventing a prior skip-logic regression from recurring."
    tier: pre-pr
    blocking: true
    triggers:
      - ".github/workflows/build.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/security-scan.yml"
      - ".github/workflows/mcp-schema-drift.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - "scripts/lib/ci-gates-resolved-fixtures.sh"
      - "scripts/verify-docs-only-ci-skip.sh"
      - "scripts/test-verify-docs-only-ci-skip.sh"
      - "scripts/lib/ci-gate-merge-group-checks.sh"
      - "scripts/lib/ci-gate-predicate-quantifier.sh"
    local:
      command: "bash scripts/verify-docs-only-ci-skip.sh"
      test_command: "bash scripts/test-verify-docs-only-ci-skip.sh"
    ci:
      workflow: test.yml
      job: "docs-helm-hygiene"
    requirements: []
    ci_only_reason: ""
    # #5841 follow-up: verify-docs-only-ci-skip.sh existed and already ran in
    # CI (docs-helm-hygiene), but neither it nor its test mirror
    # (scripts/test-verify-docs-only-ci-skip.sh) had a registry entry, so the
    # mutation-proven regression guards it added were only exercised when a
    # human ran the mirror by hand. Registering the gate here does two things
    # at once: it gives the verifier the same registry citizenship every other
    # CI-wired script has, AND it makes its test_command executable when the
    # local gate selector chooses this gate. The actual CI wiring for the
    # mirror is the docs-helm-hygiene step in test.yml running both scripts in
    # sequence (the parser-relationship-kit pattern: test mirror, then the real
    # check).

  # ─── FRONTEND ──────────────────────────────────────────────────────────────

  - id: frontend-format-changed
    name: Verify Frontend Format (changed)
    category: frontend
    layer: hygiene
    purpose: "Runs Prettier to check changed frontend files are correctly formatted; advisory, does not block merge."
    tier: pre-push
    blocking: false
    triggers:
      - "src/**"
      - "apps/console/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "wrangler.jsonc"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/test-verify-frontend-format-changed.sh"
      - "scripts/verify-frontend-format-changed.sh"
    local:
      command: "bash scripts/verify-frontend-format-changed.sh"
      test_command: "bash scripts/test-verify-frontend-format-changed.sh"
    ci:
      workflow: frontend.yml
      job: "Prettier format check (issue #3763)"
    requirements:
      - node
    ci_only_reason: ""
    hook_id: frontend-format-changed

  - id: console-e2e
    name: Console e2e (mocked)
    category: frontend
    layer: unit
    purpose: "Runs the admin console's mocked end-to-end test suite to verify UI flows without hitting real backends."
    tier: pre-push
    blocking: true
    triggers:
      - "apps/console/**"
      - "src/**"
      - "scripts/dev/precommit-console.sh"
      - "scripts/test-precommit-console.sh"
    local:
      command: "bash scripts/dev/precommit-console.sh e2e"
      test_command: "bash scripts/test-precommit-console.sh"
    ci:
      workflow: frontend.yml
      job: "Console (apps/console)"
    requirements:
      - node
    ci_only_reason: ""
    hook_id: console-e2e
