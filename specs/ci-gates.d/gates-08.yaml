  # #6784 slice B: every CI-class row from specs/live-tests.v1.yaml runs on
  # NornicDB and Neo4j. It landed non-blocking because required-gates judges
  # a PR with main's registry: a new blocking check_name cannot be
  # introduced in the PR that first produces it. Blocking flipped to true in
  # the follow-up once main went green on this job (run 35901630978 on the
  # slice-B merge commit). Triggers mirror the workflow
  # paths (whole-module go/**: the ledger validator scans every go package
  # for live tests, so any Go change can add an unclassified live test).
  - id: live-backend-tests
    name: Live Backend Tests on NornicDB and Neo4j (Docker)
    category: exactness
    layer: truth
    purpose: "Runs the CI-class tests from the live-test ledger against NornicDB and Neo4j in Docker and fails on a wrong answer."
    tier: ci-heavy
    blocking: true
    triggers:
      - "go/**"
      - "specs/live-tests.v1.yaml"
      - "specs/live-tests.d/**"
      - "scripts/lib/live_tests_registry.py"
      - "scripts/test-live-tests-registry.py"
      - "scripts/lib/live_postgres_readiness_inventory.py"
      - "scripts/run-live-backend-tests.sh"
      - "scripts/test-run-live-backend-tests.sh"
      - "scripts/verify-live-tests-ledger.sh"
      - "scripts/test-verify-live-tests-ledger.sh"
      - "scripts/lib/live_backend_test_targets.py"
      - "scripts/lib/verify-live-tests-ledger.py"
      - "scripts/lib/live-gate-lock.sh"
      - "scripts/ci/install-apt-packages.sh"
      - "scripts/ci/go-mod-download-retry.sh"
      - "docker-compose.live-backend-nornicdb.yml"
      - "docker-compose.live-backend-neo4j.yml"
      - "docker-compose.yaml"
      - "docker-compose.neo4j.yml"
      - ".github/workflows/live-backend-tests.yml"
    local:
      command: "bash scripts/run-live-backend-tests.sh --backend both"
      test_command: "bash scripts/test-run-live-backend-tests.sh"
    ci:
      workflow: live-backend-tests.yml
      job: "live-backend (nornicdb and neo4j)"
      check_names:
        - "live-backend (nornicdb and neo4j)"
    requirements:
      - go
      - docker
      - nornicdb
    ci_only_reason: ""

  # Owner row for the `static-mirror (ledger and runner probes)` job of
  # live-backend-tests.yml. Without a row a failing ledger or runner probe did
  # not block a merge (see ifa-static-mirror). The job needs no Docker: it
  # validates specs/live-tests.v1.yaml against every live test under go/ and
  # exercises the runner script, so its triggers are the workflow paths, as the
  # live-backend-tests row above.
