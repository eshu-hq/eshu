  - id: golden-corpus-differential
    name: Differential NornicDB vs Neo4j oracle (Docker)
    category: exactness
    layer: truth
    purpose: "Runs the golden corpus on NornicDB and Neo4j with capture; failed runs, empty captures, missing coverage or unanchored id writers block, row diffs are advisory."
    tier: ci-heavy
    blocking: true
    triggers:
      - "go/internal/graph/**"
      - "go/internal/backendconformance/**"
      - "go/internal/queryplan/**"
      - "go/cmd/golden-corpus-gate/**"
      - "go/cmd/projector/**"
      - "go/cmd/reducer/**"
      - "go/cmd/bootstrap-index/**"
      - "go/cmd/api/**"
      - "go/cmd/mcp-server/**"
      - "docker-compose.yaml"
      - "specs/backend-divergence-allowlist.v1.yaml"
      - "scripts/verify-golden-corpus-gate.sh"
      - "scripts/test-verify-golden-corpus-gate.sh"
      - "scripts/lib/golden-corpus-*.sh"
      - "scripts/lib/test-golden-corpus-*.sh"
      - "scripts/lib/live-gate-lock.sh"
      - "scripts/ci/install-apt-packages.sh"
      - "scripts/ci/go-mod-download-retry.sh"
      - ".github/workflows/golden-corpus-gate.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - "scripts/lib/ci-gates-resolved-fixtures.sh"
    local:
      command: "rm -rf /tmp/eshu-diff-corpus && ESHU_DIFFERENTIAL_CAPTURE=1 ESHU_DIFFERENTIAL_CAPTURE_DIR=/tmp/diff-capture/nornicdb ESHU_REPOS_DIR=/tmp/eshu-diff-corpus ESHU_GRAPH_BACKEND=nornicdb bash scripts/verify-golden-corpus-gate.sh && rm -rf /tmp/eshu-diff-corpus && ESHU_DIFFERENTIAL_CAPTURE=1 ESHU_DIFFERENTIAL_CAPTURE_DIR=/tmp/diff-capture/neo4j ESHU_REPOS_DIR=/tmp/eshu-diff-corpus ESHU_GRAPH_BACKEND=neo4j bash scripts/verify-golden-corpus-gate.sh && (cd go && go run ./cmd/golden-corpus-gate -phase=backend-diff -diff-left=/tmp/diff-capture/nornicdb -diff-right=/tmp/diff-capture/neo4j -diff-allowlist=../specs/backend-divergence-allowlist.v1.yaml && go run ./cmd/golden-corpus-gate -phase=statement-coverage -coverage-manifest=internal/queryplan/testdata/statement-builders.yaml -coverage-dirs=/tmp/diff-capture/neo4j && go run ./cmd/golden-corpus-gate -phase=writer-coverage -coverage-dirs=/tmp/diff-capture/nornicdb,/tmp/diff-capture/neo4j)"
      test_command: "bash scripts/test-verify-golden-corpus-gate.sh && (cd go && go test ./cmd/golden-corpus-gate -run 'TestBackendDiff|TestRunBackendDiff|TestStatementCoverage|TestRunStatementCoverage|TestWriterCoverage|TestAnchorCensus' -count=1 && go test ./internal/graph/anchor -count=1 && go test ./internal/backendconformance -run 'TestComputeStatementCoverage' -count=1 && go test ./internal/queryplan -run 'TestDiscoverStatementBuilders|TestValidateBuilderManifest|TestStatementBuildersManifestMatchesProduction' -count=1)"
    ci:
      workflow: golden-corpus-gate.yml
      job: "differential nornicdb vs neo4j"
      check_names:
        - "differential nornicdb vs neo4j"
    requirements:
      - go
      - docker
    ci_only_reason: "needs two live graph backends (NornicDB and Neo4j) side by side; the static mirror plus the gate's seeded RED/GREEN unit pair are the local proof"
    # #6965 phase 5: the comparison step ("Compare backend recordings") is
    # advisory discovery -- continue-on-error, a warning annotation and step
    # summary, and the capture upload when it fails. This row stays blocking
    # for the rest of the job: the four B-7 capture legs, the check that
    # every leg wrote recordings (which keeps a one-sided capture loss
    # failing closed now that Compare's own check is advisory), and the
    # #6783 statement coverage check (Neo4j-only per #7331: coverage-dirs
    # names the neo4j capture only; NornicDB is not a coverage target).
    # Per-backend truth is asserted by blocking
    # gates (golden-corpus-gate-neo4j on Neo4j, and the backendconformance
    # WantRows the e2e-tests live lanes run on both backends), so a reproduced
    # divergence is filed as an issue (e.g. #6968), not a merge blocker.
    # #6782: the differential oracle. It replays the same B-7
    # corpus on both backends with differential capture on and fails on any
    # divergence the committed allowlist does not excuse (advisory since #6965
    # phase 5, above). A silently dropped capture cannot false-green: the
    # capture-leg step fails closed on any leg without recordings (Compare's
    # own both-backends check is advisory now), and the failure upload
    # carries the recordings.
    # Multi-leg quorum (owner direction 2026-09-21): CI runs two
    # pairings (-diff-left2/-diff-right2) and fails only on divergences
    # reproducing across both; pairing-local scheduling noise is advisory.
    # Execution-count and row-total divergences with agreeing results (the
    # executions and rowcount kinds) are advisory even when reproduced
    # (#6782 permanent dispositions, 2026-09-21/22): the backends drain at
    # different speeds, so per-statement allowlist excuses were open-ended;
    # results/missing still fail unless allowlisted. Divergences on registered
    # transient-state reads (transient_reads, #6782 option 1) are excluded
    # into their own advisory finding, and reproduced transient exclusions
    # count toward the ceiling below.
    # #6941: that advisory total was unbounded, so a backend regression that
    # tripled drain passes would still pass green. CI's quorum invocation
    # (.github/workflows/golden-corpus-gate.yml, "Compare backend
    # recordings") now passes -diff-executions-advisory-max=200 -- observed
    # totals on this corpus were 12-70 across nine CI runs and four replayed
    # capture artifacts (run IDs in docs/internal/evidence/
    # 6782-executions-advisory.md, "Calibration"), so 200 is a
    # systemic-regression tripwire (~2.9x observed max), not a tuning target.
    # local.command above stays single-pair (-diff-left/-diff-right only, no
    # -diff-left2/-diff-right2): single-pair mode has no quorum and never
    # reaches runBackendDiffQuorum, so the ceiling flag has nothing to bound
    # there and is intentionally not added to this command.

  # #5538 task 4 root-cause fix: three review rounds each found more packages
  # missing from golden-corpus-gate's own path filter because completeness was
  # maintained by hand. This gate makes it converge -- it derives the real
  # compiled-package set with `go list -deps` and fails when a package is
  # neither covered by that filter nor listed in the exclusions file. Its own
  # triggers include its own script/lib/workflow paths (not just the filter it
  # checks), so an edit to the checker itself is never a false green -- the
  # #5873 self-trigger gap this is written to avoid repeating.
  - id: golden-corpus-filter-exhaustive
    name: Golden corpus PR path filter exhaustiveness
    category: hygiene
    layer: contract
    purpose: "Checks that the golden-corpus-gate CI path filter lists every Go package the gate actually compiles."
    tier: pre-pr
    blocking: true
    triggers:
      - "go/**"
      - ".github/workflows/golden-corpus-gate.yml"
      - "scripts/verify-golden-corpus-filter-exhaustive.sh"
      - "scripts/test-verify-golden-corpus-filter-exhaustive.sh"
      - "scripts/lib/golden-corpus-filter-exclusions.txt"
      - "go/cmd/golden-corpus-gate/main.go"
    self_test_triggers:
      - ".github/workflows/golden-corpus-gate.yml"
      - "scripts/verify-golden-corpus-filter-exhaustive.sh"
      - "scripts/test-verify-golden-corpus-filter-exhaustive.sh"
      - "scripts/lib/golden-corpus-filter-exclusions.txt"
      - "go/cmd/golden-corpus-gate/main.go"
    local:
      command: "bash scripts/verify-golden-corpus-filter-exhaustive.sh"
      pre_push: floor
      test_command: "bash scripts/test-verify-golden-corpus-filter-exhaustive.sh"
    ci:
      workflow: test.yml
      job: "verify-contracts"
    requirements:
      - go
    ci_only_reason: ""

