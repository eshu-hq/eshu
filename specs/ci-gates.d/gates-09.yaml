    name: C-1/C-8/C-9/C-10/C-13 Replay Coverage Gate
    category: exactness
    layer: contract
    purpose: "Checks that every surface Eshu claims to support has a recorded, non-stale replay scenario in the coverage manifest."
    tier: pre-pr
    blocking: true
    triggers:
      - "go/cmd/replay-coverage-gate/**"
      - "go/cmd/eshu/**"
