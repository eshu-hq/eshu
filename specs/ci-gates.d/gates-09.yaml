      - "go/internal/replaycoverage/**"
      - "go/internal/cigates/**"
      - "go/internal/query/**"
      - "go/internal/mcp/**"
      - "go/internal/scopedtoken/**"
      - "go/internal/goldengate/**"
      - "go/internal/replay/parserfixture/**"
      - "go/internal/replay/inputtape/**"
      - "go/internal/replay/schedulereplay/**"
      - "go/internal/replay/crashreplay/**"
      - "go/internal/replay/costcounting/**"
      - "go/internal/capabilitycatalog/**"
      - "go/internal/facts/**"
      - "go/internal/storage/cypher/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - "scripts/lib/ci-gates-resolved-fixtures.sh"
      - "specs/capability-budget-proof.v1.yaml"
      - "specs/capability-catalog.v1.yaml"
      - "specs/capability-matrix.v1.yaml"
      - "specs/capability-matrix/**"
      - "specs/product-claims.v1.yaml"
      - "specs/replay-coverage-manifest.v1.yaml"
      - "specs/replay-depth-requirements.v1.yaml"
      - "specs/authorization-catalog.v1.yaml"
      - "specs/authorization-replay-coverage.v1.yaml"
      - "specs/parser-backing-ledger.v1.yaml"
      - "specs/language-feature-parity-ledger.v1.yaml"
      - "specs/fact-kind-registry.v1.yaml"
      - "specs/surface-inventory.v1.yaml"
      - "testdata/golden/e2e-20repo-snapshot.json"
      - "testdata/cassettes/**"
      - "scripts/test-verify-replay-coverage-gate.sh"
      - "scripts/verify-replay-coverage-gate.sh"
      - "scripts/lib/go-test-run-guard.sh"
      - "scripts/ci/go-mod-download-retry.sh"
    local:
      command: "bash scripts/verify-replay-coverage-gate.sh --blocking"
      pre_push: floor
      test_command: "bash scripts/test-verify-replay-coverage-gate.sh"
    ci:
      workflow: replay-coverage-gate.yml
      job: "coverage-gate (blocking)"
    requirements:
      - go
    ci_only_reason: ""

  # Owner row for the `static mirror` job of replay-coverage-gate.yml (see
  # ifa-static-mirror for why an unowned job never blocked a merge). The job
  # runs scripts/test-verify-replay-coverage-gate.sh, which the
  # replay-coverage-gate row already runs locally as its test_command, so this
  # row is CI-only. The mirror also reads docs/public/reference/replay-coverage.md
  # and docs/mkdocs.yml, which the workflow's paths: filter does not list; they
  # are left out of the triggers because a trigger the workflow does not start
  # on would select a check that never arrives (checkOwnerRowTriggers enforces
  # this). scripts/lib/go-test-run-guard.sh is left out for the same reason: the
  # mirror never reads it.
  - id: replay-coverage-static-mirror
    name: Replay coverage static mirror
    category: exactness
    layer: contract
    purpose: "Checks the replay coverage verifier, workflow and registry rows still agree on the gate contract, without a Go build."
    tier: pre-pr
    blocking: true
    triggers:
      - "scripts/test-verify-replay-coverage-gate.sh"
      - "scripts/verify-replay-coverage-gate.sh"
      - "scripts/ci/install-apt-packages.sh"
      - "specs/replay-coverage-manifest.v1.yaml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/workflows/replay-coverage-gate.yml"
    ci:
      workflow: replay-coverage-gate.yml
      job: "static mirror"
    requirements: []
    ci_only_reason: "the replay-coverage-gate row runs the same scripts/test-verify-replay-coverage-gate.sh locally as its test_command; this row only owns the CI job"

  - id: ifa-contract-layer
    name: Ifa contract-layer Odù skeleton
    category: exactness
    layer: contract
    purpose: "Runs the Ifá contract-layer test suite, verifying the Odù catalog, coverage manifest, and reducer code stay in lockstep."
    tier: pre-pr
    blocking: true
    triggers:
      - "go/internal/ifa/**"
      - "go/internal/reducer/**"
      - "go/cmd/ifa/**"
      - "go/internal/synth/gcp/**"
      - "docs/internal/design/4389-ifa-conformance-platform.md"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/static-contract-filters.yml"
      - "specs/ifa-coverage-manifest.v1.yaml"
      - "specs/fact-kind-registry.v1.yaml"
      - "specs/replay-coverage-manifest.v1.yaml"
      - "testdata/golden/e2e-20repo-snapshot.json"
    local:
      command: "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1"
      test_command: "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify Ifa contract-layer gate"
    requirements:
      - go
    ci_only_reason: ""

  - id: content-entity-bucket-sync
    name: Content-entity bucket<->label sync and projector-label totality (#5531, #6206)
    category: exactness
    layer: contract
    purpose: "Checks that collector content-entity buckets, projector label maps, and the drift ledger all agree with each other and the code."
    tier: pre-pr
    blocking: true
    # Triggers name all three source files the gate reads, not just the package
    # it runs from. A bucket added to the collector's twin or a label added to
    # the projector map must select this gate — those are exactly the edits it
    # exists to catch, and triggering only on the shape package would leave the
    # two most likely edits unguarded.
    #
    # The -run list is hand-maintained, so a new gate test in that package is
    # not run here until it is named. TestEveryProjectorLabelHasASource (#6206)
    # walks projector -> bucket, the reverse of
    # TestContentEntityLabelsHaveProjectorLabels, and catches a registry entry
    # no bucket can ever feed. It ran only incidentally, under
    # race-graph-writes' unfiltered ./internal/content/shape/... , until it was
    # added below; one narrowing of that race gate's package list and the
    # coverage would have vanished with nothing red.
    triggers:
      - "go/internal/content/shape/**"
      - "go/internal/collector/repo/git/snapshot_entity_buckets.go"
      - "go/internal/projector/canonical/materialization.go"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/static-contract-filters.yml"
    local:
      command: "cd go && go test ./internal/content/shape -run 'TestContentEntityBucketsMatchCollectorTwin|TestContentEntityLabelsHaveProjectorLabels|TestBucketSyncDriftLedgerIsHonest|TestEveryProjectorLabelHasASource' -count=1"
      test_command: "cd go && go test ./internal/content/shape -run 'TestContentEntityBucketsMatchCollectorTwin|TestContentEntityLabelsHaveProjectorLabels|TestBucketSyncDriftLedgerIsHonest|TestEveryProjectorLabelHasASource' -count=1"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify content-entity bucket sync gate"
    requirements:
      - go
    ci_only_reason: ""

  # ─── REPO-WIDE SWEEP TESTS (#7111 F5) ──────────────────────────────────────
  # Each of these Go tests reads source far outside its own package, so the
  # floor's changed-package `go test` never runs it when only an input changes.
  # CI runs them inside go-core's `go test ./...`; these rows select them
  # locally from their real inputs. Triggers are derived from what each test
  # reads (named in its comment) plus its own package, which it compiles.

  - id: index-key-guard-sweep
    name: Production indexed-write Cypher literals are guarded (#7058)
    category: exactness
    layer: contract
    purpose: "Scans production Cypher literals across storage, reducer, projector, collector, and cmd code to keep indexed writes schema-guarded."
    tier: pre-pr
    blocking: true
    # TestProductionCypherLiteralsAreGuarded scans the non-test Go literals
    # under sweepDirs (go/internal/graph/index_key_guard_sweep_test.go):
    # internal/storage, internal/reducer, internal/projector,
    # internal/collector, and cmd. The analyzer and schema it checks against
    # live in internal/graph.
    triggers:
      - "go/internal/graph/**"
      - "go/internal/storage/**"
      - "go/internal/reducer/**"
      - "go/internal/projector/**"
      - "go/internal/collector/**"
      - "go/cmd/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    local:
      command: "cd go && go test ./internal/graph -run '^TestProductionCypherLiteralsAreGuarded$' -count=1"
      test_command: "cd go && go test ./internal/graph -run '^(TestSweepFlagsSeededViolations|TestSweepReadsJoinedLabelTemplateWhole)$' -count=1"
      pre_push: floor
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
