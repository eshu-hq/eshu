  # #7529 staging row. The trusted publisher reads main's registry, so the
  # new check first lands non-blocking and flips after a green main run.
  - id: live-postgres-migrations
    name: Live PostgreSQL migration interruption and ownership proofs
    category: exactness
    layer: truth
    purpose: "Runs the exact seven PostgreSQL 18.6 migration and fixture-ownership integration tests; every test and the package must pass without skips."
    tier: ci-heavy
    blocking: true
    triggers:
      - "go/internal/storage/postgres/**"
      - "go/go.mod"
      - "go/go.sum"
      - "specs/live-tests.v1.yaml"
      - "specs/live-tests.d/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - "scripts/lib/live_postgres_migrations.py"
      - "scripts/lib/live_tests_registry.py"
      - "scripts/ci/go-mod-download-retry.sh"
      - "scripts/ci/install-apt-packages.sh"
      - "scripts/run-live-postgres-migrations.sh"
      - "scripts/test-live-postgres-migrations.py"
      - "scripts/test-run-live-postgres-migrations.sh"
      - "scripts/testdata/live-postgres-migrations-fake-docker.sh"
      - "scripts/testdata/live-postgres-migrations-fake-go.sh"
      - ".github/workflows/live-postgres-migrations.yml"
      - ".github/workflows/required-gates.yml"
    local:
      command: "bash scripts/test-run-live-postgres-migrations.sh"
      test_command: "python3 scripts/test-live-postgres-migrations.py"
    ci:
      workflow: live-postgres-migrations.yml
      job: "live-postgres-migrations (postgres18)"
      check_names:
        - "live-postgres-migrations (postgres18)"
    requirements:
      - go
      - postgres
    ci_only_reason: ""

  - id: golden-corpus-differential
    name: Differential capture checks on Neo4j (Docker; NornicDB legs off)
    category: exactness
    layer: truth
    purpose: "Runs the golden corpus on Neo4j with capture; failed runs, empty captures, missing coverage or unanchored id writers block. NornicDB legs are off (2026-11-05)."
    tier: ci-heavy
    blocking: false
    triggers:
      - "scripts/lib/cgo-cflags.sh"
      - "go/internal/graph/**"
      - "go/internal/backendconformance/**"
      - "go/internal/queryplan/**"
      - "go/cmd/golden-corpus-gate/**"
      - "go/cmd/projector/**"
      - "go/cmd/reducer/**"
      - "go/cmd/bootstrap-index/**"
      - "specs/backend-divergence-allowlist.v1.yaml"
      - "scripts/verify-golden-corpus-gate.sh"
      - "scripts/test-verify-golden-corpus-gate.sh"
      - "scripts/lib/golden-corpus-*.sh"
      - "scripts/lib/test-golden-corpus-*.sh"
      - "scripts/lib/live-gate-lock.sh"
      - "scripts/ci/install-apt-packages.sh"
      - "scripts/ci/go-mod-download-retry.sh"
      - ".github/workflows/golden-corpus-gate.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - "scripts/lib/ci-gates-resolved-fixtures.sh"
      - "scripts/lib/golden-corpus-capture-leg-cases.sh"
      - "scripts/lib/stage-differential-capture.sh"
      - "scripts/test-stage-differential-capture.sh"
      - "scripts/ci/compose.sh"
      - "scripts/lib/ci-image-compose.sh"
      - "scripts/lib/ci_image_compose.py"
      - "specs/ci-images.v1.json"
      - "scripts/lib/ci_image_compose_signature.py"
    local:
      command: "rm -rf /tmp/eshu-diff-corpus && ESHU_DIFFERENTIAL_CAPTURE=1 ESHU_DIFFERENTIAL_CAPTURE_DIR=/tmp/diff-capture/neo4j ESHU_REPOS_DIR=/tmp/eshu-diff-corpus ESHU_GRAPH_BACKEND=neo4j bash scripts/verify-golden-corpus-gate.sh && (cd go && go run ./cmd/golden-corpus-gate -phase=statement-coverage -coverage-manifest=internal/queryplan/testdata/statement-builders.yaml -coverage-dirs=/tmp/diff-capture/neo4j && go run ./cmd/golden-corpus-gate -phase=writer-coverage -coverage-dirs=/tmp/diff-capture/neo4j)"
      test_command: "bash scripts/test-verify-golden-corpus-gate.sh && (cd go && go test ./cmd/golden-corpus-gate -run 'TestBackendDiff|TestRunBackendDiff|TestStatementCoverage|TestRunStatementCoverage|TestWriterCoverage|TestAnchorCensus' -count=1 && go test ./internal/graph/anchor -count=1 && go test ./internal/backendconformance -run 'TestComputeStatementCoverage' -count=1 && go test ./internal/queryplan -run 'TestDiscoverStatementBuilders|TestValidateBuilderManifest|TestStatementBuildersManifestMatchesProduction' -count=1)"
    ci:
      workflow: golden-corpus-gate.yml
      job: "differential nornicdb vs neo4j"
      check_names:
        - "differential nornicdb vs neo4j"
    requirements:
      - go
      - docker
    ci_only_reason: "needs a live Neo4j graph backend; the NornicDB capture legs and backend-diff are off by owner order (2026-11-05, #7331), see docs/internal/ci-workflow-inventory.md (Re-enabling NornicDB CI). The static mirror plus the gate's seeded RED/GREEN unit pair are the local proof"

