version: v1
gates:
  # Scoped PR and scheduled proof. It remains nonblocking while hosted acceptance
  # is established on the reviewed split branch and is not a universal PR check.
  - id: ifa-scheduled-proofs
    name: Ifá scheduled proof enrollment (#7533)
    category: exactness
    layer: contract
    purpose: "Runs eight exact tagged Ifá tests against fresh NornicDB and PostgreSQL, then validates their Go events and backend identities."
    tier: ci-heavy
    blocking: false
    triggers:
      - ".github/workflows/ifa-scheduled-proofs.yml"
      - "go/go.mod"
      - "go/go.sum"
      - "scripts/ci/go-mod-download-retry.sh"
      - "scripts/run-ifa-scheduled-proofs.sh"
      - "scripts/lib/ifa_scheduled_events.py"
      - "scripts/lib/ifa_scheduled_inventory.json"
      - "scripts/lib/ifa_scheduled_manifest.py"
      - "scripts/test-ifa-scheduled-manifest.py"
      - "scripts/lib/ifa_scheduled_bundle.py"
      - "scripts/test-ifa-scheduled-bundle.py"
      - "scripts/lib/reducer_contention_events.py"
      - "scripts/lib/verify-live-tests-ledger.py"
      - "scripts/test-ifa-scheduled-events.py"
      - "scripts/test-ifa-scheduled-ledger-policy.py"
      - "scripts/verify-live-tests-ledger.sh"
      - "scripts/test-verify-live-tests-ledger.sh"
      - "specs/live-tests.v1.yaml"
      - "specs/live-tests.d/live-tests-01.yaml"
      - "specs/live-tests.d/live-tests-02.yaml"
      - "specs/live-tests.d/live-tests-03.yaml"
      - "specs/live-tests.d/live-tests-04.yaml"
      - "specs/live-tests.d/live-tests-05.yaml"
      - "specs/live-tests.d/live-tests-06.yaml"
      - "go/cmd/reducer/ifa_group_retry_live_test.go"
      - "go/internal/replay/offlinetier/postgres_test.go"
      - "go/internal/replay/offlinetier/delta_tier_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_proof_database_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_concurrency_fixture_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_concurrency_graph_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_concurrency_graph_validation_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_cleanup_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_concurrency_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_database_guard_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_process_death_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_quarantine_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_replay_coordinates_live_test.go"
    ci:
      workflow: ifa-scheduled-proofs.yml
      job: "Ifá scheduled proof vs NornicDB and PostgreSQL"
    requirements:
      - go
      - docker
      - postgres
    ci_only_reason: "needs fresh hosted NornicDB and PostgreSQL services; the blocking live-backend static mirror runs its source, route, event, and ledger guards locally"
  # ─── REPO-WIDE SWEEP TESTS (#7111 F5) ──────────────────────────────────────
  # Each of these Go tests reads source far outside its own package, so the
  # floor's changed-package `go test` never runs it when only an input changes.
  # CI runs them inside go-core's `go test ./...`; these rows select them
  # locally from their real inputs. Triggers are derived from what each test
  # reads (named in its comment) plus its own package, which it compiles.

  - id: index-key-guard-sweep
    name: Production indexed-write Cypher literals are guarded (#7058)
    category: exactness
    layer: contract
    purpose: "Scans production Cypher literals across storage, reducer, projector, collector, and cmd code to keep indexed writes schema-guarded."
    tier: pre-pr
    blocking: true
    # TestProductionCypherLiteralsAreGuarded scans the non-test Go literals
    # under sweepDirs (go/internal/graph/index_key_guard_sweep_test.go):
    # internal/storage, internal/reducer, internal/projector,
    # internal/collector, and cmd. The analyzer and schema it checks against
    # live in internal/graph.
    triggers:
      - "go/internal/graph/**"
      - "go/internal/storage/**"
      - "go/internal/reducer/**"
      - "go/internal/projector/**"
      - "go/internal/collector/**"
      - "go/cmd/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    local:
      command: "cd go && go test ./internal/graph -run '^TestProductionCypherLiteralsAreGuarded$' -count=1"
      test_command: "cd go && go test ./internal/graph -run '^(TestSweepFlagsSeededViolations|TestSweepReadsJoinedLabelTemplateWhole)$' -count=1"
      pre_push: floor
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: fips-md5-sql-sweep
    name: Production SQL has no md5() calls (FIPS, #6753)
    category: exactness
    layer: contract
    purpose: "Scans production Go SQL literals, migrations, and shipped schema SQL for md5() calls, which fail on FIPS-enabled PostgreSQL."
    tier: pre-pr
    blocking: true
    # TestProductionSQLHasNoMD5Calls scans the non-test Go string literals
    # under go/ plus the shipped .sql roots (migrations and
    # schema/data-plane/postgres)
    # (go/internal/storage/postgres/md5_sql_sweep_test.go). Testdata,
    # fixtures, docs evidence, and script proof helpers may still use md5();
    # only shipped SQL is in scope.
    triggers:
      - "go/**"
      - "schema/data-plane/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    local:
      command: "cd go && go test ./internal/storage/postgres -run '^TestProductionSQLHasNoMD5Calls$' -count=1"
      test_command: "cd go && go test ./internal/storage/postgres -run '^TestMD5SweepFlagsSeededViolation$' -count=1"
      pre_push: floor
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: hot-cypher-source-coverage
    name: Hot Cypher manifest covers every production query call
    category: exactness
    layer: contract
    purpose: "Checks that the hot-Cypher manifest lists every production query call site so no query runs outside the tracked manifest."
    tier: pre-pr
    blocking: true
    # TestHotCypherManifestCoversEveryProductionQueryCall
    # (go/internal/queryplan/source_coverage_test.go) discovers query call
    # sites under ../query and checks them against the manifests in
    # go/internal/queryplan/testdata.
    triggers:
      - "go/internal/queryplan/**"
      - "go/internal/query/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    local:
      command: "cd go && go test ./internal/queryplan -run '^TestHotCypherManifestCoversEveryProductionQueryCall$' -count=1"
      test_command: "cd go && go test ./internal/queryplan -run '^TestValidateSourceCoverage' -count=1"
      pre_push: floor
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: ask-overlay-inventory-coverage
    name: Ask catalog overlay covers the surface inventory
    category: exactness
    layer: contract
    purpose: "Checks that the Ask catalog's overlay covers every surface listed in the generated surface-inventory registry."
    tier: pre-pr
    blocking: true
    # TestOverlayCoversInventory (go/internal/ask/catalog/coverage_test.go)
    # reads the committed
    # go/internal/capabilitycatalog/data/surface-inventory.generated.json and
    # checks it against the overlay in its own package.
    triggers:
      - "go/internal/ask/catalog/**"
      - "go/internal/capabilitycatalog/data/surface-inventory.generated.json"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    local:
      command: "cd go && go test ./internal/ask/catalog -run '^TestOverlayCoversInventory$' -count=1"
      test_command: ""
      pre_push: floor
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: ifa-materialized-edge-coverage
    name: Ifa materialized-edge exhaustiveness gate (#5351)
    category: exactness
    layer: contract
    purpose: "Checks that the Ifá materialized-edge coverage manifest stays exhaustive against the reducer, Cypher writers, and cassette fixtures."
    tier: pre-pr
    blocking: true
    triggers:
      # This gate runs two package-level `go test` commands, which compile every
      # file in each package — so an edit to any sibling file can change the
      # verdict and must select the gate (#5873). The per-file entries below are
      # kept: they are the files the gate is actually about, and the doc renders
      # them as the reader's map of what it guards.
      - "go/internal/ifa/**"
      - "go/cmd/ifa/**"
      - "go/internal/reducer/**"
      - "go/internal/ifa/materializededges/**"
      - "go/internal/ifa/sql_relationship_odu*.go"
      - "go/internal/reducer/materialized_edge_families.go"
      - "go/internal/reducer/contract/domain.go"
      - "go/internal/reducer/sqlrelationship/sql_relationship_materialization.go"
      - "go/internal/reducer/sqlrelationship/sql_relationship_embedded_query.go"
      - "go/internal/reducer/sqlrelationship/sql_relationship_metadata.go"
      # The whole cypher package, for the same reason the reducer leg above is
      # a subtree (#6181). This gate's direct-family drift guard parses EVERY
      # non-test file in go/internal/storage/cypher and follows each reducer
      # port through the package call graph to the Cypher it reaches, so any
      # file there can change its verdict. The four per-file entries below
      # covered 6 of the package's 131 non-test files, which meant a change to
      # iam_can_perform_edge_writer.go or secrets_iam_graph_writer.go -- a
      # direct writer whose family the guard classifies -- did not select this
      # gate at all. Measured with `ci-gates select --paths-from`, not
      # estimated. The per-file entries stay as the reader's map of what the
      # gate is about.
      - "go/internal/storage/cypher/**"
      - "go/internal/storage/cypher/edge/writer/sql.go"
      - "go/internal/storage/cypher/materialized_edge_*.go"
      - "go/internal/storage/cypher/canonical/node/code_call_edges.go"
      - "go/internal/storage/cypher/canonical/inheritance/edges.go"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/static-contract-filters.yml"
      - "specs/ifa-materialized-edge-coverage.v1.yaml"
      - "specs/ifa-materialized-edge-coverage-direct.v1.yaml"
      # The Go blocker-shape lockstep test PARSES these shell files: it reads
      # each family's declared blocker_kind from the registry rows and binds
      # it to the real handler's write shape. Without these triggers a row
      # could be flipped to shared_intent_lock for an EdgeWriter-only handler,
      # its hand-derived pin updated to agree, and the check able to prove that
      # blocker architecturally vacuous would not be selected for this gate.
      #
      # "not selected for this gate" is the accurate scope, and it is narrower
      # than it looks. The reducer leg below is what runs that lockstep, and it
      # was absent from the CI job's command until this change added it -- so
      # before, these triggers bought local `make pre-pr` selection only, while
      # in CI the lockstep rode along on test.yml's go-core lane (whose `code:`
      # filter is '**' minus docs, and therefore already matched any
      # scripts/lib/** edit). Local and CI now run the same command for this
      # gate id. Said plainly because the earlier wording claimed the triggers
      # were the only thing standing between a vacuous blocker and CI, which
      # was not true of any lane.
      - "scripts/lib/ifa_family_registry.sh"
      - "scripts/lib/ifa_family_registry/**"
      - "testdata/cassettes/sqlrelationships/**"
      - "testdata/cassettes/codecalls/**"
      - "testdata/cassettes/symbolruntime/**"
      # Every remaining family that carries a materialized_edges:* coverage row.
      # This gate RECONCILES that manifest, so a cassette edit which changes facts
      # while leaving the edge set identical must re-run it -- the two live gates'
      # exact-set assertions cannot see such an edit, and the compiled-Odu/cassette
      # lockstep this gate runs is what does. Listing three of twelve made the map
      # uneven and the rule unstated (#6212); ci-gates/ifa_registry_test.go now
      # derives the required set from the coverage manifest and fails if one is
      # missing, so this list cannot drift again by hand.
      - "testdata/cassettes/codeowners/**"
      - "testdata/cassettes/deployableunit/**"
      - "testdata/cassettes/documentation/**"
      - "testdata/cassettes/inheritance/**"
      - "testdata/cassettes/iaminstanceprofilerole/**"
      - "testdata/cassettes/iamcanassume/**"
      - "testdata/cassettes/iamcanperform/**"
      - "testdata/cassettes/iamescalation/**"
      - "testdata/cassettes/authenticatesvaultrole/**"
      - "testdata/cassettes/usesvaultpolicy/**"
      - "testdata/cassettes/ec2usesprofile/**"
      - "testdata/cassettes/cloudresource/**"
      - "testdata/cassettes/kubernetesnamespaceenvironment/**"
      - "testdata/cassettes/rationale/**"
      - "testdata/cassettes/repodependency/**"
      - "testdata/cassettes/s3logsto/**"
      - "testdata/cassettes/builtfrom/**"
      - "testdata/cassettes/cloudresourcecontainerimage/**"
      - "testdata/cassettes/crossplanesatisfiedby/**"
      - "testdata/cassettes/shellexec/**"
      - "testdata/cassettes/submodulepin/**"
      - "testdata/cassettes/workloaddependency/**"
      - "go/internal/ifa/testdata/sqlrelationships/**"
      - "go/internal/ifa/testdata/codecalls/**"
    local:
      # The reducer leg runs the WHOLE TREE (`./internal/reducer/...`)
      # rather than a -run filter.
      # A hand-maintained test-name regex went stale twice here: it listed
      # TestMaterializedEdgeFamilies|TestMaterializedEdgeFamilyBlockerLockstep,
      # which silently did not select TestIfaFamilyRegistryWaitKeyIsKnownDomain
      # when that landed -- a check present in the tree and never run by the
      # gate meant to run it. The tree takes ~8s; that buys a selection
      # that cannot rot as tests are added, and -- because the leg is
      # recursive -- cannot rot as #6061 moves families out of the
      # reducer root into domain subpackages either.
      #
      # The ifa leg names materializededges explicitly for the same reason.
      # That leg -- not the reducer one above it -- is PACKAGE-EXACT,
      # not recursive, so a package that is not named here
      # is not run by this gate no matter how many tests it holds.
      command: "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1"
      test_command: "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify Ifa contract-layer gate"
    requirements:
      - go
    ci_only_reason: ""
