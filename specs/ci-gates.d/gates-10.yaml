version: v1
gates:
  - id: ifa-contract-layer
    name: Ifa contract-layer Odù skeleton
    category: exactness
    layer: contract
    purpose: "Runs the Ifá contract-layer test suite, verifying the Odù catalog, coverage manifest, and reducer code stay in lockstep."
    tier: pre-pr
    blocking: true
    # CI runs these packages inside test.yml's go-core job; this row selects
    # the contract-layer suite locally and backs specs/ifa-coverage-manifest.v1.yaml.
    triggers:
      - "go/internal/ifa/**"
      - "go/internal/reducer/**"
      - "go/cmd/ifa/**"
      - "go/internal/synth/gcp/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - "specs/ifa-coverage-manifest.v1.yaml"
      - "specs/fact-kind-registry.v1.yaml"
      - "specs/replay-coverage-manifest.v1.yaml"
      - "testdata/golden/e2e-20repo-snapshot.json"
      - "testdata/cassettes/vulnerabilityintelligence/**"
    local:
      command: "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1"
      test_command: "cd go && go test ./internal/ifa ./internal/ifa/materializededges ./cmd/ifa -count=1 && go test ./internal/reducer/... -count=1"
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: ifa-load-saturation
    name: Ifa P5 load/saturation Odù (corpus amplifier + throughput + #3560 saturation regression)
    category: exactness
    layer: performance
    purpose: "Checks the real backpressure gate holds under saturation load so overflow work waits and drains instead of dead-lettering."
    tier: pre-pr
    blocking: true
    # CI runs these packages under -race inside test.yml's go-race lane.
    triggers:
      - "go/internal/ifa/amplify.go"
      - "go/internal/ifa/slots.go"
      - "go/internal/ifa/saturation/**"
      - "go/internal/ifa/throughput/**"
      - "go/internal/storage/cypher/backpressure_executor.go"
      - "go/internal/storage/cypher/timeout_executor.go"
      - "go/internal/storage/postgres/reducer_queue_helpers.go"
      - "go/internal/storage/postgres/reducer_queue_readiness_sql.go"
      - "go/internal/reducer/contract/intent.go"
      - "go/internal/reducer/intent.go"
    local:
      command: "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1"
      test_command: "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1"
    ci:
      workflow: test.yml
      job: "go-race-complete"
    requirements:
      - go
    ci_only_reason: ""

  - id: collector-content-pin
    name: Collector content pin matches collector output
    category: exactness
    layer: contract
    purpose: "Fails when the committed content-epoch ledger drifts from what the git collector emits for its fixture."
    tier: pre-pr
    blocking: true
    # CI runs this package inside go-core's go test ./...; this row selects
    # the pin test locally from its real inputs, per the pattern above.
    triggers:
      - "go/internal/collector/repo/git/**"
      - "go/internal/collector/repo/git/epoch/ledger.tsv"
      - "go/internal/collector/repo/git/snapshot_content_version_gate_test.go"
      - "go/internal/collector/repo/git/testdata/content_version/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    # #9621: the machine-readable file classes whose changes can alter the
    # re-pinned ledger. The drift check fails when no trigger matches one.
    generator_inputs:
      - "go/internal/collector/repo/git/**"
    local:
      command: "cd go && go test ./internal/collector/repo/git -run '^TestGenerationContentVersionPinsCollectorOutput$' -count=1"
      test_command: "cd go && go test ./internal/collector/repo/git -run '^TestContentVersionFixtureDigestIsDeterministic$' -count=1"
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    # A ledger conflict takes the base's copy first, then re-pins: keeping
    # both sides' bucket lines under one epoch would ship new facts under an
    # old hint. No -advance-content-epoch here; that flag stays a human call.
    # After the helper re-pins, a change touching fixture files and collector
    # output together still needs a human -advance-content-epoch decision: the
    # re-pinned ledger passes its gate either way, so no gate catches the
    # stale-epoch variant. See the conflict recipe for the pin.
    regenerate:
      "go/internal/collector/repo/git/epoch/ledger.tsv": "git show ${ESHU_REGEN_BASE:?set_ESHU_REGEN_BASE}:go/internal/collector/repo/git/epoch/ledger.tsv > go/internal/collector/repo/git/epoch/ledger.tsv && (cd go && go test ./internal/collector/repo/git -run '^TestGenerationContentVersionPinsCollectorOutput$' -count=1 -update-content-version-pin) && (cd go && go test ./internal/collector/repo/git -run '^TestGenerationContentVersionPinsCollectorOutput$' -count=1)"
  - id: delta-union-scheduled
    name: Delta union scheduled proof enrollment (#8785)
    category: exactness
    layer: contract
    purpose: "Runs the two exact delta union projector proofs on isolated PostgreSQL 18.6 and Neo4j, with JSON event accounting."
    tier: ci-heavy
    blocking: false
    triggers:
      - ".github/workflows/delta-union-scheduled.yml"
      - "go/cmd/projector/**"
      - "go/internal/**"
      - "go/pkg/**"
      - "sdk/go/collector/**"
      - "sdk/go/factschema/**"
      - "go/go.mod"
      - "go/go.sum"
      - "scripts/ci/go-mod-download-retry.sh"
      - "scripts/lib/delta_union_scheduled.py"
      - "scripts/lib/live_tests_legacy_policy.py"
      - "scripts/test-delta-union-scheduled.py"
      - "scripts/lib/reducer_contention_events.py"
      - "scripts/lib/verify-live-tests-ledger.py"
      - "scripts/verify-live-tests-ledger.sh"
      - "specs/live-tests.v1.yaml"
      - "specs/live-tests.d/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    ci:
      workflow: delta-union-scheduled.yml
      job: "Delta union proof vs Neo4j and PostgreSQL"
    requirements:
      - go
      - docker
      - postgres
    ci_only_reason: "isolated hosted PostgreSQL and Neo4j services reset by the tests; the blocking static mirror verifies source, workflow, selector, event accounting, and ledger locally"
  # Scoped PR and scheduled proof. It remains nonblocking while hosted acceptance
  # is established on the reviewed split branch and is not a universal PR check.
  - id: ifa-scheduled-proofs
    name: Ifá scheduled proof enrollment (#7533)
    category: exactness
    layer: contract
    purpose: "Runs nine exact tagged Ifá tests against fresh Neo4j and PostgreSQL, then validates their Go events and backend identities."
    tier: ci-heavy
    blocking: false
    triggers:
      - ".github/workflows/ifa-scheduled-proofs.yml"
      - "go/go.mod"
      - "go/go.sum"
      - "scripts/ci/go-mod-download-retry.sh"
      - "scripts/run-ifa-scheduled-proofs.sh"
      - "scripts/lib/ifa_scheduled_events.py"
      - "scripts/lib/ifa_scheduled_inventory.json"
      - "scripts/lib/ifa_scheduled_manifest.py"
      - "scripts/test-ifa-scheduled-manifest.py"
      - "scripts/lib/ifa_scheduled_bundle.py"
      - "scripts/test-ifa-scheduled-bundle.py"
      - "scripts/lib/reducer_contention_events.py"
      - "scripts/lib/verify-live-tests-ledger.py"
      - "scripts/test-ifa-scheduled-events.py"
      - "scripts/test-ifa-scheduled-ledger-policy.py"
      - "scripts/verify-live-tests-ledger.sh"
      - "scripts/test-verify-live-tests-ledger.sh"
      - "specs/live-tests.v1.yaml"
      - "specs/live-tests.d/live-tests-01.yaml"
      - "specs/live-tests.d/live-tests-02.yaml"
      - "specs/live-tests.d/live-tests-03.yaml"
      - "specs/live-tests.d/live-tests-04.yaml"
      - "specs/live-tests.d/live-tests-05.yaml"
      - "specs/live-tests.d/live-tests-06.yaml"
      - "go/cmd/reducer/ifa_group_retry_live_test.go"
      - "go/internal/replay/offlinetier/postgres_test.go"
      - "go/internal/replay/offlinetier/delta_tier_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_proof_database_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_concurrency_fixture_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_concurrency_graph_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_concurrency_graph_validation_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_cleanup_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_concurrency_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_database_guard_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_process_death_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_quarantine_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_ifa_replay_coordinates_live_test.go"
      - "go/internal/replay/offlinetier/repo_dependency_proof_trigram_sharing_live_test.go"
    ci:
      workflow: ifa-scheduled-proofs.yml
      job: "Ifá scheduled proof vs Neo4j and PostgreSQL"
    requirements:
      - go
      - docker
      - postgres
    ci_only_reason: "needs fresh hosted Neo4j and PostgreSQL services; the blocking live-backend static mirror runs its source, route, event, and ledger guards locally"
  # ─── REPO-WIDE SWEEP TESTS (#7111 F5) ──────────────────────────────────────
  # Each of these Go tests reads source far outside its own package, so the
  # floor's changed-package `go test` never runs it when only an input changes.
  # CI runs them inside go-core's `go test ./...`; these rows select them
  # locally from their real inputs. Triggers are derived from what each test
  # reads (named in its comment) plus its own package, which it compiles.

  - id: index-key-guard-sweep
    name: Production indexed-write Cypher literals are guarded (#7058)
    category: exactness
    layer: contract
    purpose: "Scans production Cypher literals across storage, reducer, projector, collector, and cmd code to keep indexed writes schema-guarded."
    tier: pre-pr
    blocking: true
    # TestProductionCypherLiteralsAreGuarded scans the non-test Go literals
    # under sweepDirs (go/internal/graph/index_key_guard_sweep_test.go):
    # internal/storage, internal/reducer, internal/projector,
    # internal/collector, and cmd. The analyzer and schema it checks against
    # live in internal/graph.
    triggers:
      - "go/internal/graph/**"
      - "go/internal/storage/**"
      - "go/internal/reducer/**"
      - "go/internal/projector/**"
      - "go/internal/collector/**"
      - "go/cmd/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    self_test_triggers:
      - "go/internal/graph/**"
    local:
      command: "cd go && go test ./internal/graph -run '^TestProductionCypherLiteralsAreGuarded$' -count=1"
      test_command: "cd go && go test ./internal/graph -run '^(TestSweepFlagsSeededViolations|TestSweepReadsJoinedLabelTemplateWhole)$' -count=1"
      pre_push: floor
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: fips-md5-sql-sweep
    name: Production SQL has no md5() calls (FIPS, #6753)
    category: exactness
    layer: contract
    purpose: "Scans production Go SQL literals, migrations, and shipped schema SQL for md5() calls, which fail on FIPS-enabled PostgreSQL."
    tier: pre-pr
    blocking: true
    # TestProductionSQLHasNoMD5Calls scans the non-test Go string literals
    # under go/ plus the shipped .sql roots (migrations and
    # schema/data-plane/postgres)
    # (go/internal/storage/postgres/md5_sql_sweep_test.go). Testdata,
    # fixtures, docs evidence, and script proof helpers may still use md5();
    # only shipped SQL is in scope.
    triggers:
      - "go/**"
      - "go/internal/storage/postgres/md5_sql_sweep_test.go"
      - "schema/data-plane/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    self_test_triggers:
      - "go/internal/storage/postgres/md5_sql_sweep_test.go"
    local:
      command: "cd go && go test ./internal/storage/postgres -run '^TestProductionSQLHasNoMD5Calls$' -count=1"
      test_command: "cd go && go test ./internal/storage/postgres -run '^TestMD5SweepFlagsSeededViolation$' -count=1"
      pre_push: floor
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: hot-cypher-source-coverage
    name: Hot Cypher manifest covers every production query call
    category: exactness
    layer: contract
    purpose: "Checks that the hot-Cypher manifest lists every production query call site so no query runs outside the tracked manifest."
    tier: pre-pr
    blocking: true
    # TestHotCypherManifestCoversEveryProductionQueryCall
    # (go/internal/queryplan/source_coverage_test.go) discovers query call
    # sites under ../query and checks them against the manifests in
    # go/internal/queryplan/testdata.
    triggers:
      - "go/internal/queryplan/**"
      - "go/internal/query/**"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    self_test_triggers:
      - "go/internal/queryplan/**"
    local:
      command: "cd go && go test ./internal/queryplan -run '^TestHotCypherManifestCoversEveryProductionQueryCall$' -count=1"
      test_command: "cd go && go test ./internal/queryplan -run '^TestValidateSourceCoverage' -count=1"
      pre_push: floor
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: ask-overlay-inventory-coverage
    name: Ask catalog overlay covers the surface inventory
    category: exactness
    layer: contract
    purpose: "Checks that the Ask catalog's overlay covers every surface listed in the generated surface-inventory registry."
    tier: pre-pr
    blocking: true
    # TestOverlayCoversInventory (go/internal/ask/catalog/coverage_test.go)
    # reads the committed
    # go/internal/capabilitycatalog/data/surface-inventory.generated.json and
    # checks it against the overlay in its own package.
    triggers:
      - "go/internal/ask/catalog/**"
      - "go/internal/capabilitycatalog/data/surface-inventory.generated.json"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
    local:
      command: "cd go && go test ./internal/ask/catalog -run '^TestOverlayCoversInventory$' -count=1"
      test_command: ""
      pre_push: floor
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
