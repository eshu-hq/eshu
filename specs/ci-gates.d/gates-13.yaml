  - id: ifa-load-saturation
    name: Ifa P5 load/saturation Odù (corpus amplifier + throughput + #3560 saturation regression)
    category: exactness
    layer: performance
    purpose: "Checks the real backpressure gate holds under saturation load so overflow work waits and drains instead of dead-lettering."
    tier: pre-pr
    blocking: true
    triggers:
      - ".github/workflows/static-contract-gates.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/static-contract-filters.yml"
      - "go/internal/ifa/amplify.go"
      - "go/internal/ifa/slots.go"
      - "go/internal/ifa/saturation/**"
      - "go/internal/ifa/throughput/**"
      - "specs/scale-lab-corpus.v1.yaml"
      - "go/internal/storage/cypher/backpressure_executor.go"
      - "go/internal/storage/cypher/timeout_executor.go"
      - "go/internal/storage/postgres/reducer_queue_helpers.go"
      - "go/internal/storage/postgres/reducer_queue_readiness_sql.go"
      - "go/internal/reducer/contract/intent.go"
      - "go/internal/reducer/intent.go"
    local:
      command: "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1"
      test_command: "cd go && go test ./internal/ifa/saturation/ ./internal/ifa/throughput/ -race -count=1"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify Ifa P5 load/saturation gate"
    requirements:
      - go
    ci_only_reason: ""

  - id: cassette-author
    name: Cassette author gate (private-data scan + v1 format contract)
    category: security
    layer: contract
    purpose: "Scans committed cassettes for leaked private data and validates each one against the v1 cassette-format schema."
    tier: pre-pr
    blocking: true
    triggers:
      # Every committed cassette: the scan's subject (#6965 Phase 2). A leak
      # pushed to a PR branch is already public, so this runs in the
      # pre-push floor rather than only in CI.
      - "testdata/cassettes/**"
      - "scripts/verify-cassette-author.sh"
      - "scripts/test-verify-cassette-author.sh"
      # The alternatives, the fail-closed allowlist and the controls that
      # prove them. Without a row here, neutering the pattern re-runs nothing.
      - "scripts/lib/cassette_private_data_pattern.sh"
      # The v1 cassette-format validator the second half of the gate drives.
      - "go/internal/replay/schema/**"
      - ".github/workflows/static-contract-gates.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/ci-gates.d/**"
      - ".github/static-contract-filters.yml"
    local:
      command: "bash scripts/verify-cassette-author.sh"
      pre_push: floor
      test_command: "bash scripts/test-verify-cassette-author.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify cassette author gate"
    requirements:
      - go
    ci_only_reason: ""
