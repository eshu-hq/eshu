      - "scripts/lib/test-pre-pr-test-selection.sh"
      - "scripts/generate-ci-gates-doc.sh"
      - "scripts/lib/ci-gates-doc-parse.awk"
      - "scripts/lib/test-verify-ci-gates-registry-telemetry-cases.sh"
      - "scripts/lib/test-verify-ci-gates-registry-performance-cases.sh"
      - "scripts/lib/test-verify-ci-gates-registry-docs-cli-env-cases.sh"
      - "scripts/lib/test-verify-ci-gates-registry-ifa-filter-cases.sh"
      - "scripts/lib/test-verify-ci-gates-registry-parser-relationship-cases.sh"
      - "scripts/lib/test-verify-ci-gates-registry-workflow-shape-cases.sh"
