      command: "bash scripts/verify-ci-gates-registry.sh --drift"
      pre_push: floor
      test_command: "bash scripts/test-verify-ci-gates-registry.sh && bash scripts/test-pre-pr-whole-module-gates.sh && bash scripts/test-pre-push.sh && bash scripts/test-no-prepr-stamp-references.sh && bash scripts/test-generate-ci-gates-doc.sh && bash scripts/test-verify-live-required-status-checks.sh && bash scripts/test-resolve-required-gates-pr.sh && (cd go && go test ./internal/cigates -count=1)"
    ci:
      workflow: verify-ci-gate-registry.yml
      job: "Verify ci-gate registry + drift"
    requirements:
