  - id: ifa-materialized-edge-coverage
    name: Ifa materialized-edge exhaustiveness gate (#5351)
    category: exactness
    tier: pre-pr
    blocking: true
    triggers:
      # This gate runs two package-level `go test` commands, which compile every
      # file in each package — so an edit to any sibling file can change the
      # verdict and must select the gate (#5873). The per-file entries below are
      # kept: they are the files the gate is actually about, and the doc renders
      # them as the reader's map of what it guards.
      - "go/internal/ifa/**"
      - "go/cmd/ifa/**"
      - "go/internal/reducer/**"
      - "go/internal/ifa/materializededges/**"
      - "go/internal/ifa/sql_relationship_odu*.go"
      - "go/internal/reducer/materialized_edge_families.go"
      - "go/internal/reducer/shared_projection.go"
      - "go/internal/reducer/sql_relationship_materialization.go"
      - "go/internal/reducer/sql_relationship_embedded_query.go"
      - "go/internal/reducer/sql_relationship_metadata.go"
      # The whole cypher package, for the same reason the reducer leg above is
      # a subtree (#6181). This gate's direct-family drift guard parses EVERY
      # non-test file in go/internal/storage/cypher and follows each reducer
      # port through the package call graph to the Cypher it reaches, so any
      # file there can change its verdict. The four per-file entries below
      # covered 6 of the package's 131 non-test files, which meant a change to
      # iam_can_perform_edge_writer.go or secrets_iam_graph_writer.go -- a
      # direct writer whose family the guard classifies -- did not select this
      # gate at all. Measured with `ci-gates select --paths-from`, not
      # estimated. The per-file entries stay as the reader's map of what the
      # gate is about.
      - "go/internal/storage/cypher/**"
      - "go/internal/storage/cypher/edge_writer_sql.go"
      - "go/internal/storage/cypher/materialized_edge_*.go"
      - "go/internal/storage/cypher/canonical_code_call_edges.go"
      - "go/internal/storage/cypher/canonical_inheritance_edges.go"
      - "specs/ci-gates.v1.yaml"
      - "specs/ifa-materialized-edge-coverage.v1.yaml"
      - "specs/ifa-materialized-edge-coverage-direct.v1.yaml"
      # The Go blocker-shape lockstep test PARSES these shell files: it reads
      # each family's declared blocker_kind from the registry rows and binds
      # it to the real handler's write shape. Without these triggers a row
      # could be flipped to shared_intent_lock for an EdgeWriter-only handler,
      # its hand-derived pin updated to agree, and the check able to prove that
      # blocker architecturally vacuous would not be selected for this gate.
      #
      # "not selected for this gate" is the accurate scope, and it is narrower
      # than it looks. The reducer leg below is what runs that lockstep, and it
      # was absent from the CI job's command until this change added it -- so
      # before, these triggers bought local `make pre-pr` selection only, while
      # in CI the lockstep rode along on test.yml's go-core lane (whose `code:`
      # filter is '**' minus docs, and therefore already matched any
      # scripts/lib/** edit). Local and CI now run the same command for this
      # gate id. Said plainly because the earlier wording claimed the triggers
      # were the only thing standing between a vacuous blocker and CI, which
      # was not true of any lane.
      - "scripts/lib/ifa_family_registry.sh"
      - "scripts/lib/ifa_family_registry/**"
      - "testdata/cassettes/sqlrelationships/**"
      - "testdata/cassettes/codecalls/**"
      - "testdata/cassettes/symbolruntime/**"
      # Every remaining family that carries a materialized_edges:* coverage row.
      # This gate RECONCILES that manifest, so a cassette edit which changes facts
      # while leaving the edge set identical must re-run it -- the two live gates'
      # exact-set assertions cannot see such an edit, and the compiled-Odu/cassette
      # lockstep this gate runs is what does. Listing three of twelve made the map
      # uneven and the rule unstated (#6212); ci-gates/ifa_registry_test.go now
      # derives the required set from the coverage manifest and fails if one is
      # missing, so this list cannot drift again by hand.
      - "testdata/cassettes/codeowners/**"
      - "testdata/cassettes/deployableunit/**"
