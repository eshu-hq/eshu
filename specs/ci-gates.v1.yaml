# CI gate registry — single source of truth mapping changed paths to local/CI gates.
# Version: v1
# See docs/public/reference/local-testing.md for usage.
# Managed by: scripts/verify-ci-gates-registry.sh (validate)
#             scripts/dev/select-gates.sh (select)
#             scripts/dev/run-selected-gates.sh (run)

version: v1

# Repository-owned manifest of the required contexts. The live main ruleset
# requires only the two Go umbrellas (ruleset_required defaults to true),
# which the ruleset reads directly: there is no aggregate publisher since
# #10584 deleted the required-gates.yml workflow_run fan-in (the aggregate
# job had been disabled since #9805). At most one aggregates_blocking_gates
# entry may be declared; with none present, validation skips the trusted
# publisher checks.
required_status_checks:
  - context: go-core-complete
    workflow: test.yml
    job: go-core-complete
    integration_id: 15368
    aggregates_blocking_gates: false
  - context: go-race-complete
    workflow: test.yml
    job: go-race-complete
    integration_id: 15368
    aggregates_blocking_gates: false

gate_fragments:
  - ci-gates.d/gates-01.yaml
  - ci-gates.d/gates-02.yaml
  - ci-gates.d/gates-03.yaml
  - ci-gates.d/gates-04.yaml
  - ci-gates.d/gates-05.yaml
  - ci-gates.d/gates-06.yaml
  - ci-gates.d/gates-07.yaml
  - ci-gates.d/gates-08.yaml
  - ci-gates.d/gates-09.yaml
  - ci-gates.d/gates-10.yaml
  - ci-gates.d/gates-11.yaml
  - ci-gates.d/gates-12.yaml
  - ci-gates.d/gates-13.yaml
  - ci-gates.d/gates-14.yaml
  - ci-gates.d/gates-16.yaml
  - ci-gates.d/gates-15.yaml
  - ci-gates.d/gates-17.yaml

# Merge-group slim lane (#7859 P3): ordered set of blocking gate IDs for the
# merge_group selector. The duplicate test.yml/merge-group-slim job and its six
# slim-* rows were removed after the merge queue was disabled on 2026-10-16;
# pull-request selection never reads this list. Every entry must name a distinct
# existing blocking gate.
merge_group_slim_gates:
  - markdown-file-cap
  - scripts-file-cap
  - ci-gate-registry
  - capability-inventory
  - mcp-tool-count
  - live-backend-static-mirror
  - go-dir-gate

hygiene_hooks:
  - id: codex-spawn-guard
    reason: "pre-commit mirror of the agent-canon Codex spawn guard test, also run locally and in CI"
  - id: goal-role-routing
    reason: "pre-commit mirror of agent-canon goal router behavior, also run in the local test command and CI hygiene workflow"
  - id: no-ai-attribution-message
    reason: "commit-msg-stage variant of the no-ai-attribution gate (same check, different stage)"
  - id: no-private-identifiers-message
    reason: "commit-msg-stage variant of the no-private-identifiers gate (same check, different stage)"
  - id: frontend-format-staged
    reason: "staged-file variant of frontend-format-changed (same prettier check, pre-commit stage)"
  - id: frontend-format-verifier-tests
    reason: "self-test of the frontend-format verifier + hook wiring"
  - id: docs-build-staged
    reason: "staged-file variant of docs-build-changed (same mkdocs check, pre-commit stage)"
  - id: docs-build-verifier-tests
    reason: "self-test of the docs-build verifier + hook wiring"
  - id: console-e2e-verifier-tests
    reason: "self-test of the console-e2e pre-push helper routing"
  - id: naming-glue-gate
    reason: "model-judged glued-compound directory name check (naming.md rule 3); pre-commit-only by design -- see go/cmd/naming-glue-gate/AGENTS.md for why it does not also run (and re-bill) in CI on every push of an already-locally-checked branch"

# ─── NON-GATE WORKFLOWS ──────────────────────────────────────────────────────
# .github/workflows/*.yml files that are deliberately NOT PR gates (deploy,
# release, scheduled-refresh, on-demand, or bot workflows). Each must exist on
# disk; the drift check fails on a stale entry or an unregistered workflow.
non_gate_workflows:
  - file: required-gates.yml
    reason: "scheduled/manual live-ruleset audit (verify-live-ruleset), retained per #10977: named consumer is the Main Health watcher, which reads its newest completed scheduled run and fails closed without it; the workflow_run fan-in and aggregate publisher were deleted in #10584, never a PR gate"
  - file: live-postgres-readiness-calibration.yml
    reason: "manual six-shard calibration for #9100; evidence only, never a PR or main-push acceptance gate"
  - file: main-health.yml
    reason: "post-merge watcher on main (15m schedule + manual dispatch) that files the main-is-red issue and status; its script is gated by main-health-watcher, the workflow itself is not a PR gate"
  - file: dirgate-main-alarm.yml
    reason: "post-merge dirgate alarm on main (workflow_run of Build Test + manual dispatch) that comments the merged PR with the directory and missing trailer; never a PR gate"
  - file: bench.yml
    reason: "advisory perf benchmark + regression (BENCH_REGRESSION_ENFORCE=false); not a credential-free local-parity gate"
  - file: bench-baseline-refresh.yml
    reason: "scheduled benchmark-baseline refresh, not a PR gate"
  - file: build.yml
    reason: "release-binary build/publish; PR compile coverage is the go-build gate via test.yml"
  - file: deploy-root-docs.yml
    reason: "docs site deploy, not a PR gate"
  - file: refresh-cassettes.yml
    reason: "scheduled/manual cassette refresh, not a PR gate"
  - file: postgres-scheduled-live.yml
    reason: "daily/manual PostgreSQL live proof enrollment; scheduled verification, not a PR or merge gate pending repeated cost evidence"
  - file: ci-census.yml
    reason: "daily CI cost census telemetry (#8617); reports run counts, cancelled share, and duration percentiles to a job summary, posts no merge-relevant status"
  - file: seed-publish.yml
    reason: "dispatch-only #8877 seed image publish (buildx provenance+SBOM, push, in-image smoke, digest output); never a PR or main-push acceptance gate"
  - file: live-postgres-readiness.yml
    reason: "4-hourly/manual deep PostgreSQL readiness EXPLAIN & correctness proofs; moved off per-PR and per-push main runs to eliminate CI burn and broken-window advisory noise"
  - file: reducer-contention-gate.yml
    reason: "4-hourly/manual deep PostgreSQL reducer contention & supply-chain proofs; moved off per-PR and per-push main runs"
  - file: code-coverage-report.yml
    reason: "nightly/manual advisory Go coverage report and module floor ranking; moved off per-PR and per-push main runs"
  - file: tagged-builds.yml
    reason: "nightly/manual 73-configuration //go:build sweep; moved out of static-contract-gates.yml"
  - file: go-race-cache-warm.yml
    reason: "main-push-only deterministic GOCACHE warmer for test.yml go-race shards (#11550); never a PR gate, self-test and parity checks run in test.yml"
