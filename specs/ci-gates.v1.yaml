    tier: pre-push
    blocking: true
    triggers:
      - "src/**"
      - "apps/console/src/**"
      - "eslint.config.js"
      - "scripts/verify-eslint-config.sh"
      - "scripts/test-eslint-config.sh"
      # The eslint self-test (test-eslint-config.sh) reads the lint fixtures, so
      # a fixture change must re-run this gate (it is in frontend.yml's filter).
      - "tests/lint-fixture/**"
      # verify-eslint-config.sh runs `eslint .` repo-wide, and eslint.config.js
      # carries an explicit files: ["scripts/**/*.{js,mjs,cjs,ts,mts,cts}"] block,
      # so every .mjs under scripts/ is linted by this gate (#5798). Matched as a
      # class rather than enumerated: naming them one at a time is what let the
      # console-bundle and marketing-review scripts go ungated in the first place.
      # The .d.mts siblings are deliberately NOT covered - eslint.config.js
      # ignores "**/*.d.mts", so this glob must not match them (it does not).
      - "scripts/**/*.mjs"
    local:
      command: "bash scripts/verify-eslint-config.sh"
      test_command: "bash scripts/test-eslint-config.sh"
    ci:
      workflow: frontend.yml
      job: "ESLint flat config (issue #3763)"
    requirements:
      - node
    ci_only_reason: ""

