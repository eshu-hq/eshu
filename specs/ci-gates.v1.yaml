    local:
      # go_test_run_guard (#6055) asserts the pattern still matches all 6
      # named tests via `go test -list` before running them, so a rename or
      # move that drops the match count to zero fails loudly instead of the
      # bare `go test -run` exiting 0 on nothing. The command stays
      # "cd go && ..."-prefixed (a relative ../scripts/ call rather than a
      # bare scripts/ one) so it keeps the same registry shape
      # heredoc-budget's local.command already uses for a script it invokes
      # from inside go/ — the two new triggers above are added explicitly
      # even though this shape is exempt from checkScriptTriggerCoverage's
      # automatic derivation, matching that same precedent.
      command: "cd go && ../scripts/go-test-run-guard.sh 6 'Test(AuthorizationReplayCoverageContract|SecretsIAMPostureSummaryScopedGrant|AuthMiddlewareWithScopedTokensAllowsSecretsIAMRoutes)' -- ./internal/query -count=1"
