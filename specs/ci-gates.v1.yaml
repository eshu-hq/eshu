      job: "MCP-identity auth E2E (browser + scripted OAuth, fresh stack)"
    requirements:
      - go
      - node
      - docker
      - nornicdb
      - postgres
    ci_only_reason: ""

  - id: trivy-image
    name: Trivy image scan (GHCR)
    category: security
    tier: ci-heavy
    # Post-publish evidence: the image does not exist until docker-publish has
    # completed on main, so this cannot honestly be a pre-merge blocker.
    blocking: false
    triggers:
      - "go/**"
      - "Dockerfile"
      - "deploy/helm/**"
    ci:
      workflow: security-scan.yml
      job: "Trivy image scan (ghcr.io/eshu-hq/eshu)"
    requirements:
      - credentials
    ci_only_reason: "requires published container image and GHCR credentials"

  - id: docker-image-build
    name: Docker image build smoke
    category: build
    tier: ci-heavy
    blocking: true
    triggers:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
    ci:
      workflow: docker-publish.yml
      job: "build-and-push-image"
    requirements:
      - docker
    ci_only_reason: "requires hosted Docker Buildx; PR runs build with push disabled"

  - id: docker-image-reproducibility
    name: Docker image reproducibility
    category: build
    tier: ci-heavy
    blocking: true
    triggers:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
    ci:
      workflow: docker-publish.yml
      job: "verify-reproducibility"
    requirements:
      - docker
    ci_only_reason: "requires two clean hosted Docker Buildx builds"

  - id: helm-package
    name: Helm chart lint and package
    category: release
    tier: ci-heavy
    blocking: true
    triggers:
      - "deploy/helm/**"
      - ".github/workflows/docker-publish.yml"
    ci:
      workflow: docker-publish.yml
      job: "package-and-push-chart"
    requirements:
      - go
    ci_only_reason: "requires the hosted Helm packaging lane; PR runs skip the registry push"

  - id: docker-publish
    name: Docker image and Helm publication
    category: release
    tier: manual
    blocking: false
    triggers:
      - "go/**"
      - "Dockerfile"
      - "deploy/helm/**"
    ci:
      workflow: docker-publish.yml
      job: "build-and-push-image"
    requirements:
      - credentials
      - release_token
    ci_only_reason: "post-merge publication requires registry push credentials and cannot block its own merge"

  - id: macos-build
    name: macOS build verification
    category: build
    tier: ci-heavy
    blocking: true
    triggers:
      - "go/**"
    ci:
      workflow: macos.yml
      job: "macos"
    requirements:
      - go
    ci_only_reason: "requires macOS hosted runner"

  # ─── EVIDENCE / LEDGER / DRIFT ─────────────────────────────────────────────

  - id: root-cause-evidence
    name: Root-cause claims carry observed evidence
    category: exactness
    tier: pre-pr
    blocking: false
    triggers:
      - "docs/internal/evidence/**"
      - "scripts/verify-root-cause-evidence.sh"
      - "scripts/test-verify-root-cause-evidence.sh"
      - "specs/ci-gates.v1.yaml"
    local:
      command: "bash scripts/verify-root-cause-evidence.sh"
      test_command: "bash scripts/test-verify-root-cause-evidence.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify root-cause-evidence gate"
    requirements: []
    ci_only_reason: ""
    hook_id: ""

  - id: perf-evidence
    name: Hot-path performance evidence
    category: telemetry
    tier: pre-push
    blocking: true
    triggers:
      - "go/internal/storage/**"
      - "go/internal/reducer/**"
      - "go/internal/collector/**"
      - "go/internal/query/**"
      - "go/internal/runtime/**"
      - "scripts/dev/precommit-go.sh"
      - "scripts/verify-performance-evidence.sh"
      - "scripts/lib/live-gate-lock.sh"
      - "scripts/lib/golden-corpus-keep-marker.sh"
      - "scripts/test-verify-performance-evidence.sh"
      - "scripts/test-verify-performance-evidence-ci-base.sh"
      - "scripts/test-verify-performance-evidence-inherited-marker.sh"
      - "scripts/test-verify-performance-evidence-large-marker.sh"
      - "scripts/test-verify-performance-evidence-merge-base.sh"
    local:
      command: "bash scripts/dev/precommit-go.sh perf-evidence"
      test_command: "bash scripts/test-verify-performance-evidence.sh"
    ci:
      workflow: test.yml
      job: "verify-contracts"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-perf-evidence

  - id: product-claim-ledger
    name: Product Claim Ledger (deterministic verify)
    category: exactness
    tier: pre-pr
    blocking: true
    triggers:
      - "specs/product-claims.v1.yaml"
      - "specs/capability-catalog.v1.yaml"
      - "specs/capability-matrix.v1.yaml"
      # The gate IS this program: it runs `go run ./cmd/capability-inventory
      # -mode product-claims`, so an edit there must select it (#5873). Its two
      # sibling gates on the same binary, capability-inventory and
      # capability-inventory-docs, already trigger on this path.
      - "go/cmd/capability-inventory/**"
    # The deterministic product-claims-mode verify is credential-free. The live
    # issue-state variant (ESHU_VERIFY_PRODUCT_CLAIM_ISSUES_LIVE=1 + GITHUB_TOKEN)
    # stays CI-only. #4073: narrowed from -mode docs to -mode product-claims so
    # this gate does not repeat the capability-state/collector-state docs-tree
    # scan the capability-inventory-docs gate already runs on every PR.
    local:
      command: "cd go && go run ./cmd/capability-inventory -mode product-claims"
      test_command: ""
    ci:
      workflow: product-claim-ledger.yml
      job: "Verify product claim ledger"
    requirements:
      - go
    ci_only_reason: ""

  - id: replay-tier
    name: Replay tier (offline cassette replay)
    category: exactness
    tier: ci-heavy
    blocking: true
    triggers:
      - "go/cmd/ingester/**"
      - "go/cmd/projector/**"
      # internal/query carries the sql_table blast-radius branch proof (#5409),
      # which this gate runs and nothing else does (#6182). Without this
      # trigger a PR editing only the blast-radius query would not select the
      # gate that proves its UNION branches still match.
      - "go/internal/query/**"
      - "go/internal/replay/**"
      - "go/internal/reducer/**"
      - "go/internal/storage/cypher/**"
      - "go/internal/storage/nornicdb/**"
      - "go/internal/projector/**"
      - "go/internal/graph/**"
      - "go/internal/runtime/**"
      - "testdata/cassettes/replayoffline/**"
      - "testdata/cassettes/replaydelta/**"
      - "scripts/verify-replay-tier.sh"
      - "scripts/test-verify-replay-tier.sh"
      - "scripts/dev/pre-pr.sh"
      - "scripts/ci/install-apt-packages.sh"
      - ".github/workflows/verify-replay-tier.yml"
    local:
      command: "bash scripts/verify-replay-tier.sh"
      test_command: "bash scripts/test-verify-replay-tier.sh"
    ci:
      workflow: verify-replay-tier.yml
      job: "Offline replay tier vs real NornicDB"
    requirements:
      - go
      - docker
    ci_only_reason: ""

  - id: go-test-race
    name: Go tests with race detector
    category: race
    tier: pre-pr
    blocking: true
    triggers:
      - "go/internal/replay/inputtape/**"
      - "go/internal/replay/schedulereplay/**"
      - "go/internal/replay/crashreplay/**"
      - "go/internal/replay/concurrentreplay/**"
      - "go/internal/replay/costcounting/**"
      - ".github/workflows/test.yml"
    local:
      command: "cd go && go test -race -count=1 -timeout 300s ./internal/replay/inputtape/... ./internal/replay/schedulereplay/... ./internal/replay/crashreplay/... ./internal/replay/concurrentreplay/... ./internal/replay/costcounting/..."
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-race-complete"
    requirements:
      - go
    ci_only_reason: ""

  - id: ci-gate-registry
    name: CI gate registry + drift
    category: hygiene
    tier: pre-pr
    blocking: true
    triggers:
      - "specs/ci-gates.v1.yaml"
      - "go/internal/cigates/**"
      - "go/cmd/ci-gates/**"
      - ".pre-commit-config.yaml"
      - "scripts/dev/pre-pr.sh"
      - "scripts/dev/precommit-go.sh"
      - "scripts/dev/trivy-fs-local.sh"
      - "scripts/lib/trivy-skip-dirs.sh"
      - "specs/trivy-skip-dirs.txt"
      - "scripts/test-verify-ci-gates-registry.sh"
      - "scripts/verify-live-required-status-checks.sh"
      - "scripts/test-verify-live-required-status-checks.sh"
      - "scripts/test-pre-pr-whole-module-gates.sh"
      - "scripts/lib/pre-pr-test-selection.sh"
      - "scripts/lib/test-pre-pr-test-selection.sh"
      - "scripts/generate-ci-gates-doc.sh"
      - "scripts/lib/ci-gates-doc-parse.awk"
      - "scripts/lib/test-verify-ci-gates-registry-telemetry-cases.sh"
      - "scripts/lib/test-verify-ci-gates-registry-performance-cases.sh"
      - "scripts/lib/test-verify-ci-gates-registry-docs-cli-env-cases.sh"
      - "scripts/lib/test-verify-ci-gates-registry-ifa-filter-cases.sh"
      - "scripts/test-generate-ci-gates-doc.sh"
      - "docs/public/reference/ci-gates.md"
      - ".github/workflows/**"
      - "scripts/verify-ci-gates-registry.sh"
    local:
      command: "bash scripts/verify-ci-gates-registry.sh --drift"
      test_command: "bash scripts/test-verify-ci-gates-registry.sh && bash scripts/test-pre-pr-whole-module-gates.sh && bash scripts/test-generate-ci-gates-doc.sh && bash scripts/test-verify-live-required-status-checks.sh && (cd go && go test ./internal/cigates -count=1)"
    ci:
      workflow: verify-ci-gate-registry.yml
      job: "Verify ci-gate registry + drift"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: gate-registry-drift

  - id: prepr-stamp-verify-selftest
    name: pre-pr stamp verify guard self-test
    category: hygiene
    tier: pre-pr
    # Advisory, not blocking (mirrors docs-prose-quality/docs-contradiction):
    # a blocking gate with no CI backstop fails ValidateRequiredStatusChecks
    # (TestValidateRequiredStatusChecks_RejectsBlockingGateWithoutCIReachability),
    # because nothing in CI could ever satisfy it. This gate has no CI
    # counterpart by design -- see local_only_reason below -- so it stays
    # advisory the same way those two do.
    blocking: false
    triggers:
      - "scripts/dev/prepr-stamp-verify.sh"
      - "scripts/dev/test-prepr-stamp-verify.sh"
      - "specs/ci-gates.v1.yaml"
    local:
      # command is deliberately empty, not a no-op filler: prepr-stamp-verify.sh
      # reads the stamp of the commit about to be pushed, so running the real
      # guard as this gate's own local.command inside `make pre-pr` would fail
      # every time -- that stamp does not exist until `make pre-pr` finishes.
      # Only the hermetic self-test is meaningful to run from this registry
      # path; the real guard's enforcement stays the pre-commit pre-push stage
      # (hygiene_hooks entry below), which this gate does not duplicate.
      command: ""
      test_command: "bash scripts/dev/test-prepr-stamp-verify.sh"
    ci:
      workflow: ""
      job: ""
    requirements: []
    ci_only_reason: ""
    local_only_reason: "prepr-stamp-verify.sh is a git pre-push hook (stages: [pre-push] in .pre-commit-config.yaml); CI never runs git push, so it has no CI job to point at, and the chicken-and-egg problem above rules out a meaningful local.command too. Before this gate existed, test-prepr-stamp-verify.sh (148 lines, added as \"the first behavioural test for prepr-stamp-verify.sh\") was reachable from nothing -- not pre-pr.sh, not a gate, not a workflow, not a Makefile target -- and never ran (#6149 follow-up item 8 review, P1). This gate closes that: `make pre-pr` now runs the self-test whenever the guard or its test changes. Unlike docs-prose-quality/docs-contradiction, this is a permanent local-only shape, not a staging one waiting on a CI job -- CI cannot exercise a pre-push hook, ever, so there is nothing here that would close by adding one."

# ─── HYGIENE HOOKS ───────────────────────────────────────────────────────────
# Local pre-commit hook ids that are basic hygiene or self-tests, intentionally
# NOT registry gates. The drift check allows these without a gate mapping.
hygiene_hooks:
  - id: no-ai-attribution-message
    reason: "commit-msg-stage variant of the no-ai-attribution gate (same check, different stage)"
  - id: frontend-format-staged
    reason: "staged-file variant of frontend-format-changed (same prettier check, pre-commit stage)"
  - id: frontend-format-verifier-tests
    reason: "self-test of the frontend-format verifier + hook wiring"
  - id: docs-build-staged
    reason: "staged-file variant of docs-build-changed (same mkdocs check, pre-commit stage)"
  - id: docs-build-verifier-tests
    reason: "self-test of the docs-build verifier + hook wiring"
  - id: console-e2e-verifier-tests
    reason: "self-test of the console-e2e pre-push helper routing"
  - id: prepr-stamp-verify
    reason: "local-only pre-push guard: blocks pushing a commit make pre-pr did not stamp; no CI counterpart (CI re-runs the gates regardless)"

# ─── NON-GATE WORKFLOWS ──────────────────────────────────────────────────────
# .github/workflows/*.yml files that are deliberately NOT PR gates (deploy,
# release, scheduled-refresh, on-demand, or bot workflows). Each must exist on
# disk; the drift check fails on a stale entry or an unregistered workflow.
non_gate_workflows:
  - file: bench.yml
    reason: "advisory perf benchmark + regression (BENCH_REGRESSION_ENFORCE=false); not a credential-free local-parity gate"
  - file: bench-baseline-refresh.yml
    reason: "scheduled benchmark-baseline refresh, not a PR gate"
  - file: build.yml
    reason: "release-binary build/publish; PR compile coverage is the go-build gate via test.yml"
  - file: deploy-root-docs.yml
    reason: "docs site deploy, not a PR gate"
  - file: generate-bundle-on-demand.yml
    reason: "on-demand/dispatch bundle generation, not a PR gate"
  - file: post_discord_invite.yml
    reason: "Discord invite bot post, not a review gate"
  - file: refresh-cassettes.yml
    reason: "scheduled/manual cassette refresh, not a PR gate"
