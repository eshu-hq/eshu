    requirements:
      - go
    ci_only_reason: ""
    # Wired into CI (static-contract-gates.yml, same lane as doc-citations and
    # maturity-drift-guard) because this is a blocking recurrence-prevention
    # gate for #5336's part (d) finding: remote_validation proof-IDs in the
    # capability matrix were free-form slugs with no allow-list and no
    # required committed evidence, so a production:supported claim could ride
    # on an unverifiable reference indefinitely
    # (component_extensions.{inventory,diagnostics} were the flagged
    # example). convertVerification() in
    # go/internal/capabilitycatalog/matrix.go now hard-fails an unknown
    # verification kind at load time (covered by the existing
    # go test ./internal/capabilitycatalog gate); this gate covers the
    # second half — CheckRemoteValidationArtifacts requires every
    # remote_validation ref to resolve to a deployed-tier artifact at
    # docs/internal/remote-validation/<ref>.md or appear in the burn-down
    # baseline. The content check requires a dated command with direct exit
    # capture, exit 0, a permitted committed deployed source, and an assertion
    # for every production capability sharing the slug. The generated inventory
    # binds the matrix rows to their artifact paths without generating run data.

