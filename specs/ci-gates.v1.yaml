      # class rather than enumerated: naming them one at a time is what let the
      # console-bundle and marketing-review scripts go ungated in the first place.
      # The .d.mts siblings are deliberately NOT covered - eslint.config.js
      # ignores "**/*.d.mts", so this glob must not match them (it does not).
      - "scripts/**/*.mjs"
    local:
      command: "bash scripts/verify-eslint-config.sh"
      test_command: "bash scripts/test-eslint-config.sh"
    ci:
      workflow: frontend.yml
      job: "ESLint flat config (issue #3763)"
    requirements:
      - node
    ci_only_reason: ""

