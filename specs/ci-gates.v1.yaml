      command: "cd go && go test ./internal/query -run 'Test(AuthorizationReplayCoverageContract|SecretsIAMPostureSummaryScopedGrant|AuthMiddlewareWithScopedTokensAllowsSecretsIAMRoutes)' -count=1"
      test_command: ""
    ci:
      workflow: replay-coverage-gate.yml
      job: "coverage-gate (blocking)"
    requirements:
      - go
    ci_only_reason: ""

  - id: code-coverage-report
    name: Go Code Coverage Report
    category: exactness
    tier: pre-pr
    blocking: false
    triggers:
