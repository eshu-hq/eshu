# CI gate registry — single source of truth mapping changed paths to local/CI gates.
# Version: v1
# See docs/public/reference/local-testing.md for usage.
# Managed by: scripts/verify-ci-gates-registry.sh (validate)
#             scripts/dev/select-gates.sh (select)
#             scripts/dev/run-selected-gates.sh (run)

version: v1

# Repository-owned mirror of the active main ruleset. The two Go umbrellas stay
# required during rollout; required-gates-complete is the trusted default-branch
# status publisher that aggregates every path-selected blocking gate below.
required_status_checks:
  - context: go-core-complete
    workflow: test.yml
    job: go-core-complete
    integration_id: 15368
    aggregates_blocking_gates: false
  - context: go-race-complete
    workflow: test.yml
    job: go-race-complete
    integration_id: 15368
    aggregates_blocking_gates: false
  - context: required-gates-complete
    workflow: required-gates.yml
    job: aggregate
    source_workflow: Build Test
    integration_id: 15368
    aggregates_blocking_gates: true

gates:

  # ─── HYGIENE / GO CORE ─────────────────────────────────────────────────────

  - id: go-fmt
    name: Go gofumpt formatting
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "bash scripts/dev/precommit-go.sh fmt-all"
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-fmt

  - id: go-lint
    name: Go lint (golangci-lint)
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "bash scripts/dev/precommit-go.sh lint-all"
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-lint

  - id: go-build
    name: Go build (all binaries)
    category: build
    tier: pre-push
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "cd go && go build ./..."
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: go-vet
    name: Go vet
    category: hygiene
    tier: pre-push
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "cd go && go vet ./..."
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: go-file-cap
    name: Go 500-line file cap
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "bash scripts/dev/precommit-go.sh filecap-all"
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-file-cap

  - id: package-docs
    name: Go package docs coverage
    category: hygiene
    tier: pre-pr
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "bash scripts/verify-package-docs.sh"
      test_command: "bash scripts/test-verify-package-docs.sh"
    ci:
      workflow: test.yml
      job: "verify-contracts"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-package-docs

  - id: agent-canon
    name: Agent canon check
    category: hygiene
    tier: pre-pr
    blocking: true
    triggers:
      - "go/**"
      - ".agents/**"
      - ".claude/skills/**"
      - ".codex/skills/**"
      - ".opencode/agent/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/verify-agent-canon.sh"
      - "scripts/test-verify-agent-hygiene.sh"
    local:
      command: "bash scripts/verify-agent-canon.sh"
      test_command: "bash scripts/test-verify-agent-hygiene.sh"
    ci:
      workflow: verify-agent-hygiene.yml
      job: "Agent hygiene gate"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: agent-canon

  - id: no-ai-attribution
    name: No AI attribution in commits/docs
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      # The CI check scans every commit message and every added diff line, so
      # required-gate selection must wait for it on every non-empty PR.
      - "**"
    local:
      command: "bash scripts/verify-no-ai-attribution.sh"
      test_command: ""
    ci:
      # The AI-attribution check runs in verify-agent-hygiene.yml's "No AI
      # attribution" step, not in test.yml's docs-helm-hygiene job, which has
      # no such step. Matches the sibling agent-canon gate in the same
      # workflow (#5748).
      workflow: verify-agent-hygiene.yml
      job: "Agent hygiene gate"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: no-ai-attribution-content

  - id: license-header
    name: Go license header verification
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      # Must match the scope verify-license-header.sh actually scans -- every
      # .go file in the repo, not only go/**. 312 tracked .go files live under
      # sdk/go/** and examples/collector-extensions/**, and while the trigger
      # read "go/**" a PR touching only those passed `make pre-pr` and first
      # failed in CI's verify-contracts job (#5535). Keyed on *.go rather than
      # a directory list so a future top-level Go directory is covered the day
      # it is added; this also stops a non-Go change under go/ (a README, a
      # fixture) from selecting a gate that would not inspect it.
      - "**/*.go"
    local:
      command: "bash scripts/verify-license-header.sh"
      test_command: "bash scripts/test-verify-license-header.sh"
    ci:
      workflow: test.yml
      job: "verify-contracts"
    requirements:
      - go
    ci_only_reason: ""

