# CI gate registry — single source of truth mapping changed paths to local/CI gates.
# Version: v1
# See docs/public/reference/local-testing.md for usage.
# Managed by: scripts/verify-ci-gates-registry.sh (validate)
#             scripts/dev/select-gates.sh (select)
#             scripts/dev/run-selected-gates.sh (run)

version: v1

# Repository-owned mirror of the active main ruleset. The two Go umbrellas stay
# required during rollout; required-gates-complete is the trusted default-branch
# status publisher that aggregates every path-selected blocking gate below.
required_status_checks:
  - context: go-core-complete
    workflow: test.yml
    job: go-core-complete
    integration_id: 15368
    aggregates_blocking_gates: false
  - context: go-race-complete
    workflow: test.yml
    job: go-race-complete
    integration_id: 15368
    aggregates_blocking_gates: false
  - context: required-gates-complete
    workflow: required-gates.yml
    job: aggregate
    source_workflow: Build Test
    integration_id: 15368
    aggregates_blocking_gates: true

gate_fragments:
  - ci-gates.d/gates-01.yaml
  - ci-gates.d/gates-02.yaml
  - ci-gates.d/gates-03.yaml
  - ci-gates.d/gates-04.yaml
  - ci-gates.d/gates-05.yaml
  - ci-gates.d/gates-06.yaml
  - ci-gates.d/gates-07.yaml
  - ci-gates.d/gates-08.yaml
  - ci-gates.d/gates-09.yaml
  - ci-gates.d/gates-10.yaml
  - ci-gates.d/gates-11.yaml
  - ci-gates.d/gates-12.yaml
  - ci-gates.d/gates-13.yaml
  - ci-gates.d/gates-14.yaml
  - ci-gates.d/gates-15.yaml

hygiene_hooks:
  - id: codex-spawn-guard
    reason: "pre-commit mirror of the agent-canon Codex spawn guard test, also run locally and in CI"
  - id: goal-role-routing
    reason: "pre-commit mirror of agent-canon goal router behavior, also run in the local test command and CI hygiene workflow"
  - id: no-ai-attribution-message
    reason: "commit-msg-stage variant of the no-ai-attribution gate (same check, different stage)"
  - id: frontend-format-staged
    reason: "staged-file variant of frontend-format-changed (same prettier check, pre-commit stage)"
  - id: frontend-format-verifier-tests
    reason: "self-test of the frontend-format verifier + hook wiring"
  - id: docs-build-staged
    reason: "staged-file variant of docs-build-changed (same mkdocs check, pre-commit stage)"
  - id: docs-build-verifier-tests
    reason: "self-test of the docs-build verifier + hook wiring"
  - id: console-e2e-verifier-tests
    reason: "self-test of the console-e2e pre-push helper routing"
  - id: naming-glue-gate
    reason: "model-judged glued-compound directory name check (naming.md rule 3); pre-commit-only by design -- see go/cmd/naming-glue-gate/AGENTS.md for why it does not also run (and re-bill) in CI on every push of an already-locally-checked branch"

# ─── NON-GATE WORKFLOWS ──────────────────────────────────────────────────────
# .github/workflows/*.yml files that are deliberately NOT PR gates (deploy,
# release, scheduled-refresh, on-demand, or bot workflows). Each must exist on
# disk; the drift check fails on a stale entry or an unregistered workflow.
non_gate_workflows:
  - file: main-health.yml
    reason: "post-merge watcher on main (workflow_run + 6h schedule) that files the main-is-red issue and status; its script is gated by main-health-watcher, the workflow itself is not a PR gate"
  - file: bench.yml
    reason: "advisory perf benchmark + regression (BENCH_REGRESSION_ENFORCE=false); not a credential-free local-parity gate"
  - file: bench-baseline-refresh.yml
    reason: "scheduled benchmark-baseline refresh, not a PR gate"
  - file: build.yml
    reason: "release-binary build/publish; PR compile coverage is the go-build gate via test.yml"
  - file: deploy-root-docs.yml
    reason: "docs site deploy, not a PR gate"
  - file: generate-bundle-on-demand.yml
    reason: "on-demand/dispatch bundle generation, not a PR gate"
  - file: post_discord_invite.yml
    reason: "Discord invite bot post, not a review gate"
  - file: refresh-cassettes.yml
    reason: "scheduled/manual cassette refresh, not a PR gate"
