    #
    # The -run list is hand-maintained, so a new gate test in that package is
    # not run here until it is named. TestEveryProjectorLabelHasASource (#6206)
    # walks projector -> bucket, the reverse of
    # TestContentEntityLabelsHaveProjectorLabels, and catches a registry entry
