# CI gate registry — single source of truth mapping changed paths to local/CI gates.
# Version: v1
# See docs/public/reference/local-testing.md for usage.
# Managed by: scripts/verify-ci-gates-registry.sh (validate)
#             scripts/dev/select-gates.sh (select)
#             scripts/dev/run-selected-gates.sh (run)

version: v1

# Repository-owned mirror of the active main ruleset. The two Go umbrellas stay
# required during rollout; required-gates-complete is the trusted default-branch
# status publisher that aggregates every path-selected blocking gate below.
required_status_checks:
  - context: go-core-complete
    workflow: test.yml
    job: go-core-complete
    integration_id: 15368
    aggregates_blocking_gates: false
  - context: go-race-complete
    workflow: test.yml
    job: go-race-complete
    integration_id: 15368
    aggregates_blocking_gates: false
  - context: required-gates-complete
    workflow: required-gates.yml
    job: aggregate
    source_workflow: Build Test
    integration_id: 15368
    aggregates_blocking_gates: true

gates:

  # ─── HYGIENE / GO CORE ─────────────────────────────────────────────────────

  - id: go-fmt
    name: Go gofumpt formatting
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
      - "scripts/dev/precommit-go.sh"
    local:
      command: "bash scripts/dev/precommit-go.sh fmt-all"
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-fmt

  - id: go-lint
    name: Go lint (golangci-lint)
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
      - "scripts/dev/precommit-go.sh"
    local:
      command: "bash scripts/dev/precommit-go.sh lint-all"
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-lint

  - id: go-build
    name: Go build (all binaries)
    category: build
    tier: pre-push
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "cd go && go build ./..."
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: go-vet
    name: Go vet
    category: hygiene
    tier: pre-push
    blocking: true
    triggers:
      - "go/**"
    local:
      command: "cd go && go vet ./..."
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""

  - id: go-file-cap
    name: Go 500-line file cap
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
      - "scripts/dev/precommit-go.sh"
      - "scripts/test-precommit-go-filecap.sh"
      - "scripts/lib/test-precommit-go-filecap-cases.sh"
      # The Go plugin is the AUTHORITY the two bash variants mirror, and
      # tools/golangci-lint-filelength/skip_parity_test.go is what actually
      # compares them: it runs the plugin's skip() and the bash side (via
      # `precommit-go.sh filecap-skip`) over the same paths and fails when they
      # disagree. Before that test existed this trigger only re-ran a
      # bash-against-bash test, which is how the changed-files `filecap` variant
      # ended up rejecting long _test.go files that CI passed (#6104) with
      # nothing catching it.
      - "tools/golangci-lint-filelength/**"
    self_test_triggers:
      - "scripts/dev/precommit-go.sh"
      - "scripts/test-precommit-go-filecap.sh"
      - "scripts/lib/test-precommit-go-filecap-cases.sh"
      - "tools/golangci-lint-filelength/**"
    local:
      command: "bash scripts/dev/precommit-go.sh filecap-all"
      # Half of this test_command now runs in CI and half does not, and the
      # split is deliberate. The plugin-module half (skip_parity_test.go, the
      # regression guard for the #6104 plugin-vs-bash drift) runs in test.yml's
      # go-core job via the "Test golangci-lint filelength plugin" step, because
      # a guard that only fires locally cannot stop the drift it exists to catch.
      # The shell half (test-precommit-go-filecap.sh) runs only under the local
      # runner (`make pre-pr` selects go-file-cap on a go/** change). That is the
      # existing convention, not an oversight. The closest precedent is
      # scripts/test-precommit-console.sh, the harness this one was modelled on:
      # a test_command names it here and nothing under .github/workflows/ ever
      # runs it. Six more are wired the same way. To re-derive that: pull every
      # scripts/*.sh token out of the test_command values in this file and
      # sort -u them (65 paths at this commit -- re-derive it rather than
      # trusting this number, it has gone stale twice), then rg each one under
      # .github/workflows/ -- 8 come back with no hit, the same 8 whether you
      # search the basename or the full path. CI still enforces the cap itself
      # through the golangci-lint plugin. What CI does not check is whether the
      # two bash variants still mirror that plugin.
      test_command: "bash scripts/test-precommit-go-filecap.sh && cd tools/golangci-lint-filelength && env -u GOROOT go test -count=1 ."
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-file-cap

  - id: go-dir-gate
    name: Go directory-size and naming gate
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**"
      - "scripts/dev/precommit-go.sh"
      - "scripts/verify-dirgate.sh"
      # Glob, not the four-or-so exact paths this used to list. Every dirgate
      # file under scripts/lib/ is part of this gate: the core implementation,
      # both pinned ledgers, and the case files scripts/test-verify-dirgate.sh
      # sources. Listing them individually is what let the ledgers fall out of
      # their own gate's trigger list once already, and the same thing happened
      # again the moment the test suite was split into per-area case files --
      # editing one reported "SKIPPED go-dir-gate: no trigger matched changed
      # paths" (#6054 review finding). A glob cannot drift as files are added.
      - "scripts/lib/*dirgate*"
      - "scripts/test-verify-dirgate.sh"
      - "scripts/generate-dirgate-grandfather-go.sh"
      - "scripts/test-generate-dirgate-grandfather-go.sh"
      - "tools/golangci-lint-dirgate/**"
    self_test_triggers:
      - "scripts/dev/precommit-go.sh"
      - "scripts/verify-dirgate.sh"
      - "scripts/lib/*dirgate*"
      - "scripts/test-verify-dirgate.sh"
      - "scripts/generate-dirgate-grandfather-go.sh"
      - "scripts/test-generate-dirgate-grandfather-go.sh"
      - "tools/golangci-lint-dirgate/**"
    local:
      command: "bash scripts/dev/precommit-go.sh dirgate-all"
      test_command: "bash scripts/test-verify-dirgate.sh && bash scripts/test-generate-dirgate-grandfather-go.sh"
    ci:
      workflow: test.yml
      job: "go-core"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-dir-gate

  - id: markdown-file-cap
    name: Markdown 500-line file cap (go/)
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      - "go/**/*.md"
      - "scripts/verify-markdown-line-cap.sh"
      - "scripts/test-verify-markdown-line-cap.sh"
      # Glob, for the reason go-dir-gate globs its own lib files: the core
      # implementation, the pinned ledger, and the two case files the test
      # mirror sources all live under scripts/lib/ and all belong to this
      # gate. Listing them individually is what let the dirgate ledgers fall
      # out of their own gate's trigger list twice (#6054 review finding); a
      # glob cannot drift as files are added.
      - "scripts/lib/*markdown-line-cap*"
    self_test_triggers:
      - "scripts/verify-markdown-line-cap.sh"
      - "scripts/test-verify-markdown-line-cap.sh"
      - "scripts/lib/*markdown-line-cap*"
    local:
      command: "bash scripts/verify-markdown-line-cap.sh --all"
      test_command: "bash scripts/test-verify-markdown-line-cap.sh"
    ci:
      workflow: test.yml
      job: "verify-contracts"
    # No `go` requirement, unlike go-file-cap and go-dir-gate: this gate is
    # pure bash plus `git ls-files`. The Go cap needs a toolchain because its
    # CI half is a golangci-lint plugin; Markdown has no such plugin, which is
    # exactly why #6187 needed a separate checker rather than a setting.
    requirements: []
    ci_only_reason: ""
    hook_id: markdown-file-cap

  - id: package-docs
    name: Go package docs coverage
    category: hygiene
    tier: pre-pr
    blocking: true
    triggers:
      - "go/**"
      - "scripts/test-verify-package-docs.sh"
      - "scripts/verify-package-docs.sh"
    self_test_triggers:
      - "scripts/test-verify-package-docs.sh"
      - "scripts/verify-package-docs.sh"
    local:
      command: "bash scripts/verify-package-docs.sh"
      test_command: "bash scripts/test-verify-package-docs.sh"
    ci:
      workflow: test.yml
      job: "verify-contracts"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: go-package-docs

  - id: agent-canon
    name: Agent canon check
    category: hygiene
    tier: pre-pr
    blocking: true
    triggers:
      - "go/**"
      - ".agents/**"
      - ".claude/skills/**"
      - ".codex/skills/**"
      # verify-agent-canon.sh reads .claude/hooks/skill-nudge.sh to prove every
      # skill is reachable from a routing arm. Without this trigger a hook-only
      # edit would not select the gate that validates it, which is the same
      # silent rot the check exists to catch.
      - ".claude/hooks/**"
      # settings.json for the same reason: test-agent-hooks.sh asserts the
      # (event, matcher, command) triple in it, so a wiring-only edit -- moving
      # a hook to the wrong event -- must select the gate that would catch it.
      - ".claude/settings.json"
      - ".opencode/agent/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/verify-agent-canon.sh"
      - "scripts/test-verify-agent-hygiene.sh"
      - "scripts/test-agent-hooks.sh"
      - "scripts/test-goal-*cases*.sh"
      - "scripts/test-goal-continue-hook.sh"
      # The Stop-hook mirror's later suites live in a sourced companion file,
      # so it is a trigger path in its own right -- otherwise deleting a case
      # from it would not select the gate that runs it.
      - "scripts/test-goal-continue-hook-cases.sh"
      # The Stop mirror's budget suite, split out when its sibling crossed the
      # 500-line cap. Trigger path for the same reason as every companion.
      - "scripts/test-goal-continue-hook-budget-cases.sh"
      - "scripts/test-goal-refresh-hook.sh"
      # Same reason as the Stop mirror's companion above: the refresh mirror's
      # later suites are sourced from their own file, which must select this
      # gate on its own.
      - "scripts/test-goal-refresh-hook-cases.sh"
      # The refresh mirror needed a second companion when the first crossed the
      # 500-line cap; it is a trigger path for the same reason as its sibling.
      - "scripts/test-goal-refresh-hook-guard-cases.sh"
      # The cross-hook parity matrix: both hooks parse the same goal-file
      # format, and two PR reviewers found them disagreeing on check ORDER
      # after eleven rounds of per-hook review. It is a trigger path so
      # editing it alone selects the gate that runs it.
      - "scripts/test-goal-refresh-hook-parity-cases.sh"
      # The workflow itself, so removing a test STEP selects the gate
      # that asserts the step is there. Without this a workflow-only
      # edit re-opens the local/CI parity gap silently.
      - ".github/workflows/verify-agent-hygiene.yml"
      - ".pre-commit-config.yaml"
      - "scripts/verify-no-ai-attribution.sh"
      - "specs/ci-gates.v1.yaml"
    self_test_triggers:
      - ".agents/**"
      - ".claude/skills/**"
      - ".codex/skills/**"
      - ".claude/hooks/**"
      - ".claude/settings.json"
      - ".opencode/agent/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/verify-agent-canon.sh"
      - "scripts/test-verify-agent-hygiene.sh"
      - "scripts/test-agent-hooks.sh"
      - "scripts/test-goal-*cases*.sh"
      - "scripts/test-goal-continue-hook.sh"
      - "scripts/test-goal-continue-hook-cases.sh"
      - "scripts/test-goal-continue-hook-budget-cases.sh"
      - "scripts/test-goal-refresh-hook.sh"
      - "scripts/test-goal-refresh-hook-cases.sh"
      - "scripts/test-goal-refresh-hook-guard-cases.sh"
      - "scripts/test-goal-refresh-hook-parity-cases.sh"
      - ".github/workflows/verify-agent-hygiene.yml"
      - ".pre-commit-config.yaml"
      - "scripts/verify-no-ai-attribution.sh"
      - "specs/ci-gates.v1.yaml"
    local:
      command: "bash scripts/verify-agent-canon.sh"
      # Both mirrors. .claude/hooks/** is a trigger for this gate, so a hook
      # change selects it -- but running only the canon mirror would skip the
      # behavioural hook suite, and an exit-code or routing regression would
      # first appear in Actions despite being credential-free.
      test_command: "bash scripts/test-verify-agent-hygiene.sh && bash scripts/test-agent-hooks.sh && bash scripts/test-goal-continue-hook.sh && bash scripts/test-goal-refresh-hook.sh"
    ci:
      workflow: verify-agent-hygiene.yml
      job: "Agent hygiene gate"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: agent-canon

  - id: no-diff-fragments
    name: No diff fragments or conflict markers in source
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      # Tree mode scans every tracked file, so any non-empty PR must wait for
      # it. The corruption this catches lands in a file the PR need not touch
      # -- it is introduced at commit time on the author machine -- so a
      # path-scoped trigger would miss exactly the case it exists for (#5612).
      - "**"
    local:
      command: "bash scripts/verify-no-diff-fragments.sh"
      test_command: "bash scripts/test-verify-no-diff-fragments.sh"
    ci:
      # Runs in verify-agent-hygiene.yml's gate job alongside agent-canon and
      # the AI-attribution check; same workflow, same job, one more step.
      workflow: verify-agent-hygiene.yml
      job: "Agent hygiene gate"
    requirements: []
    ci_only_reason: ""
    hook_id: no-diff-fragments

  - id: no-ai-attribution
    name: No AI attribution in commits/docs
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      # The CI check scans every commit message and every added diff line, so
      # required-gate selection must wait for it on every non-empty PR.
      - "**"
    local:
      command: "bash scripts/verify-no-ai-attribution.sh"
      test_command: ""
    ci:
      # The AI-attribution check runs in verify-agent-hygiene.yml's "No AI
      # attribution" step, not in test.yml's docs-helm-hygiene job, which has
      # no such step. Matches the sibling agent-canon gate in the same
      # workflow (#5748).
      workflow: verify-agent-hygiene.yml
      job: "Agent hygiene gate"
    requirements:
      - go
    ci_only_reason: ""
    hook_id: no-ai-attribution-content

  - id: license-header
    name: Go license header verification
    category: hygiene
    tier: pre-commit
    blocking: true
    triggers:
      # Must match the scope verify-license-header.sh actually scans -- every
      # .go file in the repo, not only go/**. 312 tracked .go files live under
      # sdk/go/** and examples/collector-extensions/**, and while the trigger
      # read "go/**" a PR touching only those passed `make pre-pr` and first
      # failed in CI's verify-contracts job (#5535). Keyed on *.go rather than
      # a directory list so a future top-level Go directory is covered the day
      # it is added; this also stops a non-Go change under go/ (a README, a
      # fixture) from selecting a gate that would not inspect it.
      - "**/*.go"
      - "scripts/test-verify-license-header.sh"
      - "scripts/verify-license-header.sh"
      - "scripts/add-license-header.sh"
    self_test_triggers:
      - "scripts/test-verify-license-header.sh"
      - "scripts/verify-license-header.sh"
      - "scripts/add-license-header.sh"
    local:
      command: "bash scripts/verify-license-header.sh"
      test_command: "bash scripts/test-verify-license-header.sh"
    ci:
      workflow: test.yml
      job: "verify-contracts"
    requirements:
      - go
    ci_only_reason: ""

  - id: ci-install-apt-packages
    name: CI apt/ripgrep installer test mirror
    category: hygiene
    tier: pre-pr
    blocking: true
    triggers:
      - "scripts/ci/install-apt-packages.sh"
      - "scripts/test-ci-install-apt-packages.sh"
      # The fixtures/assertion-helper lib is a trigger for the same reason as
      # the mirror itself: the mirror sources it, so a change confined to
      # this file changes what the gate actually exercises even though the
      # mirror's own file did not change. A gate must trigger on the files it
      # reads (#6174 review).
      - "scripts/lib/test-ci-install-apt-packages-fixtures.sh"
      # The workflow is a trigger because the mirror asserts its own CI
      # wiring. Seven gates share test.yml's go-core job, and the registry
      # drift check skips per-gate CI attribution for a shared bucket, so
      # deleting the step that runs this mirror would otherwise leave every
      # check green while CI stopped enforcing the installer's guards. Without
      # this trigger a workflow-only edit does not select the gate, and the
      # assertion never runs in exactly the case it exists for.
      - ".github/workflows/test.yml"
      # This registry file is this gate's other CI-wiring assertion input:
      # test_mirror_is_wired_into_ci reads BOTH .github/workflows/test.yml and
      # this file (it checks the registry references the mirror, the same way
      # it checks the workflow runs it). A registry-only edit that drops or
      # breaks that reference must select this gate for the same reason the
      # workflow does.
      - "specs/ci-gates.v1.yaml"
    local:
      # install-apt-packages.sh has no separate "verify" mode of its own --
      # it is an installer (it downloads a pinned ripgrep release, verifies
      # its checksum, and installs it, or shells out to apt-get for anything
      # else), and running it for real would mutate the machine it runs on
      # (system-wide /usr/local/bin writes, sudo, apt-get). The 34-assertion
      # test mirror IS this gate's verification: it drives the same code
      # paths (bounded-transfer curl flags, fail-closed checksum verify,
      # arch-support guard, apt fallback) hermetically, off the network,
      # via ESHU_CI_APT_RIPGREP_URL file:// fixtures and
      # ESHU_CI_APT_SKIP_INSTALL/ESHU_CI_APT_NO_SUDO. Mirrors the
      # golden-corpus-mirror gate's shape (a static/hermetic mirror gate
      # whose `local.command` IS the test script, with no separate
      # test_command) rather than the usual real-command/test-command split
      # every other gate uses, because there is no non-mutating "real"
      # command to pair it with.
      command: "bash scripts/test-ci-install-apt-packages.sh"
      test_command: ""
    ci:
      workflow: test.yml
      job: "go-core"
    requirements: []
    ci_only_reason: ""

  # ─── EXACTNESS / CONTRACT ──────────────────────────────────────────────────

  - id: openapi-surface
    name: Verify OpenAPI Surface
    category: exactness
    tier: pre-pr
    blocking: true
    triggers:
      - "go/internal/query/**"
      - "go/internal/mcp/**"
      - "go/internal/serviceintelhttp/**"
      - "specs/surface-inventory.v1.yaml"
      - "specs/capability-catalog.v1.yaml"
      - "specs/capability-matrix.v1.yaml"
      - "scripts/lib/*verify-openapi*.sh"
      - ".github/openapi-known-drift.txt"
      - "scripts/test-verify-openapi.sh"
      - "scripts/test-verify-openapi-subpackage.sh"
      - "scripts/verify-openapi.sh"
    self_test_triggers:
      - "scripts/lib/*verify-openapi*.sh"
      - "scripts/test-verify-openapi.sh"
      - "scripts/test-verify-openapi-subpackage.sh"
      - "scripts/verify-openapi.sh"
    local:
      command: "bash scripts/verify-openapi.sh"
      test_command: "bash scripts/test-verify-openapi.sh && bash scripts/test-verify-openapi-subpackage.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify OpenAPI gate"
    requirements:
      - go
    ci_only_reason: ""

  - id: route-coverage
    name: Verify Route Coverage
    category: exactness
    tier: pre-pr
    blocking: true
    triggers:
      - "go/internal/query/**"
      - "go/cmd/api/**"
      - "scripts/test-verify-route-coverage.sh"
      - "scripts/verify-route-coverage.sh"
    self_test_triggers:
      - "scripts/test-verify-route-coverage.sh"
      - "scripts/verify-route-coverage.sh"
    local:
      command: "bash scripts/verify-route-coverage.sh"
      test_command: "bash scripts/test-verify-route-coverage.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify route coverage gate"
    requirements:
      - go
    ci_only_reason: ""

  - id: edge-source-tool-coverage
    name: Verify Edge Source-Tool Coverage
    category: exactness
    tier: pre-pr
    blocking: true
    triggers:
      - "go/internal/relationships/**"
      - "go/internal/collector/**"
      - "go/internal/reducer/crossrepo/cross_repo_evidence_type.go"
      - "specs/surface-inventory.v1.yaml"
      - "scripts/test-verify-edge-source-tool-coverage.sh"
      - "scripts/verify-edge-source-tool-coverage.sh"
    self_test_triggers:
      - "scripts/test-verify-edge-source-tool-coverage.sh"
      - "scripts/verify-edge-source-tool-coverage.sh"
      - "go/internal/reducer/crossrepo/cross_repo_evidence_type.go"
    local:
      command: "bash scripts/verify-edge-source-tool-coverage.sh"
      test_command: "bash scripts/test-verify-edge-source-tool-coverage.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify edge source-tool coverage gate"
    requirements:
      - go
    ci_only_reason: ""

  - id: evidence-continuity
    name: Verify Evidence Continuity
    category: exactness
    tier: pre-pr
    blocking: true
    # The triggers cover every package the spec's `go test` proof refs name,
    # every file the validator reads -- the contract spec, the capability matrix
    # and its fragments, the generated surface inventory, and this registry plus
    # the workflow that carries the gate's path filter -- and every package the
    # validator is built from: its own, plus internal/cigates, whose MatchGlob
    # and DornyFilters decide what the trigger check below reports.
    # Before #6131 the go/ triggers were disjoint from the referenced set, so
    # renaming a referenced test never selected this gate and CI on unrelated
    # PRs was the first place the stale ref failed. The validator now asserts
    # this coverage itself (gate_trigger_gap in go/internal/evidencecontinuity),
    # so a spec edit that references an uncovered package fails this gate
    # instead of creating a new blind spot.
    triggers:
      - ".github/workflows/static-contract-gates.yml"
      - "specs/ci-gates.v1.yaml"
      - "specs/evidence-continuity.v1.yaml"
      - "specs/capability-matrix.v1.yaml"
      - "specs/capability-matrix/**"
      - "go/cmd/eshu/**"
      - "go/internal/capabilitycatalog/**"
      - "go/internal/cigates/**"
      - "go/internal/cli/**"
      - "go/internal/collector/**"
      - "go/internal/evidencecontinuity/**"
      - "go/internal/facts/**"
      - "go/internal/mcp/**"
      - "go/internal/query/**"
      - "go/internal/relationships/**"
      - "scripts/test-verify-evidence-continuity.sh"
      - "scripts/verify-evidence-continuity.sh"
    local:
      command: "bash scripts/verify-evidence-continuity.sh"
      test_command: "bash scripts/test-verify-evidence-continuity.sh"
    ci:
      workflow: static-contract-gates.yml
      job: "Verify evidence continuity gate"
    requirements:
      - go
    ci_only_reason: ""

  - id: skill-roundtrip
    name: Verify Skill Roundtrip
    category: exactness
    tier: pre-pr
    blocking: true
    triggers:
      - "go/cmd/skillgen/**"
      # The package is under internal/extensions/; the previous
      # internal/skillgen/** never matched a real path, so edits to the
      # adapters did not select the gate that guards them (#4059).
      - "go/internal/extensions/skillgen/**"
      - ".agents/skills/**"
      # The gate compares fragments against the committed baseline, so a
