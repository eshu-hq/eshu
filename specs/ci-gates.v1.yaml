      job: "Generate Go code coverage report"
    requirements:
      - go
    ci_only_reason: ""

  - id: e2e-tests
    name: End-to-end tests (Docker stack)
    category: exactness
    tier: ci-heavy
    blocking: true
    triggers:
      - "go/**"
      - "docker-compose*.yaml"
      - "docker-compose*.yml"
      - "scripts/verify_backend_conformance_live.sh"
    ci:
      workflow: e2e-tests.yml
      job: "test"
      check_names:
        - "test (nornicdb)"
        - "test (neo4j)"
    requirements:
