# Frozen synchronize applicability before central PR scheduling (#8847).
schema_version: 1
workflows:
- file: docker-publish.yml
  name: Publish Image
  synchronize: true
  branches:
  - main
  paths:
  - scripts/ci/build-reproducibility-image.sh
  - specs/ci-images.v1.json
  - Dockerfile
  - .dockerignore
  - .github/workflows/docker-publish.yml
  - scripts/ci/select-docker-publish-lanes.sh
  - scripts/verify-apk-floors.sh
  - scripts/test-verify-apk-floors.sh
  - scripts/fixtures/apk-floors/**
  - scripts/verify-runtime-image-tools.sh
  - scripts/test-verify-runtime-image-tools.sh
  - scripts/verify-scanner-images.sh
  - scripts/test-verify-scanner-images.sh
  - scripts/lib/rootfs-resolve.sh
  - scripts/verify-scanner-digest-pins.sh
  - scripts/test-verify-scanner-digest-pins.sh
  - scripts/ci/go-install-retry.sh
  - go/internal/collector/scannerworker/component/manifest.go
  - go/internal/collector/scannerworker/component/manifest_test.go
  - go/internal/collector/scannerworker/**
  - specs/ci-pr-workflows.d/docker-publish.yml
  jobs:
  - attach-release-sbom
  - build-and-push-image
  - build-and-push-scanner-images
  - changes
  - promote-moving-tags
  - publish-ci-service-mirrors
  - verify-apk-floors
  - verify-public-ci-service-mirrors
  - verify-reproducibility
  - verify-scanner-digest-pins
  job_names:
    build-and-push-scanner-images: Build and push scanner-${{ matrix.component }}
