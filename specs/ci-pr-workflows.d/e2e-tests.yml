# Frozen synchronize applicability before central PR scheduling (#8847).
schema_version: 1
workflows:
- file: e2e-tests.yml
  name: End-to-end Tests
  synchronize: true
  branches:
  - main
  paths:
  - scripts/ci/compose.sh
  - scripts/lib/ci-image-compose.sh
  - scripts/lib/ci_image_compose.py
  - scripts/lib/ci_image_compose_signature.py
  - specs/ci-images.v1.json
  - go/**
  - docker-compose*.yaml
  - docker-compose*.yml
  - deploy/**
  - scripts/verify_backend_conformance_live.sh
  - scripts/lib/nornic_conformance_events.py
  - scripts/lib/nornic_conformance_inventory.json
  - scripts/test-nornic-conformance-events.py
  - scripts/lib/verify-live-tests-ledger.py
  - scripts/lib/nornic_cli_activation_guard.py
  - scripts/test-nornic-ledger-guard-boundary.py
  - specs/live-tests.v1.yaml
  - specs/live-tests.d/**
  - specs/ci-gates.d/gates-09.yaml
  - .github/workflows/live-backend-tests.yml
  - scripts/ci/go-mod-download-retry.sh
  - .github/workflows/e2e-tests.yml
  - specs/ci-pr-workflows.d/e2e-tests.yml
  jobs:
  - queue-selection
  - test
  job_names:
    test: test (${{ matrix.graph_backend }})
