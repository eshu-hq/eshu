  - scripts/auth-mcp-e2e-runtime.mjs
  - scripts/verify-auth-mcp-e2e-sensitivity.sh
  - scripts/verify-auth-mcp-e2e-manifest.sh
  - scripts/refresh-auth-mcp-e2e-baseline.sh
  - scripts/lib/auth_mcp_e2e_sensitivity.sh
  - scripts/lib/auth_mcp_e2e_manifest.sh
  - scripts/test-verify-auth-mcp-e2e-sensitivity.sh
  - scripts/test-verify-auth-mcp-e2e-manifest.sh
  - docker-compose.e2e.mutation.yaml
  - testdata/golden/auth-mcp-e2e-baseline.json
  - go/cmd/mock-github/**
  - go/cmd/mcp-server/**
  - go/internal/oidcbearer/**
  - go/internal/githublogin/**
  - go/internal/query/**
  - go/internal/mcp/**
  jobs:
  - audit
  - auth-mcp-e2e
  - auth-sso-e2e
  - console
  - console-a11y
  - format
  - lint
  - marketing-site
  - queue-selection
  job_names:
    audit: npm audit (fail on high/critical)
    auth-mcp-e2e: MCP-identity auth E2E (browser + scripted OAuth, fresh stack)
    auth-sso-e2e: SSO auth E2E (browser, fresh stack)
    console: Console (apps/console)
    console-a11y: Console a11y audit (axe-core)
    format: 'Prettier format check (issue #3763)'
    lint: 'ESLint flat config (issue #3763)'
    marketing-site: Marketing site (root Vite)
