  - scripts/lib/console-retained-create-proof-schema.sql
  - scripts/lib/console-retained-verify-public-identity.sql
  - scripts/console-bundle-budget.mjs
  - scripts/console-bundle-budget.d.mts
  - scripts/console-bundle-report.mjs
  - scripts/console-bundle-report.d.mts
  - .pre-commit-config.yaml
  - .github/workflows/frontend.yml
  - scripts/lib/auth_e2e_cli.sh
  - scripts/test-auth-e2e-cli.sh
  - scripts/run-auth-e2e.sh
  - scripts/ci/go-mod-download-retry.sh
  - scripts/console-auth-e2e-runtime.mjs
  - docker-compose.e2e.yaml
  - docker-compose.neo4j.yml
  - docker-compose.yaml
  - Dockerfile
  - go/cmd/mock-oidc-idp/**
