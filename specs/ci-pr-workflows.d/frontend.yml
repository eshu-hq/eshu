  - scripts/lib/ci_image_compose.py
  - scripts/lib/ci_image_compose_signature.py
  - specs/ci-images.v1.json
  - src/**
  - apps/console/**
  - index.html
  - package.json
  - package-lock.json
  - vite.config.ts
  - tsconfig*.json
  - wrangler.jsonc
  - .nvmrc
  - CLOUDFLARE_PAGES.md
  - scripts/marketing-review.mjs
  - scripts/marketing-review-runtime.mjs
  - scripts/marketing-review-runtime.test.mjs
  - public/**
  - eslint.config.js
  - .prettierrc.json
  - .prettierignore
  - tests/lint-fixture/**
  - scripts/test-eslint-config.sh
  - scripts/verify-eslint-config.sh
  - scripts/test-verify-frontend-format-changed.sh
