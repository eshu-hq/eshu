  - live-backend
  - live-backend-shards
  - static-mirror
  job_names:
    live-backend: live-backend (nornicdb and neo4j)
    live-backend-shards: live-backend shard (${{ matrix.shard }}/4)
    static-mirror: static-mirror (ledger and runner probes)
