# Frozen synchronize applicability before central PR scheduling (#8847).
schema_version: 1
workflows:
- file: payload-usage-manifest.yml
  name: Payload Usage Manifest
  synchronize: true
  paths:
  - go/internal/reducer/**
  - go/internal/query/**
  - go/internal/projector/**
  - go/internal/storage/postgres/**
  - go/internal/relationships/**
  - go/internal/replay/**
  - sdk/go/factschema/**
  - go/internal/payloadusage/**
  - go/cmd/payload-usage-manifest/**
  - scripts/*verify-payload-usage-manifest*.sh
  - scripts/lib/ci-gates-resolved-fixtures.sh
  - scripts/ci/install-apt-packages.sh
  - scripts/ci/go-mod-download-retry.sh
  - .github/workflows/payload-usage-manifest.yml
  - specs/ci-pr-workflows.d/payload-usage-manifest.yml
  jobs:
  - gate
  - test-mirror
  job_names:
    gate: Verify payload-usage-manifest gate
    test-mirror: Verify payload-usage-manifest test mirror
