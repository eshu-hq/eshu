# Frozen synchronize applicability before central PR scheduling (#8847).
schema_version: 1
workflows:
- file: read-api-latency-gate.yml
  name: Read API Latency Gate
  synchronize: true
  branches:
  - main
  paths:
  - scripts/ci/compose.sh
  - scripts/lib/ci-image-compose.sh
  - scripts/lib/cgo-cflags.sh
  - scripts/lib/ci_image_compose.py
  - scripts/lib/ci_image_compose_signature.py
  - specs/ci-images.v1.json
  - go/**
  - testdata/benchmarks/read-api-route-budgets.txt
  - testdata/benchmarks/read-api-route-work-budgets.txt
  - scripts/verify-read-api-latency-gate.sh
  - scripts/lib/status-diagnostic-runner.sh
  - scripts/lib/status_diagnostic_artifacts.py
  - scripts/lib/status_diagnostic_resources.py
  - scripts/test-status-diagnostic-artifacts.py
  - scripts/test-status-diagnostic-resources.py
  - scripts/test-status-diagnostic-runner.sh
  - scripts/refresh-read-api-work-budgets.sh
  - scripts/test-refresh-read-api-work-budgets.sh
  - scripts/extend-read-api-work-budgets.sh
  - scripts/test-extend-read-api-work-budgets.sh
  - scripts/test-methodology-scale-resource-observer.sh
  - scripts/lib/test-methodology-scale-resource-observer-*.sh
  - scripts/compare-backend-latency.sh
  - scripts/test-compare-backend-latency.sh
  - scripts/lib/test-compare-backend-latency-report.json
  - scripts/lib/live-gate-lock.sh
  - scripts/lib/golden-corpus-host-helpers.sh
  - scripts/lib/compose_verification_runtime_common.sh
  - scripts/ci/install-apt-packages.sh
  - scripts/ci/go-mod-download-retry.sh
  - docker-compose.yaml
  - docker-compose.read-api-latency-gate.yaml
  - .github/workflows/read-api-latency-gate.yml
  - specs/ci-pr-workflows.d/read-api-latency-gate.yml
  # Markdown prose is never compiled or executed: a markdown-only change must
  # not select the latency gate. Appended last so every positive entry above
  # keeps precedence for non-markdown paths (last match wins).
  - '!**/*.md'
  # Lockstep re-includes: asserted test inputs stay code even though they
  # are markdown. Appended last so they win over the exclusion above
  # (last match wins); keep sorted, mirror specs/ci-docs-lockstep-paths.txt.
  - go/cmd/README.md
  - go/cmd/audit-preflight/testdata/codegraphcontext-already-tracked.md
  - go/cmd/audit-preflight/testdata/gitnexus-missing.md
  - go/cmd/audit-preflight/testdata/graphify-foundation-exists.md
  - go/cmd/audit-preflight/testdata/incomplete.md
  - go/cmd/collector-vault-live/testdata/8869-collector-vault-live-census.md
  - go/cmd/eshu/cli_extraction_inventory.md
  - go/cmd/ifa/README.md
  - go/cmd/scanner-worker/EXTRACTION_PREP.md
  - go/internal/ask/catalog/README.md
  - go/internal/cli/demo/README.md
  - go/internal/cli/hookpreflight/AGENTS.md
  - go/internal/cli/hookpreflight/README.md
  - go/internal/collector/README.md
  - go/internal/collector/sbom/SHIM_MAP.md
  - go/internal/content/artifacts/README.md
  - go/internal/facts/FACT_KIND_REGISTRIES.md
  - go/internal/ifa/README.md
  - go/internal/ifa/materializededges/README.md
  - go/internal/ifa/testdata/5998-rationale-relative-path.md
  - go/internal/query/repository/README.md
  - go/internal/reducer/AGENTS.md
  - go/internal/reducer/README.md
  - go/internal/reducer/testdata/5998-rationale-relative-path.md
  - go/internal/runtime/README.md
  - go/internal/runtime/testdata/8894-component-extension-activations.md
  jobs:
  - latency-gate
  - methodology-scale
  - queue-selection
  - static-mirror
  - static-mirror-backend-latency-compare
  job_names:
    latency-gate: latency-gate (nornicdb)
    methodology-scale: methodology scale (neo4j)
    static-mirror: static-mirror (work budget refresh)
    static-mirror-backend-latency-compare: static-mirror (backend latency comparator)
