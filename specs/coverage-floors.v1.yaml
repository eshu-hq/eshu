# Code-coverage ratchet floors (Refs eshu-hq/eshu#10983, part of #9315).
# GENERATED from a whole-module coverage profile; refresh entries only from
# a full `go test ./... -covermode=count` profile on origin/main, never by hand.
#
# Policy:
# - whole_module_floor is the published canonical baseline (see
#   docs/public/reference/code-coverage.md). The scheduled coverage job fails
#   below it. Raise it toward 90 whenever main holds headroom of >= 1 point:
#   that is the rising scheduled floor. Never lower it without naming the
#   cause in the raising PR.
# - packages maps a Go import path to its no-regression floor (whole-percent,
#   floored like the canonical report). The PR-path floors job tests changed
#   packages and fails a package below its floor. A PR that lifts a package
#   SHOULD raise that floor in the same PR; a PR that legitimately drops one
#   (for example removing covered code) MUST justify the lower floor there.
# - A changed package with no entry is record-only (pass with notice): new
#   packages and zero-test-file packages gain a floor once they appear in a
#   profile. Sibling coverage lanes add tests freely; their new coverage only
#   ever raises future floors.
# - env_gated packages need ESHU_DEPLOY_CHECKOUT or a live backend and fail
#   closed without it (#10903). The hermetic PR-path floors job skips testing
#   them; their unit tests still run in the go-core lanes.
#
# Checker: scripts/verify-coverage-floors.sh (self-test:
# scripts/test-verify-coverage-floors.sh). Parser contract: `whole_module_floor:
# N` on its own line; `env_gated:` followed by `  - <path>` lines; `packages:`
# followed by `  <path>: <int>` lines sorted for stable diffs.
