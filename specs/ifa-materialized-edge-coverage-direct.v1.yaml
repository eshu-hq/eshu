# Ifá materialized-edge coverage manifest -- DIRECT-MATERIALIZATION half
# (#6181, coverage tracked by #6228, epic #5589).
#
# The sibling file specs/ifa-materialized-edge-coverage.v1.yaml is the same
# ledger for the SHARED-projection families: the reducer domains that reach the
# graph through the ordering-safe shared-projection intent path
# (reducer.MaterializedEdgeFamilies(), locked to allProjectionDomains). This
# file holds the families the reducer writes DIRECTLY -- one family per port,
# straight to a go/internal/storage/cypher writer, with no intent row in
# between (reducer.DirectMaterializedEdgeFamilies()).
#
# Both halves are loaded together by
# materializededges.LoadMaterializedEdgeLedger and reconciled by one gate. Read
# one half alone and the other half's families produce no row, no finding and
# no output -- which is exactly the blindness #6181 reported and this file
# closes.
#
# WHY A SECOND FILE. The repository caps a file at 500 lines (CLAUDE.md), and
# the sibling manifest's own footer records that its roadmap prose was moved to
# docs/internal/design/5351-ifa-materialized-edge-known-gaps.md for that reason.
# It already sits just under the cap, and every direct family below carries two
# waiver rows -- one per proof gate -- so folding them in would push it far past
# 500. Counted rather than quoted as a digit here on purpose: a number in prose
# goes stale the day a family is added, and that drift is what
# TestMaterializedEdgeFamilyCountClaimsMatchTheCode exists to catch in the
# claims it can see. Splitting also keeps each half readable on its own terms
# and mirrors the split between the two enumerations they reconcile against.
#
# THE CAP IS CONVENTION HERE, NOT ENFORCEMENT. Nothing mechanically gates the
# length of a YAML file: the 500-line cap runs from scripts/dev/precommit-go.sh,
# whose filecap_check_file short-circuits on `[[ "${f}" == *.go ]] || return 0`.
# A future maintainer must not assume a gate is holding this line. It is held by
# whoever is reading the diff, and that is the only thing holding it.
#
# CLAIMS-LEDGER RULE -- absence means NOT CLAIMED, never inferred covered. The
# unit of a claim is one (surface x proof_gate) row. A required dimension with
# neither a `coverage:` row nor a matching waiver is UNCLAIMED, and the gate
# fails in blocking mode. Waivers are per (surface, proof_gate), never per
# family: waiving the fault gate does not grant credit to the baseline gate.
#
# ALL BUT TWO FAMILIES BELOW ARE WAIVED, AND THAT IS THE HONEST STATE. A
# coverage row here has to satisfy all four of the sibling manifest's
# conditions: a cataloged Odù, a vacuity guard registered in
# MaterializedEdgeOduResolver, a hand-derived expected-edge-set fixture naming
# an edge of every relationship type the family's writer accepts, and the live
# ifa-determinism / ifa-fault-injection matrices actually running the family.
# Seeding an aspirational coverage row instead of a waiver is the specific
# mistake commit 42e188ba1 made for documentation_edges and had to withdraw; it
# is not repeated here.
#
# TWO OF THEM NOW HAVE ALL FOUR. kubernetes_namespace_environment and
# iam_instance_profile_role each carry a cataloged Odù, a registered edge-type
# set, a vacuity guard dispatched from MaterializedEdgeOduResolver, a
# hand-derived expected-edge-set fixture their guard reproduces exactly, and --
# since #6309 -- live ifa-determinism AND ifa-fault-injection matrices driving
# the family and asserting its exact edge set. Their coverage rows below say
# so. Every other family below still lacks the fourth condition, which is why
# every other family below still carries waiver rows instead.
#
# Which families those are is asserted in code, not only here.
# guardedDirectMaterializedEdgeFamilies
# (go/internal/ifa/materializededges/materialized_edges_direct_family_coverage_test.go)
# is the roster, and TestGuardedDirectFamiliesStillCarryTheirWaivers holds each
# entry's LiveProven flag to the ledger: unproven means two waiver rows and no
# coverage row, live-proven means two coverage rows and no waiver. Retiring a
# waiver here is therefore a three-sided edit: wire the family into the live
# matrices, convert its rows here from waivers to coverage, and flip its roster
# flag there -- all in the same change.
#
# The remaining twenty-six do NOT yet resolve through
# MaterializedEdgeDomainEdgeTypes -- their relationship types are not registered
# beside their writers in go/internal/storage/cypher, so
# `eshu-ifa assert-edges -domain <family>` would error before any fixture is
# consulted. Registering them is part of the remaining #6228 work, which is why
# TestEveryWaivedFamilyIsRegistered holds the #5543 umbrella roster to the
# resolve check but not these. The waiver reasons below say so per family.
#
# NOT EVERY FAMILY CAN BE REGISTERED IN ITS CURRENT SHAPE, and the blocker is
# the registry's own contract rather than fixture effort.
# TestMaterializedEdgeFamilyRegistryMatchesItsRetract extracts a `[rel:TYPE]`
# alternation from each registered family's retract template and pins it against
# the declared edge types. A family whose retract names no relationship type
# cannot supply one. Several here are in that position: code_taint_evidence and
# incident_routing_evidence retract by `DETACH DELETE` on their evidence NODE,
# semantic_entity_containment retracts by a node-label alternation, and
# cloud_resource, observability_coverage and security_group_sg_rule retract
# through a deliberately bare `[rel]` scoped by evidence_source (their type
# vocabularies are open or derived, so an alternation would be an ever-growing
# allowlist). Covering those needs a decision about the registry contract, not
# another Odù -- record it in an ADR before writing the fixture.
#
# WHERE THE FAMILY LIST COMES FROM. Not from this file, and not from any port's
# name. reducer.DirectMaterializedEdgeFamilies() is the source, and
# TestDirectMaterializedEdgePortsMatchTheExecutedCypher holds it to the Cypher
# each port actually executes: every reducer port reaching a relationship MERGE
# must be a declared family. An earlier guard derived the set by matching port
# names against `^Write(.+)Edges$` and missed six ports that merge relationships
# under other names -- WriteKubernetesNamespaceNodes merges TARGETS_ENVIRONMENT,
# WriteSemanticEntities merges CONTAINS. Do not re-derive this list by name.

version: "1"

