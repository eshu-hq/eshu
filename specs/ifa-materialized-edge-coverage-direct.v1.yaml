  # kubernetes_namespace_environment: fault-free baseline plus kill-worker and
  # fail-graph-write recovery, all asserting the two-edge TARGETS_ENVIRONMENT
  # exact set with identical graph digests (#6309).
  - surface: "materialized_edges:kubernetes_namespace_environment"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-kubernetes-namespace-environment-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:kubernetes_namespace_environment"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-kubernetes-namespace-environment-family"
    proof_gate: ifa-fault-injection
