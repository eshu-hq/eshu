# Ifá materialized-edge coverage manifest (#5351, epic #5344).
#
# This is the curated, reviewable mapping from each reducer-materialized edge
# family to the cataloged Odù that proves it. go/internal/ifa's
# RunMaterializedEdgeCoverage enumerates the required surfaces from
# reducer.MaterializedEdgeFamilies() — the drift-proof registry of reducer
# domains that write graph edges through the ordering-safe shared-projection
# intent path (go/internal/reducer/shared_projection.go's allProjectionDomains)
# — and reports any family with no entry here as UNCOVERED unless a matching
# `waivers:` row names a tracked child issue.
#
# Surface keys are "materialized_edges:<domain>", one per
# reducer.MaterializedEdgeFamilies() entry.
#
# CLAIMS-LEDGER RULE — absence means NOT CLAIMED, never inferred covered.
# This manifest is a ledger of what is PROVEN, not a roadmap of what is planned.
# The unit of a claim is one (surface × scenario_type) row, bound to the
# proof_gate that runs it. If a required dimension has neither a `coverage:` row
# nor an allowed matching waiver, it is UNCLAIMED / not covered — a maintainer
# reads it as unproven, and the gate fails in blocking mode. SQL delta-live is a
# required, unwaived `delta_tombstone` row after #5554.
#
# Exhaustive coverage for every family requires BOTH:
#   - a `coverage:` row with scenario_type: baseline, proof_gate: ifa-determinism
#     (the P2 graph-determinism matrix replays the family's committed cassette
#     across N in {1,2,4} and, per cell, runs `ifa assert-edges -domain <family>
#     -expected <file>` — a live, set-exact assertion that the family's
#     materialized edges are EXACTLY the hand-derived expected set. Digest
#     equality across N alone cannot catch a family silently empty in ALL cells;
#     the absolute expected set can, which is why the proof_gate is only honest
#     with the assert-edges wiring in scripts/verify-ifa-determinism.sh.)
#   - a `coverage:` row with scenario_type: fault, proof_gate: ifa-fault-injection
#     (The 49-cell fault matrix drives the same family cassette into every
#     cell so lease-expiry / kill-worker recovery exercises the family's real
#     durable handler replay, asserts the fault-free baseline carries exactly
#     the expected edges via `ifa assert-edges`, then compares every recovery
#     cell's graph byte-identical to that known-good baseline.)
# SQL relationships additionally requires:
#   - a `coverage:` row with scenario_type: delta_tombstone and proof_gate:
#     ifa-determinism. The matrix drives gen 2 after the known-good baseline and
#     asserts the accumulated exact edge set before computing its digest.
# go/internal/ifa/materializededges/materialized_edges.go computes these requirements directly
# from reducer.MaterializedEdgeFamilies(), not from a scenario_requirements:
# section in this file.
#
# scenario is always "odu": every coverage entry's ref must name an Odù
# returned by Catalog()/CatalogByName() in go/internal/ifa/catalog_seed.go.
#
# Resolution semantics (go/internal/ifa/materializededges/materialized_edges.go's
# MaterializedEdgeOduResolver, materialized_edges_sql.go's
# resolveSQLRelationshipMaterializedEdges for the sql_relationships family):
# true iff (1) ref names a cataloged Odù, (2) the family's hand-derived
# expected-edge-set fixture names at least one edge of every relationship type
# the family's writer registry accepts, and (3) running the Odù's own facts
# through the family's pure, backend-free extraction seam reproduces the
# expected set EXACTLY. See go/internal/ifa/coverage_falsegreen_test.go's
# sibling materialized_edges_falsegreen_test.go for the proof this file's
# bindings cannot pass on a wrong Odù or an incomplete expected-edge-set.
#
# WAIVER GRANULARITY — per (surface × proof_gate), NOT per family.
# `waivers:` is a small addition on top of replaycoverage's generic Manifest
# schema (parsed separately by go/internal/ifa/materializededges/materialized_edges_manifest.go
# LoadMaterializedEdgeWaivers): a waiver softens an otherwise-required
# uncovered finding into an advisory one that still names the issue in every
# report, mirroring the C-13/C-14/F-6 gates' waiver-with-tracked-issue pattern.
# Each waiver carries a `proof_gate:` (one of ifa-determinism / ifa-fault-injection)
# so its key EQUALS the reconciled (surface, proof_gate) row key. Waiving the
# fault gate does NOT revoke credit for a proven baseline (determinism) row and
# vice versa: one proven dimension does not grant credit to another dimension
# that still needs a waiver. A per-family waiver (no proof_gate) is too coarse
# and fails to load. A waived (surface, proof_gate)
# that later gains real coverage must have its waiver row removed in the same
# change (materialized_edges.go flags a stale waiver on a now-covered row as its
# own finding).
#
# The sql_relationships BASELINE, DELTA, and FAULT rows, the code_calls
# BASELINE and FAULT rows, the documentation_edges BASELINE and FAULT rows, the
# deployable_unit_edges BASELINE and FAULT rows (#5993/#6158), the
# rationale_edges BASELINE and FAULT rows (#5998), the
# codeowners_ownership_edges BASELINE and FAULT rows (#5992), the
# repo_dependency BASELINE and FAULT rows (#5999), the submodule_pin_edges
# BASELINE and FAULT rows (#6002), the inheritance_edges BASELINE and FAULT
# rows (#5996), and the shell_exec BASELINE and FAULT rows (#6001) are proven;
# none of those families carries a waiver. #5555
# rebuilt both SQL cells in
# scripts/lib/ifa_fault_injection_sql_cells.sh so they provably target the
# sql_relationship_materialization / sql_relationships work item (a
# domain-scoped claimed-row precondition and a SQL edge MERGE anchor, not
# CloudResource). cell_killworker_sql proved green live first;
# cell_failgraphwrite_sql looked inert for months because the assertion reading
# its fired-fault marker called a binary the runner does not have (#5974), and
# is green live now that the assertion matches in bash. #5994 added the
# documentation cassette, its per-cell absolute DOCUMENTS assertion, the static
# gate mirrors, and two domain-scoped fault cells (graph-write failure, and
# mid-handler interruption via the ACK barrier), retiring both of that
# family's waivers. #6149 follow-up item 8 had removed the reclaim cell and
# recorded mid-handler interruption as a named gap for this family, on the
# finding that its handler holds no Postgres lock and completes in ~7ms so
# neither a kill-worker lock nor a forced expire-lease can land. #5998
# supersedes that gap: cell_killworker_documentation blocks the queue ACK
# rather than the handler -- a BEFORE UPDATE trigger on fact_work_items taking
# an advisory lock held by a separate session -- so handler width no longer
# matters. That mechanism was probed 3-of-3 before adoption with a psql session
# standing in for the reducer, which left the ordering half structural rather
# than measured; the live fault gate has since measured it on the reviewed head
# ("ACK backend ... blocked by holder ... after exact graph write", the real
# reducer blocked by the holder specifically). The pre-adoption substitution is
# kept on the record rather than erased, because it is what makes the claim
# checkable. See scripts/lib/ifa_fault_injection_documentation_cells.sh's header
# and docs/internal/evidence/5998-rationale-relative-path.md. #5998 likewise added
# full-record rationale assertions and domain-scoped recovery cells, retiring
# both rationale waivers. #6158 wired deployable_unit_edges' already-implemented
# vacuity guard into the resolver dispatch and its Odù into the catalog --
# both existed with their own tests but neither was reachable from a production
# coverage run -- retiring that family's waivers too. #6002 added the
# submodule_pin_edges Odu, cassette, and expected-edge-set fixture and wired
# the family into both live gates, retiring its waivers too. #6003 added
# workload_dependency, retiring its waiver. #5995/#6000/#5997 added
# handles_route/runs_in/invokes_cloud_action -- the last three families under
# this umbrella -- sharing one cassette/Odù and each gaining its own
# anchor-scoped graph-write fault cell. #6208 adds a runner_lease_hold cell
# for each family, blocking the production partition-lease key before killing
# and replacing the reducer. No allProjectionDomains family carries a waiver
# as of this change: the epic #5344 umbrella #5543, decomposed into per-domain
# child issues #5991-#6003, is complete.
#
# Only seed a coverage row here once the referenced Odù is genuinely green
# under the resolution semantics above (the same seed-only-green-rows
# philosophy specs/ifa-coverage-manifest.v1.yaml documents) — an aspirational
# binding belongs on the waiver list, never as an unproven coverage row.

version: "1"

coverage:
  # SQL baseline proves all nine edge types.
  - surface: "materialized_edges:sql_relationships"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-sql-family"
    proof_gate: ifa-determinism
  # #5554 promotes the gen-2 cassette from pure derivation to a live,
  # accumulated exact-set assertion inside every ifa-determinism matrix cell.
  - surface: "materialized_edges:sql_relationships"
    scenario: odu
    scenario_type: delta_tombstone
    ref: "odu:ifa-sql-family-delta"
    proof_gate: ifa-determinism
  # #5555 rebuilt the SQL fault cells in
  # scripts/lib/ifa_fault_injection_sql_cells.sh. Both are now proven live.
  #
  # cell_killworker_sql waits on a domain-scoped sql_relationship_materialization
  # row rather than any claimed row, and seeding a nonexistent domain makes it
  # time out on that name instead of latching unrelated work.
  #
  # cell_failgraphwrite_sql anchors the fault to a SQL edge (QUERIES_TABLE)
  # MERGE instead of CloudResource. Its fault dimension was waived for months on
  # the belief that it did not fire in CI. It did: the assertion that read the
  # fired-fault marker called `rg`, which the fault-injection runner does not
  # have, so "command not found" was indistinguishable from "the marker does not
  # name the operation" (#5974). With the assertion matching in bash the cell is
  # green in CI, and the waiver it justified is removed below.
  #
  # Same Odù as the baseline row above: the resolver's vacuity guard is
  # identical for baseline and fault (MaterializedEdgeOduResolver.Resolve). The
  # fault dimension's ADDITIONAL claim -- that a scripted kill / lease-expiry /
  # graph-write fault still converges to the same exact edge set -- is what the
  # two cells prove.
  - surface: "materialized_edges:sql_relationships"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-sql-family"
    proof_gate: ifa-fault-injection

  # #5991 replays the compiled code-call Odù's cassette in every N=1,2,4
  # determinism cell and asserts its hand-derived five-edge set (two CALLS,
  # one INSTANTIATES, one REFERENCES, and one USES_METACLASS) exactly. The
  # fault matrix drives the same cassette in every cell; its dedicated
  # kill-worker cell proves a claimed code_call_materialization row is
  # reclaimed, and its one-shot graph-write cell proves the CALLS write retries
  # through a durable marker before both cells assert the same exact set.
  - surface: "materialized_edges:code_calls"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-code-call-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:code_calls"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-code-call-family"
    proof_gate: ifa-fault-injection

  # #5994 replays the documentation cassette in every N=1,2,4 determinism cell
  # and asserts its hand-derived three-edge DOCUMENTS set exactly, pre- and
  # post-delta. Two of the three targets are Function/Class entities, whose real
  # graph uid is the derived content.CanonicalEntityID hash rather than the
  # content_entity fact's own entity_id -- the cassette precomputes that hash and
  # carries a matching file fact for every relative_path, or the endpoint MATCH
  # would silently no-op (README Gotchas, #5351). The third is a SqlTable target,
  # which could not materialize at all until this change added SqlTable to
  # batchCanonicalDocumentationEntityEdgeCypher's MATCH label alternation; the
  # extractor already emitted the row, so the edge was lost at the writer.
  # The fault matrix drives the same cassette in every cell; its one-shot
  # graph-write cell proves the DOCUMENTS write retries through a durable
  # marker written by the fault decorator at injection time -- not read from
  # the reducer log, the #5974 failure mode -- before re-asserting the exact
  # set. #5998 also added cell_killworker_documentation, a reclaim cell for
  # this family: scripts/lib/ifa_fault_shard.sh dispatches it in
  # IFA_FAULT_ALL_CELLS (:102) alongside cell_failgraphwrite_documentation
  # (:108), and scripts/lib/ifa_family_registry/rows/03_documentation_edges.sh:12
  # declares IFA_FAMILY_BLOCKER_KIND[documentation_edges]="ack_barrier", not
  # "none". The #6149 follow-up item 8 gap this comment once recorded (no
  # Postgres write for a kill-worker lock to target; ~7ms completion racing a
  # domain-scoped expire-lease UPDATE) is superseded, not merely worked
  # around: ack_barrier blocks the queue ACK itself via a BEFORE UPDATE
  # trigger on fact_work_items holding an advisory lock from a separate
  # session, so handler width no longer matters -- see the header block above
  # and docs/internal/evidence/5998-rationale-relative-path.md. The fault
  # dimension below is real, unwaived coverage for BOTH the reclaim
  # (ack_barrier kill-worker) and injected graph-write failure cells;
  # documentation_edges has no remaining named gap for mid-handler
  # interruption.
  - surface: "materialized_edges:documentation_edges"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-documentation-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:documentation_edges"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-documentation-family"
    proof_gate: ifa-fault-injection

  # #5993: deployable_unit_edges' resolveDeployableUnitMaterializedEdges
  # (materialized_edges_deployable_unit.go) existed, fully implemented and
  # covered by its own unit tests, but was dispatched from nowhere --
  # MaterializedEdgeOduResolver.Resolve's switch had no case for this family,
  # so it fell to the "no vacuity guard registered" default, and
  # deployableUnitFamilyOdu() was never added to catalogSeed, so even a
  # dispatch case would have found no cataloged Odù to resolve against
  # (#6157-class defect: a guard proven by its own test and reached by no
  # production path). Both gaps closed in the same change: the dispatch case
  # added, and the Odù wired into the catalog. The live fault cells
  # (cell_baseline_deployable_unit, cell_killworker_deployable_unit,
  # cell_failgraphwrite_deployable_unit) were already wired by #6149; this
  # is what makes the fault row below real, unwaived coverage rather than an
  # aspirational one.
  - surface: "materialized_edges:deployable_unit_edges"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-deployable-unit-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:deployable_unit_edges"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-deployable-unit-family"
    proof_gate: ifa-fault-injection
  # Both live gates drive the rationale cassette and exact-assert its full
  # EXPLAINS records. The determinism gate replays it in every N=1,2,4 cell and
  # exact-compares the complete Rationale source, EXPLAINS relationship, and
  # Function target records. The same matrix drives generation 2 and requires
  # the exact one-edge survivor. The 49-cell fault
  # matrix drives the cassette in every cell; its domain-scoped worker-kill and
  # one-shot EXPLAINS-write cells converge to the same exact three-record set
  # with zero dead letters.
  - surface: "materialized_edges:rationale_edges"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-rationale-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:rationale_edges"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-rationale-family"
    proof_gate: ifa-fault-injection

  # codeowners_ownership_edges (#5992). Both live gates now drive the family
  # cassette and assert its five-edge exact set: ifa-determinism uniformly in
  # every N-cell (drive, baseline assert, post-delta re-assert),
  # ifa-fault-injection through cells 19-21. The kill-worker cell holds the
  # handler open by locking fact_records -- its FIRST synchronous read, since
  # this handler has no IntentWriter and writes no Postgres row a lock could
  # target -- which was measured on a live stack before the cell was written:
  # the claimed row stayed claimed for 14 consecutive samples with the reducer
  # backends visibly waiting on that relation in pg_locks. That makes the fault
  # row real coverage rather than an aspirational one.
  - surface: "materialized_edges:codeowners_ownership_edges"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-codeowners-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:codeowners_ownership_edges"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-codeowners-family"
    proof_gate: ifa-fault-injection
  - surface: "materialized_edges:repo_dependency"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-repo-dependency-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:repo_dependency"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-repo-dependency-family"
    proof_gate: ifa-fault-injection
  - surface: "materialized_edges:workload_dependency"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-workload-dependency-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:workload_dependency"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-workload-dependency-family"
    proof_gate: ifa-fault-injection
  # inheritance_edges (#5996) and shell_exec (#6001). Both carry an Odu with a
  # committed expected-edge set, and both are now driven by the live gates:
  # SHARED_CELL=1 puts each in the determinism gate's shared N={1,2,4} cell via
  # the registry dispatch loop, and each has its own baseline/killworker/
  # failgraphwrite trio in the fault gate through the generic cell dispatchers.
  # The fault rows are real rather than aspirational for a DIFFERENT reason than
  # codeowners' above: these two declare blocker_kind=shared_intent_lock, not a
  # table lock, so the fault cell proves recovery across the shared intent lock
  # rather than through a relation visibly contended in pg_locks. Each also
  # drives itself (FAULT_SHARED_DRIVE=0) and therefore owns its own baseline
  # digest, so a fault that silently dropped an edge on recovery diverges that
  # family's own digest instead of hiding inside the shared one.
  - surface: "materialized_edges:inheritance_edges"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-inheritance-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:inheritance_edges"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-inheritance-family"
    proof_gate: ifa-fault-injection
  - surface: "materialized_edges:shell_exec"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-shell-exec-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:shell_exec"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-shell-exec-family"
    proof_gate: ifa-fault-injection

  # submodule_pin_edges (#6002). SubmodulePinEdgeMaterializationHandler is the
  # same single-stage, EdgeWriter-only, no-IntentWriter shape as
  # CodeownersOwnershipEdgeMaterializationHandler (both: FactLoader,
  # EdgeWriter, PriorGenerationCheck, Instruments; no IntentWriter), so its
  # fault cells lock the same table -- fact_records, the handler's FIRST
  # synchronous read -- for the same reason. Its cells are hand-written
  # (cell_kind: custom) for a DIFFERENT reason than codeowners' row states for
  # itself, though: codeowners stays custom because #6160 hand-wired its three
  # cells before scripts/lib/ifa_fault_generic_cells.sh existed and never
  # migrated them. This family is custom because the generic table_lock path
  # is proven broken for fact_records --
  # scripts/lib/ifa_fault_generic_table_lock.sh's
  # _ifa_generic_require_table_domain_written runs `SELECT count(*) FROM
  # <table> WHERE domain = '<wait_key>'`, and fact_records has no domain
  # column: its CREATE TABLE plus four ALTER TABLE ADD COLUMN statements in
  # go/internal/storage/postgres/migrations/003_fact_records.sql never add
  # one, and no later migration does either. Both live gates drive the family
  # cassette and assert its exact edge set the same way the codeowners row
  # above does, making the fault row real coverage rather than an
  # aspirational one.
  - surface: "materialized_edges:submodule_pin_edges"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-submodule-pin-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:submodule_pin_edges"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-submodule-pin-family"
    proof_gate: ifa-fault-injection

  # handles_route (#5995), runs_in (#6000), and invokes_cloud_action (#5997)
  # share ONE cassette/Odù (odu:ifa-symbol-runtime-family) and ONE
  # backend-free extraction seam (reducer.ExtractSymbolRuntimeIntentRows)
  # through CodeCallMaterializationHandler -- the same handler code_calls
  # already covers -- so a handler-stage kill-worker cell would reuse
  # code_calls' wait key and prove nothing new
  # (TestIfaFamilyRegistryHandlerWaitKeysAreExclusive,
  # go/internal/reducer/ifa_family_registry_wait_key_coherence_test.go). Each
  # family keeps its own anchor-scoped cell_failgraphwrite_<family>, with a
  # one-time fault injected
  # at that family's own MERGE template (HANDLES_ROUTE / RUNS_IN /
  # INVOKES_CLOUD_ACTION), independent of which handler or wait_key produced
  # the write. The fault row is real coverage, not aspirational: the cell's
  # durable marker is asserted, the drain gate requires zero dead letters, and
  # the exact-set edge assertion (2/2/1 edges respectively) reruns against the
  # shared trio baseline digest after recovery. #6208 also gives each family
  # a runner-lease kill/reclaim cell: it proves a false pre-reducer control,
  # waits for a pending family intent plus a runner parked on the exact
  # production advisory key, kills and joins that reducer, then releases,
  # reclaims, drains, exact-asserts the family, and matches the same baseline.
  - surface: "materialized_edges:handles_route"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-symbol-runtime-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:handles_route"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-symbol-runtime-family"
    proof_gate: ifa-fault-injection
  - surface: "materialized_edges:runs_in"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-symbol-runtime-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:runs_in"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-symbol-runtime-family"
    proof_gate: ifa-fault-injection
  - surface: "materialized_edges:invokes_cloud_action"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-symbol-runtime-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:invokes_cloud_action"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-symbol-runtime-family"
    proof_gate: ifa-fault-injection

waivers:
  # sql_relationships carries NO waiver. Its fault dimension was waived from
  # 2026-08-08 until #5974, on the belief that cell_failgraphwrite_sql did not
  # fire in CI. The cell fired; the assertion reading its marker shelled out to
  # a binary the runner lacks, and read "command not found" as a negative match.
  # Both SQL fault cells are green live, so the row above is real coverage and
  # this waiver is gone rather than merely re-dated.

  # documentation_edges carries NO waiver. Both dimensions were waived from
  # 2026-08-09 until #5994, when only the EXTRACTOR was proven and neither gate
  # executed the family -- a coverage row would have claimed a gate proves
  # something it never runs. #5994 retired both by doing the four things the
  # withdrawn claim was missing (commit 42e188ba1 added a coverage row on the
  # extractor proof alone and had to withdraw it): a live cassette in the
  # determinism matrix, a per-cell absolute DOCUMENTS assertion, the static gate
  # mirrors, and domain-scoped fault cells (a kill-worker cell and a
  # graph-write cell, at that time). The MaterializedEdgeDomainEdgeTypes
  # half of that old reason went stale the day after it was written, when
  # a9326630a registered the family -- the single-type registry resolves
  # documentation_edges to DOCUMENTS. #6149 follow-up item 8 removed the
  # reclaim cell (first a wrong-table kill-worker lock, then a domain-scoped
  # expire-lease attempt that raced the ~7ms handler and never landed),
  # leaving the family with one live fault cell (graph-write failure) and
  # mid-handler-interruption coverage recorded as a named gap. #5998 closed
  # that gap: cell_killworker_documentation is an ack_barrier reclaim cell
  # blocking the queue ACK itself via a BEFORE UPDATE trigger on
  # fact_work_items, not the handler, so the ~7ms handler width that defeated
  # both earlier attempts no longer matters -- scripts/lib/ifa_fault_shard.sh
  # dispatches it in IFA_FAULT_ALL_CELLS (:102) alongside
  # cell_failgraphwrite_documentation (:108), and
  # scripts/lib/ifa_family_registry/rows/03_documentation_edges.sh:12 declares
  # IFA_FAMILY_BLOCKER_KIND[documentation_edges]="ack_barrier". This waiver
  # exclusion still holds because both cells are genuine, unwaived coverage --
  # documentation_edges has no remaining named gap for mid-handler
  # interruption.
  #
  # No allProjectionDomains family carries a waiver as of this change:
  # handles_route (#5995), runs_in (#6000), and invokes_cloud_action (#5997)
  # were the last three, and #5543's decomposition into per-domain child
  # issues (#5991-#6003) is complete.

# ---------------------------------------------------------------------------
# Roadmap / known gaps -- moved to
# docs/internal/design/5351-ifa-materialized-edge-known-gaps.md to keep this
# manifest under the repository's 500-line policy cap. That doc is prose,
# never coverage or waiver data: every row a maintainer can act on still
# lives only in the coverage: and waivers: sections above.
# ---------------------------------------------------------------------------
