# Ifá materialized-edge coverage manifest (#5351, epic #5344).
#
# This is the curated, reviewable mapping from each reducer-materialized edge
# family to the cataloged Odù that proves it. go/internal/ifa's
# RunMaterializedEdgeCoverage enumerates the required surfaces from
# reducer.MaterializedEdgeFamilies() — the drift-proof registry of reducer
# domains that write graph edges through the ordering-safe shared-projection
# intent path (go/internal/reducer/shared_projection.go's allProjectionDomains)
# — and reports any family with no entry here as UNCOVERED unless a matching
# `waivers:` row names a tracked child issue.
#
# Surface keys are "materialized_edges:<domain>", one per
# reducer.MaterializedEdgeFamilies() entry.
#
# CLAIMS-LEDGER RULE — absence means NOT CLAIMED, never inferred covered.
# This manifest is a ledger of what is PROVEN, not a roadmap of what is planned.
# The unit of a claim is one (surface × scenario_type) row, bound to the
# proof_gate that runs it. If a required dimension has neither a `coverage:` row
# nor an allowed matching waiver, it is UNCLAIMED / not covered — a maintainer
# reads it as unproven, and the gate fails in blocking mode. SQL delta-live is a
# required, unwaived `delta_tombstone` row after #5554.
#
# Exhaustive coverage for every family requires BOTH:
#   - a `coverage:` row with scenario_type: baseline, proof_gate: ifa-determinism
#     (the P2 graph-determinism matrix replays the family's committed cassette
#     across N in {1,2,4} and, per cell, runs `ifa assert-edges -domain <family>
#     -expected <file>` — a live, set-exact assertion that the family's
#     materialized edges are EXACTLY the hand-derived expected set. Digest
#     equality across N alone cannot catch a family silently empty in ALL cells;
#     the absolute expected set can, which is why the proof_gate is only honest
#     with the assert-edges wiring in scripts/verify-ifa-determinism.sh.)
#   - a `coverage:` row with scenario_type: fault, proof_gate: ifa-fault-injection
#     (the P4 fault-injection matrix drives the same family cassette into every
#     cell so lease-expiry / kill-worker recovery exercises the family's real
#     durable handler replay, asserts the fault-free baseline carries exactly
#     the expected edges via `ifa assert-edges`, then compares every recovery
#     cell's graph byte-identical to that known-good baseline.)
# SQL relationships additionally requires:
#   - a `coverage:` row with scenario_type: delta_tombstone and proof_gate:
#     ifa-determinism. The matrix drives gen 2 after the known-good baseline and
#     asserts the accumulated exact edge set before computing its digest.
# go/internal/ifa/materialized_edges.go computes these requirements directly
# from reducer.MaterializedEdgeFamilies(), not from a scenario_requirements:
# section in this file.
#
# scenario is always "odu": every coverage entry's ref must name an Odù
# returned by Catalog()/CatalogByName() in go/internal/ifa/catalog_seed.go.
#
# Resolution semantics (go/internal/ifa/materialized_edges.go's
# MaterializedEdgeOduResolver, materialized_edges_sql.go's
# resolveSQLRelationshipMaterializedEdges for the sql_relationships family):
# true iff (1) ref names a cataloged Odù, (2) the family's hand-derived
# expected-edge-set fixture names at least one edge of every relationship type
# the family's writer registry accepts, and (3) running the Odù's own facts
# through the family's pure, backend-free extraction seam reproduces the
# expected set EXACTLY. See go/internal/ifa/coverage_falsegreen_test.go's
# sibling materialized_edges_falsegreen_test.go for the proof this file's
# bindings cannot pass on a wrong Odù or an incomplete expected-edge-set.
#
# WAIVER GRANULARITY — per (surface × proof_gate), NOT per family.
# `waivers:` is a small addition on top of replaycoverage's generic Manifest
# schema (parsed separately by go/internal/ifa/materialized_edges_manifest.go
# LoadMaterializedEdgeWaivers): a waiver softens an otherwise-required
# uncovered finding into an advisory one that still names the issue in every
# report, mirroring the C-13/C-14/F-6 gates' waiver-with-tracked-issue pattern.
# Each waiver carries a `proof_gate:` (one of ifa-determinism / ifa-fault-injection)
# so its key EQUALS the reconciled (surface, proof_gate) row key. Waiving the
# fault gate does NOT revoke credit for a proven baseline (determinism) row and
# vice versa: one proven dimension does not grant credit to another dimension
# that still needs a waiver. A per-family waiver (no proof_gate) is too coarse
# and fails to load. A waived (surface, proof_gate)
# that later gains real coverage must have its waiver row removed in the same
# change (materialized_edges.go flags a stale waiver on a now-covered row as its
# own finding).
#
# The sql_relationships BASELINE, DELTA, and FAULT rows, the code_calls
# BASELINE and FAULT rows, and the documentation_edges BASELINE and FAULT rows
# are proven; none of those three families carries a waiver. #5555
# rebuilt both SQL cells in
# scripts/lib/ifa_fault_injection_sql_cells.sh so they provably target the
# sql_relationship_materialization / sql_relationships work item (a
# domain-scoped claimed-row precondition and a SQL edge MERGE anchor, not
# CloudResource). cell_killworker_sql proved green live first;
# cell_failgraphwrite_sql looked inert for months because the assertion reading
# its fired-fault marker called a binary the runner does not have (#5974), and
# is green live now that the assertion matches in bash. #5994 added the
# documentation cassette, its per-cell absolute DOCUMENTS assertion, the static
# gate mirrors, and one domain-scoped fault cell (graph-write failure),
# retiring both of that family's waivers. #6149 follow-up item 8 later found
# and removed a second, dedicated reclaim cell for that family: neither a
# kill-worker lock (wrong table, blocked nothing) nor a domain-scoped
# expire-lease UPDATE (raced the handler's ~7ms completion, never landed)
# could be made deterministic, so mid-handler-interruption coverage for
# documentation_edges is a named, documented gap rather than a proven cell --
# see scripts/lib/ifa_fault_injection_documentation_cells.sh's header. Every
# remaining
# allProjectionDomains family is RED-BY-DEFAULT for BOTH gates and carries a
# `waivers:` row per gate, pointing at the epic #5344 umbrella follow-up
# #5543, which is now decomposed into per-domain child issues #5991-#6003;
# each waiver names the child that will retire it.
#
# Only seed a coverage row here once the referenced Odù is genuinely green
# under the resolution semantics above (the same seed-only-green-rows
# philosophy specs/ifa-coverage-manifest.v1.yaml documents) — an aspirational
# binding belongs on the waiver list, never as an unproven coverage row.

version: "1"

coverage:
  # SQL baseline proves all nine edge types.
  - surface: "materialized_edges:sql_relationships"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-sql-family"
    proof_gate: ifa-determinism
  # #5554 promotes the gen-2 cassette from pure derivation to a live,
  # accumulated exact-set assertion inside every ifa-determinism matrix cell.
  - surface: "materialized_edges:sql_relationships"
    scenario: odu
    scenario_type: delta_tombstone
    ref: "odu:ifa-sql-family-delta"
    proof_gate: ifa-determinism
  # #5555 rebuilt the SQL fault cells in
  # scripts/lib/ifa_fault_injection_sql_cells.sh. Both are now proven live.
  #
  # cell_killworker_sql waits on a domain-scoped sql_relationship_materialization
  # row rather than any claimed row, and seeding a nonexistent domain makes it
  # time out on that name instead of latching unrelated work.
  #
  # cell_failgraphwrite_sql anchors the fault to a SQL edge (QUERIES_TABLE)
  # MERGE instead of CloudResource. Its fault dimension was waived for months on
  # the belief that it did not fire in CI. It did: the assertion that read the
  # fired-fault marker called `rg`, which the fault-injection runner does not
  # have, so "command not found" was indistinguishable from "the marker does not
  # name the operation" (#5974). With the assertion matching in bash the cell is
  # green in CI, and the waiver it justified is removed below.
  #
  # Same Odù as the baseline row above: the resolver's vacuity guard is
  # identical for baseline and fault (MaterializedEdgeOduResolver.Resolve). The
  # fault dimension's ADDITIONAL claim -- that a scripted kill / lease-expiry /
  # graph-write fault still converges to the same exact edge set -- is what the
  # two cells prove.
  - surface: "materialized_edges:sql_relationships"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-sql-family"
    proof_gate: ifa-fault-injection

  # #5991 replays the compiled code-call Odù's cassette in every N=1,2,4
  # determinism cell and asserts its hand-derived five-edge set (two CALLS,
  # one INSTANTIATES, one REFERENCES, and one USES_METACLASS) exactly. The
  # fault matrix drives the same cassette in every cell; its dedicated
  # kill-worker cell proves a claimed code_call_materialization row is
  # reclaimed, and its one-shot graph-write cell proves the CALLS write retries
  # through a durable marker before both cells assert the same exact set.
  - surface: "materialized_edges:code_calls"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-code-call-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:code_calls"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-code-call-family"
    proof_gate: ifa-fault-injection

  # #5994 replays the documentation cassette in every N=1,2,4 determinism cell
  # and asserts its hand-derived three-edge DOCUMENTS set exactly, pre- and
  # post-delta. Two of the three targets are Function/Class entities, whose real
  # graph uid is the derived content.CanonicalEntityID hash rather than the
  # content_entity fact's own entity_id -- the cassette precomputes that hash and
  # carries a matching file fact for every relative_path, or the endpoint MATCH
  # would silently no-op (README Gotchas, #5351). The third is a SqlTable target,
  # which could not materialize at all until this change added SqlTable to
  # batchCanonicalDocumentationEntityEdgeCypher's MATCH label alternation; the
  # extractor already emitted the row, so the edge was lost at the writer.
  # The fault matrix drives the same cassette in every cell; its one-shot
  # graph-write cell proves the DOCUMENTS write retries through a durable
  # marker written by the fault decorator at injection time -- not read from
  # the reducer log, the #5974 failure mode -- before re-asserting the exact
  # set. This family has no reclaim cell: DocumentationEdgeMaterializationHandler.Handle
  # has no Postgres write for a kill-worker lock to target, and its ~7ms
  # completion races a domain-scoped expire-lease UPDATE before it can land
  # (#6149 follow-up item 8, both attempts and why neither survived). The
  # fault dimension below is real, unwaived coverage for injected graph-write
  # failure; mid-handler interruption for this family remains a named,
  # documented gap, not silent absence.
  - surface: "materialized_edges:documentation_edges"
    scenario: odu
    scenario_type: baseline
    ref: "odu:ifa-documentation-family"
    proof_gate: ifa-determinism
  - surface: "materialized_edges:documentation_edges"
    scenario: odu
    scenario_type: fault
    ref: "odu:ifa-documentation-family"
    proof_gate: ifa-fault-injection

waivers:
  # sql_relationships carries NO waiver. Its fault dimension was waived from
  # 2026-08-08 until #5974, on the belief that cell_failgraphwrite_sql did not
  # fire in CI. The cell fired; the assertion reading its marker shelled out to
  # a binary the runner lacks, and read "command not found" as a negative match.
  # Both SQL fault cells are green live, so the row above is real coverage and
  # this waiver is gone rather than merely re-dated.

  # --- The 11 other allProjectionDomains families: both gates unproven. ---
  # Each carries a baseline (ifa-determinism) AND a fault (ifa-fault-injection)
  # waiver because NEITHER dimension has an Odù + expected-edge-set fixture yet.
  # Each names its own per-domain child issue (#5991-#6003) under the #5344
  # epic umbrella #5543, not the umbrella itself: a waiver should name the issue
  # whose closure retires it, and the umbrella retires none of them individually.
  - surface: "materialized_edges:repo_dependency"
    proof_gate: ifa-determinism
    issue: "#5999"
    waived: "2026-07-20"
    reason: "reducer.DomainRepoDependency (Terraform/app_repo dependency edges); pending #5999 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:repo_dependency"
    proof_gate: ifa-fault-injection
    issue: "#5999"
    waived: "2026-07-20"
    reason: "reducer.DomainRepoDependency (Terraform/app_repo dependency edges); pending #5999 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:workload_dependency"
    proof_gate: ifa-determinism
    issue: "#6003"
    waived: "2026-07-20"
    reason: "reducer.DomainWorkloadDependency; pending #6003 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:workload_dependency"
    proof_gate: ifa-fault-injection
    issue: "#6003"
    waived: "2026-07-20"
    reason: "reducer.DomainWorkloadDependency; pending #6003 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:shell_exec"
    proof_gate: ifa-determinism
    issue: "#6001"
    waived: "2026-07-20"
    reason: "reducer.DomainShellExec; pending #6001 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:shell_exec"
    proof_gate: ifa-fault-injection
    issue: "#6001"
    waived: "2026-07-20"
    reason: "reducer.DomainShellExec; pending #6001 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:inheritance_edges"
    proof_gate: ifa-determinism
    issue: "#5996"
    waived: "2026-07-20"
    reason: "reducer.DomainInheritanceEdges; pending #5996 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:inheritance_edges"
    proof_gate: ifa-fault-injection
    issue: "#5996"
    waived: "2026-07-20"
    reason: "reducer.DomainInheritanceEdges; pending #5996 for an Odù + expected-edge-set fixture"
  # documentation_edges carries NO waiver. Both dimensions were waived from
  # 2026-08-09 until #5994, when only the EXTRACTOR was proven and neither gate
  # executed the family -- a coverage row would have claimed a gate proves
  # something it never runs. #5994 retired both by doing the four things the
  # withdrawn claim was missing (commit 42e188ba1 added a coverage row on the
  # extractor proof alone and had to withdraw it): a live cassette in the
  # determinism matrix, a per-cell absolute DOCUMENTS assertion, the static gate
  # mirrors, and domain-scoped fault cells (a kill-worker cell and a
  # graph-write cell, at that time). The MaterializedEdgeDomainEdgeTypes
  # half of that old reason went stale the day after it was written, when
  # a9326630a registered the family -- the single-type registry resolves
  # documentation_edges to DOCUMENTS. #6149 follow-up item 8 later removed the
  # reclaim cell (first a wrong-table kill-worker lock, then a domain-scoped
  # expire-lease attempt that raced the ~7ms handler and never landed): the
  # family now has one live fault cell (graph-write failure), and this waiver
  # exclusion still holds because that cell is genuine, unwaived coverage --
  # mid-handler-interruption coverage is a documented gap, not a silently
  # dropped claim.
  - surface: "materialized_edges:codeowners_ownership_edges"
    proof_gate: ifa-determinism
    issue: "#5992"
    waived: "2026-07-21"
    reason: "reducer.DomainCodeownersOwnershipEdges (DECLARES_CODEOWNER edges, #5419); pending #5992 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:codeowners_ownership_edges"
    proof_gate: ifa-fault-injection
    issue: "#5992"
    waived: "2026-07-21"
    reason: "reducer.DomainCodeownersOwnershipEdges (DECLARES_CODEOWNER edges, #5419); pending #5992 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:submodule_pin_edges"
    proof_gate: ifa-determinism
    issue: "#6002"
    waived: "2026-07-21"
    reason: "reducer.DomainSubmodulePinEdges (PINS_SUBMODULE edges, #5420); pending #6002 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:submodule_pin_edges"
    proof_gate: ifa-fault-injection
    issue: "#6002"
    waived: "2026-07-21"
    reason: "reducer.DomainSubmodulePinEdges (PINS_SUBMODULE edges, #5420); pending #6002 for an Odù + expected-edge-set fixture"
  # rationale_edges: the EXTRACTOR is proven by odu:ifa-rationale-family (#5998)
  # -- ExtractRationaleEdgeRows reproduces a hand-derived exact edge set, and
  # mutating the tombstone guard, the blank kind/text guard, the dedup, or the
  # comment kind in the node identity each turns it red. Both dimensions stay
  # WAIVED anyway: a coverage row names a proof GATE, and neither gate executes
  # this family. verify-ifa-determinism.sh asserts expected edges for
  # sql_relationships and code_calls only, and MaterializedEdgeDomainEdgeTypes
  # rejects rationale_edges, so a row here would claim a gate proves something
  # it never runs.
  - surface: "materialized_edges:rationale_edges"
    proof_gate: ifa-determinism
    issue: "#5998"
    waived: "2026-08-09"
    reason: "reducer.DomainRationaleEdges extraction proven by odu:ifa-rationale-family; live determinism-gate execution pending a cassette + absolute EXPLAINS assertion"
  - surface: "materialized_edges:rationale_edges"
    proof_gate: ifa-fault-injection
    issue: "#5998"
    waived: "2026-08-09"
    reason: "reducer.DomainRationaleEdges extraction proven by odu:ifa-rationale-family; fault dimension pending domain-scoped live cells"
  - surface: "materialized_edges:deployable_unit_edges"
    proof_gate: ifa-determinism
    issue: "#5993"
    waived: "2026-07-20"
    reason: "reducer.DomainDeployableUnitEdges; pending #5993 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:deployable_unit_edges"
    proof_gate: ifa-fault-injection
    issue: "#5993"
    waived: "2026-07-20"
    reason: "reducer.DomainDeployableUnitEdges; pending #5993 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:handles_route"
    proof_gate: ifa-determinism
    issue: "#5995"
    waived: "2026-07-20"
    reason: "reducer.DomainHandlesRoute (HANDLES_ROUTE edges, #2721); pending #5995 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:handles_route"
    proof_gate: ifa-fault-injection
    issue: "#5995"
    waived: "2026-07-20"
    reason: "reducer.DomainHandlesRoute (HANDLES_ROUTE edges, #2721); pending #5995 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:runs_in"
    proof_gate: ifa-determinism
    issue: "#6000"
    waived: "2026-07-20"
    reason: "reducer.DomainRunsIn (RUNS_IN edges, #2722); pending #6000 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:runs_in"
    proof_gate: ifa-fault-injection
    issue: "#6000"
    waived: "2026-07-20"
    reason: "reducer.DomainRunsIn (RUNS_IN edges, #2722); pending #6000 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:invokes_cloud_action"
    proof_gate: ifa-determinism
    issue: "#5997"
    waived: "2026-07-20"
    reason: "reducer.DomainInvokesCloudAction (INVOKES_CLOUD_ACTION edges, #2723); pending #5997 for an Odù + expected-edge-set fixture"
  - surface: "materialized_edges:invokes_cloud_action"
    proof_gate: ifa-fault-injection
    issue: "#5997"
    waived: "2026-07-20"
    reason: "reducer.DomainInvokesCloudAction (INVOKES_CLOUD_ACTION edges, #2723); pending #5997 for an Odù + expected-edge-set fixture"

# ---------------------------------------------------------------------------
# Roadmap / known gaps (discoverable from the gate itself, not only a PR body).
# These are UNCLAIMED dimensions — per the claims-ledger rule above, a
# maintainer reads them as unproven. They are recorded here so the honest gaps
# travel with the gate:
#
#   - sql_relationships DELTA-LIVE is proven by the delta_tombstone row above:
#     the ifa-determinism matrix drives gen 1, asserts its exact nine-edge set,
#     drives gen 2 with the reused source_run_id, drains again, and asserts the
#     accumulated exact nine-edge set with INDEXES retargeted to orders.
#   - sql_relationships FAULT is covered. #5555 rebuilt both cells
#     (scripts/lib/ifa_fault_injection_sql_cells.sh) so they target the
#     sql_relationship_materialization / sql_relationships work item
#     specifically (a domain-scoped claimed-row precondition and a SQL edge
#     MERGE anchor, not CloudResource). cell_killworker_sql and
#     cell_failgraphwrite_sql are green live, so the family carries no waiver.
#   - code_calls BASELINE and FAULT are covered by the exact-set replay and two
#     domain-scoped recovery cells described above (#5991).
#   - The 11 other allProjectionDomains families are blocked on the epic #5344
#     umbrella #5543, decomposed into per-domain child issues #5991-#6003
#     (both gates each).
# ---------------------------------------------------------------------------
