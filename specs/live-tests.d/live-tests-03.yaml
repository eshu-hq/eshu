    tag: ~
    class: postgres_ci
    reason: "#7009 disposable PostgreSQL 18 proof of the status summary reader's decision (Select) inside a REPEATABLE READ READ ONLY transaction: a missing table is a typed fallback that leaves the transaction usable, a missing row, a foreign digest or schema version, an undecodable payload, a row_count mismatch and a row older than the limit fall back with their reason, and a fresh row is served with its age taken from the database clock and added to the stored ages"
    runner: live-postgres-readiness
  - file: go/internal/reducer/status/summary/runner_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#7009 disposable PostgreSQL 18 proofs of the reducer status summary writer: after a pass the stored row equals the live active-work statement at its as_of in one snapshot at 0.2, 50 and 100 percent live work and when empty (with a non-vacuity mutation), a backend killed between the statement and the upsert leaves the old row whole, a newer stored row is kept (rejected_guard), a missing table is skipped until migration 161 applies, a row from another statement digest is replaced, the pass runs READ COMMITTED under a REPEATABLE READ database default, and a second writer skips while the first holds the advisory lock; the blocking reducer-contention-gate step also runs it with ESHU_REQUIRE_STATUS_SUMMARY_WRITER_PROOF=1, so an unset DSN fails there"
    runner: live-postgres-readiness
  - file: go/internal/reducer/status/summary/contention_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#7009 disposable PostgreSQL 18 proof that two status summary writers at the production 5 s cadence for 30 s beside two workers claiming and Acking through the production ReducerQueue (80 to 100 percent live spike) cause zero claim errors and zero writer-attributable lock waits, keep the stored as_of monotone, never compute at once, and count overruns only for passes over the interval; the blocking reducer-contention-gate step also runs it with ESHU_REQUIRE_STATUS_SUMMARY_WRITER_PROOF=1, so an unset DSN fails there"
    runner: live-postgres-readiness
  - file: go/internal/reducer/status/summary/reader_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#7009 disposable PostgreSQL 18 proofs of the status summary reader against the production writer: a row written by a writer pass and read back by the stored-summary reader inside a REPEATABLE READ READ ONLY snapshot equals the live active-work statement at the same data and clock at 0.2, 50 and 100 percent live work and when empty (the age add is load-bearing: dropping it fails the comparison, and a changed work item shows the comparison can differ), and a stale row, a row from another statement digest, and a dropped table each fall back to the whole live answer with the right reason and without aborting the transaction"
    runner: live-postgres-readiness
  - file: go/internal/reducer/status/summary/scrape_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#7009 disposable PostgreSQL 18 proofs of the runtime /metrics scrape path in autocommit, the shape of every hosted runtime: a row written by the production writer is served equal to the live active-work statement at the same data and clock; once the row is stale, missing, or its table is dropped, the process keeps serving its last row as stale with an age that keeps growing; a process that restarts into a stale but decodable row serves that row as stale, and a process that restarts with the table dropped serves the zero summary (the empty-table and foreign or undecodable row cases are proven hermetically, not by this live file); the live active-work statement runs zero times; the statement inventory on an empty store through the production status store is 24 statements before, 20 with the reader off, and 21 with the reader on (no active-work statement); and the scrape renders identical bytes through the production handler with the metrics selection and the broader selection over a database whose collector fact-evidence, registry collector, and coordinator sections are populated (with a planted violation); the blocking reducer-contention-gate step also runs it with ESHU_REQUIRE_STATUS_SUMMARY_WRITER_PROOF=1, so an unset DSN fails there"
    runner: live-postgres-readiness
  - file: go/internal/reducer/status/summary/terraform_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#7009 disposable PostgreSQL 18 proof of the terraform_state summary model: a row written by the production writer pass (each model row is its own transaction under the same advisory lock, reads its own database clock after the active-work row commits so the terraform_state as_of is not earlier than the active-work as_of, and carries its own digest) and read back by the production stored-summary reader inside a REPEATABLE READ READ ONLY snapshot equals what the two live Terraform-state statements return at an empty database, a few state scopes, past the per-locator rank cap of 50, and with Git backend warnings plus state scopes whose generation ids carry no serial; a warning written after the pass shows the comparison can differ; TestWriterKilledMidCompanionKeepsThePrimaryRowLive terminates the companion's backend between its statements and its upsert and shows the active-work row advances while the terraform_state row keeps its old as_of and still serves equal to live"
