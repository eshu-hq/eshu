tests:
  - file: go/internal/storage/postgres/recovery_replay_lock_order_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8205 150 rounds of three concurrent recovery replays (scoped plus failure class, stage-only, bounded per scope in reverse) over 400,000 analyzed background rows, with an EXPLAIN check that the scoped and stage-only replays reach their rows through different indexes and never seq-scan fact_work_items; requires 0 x 40P01 and every row replayed exactly once (main: 145 of 150 rounds deadlocked); isolated schema from ESHU_REDUCER_FAIRNESS_PROOF_DSN or ESHU_POSTGRES_DSN; about 17-19 s locally including a 10 s seed; enrolled in the live-postgres-readiness runner"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/recovery_replay_lock_order_interleave_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8205 deterministic two-session proofs with a test-schema-only pg_sleep BEFORE UPDATE trigger: a scoped and a stage-only recovery replay wait one way on pg_blocking_pids and both succeed with exact accounting (main: mutual block, then 40P01), the held-middle-row race of the same pair completes (main: 40P01), and the EvalPlanQual case drops a row another session made pending or claimed before the replay could lock it; isolated schemas; about 15 s locally; enrolled in the live-postgres-readiness runner"
    runner: live-postgres-readiness
  - file: go/internal/query/admin/replay_lock_order_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8205 admin replay lock order: admin stage-only versus scoped recovery replay in both start orders and admin versus admin wait one way on pg_blocking_pids with exact accounting (main: admin versus recovery deadlocks), and the EvalPlanQual case keeps a row claimed before the admin lock step; isolated schemas; about 22 s locally; enrolled in the live-postgres-readiness runner"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/reducer_claim_sweep_lock_order_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8205 reducer claim-time supersede sweep lock order over 400,000 analyzed background rows: two-session sweep against scoped and stage-only recovery replays in both start orders waits one way and the held-middle-row race of the same pairs completes (main: mutual block, then 40P01), 150 rounds of a claim racing scoped, stage-only and bounded replays with 0 x 40P01 and every stale row superseded exactly once (main: 111 of 150 deadlocked), the active-generation guard keeps every active-generation row, and the EvalPlanQual case keeps a row claimed before the sweep's lock step; isolated schemas; about 60 s locally; enrolled in the live-postgres-readiness runner"
    runner: live-postgres-readiness
  - file: go/internal/query/admin/replay_claim_sweep_lock_order_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8205 admin replay against the reducer claim-time supersede sweep in both start orders waits one way and survives the held-middle-row race (main: 40P01), and 150 rounds of a claim, a scoped and a stage-only recovery replay and an admin replay started together over the same stale rows give 0 x 40P01 with exact accounting (main: 212 x 40P01); isolated schemas; about 60-90 s locally including two 400,000-row seeds; enrolled in the live-postgres-readiness runner"
  - file: go/internal/storage/postgres/config/artifacts/fence_trigger_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8155 (#7126 PR3b-1b) disposable PostgreSQL 18 proof of the migration 182 content_files version fence: INSERT, UPDATE, upsert, DELETE and TRUNCATE each bump a touched repository once per transaction and leave others alone; a rolled-back write leaves no version row; two concurrent first writes of an unseeded repository converge on one row at version 2 with no error (10 rounds); a transaction whose id a restored version row already holds still bumps once (the (bumped_xid, bumped_at) guard); the fence is the last statement-level AFTER trigger per event, after the migration 138 secret-lines triggers and, for DELETE, after the row-level RI triggers; enrolled in the live-postgres-readiness runner; 0.7-1.5 s per proof on a local PostgreSQL 18.6 on 2026-10-16; wall time is logged, not gated"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/config/artifacts/fence_churn_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8155 S3 arm 6 as a PR test through the production ContentWriter and GenerationRetentionStore: exact version rewrites full 10, delta 2, reap 4, bulk 1, prune 1 per repository, with a seeded per-row unguarded fence that misses the counts (RED); enrolled in the live-postgres-readiness runner; 11-17 s per proof on a local PostgreSQL 18.6 on 2026-10-16; wall time is logged, not gated"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/config/artifacts/fence_deadlock_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8155 arm 7 cases 1a and 1b: two opposite-order multi-repository upserts and deletes over ten shared repositories, overlapped every round by a held middle version row, 20 rounds each with 0 deadlocks and exact bump counts; the seeded row-level fence deadlocks on the same rounds (RED); enrolled in the live-postgres-readiness runner; 1.2-6.8 s per proof on a local PostgreSQL 18.6 on 2026-10-16; wall time is logged, not gated"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/config/artifacts/fence_prune_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8155 ruling additions 3a and 3b: auto_explain records the DELETE fence statement's plan with a Sort on repo_id under the Insert and no reordering node between; arm 7 case 1c runs two real PruneSupersededGenerations passes on scope sets sharing six repositories in opposite order, 3 rounds, 0 deadlocks, each shared version row bumped twice; needs LOAD 'auto_explain' (superuser DSN); enrolled in the live-postgres-readiness runner; 0.8-2.5 s per proof on a local PostgreSQL 18.6 on 2026-10-16; wall time is logged, not gated"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/config/artifacts/fence_interleave_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8155 protocol section 6 interleavings with the production ContentWriter, retention store and artifacts.Classify: R-1 (derive read between batches 1 and 2 of a three-batch Write), two-scope Writes of one repository, and a derive read inside an open prune each leave the stored version stale_version, and a read after the last commit is trusted; enrolled in the live-postgres-readiness runner; 0.9-1.9 s per proof on a local PostgreSQL 18.6 on 2026-10-16; wall time is logged, not gated"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/config/artifacts/fence_prune_write_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8155 arm 7 cases 2 and 3: a content Write of a repository whose retention prune is open waits (disjoint keys on the version row's tuple lock, a shared doomed key on the prune's transaction) until the retention commit, then lands; no deadlock, version bumped twice, rows converge; enrolled in the live-postgres-readiness runner; about 1 s per proof on a local PostgreSQL 18.6 on 2026-10-16; wall time is logged, not gated"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/config/artifacts/fence_seed_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8155 migrations 182 and 183 on a database that already holds content: one version-0 row per repository with bumped_xid 0, a row a fenced write created between the two files kept, a re-apply changes nothing, and the first write bumps 0 to 1; the seed racing an open fenced write converges on one row (commit: version 1, rollback: version 0); enrolled in the live-postgres-readiness runner; about 1-2 s per proof on a local PostgreSQL 18.6 on 2026-10-16; wall time is logged, not gated"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/config/artifacts/fence_seed_timing_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8155 seed timing proof: migrations 182 and 183 on a content_files fixture over 3,000 repositories with every index present, then exactly one version-0 row per repository; 30,000 rows by default (ESHU_CONFIG_ARTIFACT_SEED_TIMING_ROWS=1000000 for the ruling size: 182 0.0033 s, 183 0.1329 s, fixture load 74 s, load1 45 on 2026-10-16); enrolled in the live-postgres-readiness runner; SEED_TIMING wall is logged, never gated"
    runner: live-postgres-readiness
