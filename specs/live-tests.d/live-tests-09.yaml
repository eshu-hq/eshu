tests:
  - file: go/internal/storage/postgres/dead_letter_recovery_lock_order_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8261 poison recovery (RecoverDeadLettersQuery) lock order over 400,000 analyzed background rows on an en_US.utf8 database: the held-middle-row race against the scoped and stage-only recovery replays completes for mixed-case and lower-case work ids (main: 40P01 for mixed-case ids, whose default-collation and C orders disagree), 150 rounds of poison plus both replays with a 2 ms per-row trigger sleep and random start delays give 0 x 40P01 with every row re-driven once (main: 5 x 40P01), and the EvalPlanQual case drops a row claimed or whose recovery budget was spent before the lock step; isolated schemas; about 70-90 s locally; enrolled in the live-postgres-readiness runner"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/pruned_generation_lock_order_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8261 generation retention lock order: a real PruneSupersededGenerations pass over a pruned generation's dead letters races the reducer claim sweep and the scoped and stage-only recovery replays through a held middle row in both start orders and completes (main: 6 of 6 40P01 in the FK cascade delete), 150 rounds of the pass, a claim and both replays give 0 x 40P01 and prune every row (main: 14 x 40P01), and a row replayed before the pass's lock step is still pruned; isolated schemas; about 70-90 s locally; enrolled in the live-postgres-readiness runner"
    runner: live-postgres-readiness
  - file: go/internal/storage/postgres/projector_ack_supersede_lock_order_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8261 projector Ack obsolete-generation supersede (supersedeProjectorObsoleteGenerationsQuery under Ack's lock_timeout) lock order against the scoped and stage-plus-class projector replays: the held-middle-row race completes for hex and mixed-case generation ids (main: 40P01 for mixed-case ids), 150 rounds over 18 obsolete generations give 0 x 40P01 with every obsolete row superseded (main: 38 x 40P01), and the EvalPlanQual case keeps a row claimed before the lock step and its generation; isolated schemas; about 70-90 s locally; enrolled in the live-postgres-readiness runner"
    runner: live-postgres-readiness
  - file: go/internal/query/admin/skip_lock_order_live_test.go
    tag: ~
    class: postgres_ci
    reason: "#8261 admin repository skip (SkipRepositoryWorkItems) lock order against the recovery replay, the admin replay and the reducer claim sweep over failed rows of a superseded generation: the held-middle-row race completes in both start orders (main: 6 of 6 40P01), 150 rounds of all four with a 2 ms per-row trigger sleep and random start delays give 0 x 40P01 (main: 98 x 40P01), and the EvalPlanQual case drops a row claimed or replayed before the skip's lock step; isolated schemas; about 100-180 s locally including two 400,000-row seeds; enrolled in the live-postgres-readiness runner"
    runner: live-postgres-readiness
