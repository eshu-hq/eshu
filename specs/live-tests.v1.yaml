purpose: >
  Classify every live backend proof in go/ as graph CI, PostgreSQL CI,
  dedicated CI, verified scheduled PostgreSQL or Ifá proof, legacy-scheduled
  exemption, or retired with
  a reason and explicit execution or exemption ownership. The graph
  live-backend CI job runs every ci-class row on its selected backend; the
  PostgreSQL readiness job runs its untagged postgres_ci rows; the
  migration job runs only its exact integration-tagged postgres_ci rows. The
  reducer contention job verifies each enrolled PostgreSQL-only dedicated_ci
  test from Go JSON events in its expected package. The B-7 identity runner
  verifies its two PostgreSQL proofs through the existing golden corpus job.
  The postgres-scheduled job checks exact tests in fifteen groups daily on
  PostgreSQL. The ifa-scheduled job checks eight exact tagged tests daily and
  on scoped PRs on disposable NornicDB and PostgreSQL, with a second NornicDB
  identity endpoint. The replay-tier gate checks 27 exact tests from 23 files;
  25 require NornicDB. The NornicDB backend conformance job accounts for all nine
  tests in seven exact Cypher files; Neo4j keeps the core conformance path. The
  ledger validator (scripts/verify-live-tests-ledger.sh) fails on any live test
  file this ledger does not name, so a new unclassified live test can never
  pass as clean. A live test is any *_live_test.go file plus any
  *_test.go that carries a live_* build-tag atom and defines a Test func,
  tracked or untracked (ignored build output excluded);
  helper-only files ride with the files that use them. The validator also
  pins each row's tag against the file's actual //go:build line.

design: >
  One row per *_live_test.go file. class is ci (graph live-backend CI
  job, selected backends), postgres_ci (the named PostgreSQL runner;
  integration-tagged migration proofs have their own exact-file runner),
  dedicated_ci (a verified named runner: query-methodology or
  reducer-contention, golden-corpus-identity, replay-tier, or backend-conformance-nornicdb),
  verified_scheduled (an exact-file, daily or manual PostgreSQL or Ifá runner
  with strict Go event accounting; the Ifá job also runs on scoped pull requests),
  scheduled (an exact-file legacy exemption from this ledger's verified
  runner mapping, tracked by issue 7533; independently owned blocking
  runners may exist, but a reason does not prove execution), or retired (a
  former live proof repaired in place: the file still exists but no longer meets the
  live definition, and the reason names the repair commit). A missing
  or blank reason fails validation. A row for a deleted file is removed
  in the deleting commit; the validator rejects rows naming missing
  files, and rejects a retired row that still names a live file. An
  optional `backends:` line (nornicdb, neo4j, or both; default both)
  pins which backends a file can run on: tests that hardcode the
  "nornic" database pin nornicdb so the runner never schedules them
  against Neo4j. CI-class rows must be fast and deterministic: seeded
  fixtures, unique seed prefixes, cleanup on both pass and fail paths.
  Promotion from scheduled to a CI class needs measured timing evidence cited
  in the reason.

