issue: 6784
parent_issue: 6788
owners:
  - graph
  - backendconformance

purpose: >
  Classify every live backend proof in go/ as CI, scheduled, or retired with
  a reason, so no live test is a one-time developer proof by default. The
  live-backend CI job runs every CI-class row on both backends; the ledger
  validator (scripts/verify-live-tests-ledger.sh) fails on any live test
  file this ledger does not name, so a new unclassified live test can never
  pass as clean. A live test is any *_live_test.go file plus any
  *_test.go that carries a live_* build-tag atom and defines a Test func,
  tracked or untracked (ignored build output excluded);
  helper-only files ride with the files that use them. The validator also
  pins each row's tag against the file's actual //go:build line.

design: >
  One row per *_live_test.go file. class is ci (blocking live-backend CI
  job, both backends), scheduled (runs in the scheduled live lane with the
  cadence noted in the reason, never blocking), or retired (a former live
  proof repaired in place: the file still exists but no longer meets the
  live definition, and the reason names the repair commit). A missing
  or blank reason fails validation. A row for a deleted file is removed
  in the deleting commit; the validator rejects rows naming missing
  files, and rejects a retired row that still names a live file. An
  optional `backends:` line (nornicdb, neo4j, or both; default both)
  pins which backends a file can run on: tests that hardcode the
  "nornic" database pin nornicdb so the runner never schedules them
  against Neo4j. CI-class rows must be fast and deterministic: seeded
  fixtures, unique seed prefixes, cleanup on both pass and fail paths.
  Promotion from scheduled to CI needs measured timing evidence cited
  in the reason.

