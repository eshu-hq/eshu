AWSTemplateFormatVersion: "2010-09-09"
Description: VPC with subnets

Parameters:
  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: comprehensive-vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Comprehensive security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"

Outputs:
  VpcId:
    Value: !Ref VPC
  PublicSubnetId:
    Value: !Ref PublicSubnet
  # #5954: exported so lambda.yaml's LambdaFunction can pull this subnet into
  # its VpcConfig via Fn::ImportValue. Export.Name is the literal string
  # lambda.yaml's !ImportValue references -- real cross-stack imports match
  # on that literal export name, and setOptionalString
  # (go/internal/parser/cloudformation/parser_helpers.go) reads it with
  # fmt.Sprint, so a !Sub here would decode to a map (Fn::Sub) and give the
  # projected CloudFormationExport node the Go map debug string as its name
  # instead of a name lambda.yaml's import actually matches.
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
    Export:
      Name: comprehensive-vpc-PrivateSubnetId
  # #5954: exported so lambda.yaml's LambdaFunction can pull this security
  # group into its VpcConfig via Fn::ImportValue (the short-form !ImportValue
  # tag -- go/internal/parser/yaml/node_decode.go resolves it to the literal
  # Fn::ImportValue key the cloudformation parser scans for). Before this,
  # the corpus had zero Fn::ImportValue usage anywhere, so
  # CloudFormationImport had no real fixture coverage at all. Export.Name is
  # a literal string for the same reason as PrivateSubnetId's export above.
  SecurityGroupId:
    Value: !Ref SecurityGroup
    Export:
      Name: comprehensive-vpc-SecurityGroupId
