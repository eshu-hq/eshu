# #5469 round-6 same-axis-disagreement fixture.
#
# This workflow file gives container-ci-lineage a REAL, statically-parsed
# `ci.workflow_image_evidence` fact (go/internal/collector/git_workflow_image_facts.go,
# go/internal/workflowimage) declaring image ref
# ghcr.io/acme/container-ci-lineage:v2 via an ordinary `docker build -t` /
# `docker push` step. That evidence attaches to this repository's existing
# ci.run/ci.artifact pair (testdata/cassettes/cicdrun/supply-chain-demo.json,
# run 9100, repository:r_19519f37), which already declares
# artifact_digest=sha256:c10...c1c1 with no image_ref of its own.
#
# The vulnerabilityintelligence cassette (testdata/cassettes/vulnerabilityintelligence/supply-chain-demo.json)
# separately scans this same image reference and finds a DIFFERENT digest
# (sha256:d2d2...d2d2) -- a genuine "the tag moved to a different build"
# scenario. The finding's own ImageRef (ghcr.io/acme/container-ci-lineage:v2)
# then strong-matches this run's CI-declared identity by image reference
# (supplyChainDeploymentMatchesFinding's second branch), while the run's own
# artifact_digest contradicts the finding's SubjectDigest -- the real,
# same-axis (digest-vs-digest) provenance_ci_declared-vs-config_only
# disagreement version_resolution_corroboration exists to disclose (review
# finding R1), now covered live by the golden corpus instead of only by the
# unit-test matrix in supply_chain_impact_version_resolution_test.go.
#
# This file is independent of the base-image lineage this repository's
# Dockerfile already covers (#5810, rc-170): it does not reference the
# builder's base image or the child's own DERIVED_FROM edge.
name: build-and-push
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/acme/container-ci-lineage:v2 .
      - name: Push image
        run: docker push ghcr.io/acme/container-ci-lineage:v2
